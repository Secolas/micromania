// 1. TAP — tap the bouncing shiba (sometimes a DON'T TAP! fake-out)
class TapBug extends Microgame {
  static meta = { id: 'tap', env: 'lawn', prompt: 'TAP!', hint: 'tap', duration: 3.2,
    how: 'TAP THE DOG' };
  init() {
    this.miss = 0;
    this.bug = { x: 24 + Math.random() * (W - 48), y: TOP + 26 + Math.random() * (BOT - TOP - 52), r: 9 };
    const sp = this.byD(18, 34, 52);
    const a = Math.random() * 6.28;
    this.vx = Math.cos(a) * sp; this.vy = Math.sin(a) * sp;
    this.fake = this.fakeOut(0.15, "DON'T TAP!", "IT'S A TRAP!\nDON'T TOUCH IT");
  }
  update(dt, input) {
    this.bug.x += this.vx * dt; this.bug.y += this.vy * dt;
    if (this.bug.x < 12 || this.bug.x > W - 12) this.vx *= -1;
    if (this.bug.y < TOP + 12 || this.bug.y > BOT - 12) this.vy *= -1;
    if (input.justDown) {
      const hit = Math.hypot(input.x - this.bug.x, input.y - this.bug.y) < this.bug.r + 9;
      if (this.fake) { if (hit) { Sfx.growl(); this.lose(); } return; }
      if (hit) { FX.hit(this.bug.x, this.bug.y, PAL.accent); Sfx.bark(); this.succeed(); }
      else this.miss = 0.15;
    }
  }
  draw(g) {
    g.clear();
    if (this.miss > 0) { this.miss -= STEP; g.circle(Input.x, Input.y, 6, PAL.bad); }
    // laughing shiba face as the tap target (cycles frames 0-2, the open-mouth laughs)
    const fr = Math.floor(this.t * 6) % 3;
    g.sprite('face', this.bug.x, this.bug.y, { w: 22, h: 22, frame: fr });
  }
}

// 2. DRAG — catch every falling treat
class CatchCoin extends Microgame {
  static meta = { id: 'catch', env: 'lawn', prompt: 'CATCH!', hint: 'drag', duration: 4.0,
    how: 'DRAG THE SHIBA\nCATCH EVERY TREAT' };
  init() {
    this.bx = CX;
    this.need = this.byD(1, 2, 3);
    this.got = 0;
    // Catch shiba drawn at hero size to unify sprite scale across games.
    // Art is 40x56; drawn at h=DOGH tall, width scales the same ratio.
    this.dogH = 24; this.dogW = Math.round(40 * this.dogH / 56);   // 17
    // Paws sit at sprite-local y 16/56; the catch line is at the paws:
    //   dogY = catchLine + (dogH/2 - 16*dogH/56)
    this.pawOff = (this.dogH / 2) - (16 * this.dogH / 56);         // ~5
    this.floor = BOT - this.dogH - 4;         // catch line, leaves the sprite on the shelf edge
    this.dogY = this.floor + this.pawOff;     // sprite centre
    this.catchTol = Math.round(this.dogW / 2) + 4;                 // paw span + a little grace
    this.startY = TOP + 8;

    // Fit every coin inside the round: the last one must land with time to spare,
    // so fall speed is derived from timeLimit instead of hardcoded.
    const budget = Math.max(1.2, this.timeLimit - 0.5);
    const gap = this.need > 1 ? Math.min(0.8, budget * 0.35 / (this.need - 1)) : 0;
    const travel = budget - gap * (this.need - 1);
    const speed = Math.max(55, (this.floor - this.startY) / travel);

    this.coins = [];
    for (let i = 0; i < this.need; i++) {
      this.coins.push({ x: 22 + Math.random() * (W - 44), y: this.startY, sp: speed, delay: i * gap, done: false });
    }
  }
  update(dt, input) {
    // follows your finger, and keeps the last position after you lift it
    this.bx += (input.x - this.bx) * Math.min(1, dt * 18);
    this.bx = Math.max(this.dogW / 2 + 2, Math.min(W - this.dogW / 2 - 2, this.bx));

    for (const c of this.coins) {
      if (c.done) continue;
      if (c.delay > 0) { c.delay -= dt; continue; }
      c.y += c.sp * dt;
      if (c.y >= this.floor) {                    // resolve at the floor, no tunnelling
        c.done = true;
        if (Math.abs(c.x - this.bx) < this.catchTol) {
          this.got++; Sfx.crunch(); FX.hit(c.x, this.floor, PAL.accent);
          if (this.got >= this.need) this.succeed();
        } else { this.lose(); }
      }
    }
  }
  draw(g) {
    g.clear();
    // coins first, so a landing coin passes behind the dog's head
    for (const c of this.coins) {
      if (c.done) continue;
      if (c.delay > 0) { g.rect(c.x - 1, this.startY - 6, 2, 3, PAL.mid); continue; }  // drop marker
      g.bone(c.x, c.y, 13);
    }
    g.sprite('catcher', this.bx, this.dogY, { w: this.dogW, h: this.dogH, color: PAL.ink,
             frame: Math.floor(this.t * 8) % 5 });
    for (let i = 0; i < this.need; i++) g.rect(CX - this.need * 4 + i * 8, TOP + 5, 5, 5, i < this.got ? PAL.accent : PAL.mid);
  }
}

// 3. RUB — scrub the mud off a muddy shiba
class RubClean extends Microgame {
  static meta = { id: 'rub', env: 'bath', prompt: 'RUB!', hint: 'rub', duration: 3.6,
    how: 'RUB OFF\nALL THE MUD' };
  init() {
    // mud splats over the shiba; each one fades as you scrub over it
    this.mud = [];
    const n = this.byD(6, 8, 10);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.2832, d = Math.sqrt(Math.random()) * 38;
      this.mud.push({ x: CX + Math.cos(a) * d * 1.1, y: CY + 4 + Math.sin(a) * d, r: 8 + Math.random() * 5, dirt: 1 });
    }
    this.rate = this.byD(0.05, 0.04, 0.034);
    this.bubbles = []; this.squeak = 0;
  }
  update(dt, input) {
    for (const b of this.bubbles) { b.t += dt; b.y -= 14 * dt; }
    this.bubbles = this.bubbles.filter(b => b.t < 0.6);
    this.squeak -= dt;
    if (input.down && input.moveDist > 0) {
      let scrubbed = false;
      for (const m of this.mud) {
        if (m.dirt > 0 && Math.hypot(input.x - m.x, input.y - m.y) < m.r + 10) { m.dirt -= input.moveDist * this.rate; scrubbed = true; }
      }
      if (scrubbed && Math.random() < 0.5) this.bubbles.push({ x: input.x + (Math.random() - 0.5) * 14, y: input.y, r: 2 + Math.random() * 3, t: 0 });
      if (scrubbed && this.squeak <= 0) { Sfx.squeak(); this.squeak = 0.12; }
    }
    if (this.mud.every(m => m.dirt <= 0) && !this.finished) { Sfx.bark(); this.succeed(); }
  }
  draw(g) {
    g.clear();
    const left = this.mud.filter(m => m.dirt > 0).length;
    // a floor and a bath mat to sit on, so the flat-cut paws rest on something
    g.rect(0, 204, W, BOT - 204, SCENE.grout); g.rect(0, 204, W, 2, SCENE.tileHi);
    g.rect(CX - 50, 206, 100, 10, PAL.mid); for (let mx = CX - 46; mx < CX + 48; mx += 8) g.rect(mx, 216, 3, 3, PAL.mid);
    g.sprite('shiba', CX, CY + 4, { w: 110, h: 116, frame: left === 0 ? 1 : 0 });
    for (const m of this.mud) {
      if (m.dirt <= 0) continue;
      ctx.globalAlpha = Math.min(1, m.dirt + 0.15);
      g.circle(m.x, m.y, m.r, PAL.mid);
      g.circle(m.x + m.r * 0.5, m.y - m.r * 0.6, m.r * 0.45, PAL.mid);   // splat lobes
      g.circle(m.x - m.r * 0.6, m.y + m.r * 0.4, m.r * 0.35, PAL.mid);
      ctx.globalAlpha = 1;
    }
    for (const b of this.bubbles) {
      ctx.globalAlpha = 1 - b.t / 0.6; ctx.strokeStyle = PAL.ink; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.2832); ctx.stroke(); ctx.globalAlpha = 1;
    }
    g.text('MUD LEFT ' + left, CX, TOP + 22, 9, left ? PAL.ink : PAL.accent);
  }
}

// 4. SWIPE UP — pull the tissues out
class PullTissue extends Microgame {
  static meta = { id: 'pull', env: 'room@250', prompt: 'PULL DOWN!', hint: 'swipe', duration: 4.0,
    how: 'SWIPE DOWN TO\nPULL A TISSUE' };
  init() {
    this.pulled = 0; this.need = this.byD(2, 3, 4);
    this.sheetY = 0;        // animates the sheet sliding out on each pull
    this.cue = 0;           // pulsing arrow
  }
  update(dt, input) {
    this.cue += dt * 4;
    if (this.sheetY > 0) this.sheetY = Math.max(0, this.sheetY - dt * 4);   // retract between pulls
    // a downward swipe yanks one sheet out
    if (input.swipe && input.swipe.dir === 'down') {
      this.pulled++; Sfx.tick(); buzz(10);
      this.sheetY = 1;
      FX.hit(CX, CY + 20, PAL.ink);
      if (this.pulled >= this.need) this.succeed();
    }
  }
  draw(g) {
    g.clear();
    // dispenser box mounted at the top
    const boxY = TOP + 14, boxH = 34;
    g.rect(CX - 34, boxY, 68, boxH, PAL.mid);
    g.rect(CX - 34, boxY, 68, 4, PAL.ink);
    g.text('TISSUES', CX, boxY + 22, 8, PAL.bg);
    // slot
    g.rect(CX - 20, boxY + boxH - 3, 40, 3, PAL.bg);
    // the sheet hanging out of the slot — visibly slides down when pulled
    const hang = 26 + this.sheetY * 34;
    const sheetTop = boxY + boxH - 2;
    g.rect(CX - 16, sheetTop, 32, hang, PAL.ink);
    g.rect(CX - 16, sheetTop, 32, hang, PAL.ink);
    g.box(CX - 16, sheetTop, 32, hang, PAL.mid);
    // your grab point + a pulsing DOWN arrow so the gesture is obvious
    const ay = sheetTop + hang + 8 + Math.sin(this.cue) * 3;
    g.line(CX, sheetTop + hang, CX, ay, PAL.accent, 2);
    g.line(CX, ay, CX - 5, ay - 5, PAL.accent, 2);
    g.line(CX, ay, CX + 5, ay - 5, PAL.accent, 2);
    // progress pips
    for (let i = 0; i < this.need; i++) g.rect(CX - this.need * 5 + i * 10, BOT - 10, 7, 7, i < this.pulled ? PAL.accent : PAL.mid);
  }
}

// 5. SHAKE — build up pressure (accelerometer or frantic wiggling)
class SodaShake extends Microgame {
  static meta = { id: 'shake', env: 'room@196', prompt: 'SHAKE!', hint: 'shake', duration: 3.6,
    how: { motion: 'SHAKE YOUR PHONE\nHARD!', touch: 'WIGGLE YOUR FINGER\nFAST' } };
  init() { this.fill = 0; this.need = this.byD(1.4, 1.8, 2.3); this.buzzT = 0; }
  update(dt, input) {
    this.fill += input.shake * dt * 2.2;
    // buzz continuously while the player is actually shaking, harder the harder
    // they shake — re-fired on a short cadence so the motor stays humming
    this.buzzT -= dt;
    if (input.shake > 0.15 && this.buzzT <= 0) {
      buzz(Math.round(25 + input.shake * 45)); this.buzzT = 0.05;
      Sfx.fizz(Math.min(1, this.fill / this.need));   // the fizz builds with the pressure
    }
    if (this.fill >= this.need) { Sfx.splash(); this.succeed(); }
  }
  draw(g) {
    g.clear();
    const prog = Math.min(1, this.fill / this.need);
    if (Assets.get('shaketable')) {
      // frame keyed to the meter: calm on the table -> it topples -> the shiba
      // falls off. A hard shake is a bigger earthquake, so it drops sooner.
      const fr = Math.max(0, Math.min(8, Math.floor(prog * 8.99)));
      // jitter grows with how hard you are shaking, and eases off near the end
      // where the fall itself carries the motion
      // jitter only from real shaking (Input.shake is 0 at rest now), so the
      // table sits dead still until the player actually shakes
      const q = Input.shake > 0.12 ? Input.shake * (1 - prog * 0.6) : 0;
      const jx = (Math.random() - 0.5) * q * 10, jy = (Math.random() - 0.5) * q * 6;
      g.sprite('shaketable', CX + jx, CY - 2 + jy, { w: 104, h: 104, frame: fr });
      g.text(Input.gyroReady || Input.micReady ? 'SHAKE!' : 'SHAKE FAST!', CX, TOP + 26, 9, PAL.mid);
    } else {
      const j = (Math.random() - 0.5) * prog * 6;
      g.cRect(CX + j, CY - 6, 30, 54, PAL.bad);
      g.rect(CX - 15 + j, CY - 33, 30, 6, PAL.mid);
    }
    g.bar(30, BOT - 16, W - 60, 8, prog);
  }
}

// 6. SWIPE — follow the arrow, in order
class SwipeArrow extends Microgame {
  static meta = { id: 'swipe', env: 'field@190', prompt: 'SWIPE!', hint: 'swipe', duration: 4.0,
    how: 'SWIPE THE WAY\nEACH ARROW POINTS' };
  init() {
    const dirs = ['up', 'down', 'left', 'right'];
    this.seq = Array.from({ length: this.byD(1, 2, 3) }, () => dirs[Math.floor(Math.random() * 4)]);
    this.i = 0;
  }
  update(dt, input) {
    if (!input.swipe) return;
    if (input.swipe.dir === this.seq[this.i]) {
      this.i++; Sfx.tick(); buzz(10); FX.burst(CX, CY, PAL.ink, 5, 40);
      if (this.i >= this.seq.length) this.succeed();
    } else { buzz(40); FX.shake(3); this.lose(); }
  }
  draw(g) {
    g.clear();
    const d = this.seq[this.i];
    const ang = { up: -Math.PI / 2, down: Math.PI / 2, left: Math.PI, right: 0 }[d];
    const ux = Math.cos(ang), uy = Math.sin(ang), sy = 167;   // paws in the grass (horizon at 190), not up in the sky
    // the shiba faces the way it wants you to swipe, one dedicated high-res
    // sprite per direction (running left/right, jumping up, running down).
    if (d === 'left' || d === 'right') {
      g.sprite(d === 'right' ? 'swiperight' : 'swipeleft', CX, sy, { w: 116, h: 116, frame: Math.floor(this.t * 14) % 9 });
    } else if (d === 'up') {
      // 120px frames carry wide transparent padding, so draw large for on-screen size
      g.sprite('swipeup', CX, sy, { w: 112, h: 112, frame: Math.floor(this.t * 12) % 9 });
    } else {
      g.sprite('swipedown', CX, sy, { w: 112, h: 112, frame: Math.floor(this.t * 14) % 9 });
    }
    // bold arrow pushed out past the dog so it stays visible
    ctx.save(); ctx.translate(CX + ux * 62, sy + uy * 62); ctx.rotate(ang);
    g.line(-16, 0, 14, 0, PAL.ink, 7);
    g.line(14, 0, 2, -12, PAL.ink, 7);
    g.line(14, 0, 2, 12, PAL.ink, 7);
    ctx.restore();
    for (let k = 0; k < this.seq.length; k++) g.circle(CX - (this.seq.length - 1) * 6 + k * 12, BOT - 20, 3, k < this.i ? PAL.accent : PAL.mid);
  }
}

// 7. PAT — pat the sad shiba until it's cheering (tap fast)
class PatShiba extends Microgame {
  static meta = { id: 'pat', env: 'room@206', prompt: 'PAT!', hint: 'mash', duration: 3.6,
    how: 'TAP THE SHIBA\nTO CHEER IT UP' };
  init() {
    this.count = 0; this.need = this.byD(6, 10, 14); this.squish = 0; this.pops = []; this.snap = 0;
    // sometimes it's a grumpy one that doesn't want patting
    this.fake = this.fakeOut(0.15, "DON'T PAT!", "IT'S GRUMPY!\nDON'T TOUCH IT");
  }
  update(dt, input) {
    this.squish = Math.max(0, this.squish - dt);
    if (this.snap > 0) this.snap -= dt;
    for (const p of this.pops) { p.t += dt; p.y -= 34 * dt; }
    this.pops = this.pops.filter(p => p.t < 0.7);
    // a pat has to land on the dog, but the dog is big
    const onDog = input.justDown && Math.abs(input.x - CX) < 56 && Math.abs(input.y - (CY + 4)) < 60;
    if (this.fake) { if (onDog) { this.snap = 0.3; Sfx.growl(); FX.shake(3); this.lose(); } return; }
    if (onDog && !this.finished) {
      this.count++; this.squish = 0.15;
      Sfx.blip(480 + this.count * 45, 0.06, 'triangle', 0.07); buzz(8);
      this.pops.push({ x: input.x, y: input.y - 8, t: 0, n: this.count });
      if (this.count >= this.need) { FX.burst(CX, CY - 24, PAL.accent, 16, 70); Sfx.bark(); this.succeed(); }
    }
  }
  // the mascot sheet's moods: teary (14) → sad (12, 10) → happy (0) → cheering
  // (1-7), with eyes shut (8) for a beat on every pat, enjoying it
  frame() {
    if (this.fake) return this.snap > 0 ? 13 : 12;   // grumpy, and it does not like you
    if (this.won) return 1 + Math.floor(this.t * 14) % 7;
    if (this.squish > 0) return 8;
    const p = this.count / this.need;
    return p < 0.2 ? 14 : p < 0.4 ? 12 : p < 0.6 ? 10 : p < 0.85 ? 0 : 1 + Math.floor(this.t * 14) % 7;
  }
  heart(x, y, c) {
    g.rect(x - 4, y - 3, 3, 2, c); g.rect(x + 1, y - 3, 3, 2, c);
    g.rect(x - 5, y - 1, 10, 2, c); g.rect(x - 4, y + 1, 8, 2, c); g.rect(x - 2, y + 3, 4, 2, c);
  }
  draw(g) {
    g.clear();
    const sq = this.squish > 0 ? 1 : 0;
    g.sprite('shiba', CX, CY + 4 + sq * 5, { w: 105 + sq * 8, h: 111 - sq * 10, frame: this.frame() });
    for (const p of this.pops) {
      ctx.globalAlpha = 1 - p.t / 0.7;
      this.heart(p.x, p.y, PAL.bad);
      g.text(String(p.n), p.x + 8, p.y + 4, 12, PAL.accent, 'left');
      ctx.globalAlpha = 1;
    }
    if (this.fake) { g.text('GRRR…', CX, TOP + 24, 10, PAL.bad); return; }
    g.text('PATS ' + this.count + ' / ' + this.need, CX, TOP + 24, 10, PAL.ink);
    g.bar(30, BOT - 16, W - 60, 8, this.count / this.need, PAL.bad);
  }
}

// 8. CHARGE — hold to charge a jump, release at the couch's height
class HoldRelease extends Microgame {
  static meta = { id: 'hold', env: 'room@217', prompt: 'CHARGE!', hint: 'hold', duration: 4.2,
    how: 'HOLD TO CHARGE A JUMP\nLET GO AT THE COUCH' };
  init() {
    this.p = 0; this.dir = 1;
    this.speed = this.byD(0.55, 0.8, 1.1);
    this.zone = this.byD(0.22, 0.16, 0.11);
    this.zoneAt = 0.35 + Math.random() * 0.4;
    this.armed = false;
    this.jumpT = -1;                         // seconds into the jump, -1 = still on the floor
  }
  // A plump red couch seen from the side, its seat cushion exactly th thick at
  // seat — the band you have to land in. Legs on the floor, an armrest at the
  // near end, a tall tufted back at the far end, and a bone-print pillow.
  static couch(x0, w, seat, th, floor) {
    const red = PAL.bad, dark = SCENE.couchLo, lite = SCENE.couchHi, wood = SCENE.trunk;
    const rr = (x, y, ww, hh, r, c) => {
      r = Math.max(0, Math.min(r, ww / 2, hh / 2));
      ctx.fillStyle = c; ctx.beginPath();
      ctx.moveTo(x + r, y); ctx.arcTo(x + ww, y, x + ww, y + hh, r); ctx.arcTo(x + ww, y + hh, x, y + hh, r);
      ctx.arcTo(x, y + hh, x, y, r); ctx.arcTo(x, y, x + ww, y, r); ctx.closePath(); ctx.fill();
    };
    const top = seat - th / 2, base = floor - 4;
    // little wooden legs
    g.rect(x0 + 4, base, 4, 4, wood); g.rect(x0 + w - 8, base, 4, 4, wood);
    // the body under the seat, and its shadow line
    rr(x0 + 2, top + th - 2, w - 4, base - top - th + 2, 4, dark);
    g.rect(x0 + 6, base - 3, w - 12, 1, PAL.bg);
    // tall back at the far end, tufted with buttons
    const bh = Math.max(30, th + 26), bx = x0 + w - 16;
    rr(bx, top - bh + th, 16, base - (top - bh + th), 6, red);
    rr(bx + 2, top - bh + th + 2, 4, base - (top - bh + th) - 8, 2, lite);
    for (let yy = top - bh + th + 8; yy < top - 2; yy += 9) g.rect(bx + 9, yy, 2, 2, dark);
    // the seat cushion: the landing band, with seams and a soft highlight
    rr(x0 + 8, top, w - 22, th, Math.min(5, th / 2), red);
    g.rect(x0 + 11, top + 1, w - 30, Math.max(1, Math.min(2, th / 4)), lite);
    const seamX = x0 + 8 + (w - 22) / 2;
    g.rect(seamX, top + 2, 1, th - 3, dark);
    // a bone-print pillow leaning on the back
    rr(bx - 11, top - 13, 13, 14, 4, PAL.ink);
    g.bone(bx - 5, top - 6, 8, PAL.accent);
    // armrest at the near end: a rounded roll a little above the seat
    rr(x0, top - 8, 12, base - top + 8, 6, red);
    rr(x0 + 2, top - 6, 4, 6, 2, lite);
  }

  // the meter and couch layout, shared by update and draw
  geo() {
    const x = 14, w = 12, y = CY - 70, h = 140, floor = y + h, cx0 = 92, cw = 74;
    const seat = y + (1 - this.zoneAt) * h, th = Math.max(8, this.zone * h);
    return { x, w, y, h, floor, cx0, cw, seat, th };
  }
  update(dt, input) {
    if (this.jumpT >= 0) {                   // in the air: play the leap out, then score it
      this.jumpT += dt;
      if (this.jumpT >= 0.6) { if (this.ok) { Sfx.boop(); this.succeed(); } else { Sfx.thud(); buzz(60); FX.shake(3); this.lose(); } }
      return;
    }
    if (input.down) {
      this.armed = true;
      this.p += this.dir * this.speed * dt;
      if (this.p > 1) { this.p = 1; this.dir = -1; }
      if (this.p < 0) { this.p = 0; this.dir = 1; }
    } else if (this.armed) {
      // let go: the shiba leaps as high as you charged — onto the cushion if
      // that's the couch's height, else it bonks the front and drops back
      this.ok = Math.abs(this.p - this.zoneAt) < this.zone / 2;
      this.jumpT = 0; this.playingOut = true; this.armed = false; Sfx.whoosh(); buzz(15);
    }
  }
  draw(g) {
    g.clear();
    // the jump meter on the left: how high the shiba will go
    const { x, w, y, h, floor, cx0, cw, seat, th } = this.geo();
    g.rect(x, y, w, h, PAL.mid);
    g.rect(x, y + (1 - this.zoneAt - this.zone / 2) * h, w, this.zone * h, PAL.accent);
    const py = y + (1 - this.p) * h;
    g.rect(x - 3, py - 2, w + 6, 4, PAL.ink);
    // the couch, its seat at the height the zone marks
    HoldRelease.couch(cx0, cw, seat, th, floor);
    // the aim line: where the jump tops out right now
    ctx.globalAlpha = 0.5; g.rect(x + w + 4, py - 1, 64, 2, PAL.ink); ctx.globalAlpha = 1;
    g.rect(0, floor, W, 2, PAL.mid);
    // the shiba: crouched on the floor winding up, then leaping. Its feet sit
    // a quarter of the sprite below its centre, so floor - 14 stands it on the floor.
    const S = 56, foot = 0.25 * S;
    if (this.jumpT < 0) {
      const fr = this.armed ? (Math.floor(this.t * 10) % 2) : 0;
      g.sprite('runjump', 52, floor - foot, { w: S, h: S, frame: fr });
    } else {
      // a hop from the floor that tops out where the meter was, landing on
      // the cushion — or short of the couch, back on the floor
      const k = Math.min(1, this.jumpT / 0.6), top = y + (1 - this.p) * h;
      const x1 = this.ok ? cx0 + 22 : cx0 - 10, y1 = this.ok ? seat - th / 2 : floor;
      const y0 = floor, mid = Math.min(top, y1, y0) - 4;
      const px = 52 + (x1 - 52) * k;
      const up = k < 0.5 ? k / 0.5 : 1, down = k < 0.5 ? 0 : (k - 0.5) / 0.5;
      const py = k < 0.5 ? y0 + (mid - y0) * (1 - (1 - up) * (1 - up)) : mid + (y1 - mid) * down * down;
      g.sprite('runjump', px, py - foot, { w: S, h: S, frame: k < 0.4 ? 2 : k < 0.6 ? 3 : 4 });
    }
    g.text(this.jumpT >= 0 ? (this.ok ? 'UP ON THE COUCH!' : 'BONK!') : this.armed ? 'LET GO AT THE COUCH!' : 'HOLD TO CHARGE',
           CX, BOT - 6, 8, this.jumpT >= 0 ? (this.ok ? PAL.accent : PAL.bad) : this.armed ? PAL.accent : PAL.mid);
  }
}

// 9. DODGE — survive the falling flower pots (boss-capable)
class Dodge extends Microgame {
  static meta = { id: 'dodge', env: 'lawn', prompt: 'DODGE!', hint: 'drag', duration: 5.0, winOnTimeout: true,
    how: 'DRAG TO DODGE\nTHE FALLING POTS' };
  init() {
    this.px = CX; this.py = BOT - 26;
    this.blocks = [];
    this.spawn = 0.15;
    this.every = this.byD(0.62, 0.50, 0.42);
    this.fall = this.byD(85, 105, 128);
  }
  update(dt, input) {
    // tracks your finger directly; a lerp left safe columns unreachable
    if (input.down) this.px = input.x;
    this.px = Math.max(10, Math.min(W - 10, this.px));
    this.spawn -= dt;
    if (this.spawn <= 0) {
      this.spawn = this.every;
      // keep each new pot clear of any still-high one so a gap always exists
      let x = 14 + Math.random() * (W - 28);
      for (let k = 0; k < 20; k++) {
        if (this.blocks.every(b => b.y > TOP + 50 || Math.abs(b.x - x) > 52)) break;
        x = 14 + Math.random() * (W - 28);
      }
      this.blocks.push({ x, y: TOP - 8, w: 12 + Math.random() * 10 });
    }
    for (const b of this.blocks) {
      b.y += this.fall * dt;
      // hitbox is the body core (~7px), not the drawn sprite, so ears/tail
      // clipping a pot doesn't feel unfair
      if (Math.abs(b.y - this.py) < 9 && Math.abs(b.x - this.px) < b.w / 2 + 7) { buzz(60); Sfx.crunch(); this.lose(); }
    }
    this.blocks = this.blocks.filter(b => b.y < BOT + 12);
  }
  draw(g) {
    g.clear();
    // window ledges up top, where the pots are falling from
    for (let x = 4; x < W; x += 44) { g.rect(x, TOP + 2, 34, 3, PAL.mid); g.rect(x + 3, TOP, 28, 2, PAL.mid); }
    for (const b of this.blocks) {
      // a shadow on the ground warns where each one will land
      ctx.globalAlpha = Math.min(0.5, Math.max(0, (b.y - TOP) / (BOT - TOP))); g.rect(b.x - b.w / 2, BOT - 5, b.w, 2, PAL.mid); ctx.globalAlpha = 1;
      g.pot(b.x, b.y, b.w);
    }
    g.sprite('hero', this.px, this.py - 4, { w: 24, h: 30, frame: Math.floor(this.t * 14) % 9 });
    g.rect(0, BOT - 4, W, 4, PAL.mid);
  }
}

// 11. LEAP — tap to jump when the running shiba is under the hanging frisbee
class StopBar extends Microgame {
  static meta = { id: 'stop', env: 'park@177', prompt: 'LEAP!', hint: 'tap', duration: 3.6,
    how: 'TAP TO JUMP WHEN THE\nSHIBA IS UNDER THE FRISBEE' };
  init() {
    this.p = Math.random(); this.dir = Math.random() < 0.5 ? 1 : -1;
    // >= 2.4 units of travel guarantees the runner passes under the frisbee
    // from any starting point, however short the round has become.
    this.speed = Math.max(this.byD(0.75, 1.05, 1.45), 2.4 / this.timeLimit);
    this.band = this.byD(0.26, 0.18, 0.12);   // how close counts as "under it"
    this.at = 0.2 + Math.random() * 0.6;      // where the frisbee hangs
    this.jump = -1;                           // seconds into the jump, -1 = running
    this.caught = false;
  }
  update(dt, input) {
    if (this.jump >= 0) {                     // mid-leap: play it out, then score it
      this.jump += dt;
      if (this.jump > 0.5) { if (this.caught) this.succeed(); else this.lose(); }
      return;
    }
    this.p += this.dir * this.speed * dt;
    if (this.p > 1) { this.p = 1; this.dir = -1; }
    if (this.p < 0) { this.p = 0; this.dir = 1; }
    if (input.justDown) {
      this.jump = 0; this.playingOut = true;
      this.caught = Math.abs(this.p - this.at) < this.band / 2;
      Sfx.whoosh();
      if (this.caught) setTimeout(() => Sfx.bark(), 200); else buzz(40);
    }
  }
  draw(g) {
    g.clear();
    const x0 = 20, w = W - 40, ground = CY + 38;   // paws a few px into the grass (horizon at 177), not on the line
    const fx = x0 + this.at * w, fy = ground - 78 + Math.sin(this.t * 3) * 3;
    // the frisbee's spot on the grass, so "under it" is something you can see
    const sw = this.band * w;
    ctx.globalAlpha = 0.5; g.rect(fx - sw / 2, ground + 2, sw, 3, PAL.bg); ctx.globalAlpha = 1;
    for (let y = fy + 6; y < ground - 2; y += 6) g.rect(fx - 0.5, y, 1, 3, PAL.ink);
    // the shiba: running, or leaping straight up
    const sx = x0 + this.p * w;
    const k = this.jump >= 0 ? Math.sin(Math.min(1, this.jump / 0.5) * Math.PI) : 0;
    const sy = ground - 18 - k * 64;
    if (this.jump >= 0) g.sprite('runjump', sx, sy, { w: 62, h: 62, frame: k > 0.6 ? 3 : 2, flip: this.dir < 0 });
    else g.sprite(this.dir > 0 ? 'swiperight' : 'swipeleft', sx, sy, { w: 64, h: 64, frame: Math.floor(this.t * 16) % 9 });
    // the frisbee: hanging in the air, or in the shiba's mouth once caught
    const held = this.caught && this.jump > 0.12;
    const dx = held ? sx + (this.dir > 0 ? 14 : -14) : fx, dy = held ? sy - 10 : fy;
    g.rect(dx - 10, dy - 1, 20, 6, PAL.bg); g.rect(dx - 7, dy - 3, 14, 3, PAL.bg);   // dark rim
    g.rect(dx - 9, dy, 18, 4, PAL.accent); g.rect(dx - 6, dy - 2, 12, 2, PAL.accent);
  }
}

// 12. LASER — keep your finger on the laser dot the shiba is chasing
class FollowDot extends Microgame {
  static meta = { id: 'follow', env: 'room@40', prompt: 'LASER!', hint: 'drag', duration: 4.6, winOnTimeout: true,
    how: 'KEEP YOUR FINGER\nON THE LASER DOT' };
  init() {
    this.x = CX; this.y = CY;
    const sp = this.byD(34, 52, 74);
    const a = Math.random() * 6.2832;
    this.vx = Math.cos(a) * sp; this.vy = Math.sin(a) * sp;
    this.r = this.byD(20, 17, 14);
    this.off = 0; this.grace = 0.7;     // time to get your finger there
    this.pingT = 0; this.warned = false;
    this.dx = CX; this.dy = BOT - 20; this.face = 1;   // the shiba chasing the dot
  }
  update(dt, input) {
    this.x += this.vx * dt; this.y += this.vy * dt;
    if (this.x < 16 || this.x > W - 16) this.vx *= -1;
    if (this.y < TOP + 16 || this.y > BOT - 16) this.vy *= -1;
    // the shiba is always a step behind the dot, as they are
    const k = Math.min(1, dt * 2.6);
    if (Math.abs(this.x - this.dx) > 2) this.face = this.x > this.dx ? 1 : -1;
    this.dx += (this.x - this.dx) * k; this.dy += (this.y + 20 - this.dy) * k;
    this.grace -= dt;
    if (this.grace > 0) return;
    const on = input.down && Math.hypot(input.x - this.x, input.y - this.y) < this.r;
    this.off = on ? 0 : this.off + dt;
    // a soft ping while you're on it, one warning blip the moment you slip off
    this.pingT -= dt;
    if (on) { this.warned = false; if (this.pingT <= 0) { Sfx.blip(1320, 0.04, 'sine', 0.03); this.pingT = 0.35; } }
    else if (this.off > 0.12 && !this.warned) { this.warned = true; Sfx.blip(330, 0.08, 'square', 0.04); }
    if (this.off > 0.42) this.lose();
  }
  draw(g) {
    g.clear();
    g.sprite(this.face > 0 ? 'swiperight' : 'swipeleft', this.dx, this.dy, { w: 56, h: 56, frame: Math.floor(this.t * 16) % 9 });
    const held = this.off === 0 && this.grace <= 0;
    // where your finger has to stay, and the laser dot itself
    ctx.globalAlpha = held ? 0.35 : 0.2; g.circle(this.x, this.y, this.r, held ? PAL.accent : PAL.mid); ctx.globalAlpha = 1;
    g.circle(this.x, this.y, 6, PAL.bad); g.circle(this.x, this.y, 3, PAL.ink);
    if (this.off > 0 && this.grace <= 0) g.bar(30, BOT - 14, W - 60, 5, 1 - this.off / 0.42, PAL.bad, PAL.mid);
  }
}

// 13. SEQUENCE — tap the targets in numbered order
class TapOrder extends Microgame {
  static meta = { id: 'order', env: 'lawn', prompt: 'IN ORDER!', hint: 'tap', duration: 4.2,
    how: 'TAP THE NUMBERS\nIN ORDER: 1, 2, 3' };
  init() {
    this.n = this.byD(3, 4, 5); this.i = 0; this.r = 17;
    // r stays 17 for spacing — it is what makes 5 signs fit — while the sprite
    // is drawn bigger over it, and hitR gives the bigger sign a matching target
    this.sh = 62;                 // drawn sprite height
    this.hitR = 27;
    this.pts = [];
    let guard = 0;
    while (this.pts.length < this.n && guard++ < 500) {
      const p = { x: 28 + Math.random() * (W - 56), y: TOP + 34 + Math.random() * (BOT - TOP - 74) };
      // space by sprite size so the tall signs don't overlap
      if (this.pts.every(q => Math.hypot(q.x - p.x, (q.y - p.y) * 0.7) > this.r * 2.7)) this.pts.push(p);
    }
    this.n = this.pts.length;
  }
  update(dt, input) {
    if (!input.justDown) return;
    // nearest, not first in range: with a target this size two of them can both
    // cover a tap, and index order would sometimes blame the wrong sign
    let k = -1, best = this.hitR;
    for (let j = 0; j < this.n; j++) {
      const d = Math.hypot(input.x - this.pts[j].x, input.y - this.pts[j].y);
      if (d < best) { best = d; k = j; }
    }
    if (k < 0) return;
    if (k === this.i) { this.i++; Sfx.tick(); FX.hit(this.pts[k].x, this.pts[k].y, PAL.accent); if (this.i >= this.n) this.succeed(); }
    else if (k > this.i) { this.lose(); }
  }
  draw(g) {
    g.clear();
    // draw back-to-front by y so overlapping signs stack naturally
    const order = this.pts.map((p, k) => k).sort((a, b) => this.pts[a].y - this.pts[b].y);
    for (const k of order) {
      const p = this.pts[k];
      const done = k < this.i;
      const next = k === this.i;                 // the one you should tap now
      const fr = done ? 2 : 0;
      const sw = this.sh * 34 / 65;
      if (done) ctx.globalAlpha = 0.45;
      g.sprite('ordersign', p.x, p.y, { w: sw, h: this.sh, frame: fr });
      ctx.globalAlpha = 1;
      // The shiba holds a blank placard low on the sprite. Measured on the art:
      // ~15/34 wide, ~22/65 tall, centred 63% of the way down. EVERY unsolved
      // sign gets a chip that shape — accent for the next one, cream for the
      // rest — so the number sits inside the board instead of spilling over the
      // belly, and the red numbers match the highlighted one in size and place.
      if (!done) {
        const bCY = p.y + (0.63 - 0.5) * this.sh;
        const bW = 15 / 65 * this.sh, bH = 22 / 65 * this.sh;
        g.rect(p.x - bW / 2, bCY - bH / 2, bW, bH, next ? PAL.accent : PAL.ink);
        const f = Math.round(bH * 0.72);
        g.text(String(k + 1), p.x, bCY + f * 0.36, f, next ? PAL.bg : PAL.bad);
      }
    }
  }
}

// 14. ODD ONE — one of these shibas is not like the others
class OddOneOut extends Microgame {

    how: 'TAP THE SHIBA\nTHAT LOOKS DIFFERENT' };
  init() {
    const cols = this.byD(2, 3, 3), rows = this.byD(2, 2, 3);
    this.cells = []; this.r = this.byD(22, 18, 15);
    const gw = (W - 40) / cols, gh = (BOT - TOP - 50) / rows;
    for (let ry = 0; ry < rows; ry++) for (let cx = 0; cx < cols; cx++) {
      this.cells.push({ x: 20 + gw * (cx + 0.5), y: TOP + 30 + gh * (ry + 0.5) });
    }
    this.odd = Math.floor(Math.random() * this.cells.length);
    // face frames, the gap between them shrinking with difficulty:
    // a calm face among laughing ones, a wink among smiles, eyes shut among calm
    // (face frames: 0 laugh, 1 wink, 3 smile, 4 calm, 5 eyes shut)
    const pair = this.byD([4, 0], [3, 1], [4, 5]);

// 16. BOOP — boop each snoot before it ducks back down
class WhackMole extends Microgame {
  static meta = { id: 'whack', env: 'lawn', prompt: 'BOOP!', hint: 'mash', duration: 4.4,
    how: 'BOOP EACH SNOOT\nAS IT POPS UP' };
  init() {
    this.need = this.byD(2, 3, 4); this.hit = 0; this.r = 18;
    this.sw = 46;                          // drawn sprite size
    this.holes = [];
    for (let ry = 0; ry < 2; ry++) for (let cx = 0; cx < 3; cx++) {
      this.holes.push({ x: 30 + cx * 60, y: TOP + 70 + ry * 100 });
    }
    // each pop-up's window is derived from the real round length, so it always fits
    const budget = Math.max(1.1, this.timeLimit - 0.35);
    this.up = budget / this.need * 0.92;
    this.left = this.up;
    this.cur = Math.floor(Math.random() * this.holes.length);
    this.hearts = [];
  }
  update(dt, input) {
    for (const h of this.hearts) { h.t += dt; h.y -= 30 * dt; }
    this.hearts = this.hearts.filter(h => h.t < 0.6);
    this.left -= dt;
    if (this.left <= 0) { this.lose(); return; }
    if (input.justDown) {
      const h = this.holes[this.cur];
      if (Math.hypot(input.x - h.x, input.y - (h.y - 4)) < this.r + 8) {
        this.hit++; Sfx.boop(); buzz(12); FX.hit(h.x, h.y - 10, PAL.accent);
        this.hearts.push({ x: h.x, y: h.y - 24, t: 0 });
        if (this.hit >= this.need) { this.succeed(); return; }
        let nx = this.cur;
        while (nx === this.cur) nx = Math.floor(Math.random() * this.holes.length);
        this.cur = nx; this.left = this.up;
      }
    }
  }
  /* The sheet bakes the ground into every frame, but not the same ground: the
     popped frames sit the dog on a raised mound low in the cell (widest row 42)
     while the empty frame is a flat hole higher up (widest row 29). Stepping
     through the frames therefore made the hole change shape and jump position
     as it came up. So the hole is now always frame 8, drawn identically in
     every cell, and the dog is frame 0 clipped to above the rim and slid up
     through it — which also rises smoothly instead of in nine steps.
     Rows below are in the 48px sprite's own pixels. */
  drawMole(g, x, y, pop) {
    const RIM = 30;    // the hole's near lip; the dog is cut off here
    const RISE = 26;   // far enough that pop 0 leaves the dog fully out of sight
    const k = this.sw / 48;
    ctx.save();
    ctx.beginPath();
    ctx.rect(x - this.sw / 2, y - this.sw / 2, this.sw, RIM * k);
    ctx.clip();
    g.sprite('whack', x, y + (1 - pop) * RISE * k, { w: this.sw, h: this.sw, frame: 0 });
    ctx.restore();
  }
  draw(g) {
    g.clear();
    // every cell gets the same hole, including the live one
    for (const hole of this.holes) g.sprite('whack', hole.x, hole.y, { w: this.sw, h: this.sw, frame: 8 });
    const h = this.holes[this.cur];
    const pop = Math.min(1, (this.up - this.left) * 6);
    this.drawMole(g, h.x, h.y, pop);
    for (const ht of this.hearts) {
      ctx.globalAlpha = 1 - ht.t / 0.6;
      g.rect(ht.x - 4, ht.y - 3, 3, 2, PAL.bad); g.rect(ht.x + 1, ht.y - 3, 3, 2, PAL.bad);
      g.rect(ht.x - 5, ht.y - 1, 10, 2, PAL.bad); g.rect(ht.x - 4, ht.y + 1, 8, 2, PAL.bad); g.rect(ht.x - 2, ht.y + 3, 4, 2, PAL.bad);
      ctx.globalAlpha = 1;
    }
    for (let i = 0; i < this.need; i++) g.rect(CX - this.need * 4 + i * 8, TOP + 6, 5, 5, i < this.hit ? PAL.accent : PAL.mid);
  }
}

// 17. RESTRAINT — pump into the band, then stop before it bursts
class PumpBalloon extends Microgame {
  static meta = { id: 'pump', env: 'room@196', prompt: 'PUMP!', hint: 'mash', duration: 4.2,
    how: 'TAP TO PUMP\nSTOP IN THE BAND' };
  init() {
    this.f = 0; this.still = 0; this.bounce = 0;
    this.band = this.byD(0.26, 0.19, 0.13);
    // how long you must stop for, shortened when the round itself is short
    this.stillNeed = Math.max(0.24, Math.min(0.42, this.timeLimit * 0.16));
    // FAIRNESS INVARIANT: inc < band, so some multiple of inc always lands
    // inside the band. Without this the balloon can be impossible to stop.
    this.inc = Math.max(0.05, this.band * 0.6);
    // cap the target so the taps needed fit the time actually available
    const cap = this.inc * 4.0 * Math.max(0.4, this.timeLimit - this.stillNeed);
    this.at = Math.max(0.3, Math.min(0.52 + Math.random() * 0.26, cap));
  }
  update(dt, input) {
    if (input.justDown) {
      this.f += this.inc; this.still = 0; Sfx.tap(); this.bounce = 1; buzz(10);
      if (this.f > this.at + this.band / 2) { buzz(90); this.lose(); }
    } else {
      this.still += dt;
      if (this.still > this.stillNeed && Math.abs(this.f - this.at) <= this.band / 2) this.succeed();
    }
    if (this.bounce > 0) this.bounce = Math.max(0, this.bounce - dt * 6);
  }
  draw(g) {
    g.clear();
    // pressure gauge on the right edge
    const x = W - 16, y = TOP + 24, h = BOT - TOP - 54;
    g.rect(x, y, 10, h, PAL.mid);
    g.rect(x, y + (1 - this.at - this.band / 2) * h, 10, this.band * h, PAL.accent);   // target band
    g.rect(x - 3, y + (1 - Math.min(1, this.f)) * h - 1, 16, 3, this.f > this.at + this.band / 2 ? PAL.bad : PAL.ink);
    // the shiba pumping — frame follows fill (balloon inflates 0 -> 8)
    const fr = Math.max(0, Math.min(8, Math.round(this.f * 8)));
    const wob = (this.bounce || 0) * 2;
    g.sprite('pumpdog', CX - 6, CY + 10 - wob, { w: 78, h: 78, frame: fr });
    g.text(this.still > 0.12 ? 'HOLD!' : 'PUMP!', CX - 6, TOP + 18, 9, this.still > 0.12 ? PAL.accent : PAL.mid);
  }
}

// 18. CUT — cut the rope with the bone so it drops to the shiba
class CutRope extends Microgame {
  static meta = { id: 'cut', env: 'wall@262', prompt: 'CUT!', hint: 'swipe', duration: 4.0,
    how: 'SWIPE ACROSS THE ROPE\nHOLDING THE BONE' };
  init() {
    this.n = this.byD(2, 3, 4);
    this.ropes = [];
    const gap = (W - 40) / (this.n - 1 || 1);
    for (let i = 0; i < this.n; i++) this.ropes.push({ x: 20 + gap * i + (this.n === 1 ? gap / 2 : 0), len: 0.75 + Math.random() * 0.25 });
    this.target = Math.floor(Math.random() * this.n);
    this.y0 = TOP + 30; this.y1 = BOT - 70;
    this.cut = -1;            // which rope got cut (-1 = none yet)
    this.cutAt = 0;           // y where the swipe crossed
    this.anim = 0;            // seconds since the cut, drives the split + fall
  }
  end(r) { return this.y0 + (this.y1 - this.y0) * r.len; }
  update(dt, input) {
    if (this.cut >= 0) {                    // playing the split animation
      this.anim += dt;
      if (this.anim > 0.45) { if (this.cut === this.target) this.succeed(); else this.lose(); }
      return;
    }
    const sw = input.swipe;
    if (!sw || sw.x0 == null) return;
    const midY = (sw.y0 + sw.y1) / 2;
    for (let i = 0; i < this.n; i++) {
      const r = this.ropes[i], rx = r.x;
      if (midY < this.y0 - 8 || midY > this.end(r) + 4) continue;   // missed this rope's length
      if ((sw.x0 - rx) * (sw.x1 - rx) < 0) {                        // the swipe crossed this rope
        this.cut = i; this.anim = 0;
        this.cutAt = Math.max(this.y0 + 6, Math.min(this.end(r) - 6, midY));
        FX.hit(rx, this.cutAt, i === this.target ? PAL.accent : PAL.bad);
        Sfx.whoosh();
        if (i === this.target) setTimeout(() => Sfx.chomp(), 300); else { buzz(70); FX.shake(3); }
        return;
      }
    }
  }
  draw(g) {
    g.clear();
    g.rect(0, this.y0 - 4, W, 4, PAL.ink);       // the beam they hang from
    // the shiba waiting under the bone, mouth open
    const tx = this.ropes[this.target].x;
    g.sprite('shiba', tx, BOT - 22, { w: 40, h: 42, frame: 0 });   // the whole dog, sat on the floor
    this.ropes.forEach((r, i) => {
      const e = this.end(r), bone = i === this.target;
      let itemY = e + 6;
      if (i === this.cut) {
        const k = this.anim / 0.45, recoil = k * 12;
        g.rect(r.x - 1, this.y0, 2, Math.max(0, this.cutAt - recoil - this.y0), PAL.mid);   // top piece springs up
        itemY = e + 6 + k * k * (BOT - e);                                                  // the rest drops
        g.rect(r.x - 1, this.cutAt + k * k * (BOT - e), 2, Math.max(0, e - this.cutAt), PAL.mid);
      } else {
        g.rect(r.x - 1, this.y0, 2, e - this.y0, PAL.mid);
      }
      if (bone) g.bone(r.x, itemY, 26); else g.choc(r.x, itemY, 26);
    });
    if (this.cut < 0) g.text('CUT THE BONE DOWN!', CX, TOP + 20, 8, PAL.mid);
  }
}

// 21. WALK — drag the shiba along the path home without straying
class TracePath extends Microgame {
  static meta = { id: 'trace', env: 'lawn', prompt: 'WALK!', hint: 'trace', duration: 4.8,
    how: 'DRAG THE SHIBA\nALONG THE PATH HOME' };
  init() {
    // a polyline of 3-4 nodes; you must drag through each in order
    const n = this.byD(3, 4, 4);
    this.tol = this.byD(20, 16, 13);
    this.nodes = [];
    let x = 28, y = TOP + 40 + Math.random() * 40;
    this.nodes.push({ x, y });
    for (let i = 1; i < n; i++) {
      x += (W - 56) / (n - 1);
      y = TOP + 40 + Math.random() * (BOT - TOP - 80);
      this.nodes.push({ x, y });
    }
    this.i = 0; this.started = false; this.stray = 0;
    this.dogX = this.nodes[0].x; this.dogY = this.nodes[0].y;
  }
  segDist(px, py, a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const L = dx * dx + dy * dy || 1;
    let t = ((px - a.x) * dx + (py - a.y) * dy) / L;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (a.x + dx * t), py - (a.y + dy * t));
  }
  update(dt, input) {
    if (!input.down) { if (this.started) { this.stray += dt; if (this.stray > 0.35) this.lose(); } return; }
    this.stray = 0;
    if (!this.started) {
      if (Math.hypot(input.x - this.nodes[0].x, input.y - this.nodes[0].y) < this.tol) this.started = true;
      else return;
    }
    this.dogX = input.x; this.dogY = input.y;
    // advance through nodes as the finger reaches them
    if (this.i < this.nodes.length - 1) {
      const next = this.nodes[this.i + 1];
      const d = this.segDist(input.x, input.y, this.nodes[this.i], next);
      if (d > this.tol) { this.lose(); return; }         // strayed off the path
      if (Math.hypot(input.x - next.x, input.y - next.y) < this.tol) { this.i++; Sfx.tick(); }
    }
    if (this.i >= this.nodes.length - 1) { Sfx.bark(); this.succeed(); }
  }
  draw(g) {
    g.clear();
    // the path, as paw prints on the walk so far and dashes on the way ahead
    for (let k = 0; k < this.nodes.length - 1; k++) {
      const a = this.nodes[k], b = this.nodes[k + 1];
      const len = Math.hypot(b.x - a.x, b.y - a.y), steps = Math.floor(len / 9);
      for (let j = 0; j <= steps; j++) {
        const px = a.x + (b.x - a.x) * j / steps, py = a.y + (b.y - a.y) * j / steps;
        if (k < this.i) g.paw(px, py, 5, PAL.accent); else g.rect(px - 1, py - 1, 3, 3, PAL.mid);
      }
    }
    const last = this.nodes[this.nodes.length - 1];
    g.doghouse(last.x, last.y + 10, 30);
    g.circle(this.nodes[0].x, this.nodes[0].y, this.tol, PAL.mid);
    if (!this.started) g.text('START', this.nodes[0].x, this.nodes[0].y - this.tol - 4, 7, PAL.mid);
    g.sprite('swipedown', this.dogX, this.dogY - 8, { w: 58, h: 58, frame: this.started ? Math.floor(this.t * 14) % 9 : 0 });
  }
}

// 22. COUNT — tap exactly the number asked for, no more
class GrabCount extends Microgame {
  static meta = { id: 'count', env: 'lawn', prompt: 'GRAB 3!', hint: 'count', duration: 4.2,
    how: 'TAP EXACTLY\nTHAT MANY TREATS' };
  init() {
    const total = this.byD(5, 7, 9);
    this.need = 2 + Math.floor(Math.random() * (this.byD(2, 3, 4)));
    this.static = false;
    this.items = [];
    let guard = 0;
    while (this.items.length < total && guard++ < 400) {
      const p = { x: 24 + Math.random() * (W - 48), y: TOP + 34 + Math.random() * (BOT - TOP - 64), taken: false };
      if (this.items.every(q => Math.hypot(q.x - p.x, q.y - p.y) > 26)) this.items.push(p);
    }
    this.got = 0;
    this.doneAt = null;
    this.meta = { ...GrabCount.meta, prompt: 'GRAB ' + this.need + '!' };
  }
  update(dt, input) {
    // win once they've held the right count briefly (guards against overgrab)
    if (this.got === this.need && this.doneAt != null && this.t - this.doneAt > 0.45) { this.succeed(); return; }
    if (!input.justDown) return;
    for (const it of this.items) {
      if (!it.taken && Math.hypot(input.x - it.x, input.y - it.y) < 15) {
        it.taken = true; this.got++; Sfx.tick(); FX.hit(it.x, it.y, PAL.accent);
        if (this.got > this.need) { this.lose(); return; }     // grabbed too many
        if (this.got === this.need) this.doneAt = this.t;
        return;
      }
    }
  }
  draw(g) {
    g.clear();
    for (const it of this.items) if (!it.taken) g.bone(it.x, it.y, 18);
    g.text(this.got + ' / ' + this.need, CX, TOP + 26, 9, this.got > this.need ? PAL.bad : PAL.ink);
  }
}

// 23. FETCH — swipe up to throw the ball to the running shiba
class FlickShot extends Microgame {
  static meta = { id: 'flick', env: 'beach@56', prompt: 'FETCH!', hint: 'flick', duration: 4.6,
    how: 'SWIPE UP TO THROW\nTHE BALL TO THE SHIBA' };
  init() {
    this.ox = CX; this.oy = BOT - 26;
    this.ball = { x: this.ox, y: this.oy, vx: 0, vy: 0, flying: false, z: 0 };
    // the shiba runs back and forth across the far end of the yard
    this.dy = TOP + 58 + Math.random() * 26;            // running the wet sand at the water's edge
    this.dx = 30 + Math.random() * (W - 60);
    this.dvx = this.byD(30, 48, 66) * (Math.random() < 0.5 ? 1 : -1);
    this.catchR = this.byD(26, 22, 18);
  }
  update(dt, input) {
    this.dx += this.dvx * dt;
    if (this.dx < 22 || this.dx > W - 22) { this.dvx *= -1; this.dx = Math.max(22, Math.min(W - 22, this.dx)); }
    if (!this.ball.flying) {
      const sw = input.swipe;
      if (sw && sw.dir === 'up') {
        // throw along the swipe; keyboard swipes carry no points, so straight up
        let ax = sw.x0 != null ? sw.x1 - sw.x0 : 0, ay = sw.y0 != null ? sw.y1 - sw.y0 : -1;
        const d = Math.hypot(ax, ay) || 1;
        this.ball.vx = ax / d * 280; this.ball.vy = ay / d * 280;
        this.ball.flying = true; Sfx.whoosh(); buzz(15);
      }
      return;
    }
    const b = this.ball;
    b.x += b.vx * dt; b.y += b.vy * dt; b.z += dt;
    if (Math.hypot(b.x - this.dx, b.y - this.dy) < this.catchR) { Sfx.bark(); FX.hit(this.dx, this.dy, PAL.accent); this.succeed(); return; }
    if (b.y < TOP - 10 || b.x < -10 || b.x > W + 10) { Sfx.splash(); this.lose(); }   // in the sea
  }
  draw(g) {
    g.clear();
    // the line in the sand you throw from
    for (let x = 24; x < W - 24; x += 6) g.rect(x, this.oy + 12, 3, 1, PAL.bg);
    g.sprite(this.dvx > 0 ? 'swiperight' : 'swipeleft', this.dx, this.dy, { w: 58, h: 58, frame: Math.floor(this.t * 16) % 9 });
    // the ball shrinks a little as it flies away from you
    const r = this.ball.flying ? Math.max(3.5, 6 - this.ball.z * 3) : 6;
    g.circle(this.ball.x, this.ball.y, r + 1, PAL.bg);    // dark rim so it reads on sand
    g.tennis(this.ball.x, this.ball.y, r);
    if (!this.ball.flying) {
      const a = Math.sin(this.t * 6) * 3;
      g.line(this.ox, this.oy - 12 - a, this.ox, this.oy - 22 - a, PAL.bg, 2);
      g.line(this.ox, this.oy - 22 - a, this.ox - 4, this.oy - 18 - a, PAL.bg, 2);
      g.line(this.ox, this.oy - 22 - a, this.ox + 4, this.oy - 18 - a, PAL.bg, 2);
      g.text('SWIPE UP TO THROW', CX, BOT - 2, 7, PAL.bg);
    }
  }
}

// 24. FLAPPY — tap to flap through the pipe gaps
class Flappy extends Microgame {
  static meta = { id: 'flappy', env: 'sky', prompt: 'FLAP!', hint: 'mash', duration: 4.4, winOnTimeout: true, minDuration: 2.8,
    how: 'TAP TO FLAP\nTHROUGH THE GAPS' };
  init() {
    this.y = CY; this.vy = 0;
    this.grav = 170; this.flap = -84;          // floatier: a plane, not a bird
    this.planeW = 30; this.planeH = 26;        // drawn size
    this.hitW = 16; this.hitH = 12;            // collision box: fuselage only, not wings
    this.need = this.byD(1, 2, 2); this.passed = 0;
    this.gap = this.byD(104, 96, 88);          // wide enough to fly the plane through
    this.pipeW = 14; this.bx = 40;
    const budget = Math.max(2.2, this.timeLimit - 0.3);  // floor so fast speeds stay fair
    const span = W - this.bx + 30;
    const spacing = 74;
    const lastTravel = span + (this.need - 1) * spacing;
    this.speed = lastTravel / (budget * 0.92);
    this.pipes = [];
    let cy = CY;
    for (let i = 0; i < this.need; i++) {
      const maxStep = 26;                      // small centre drift = easy to track
      cy += (Math.random() * 2 - 1) * maxStep;
      cy = Math.max(TOP + this.gap / 2 + 8, Math.min(BOT - this.gap / 2 - 8, cy));
      this.pipes.push({ x: W + 30 + i * spacing, cy, scored: false });
    }
  }
  update(dt, input) {
    if (input.justDown) { this.vy = this.flap; Sfx.tap(); }
    this.vy += this.grav * dt; this.y += this.vy * dt;
    if (this.y < TOP + this.hitH / 2 || this.y > BOT - this.hitH / 2) { buzz(70); this.lose(); return; }
    for (const p of this.pipes) {
      p.x -= this.speed * dt;
      // collide the fuselage box (not the wings) against the pipe column
      if (Math.abs(p.x - this.bx) < this.pipeW / 2 + this.hitW / 2) {
        if (Math.abs(this.y - p.cy) > this.gap / 2 - this.hitH / 2) { buzz(70); this.lose(); return; }
      }
      if (!p.scored && p.x < this.bx - this.pipeW / 2) { p.scored = true; this.passed++; Sfx.tick(); FX.hit(this.bx, this.y, PAL.accent); }
    }
    if (this.passed >= this.need) this.succeed();
  }
  draw(g) {
    g.clear();
    for (const p of this.pipes) {
      g.rect(p.x - this.pipeW / 2, TOP, this.pipeW, p.cy - this.gap / 2 - TOP, PAL.bad);
      g.rect(p.x - this.pipeW / 2, p.cy + this.gap / 2, this.pipeW, BOT - (p.cy + this.gap / 2), PAL.bad);
      g.rect(p.x - this.pipeW / 2 - 3, p.cy - this.gap / 2 - 6, this.pipeW + 6, 6, PAL.bad);   // caps
      g.rect(p.x - this.pipeW / 2 - 3, p.cy + this.gap / 2, this.pipeW + 6, 6, PAL.bad);
      g.rect(p.x - this.pipeW / 2 + 2, TOP, 2, p.cy - this.gap / 2 - TOP - 6, PAL.mid);          // shine
      g.rect(p.x - this.pipeW / 2 + 2, p.cy + this.gap / 2 + 6, 2, BOT - (p.cy + this.gap / 2) - 6, PAL.mid);
    }
    g.sprite('plane', this.bx, this.y, { w: this.planeW, h: this.planeH, frame: Math.floor(this.t * 16) % 9 });
    for (let i = 0; i < this.need; i++) g.rect(CX - this.need * 4 + i * 8, TOP + 4, 5, 5, i < this.passed ? PAL.accent : PAL.mid);
  }
}

// 25. CROSSY — hop forward across lanes of traffic to the far side
class Crossy extends Microgame {
  static meta = { id: 'crossy', env: 'lawn', prompt: 'CROSS!', hint: 'tap', duration: 4.8, minDuration: 4.4,
    how: 'TAP TO HOP\nACROSS THE ROAD' };
  init() {
    this.lanes = this.byD(2, 3, 4);
    this.laneH = (BOT - TOP - 24) / (this.lanes + 1);
    this.px = CX; this.row = 0;
    this.py = BOT - 12;
    this.cars = [];
    for (let L = 0; L < this.lanes; L++) {
      const dir = L % 2 ? 1 : -1;
      const sp = this.byD(22, 30, 38) * dir;   // slow enough that a gap always recurs in time
      this.cars.push({ lane: L, x: Math.random() * W, sp, w: 24 });
    }
    this.hopping = 0;
  }
  laneY(L) { return BOT - 12 - (L + 1) * this.laneH; }
  update(dt, input) {
    if (input.justDown && this.row <= this.lanes) { this.row++; this.hopping = 0.28; Sfx.tap(); buzz(10); }
    this.py += ((this.row === 0 ? BOT - 12 : this.row > this.lanes ? this.laneY(this.lanes - 1) - this.laneH : this.laneY(this.row - 1)) - this.py) * Math.min(1, dt * 20);
    for (const c of this.cars) {
      c.x += c.sp * dt;
      if (c.x < -16) c.x = W + 16; if (c.x > W + 16) c.x = -16;
      // hit only if the player is standing in that car's lane
      if (this.row - 1 === c.lane && Math.abs(c.x - this.px) < c.w / 2 + 2 && this.hopping <= 0) { buzz(80); Sfx.thud(); this.lose(); return; }
    }
    if (this.hopping > 0) this.hopping -= dt;
    if (this.row > this.lanes) { Sfx.bark(); this.succeed(); }   // reached the far side
  }
  draw(g) {
    g.clear();
    const top = this.laneY(this.lanes - 1) - this.laneH / 2, bottom = this.laneY(0) + this.laneH / 2;
    // the road: tarmac (cars drove on the lawn before), kerbs top and bottom, dashed lines between the lanes
    g.rect(0, top, W, bottom - top, SCENE.road);
    g.rect(0, top - 2, W, 2, PAL.ink); g.rect(0, bottom, W, 2, PAL.ink);
    for (let L = 0; L < this.lanes - 1; L++) {
      const y = this.laneY(L) - this.laneH / 2;
      for (let x = 4; x < W; x += 16) g.rect(x, y, 8, 1, TEXT_MID);
    }
    // pavement you start on, and the far side with a bone waiting
    ctx.globalAlpha = 0.25;
    g.rect(0, bottom + 2, W, BOT - bottom - 2, PAL.mid);
    g.rect(0, TOP, W, Math.max(0, top - 2 - TOP), PAL.mid);
    ctx.globalAlpha = 1;
    for (let x = 0; x < W; x += 12) g.rect(x, bottom + 2, 1, BOT - bottom - 2, PAL.bg);   // paving slabs
    g.bone(CX, (TOP + top) / 2, 20);
    for (const c of this.cars) g.car(c.x, this.laneY(c.lane), c.w, Math.sign(c.sp));
    g.sprite('hero', this.px, this.py, { w: 19, h: 24, frame: Math.floor(this.t * 14) % 9 });
  }
}

// 26. DOODLE — auto-bounce; steer to land on each rising platform
class Doodle extends Microgame {
  static meta = { id: 'doodle', env: 'sky', prompt: 'HOP!', hint: 'drag', duration: 5.0, winOnTimeout: true,
    how: 'DRAG LEFT/RIGHT\nTO LAND ON STEPS' };
  init() {
    this.x = CX; this.vy = 0;
    this.grav = 240; this.bounce = -210;
    this.pw = this.byD(58, 50, 44);            // wide platforms
    this.need = this.byD(2, 2, 3); this.landed = 0;
    const maxRise = (this.bounce * this.bounce) / (2 * this.grav);
    const step = Math.min((BOT - TOP - 30) / (this.need + 1), maxRise * 0.5);  // easy reach
    this.plats = [];
    let py = BOT - 20;
    for (let i = 0; i <= this.need; i++) { this.plats.push({ x: 20 + Math.random() * (W - 40), y: py, used: false }); py -= step; }
    this.plats[0].x = this.x = CX; this.y = this.plats[0].y - 6;
    this.cur = 0;
  }
  update(dt, input) {
    if (input.down) this.x += (input.x - this.x) * Math.min(1, dt * 20);   // snappy steering
    this.x = Math.max(8, Math.min(W - 8, this.x));
    this.vy += this.grav * dt; this.y += this.vy * dt;
    // bounce when falling onto the next platform within its width
    if (this.vy > 0) {
      for (const p of this.plats) {
        if (!p.used && Math.abs(this.y - p.y) < 9 && Math.abs(this.x - p.x) < this.pw / 2 + 3) {
          this.vy = this.bounce; if (p !== this.plats[0]) { p.used = true; this.landed++; Sfx.tick(); FX.hit(p.x, p.y, PAL.accent); }
        }
      }
    }
    if (this.y > BOT + 10) { buzz(70); this.lose(); return; }
    if (this.landed >= this.need) this.succeed();
  }
  draw(g) {
    g.clear();
    for (const p of this.plats) g.rect(p.x - this.pw / 2, p.y, this.pw, 4, p.used ? PAL.mid : PAL.accent);
    // jump sprite keyed to velocity: stretched tall (8) rising, crouched (0)
    // landing, mid frames in between for the transition
    const fr = Math.max(0, Math.min(8, Math.round(4 - this.vy / 55)));
    g.sprite('hopdog', this.x, this.y - 6, { w: 22, h: 22, frame: fr });
    for (let i = 0; i < this.need; i++) g.rect(4 + i * 8, TOP + 4, 5, 5, i < this.landed ? PAL.accent : PAL.mid);
  }
}

// 27. PAWS — tap the paw prints as they fall, never miss one (Piano Tiles)
class PianoTiles extends Microgame {
  static meta = { id: 'tiles', env: 'lawn', prompt: 'PAWS!', hint: 'tap', duration: 4.6,
    how: "TAP EVERY PAW PRINT\nDON'T MISS ONE" };
  init() {
    this.cols = 4; this.colW = W / this.cols;
    this.need = this.byD(3, 4, 5); this.hit = 0;
    this.tileH = 34;
    // Pace off the real time budget: prints arrive evenly, the last reaching the
    // bottom at ~85% of the round so every one is tappable in time.
    const budget = Math.max(1.2, this.timeLimit - 0.3);
    const interval = budget * 0.85 / this.need;      // seconds between arrivals
    this.fall = (BOT - TOP) / (budget * 0.6);        // travel top→bottom in 60% of budget
    this.tiles = [];
    for (let i = 0; i < this.need; i++) {
      const startY = TOP - this.tileH - i * interval * this.fall;
      this.tiles.push({ col: Math.floor(Math.random() * this.cols), y: startY, hit: false, missed: false });
    }
  }
  update(dt, input) {
    for (const t of this.tiles) {
      t.y += this.fall * dt;
      if (!t.hit && !t.missed && t.y > BOT) { t.missed = true; buzz(70); this.lose(); return; }  // let one fall past = fail
    }
    if (input.justDown) {
      const col = Math.floor(input.x / this.colW);
      // hit the lowest un-hit print in that column that's within the play area
      let target = null;
      for (const t of this.tiles) if (!t.hit && t.col === col && t.y + this.tileH > TOP && t.y < BOT) { if (!target || t.y > target.y) target = t; }
      if (target) { target.hit = true; this.hit++; Sfx.blip(520 + this.hit * 90, 0.06, 'triangle', 0.07); FX.hit(input.x, target.y + this.tileH / 2, PAL.accent); if (this.hit >= this.need) this.succeed(); }
      else { buzz(40); FX.shake(2); }             // tapping empty space is just a whiff, not a loss
    }
  }
  draw(g) {
    g.clear();
    for (let c = 1; c < this.cols; c++) g.rect(c * this.colW, TOP, 1, BOT - TOP, PAL.mid);
    for (const t of this.tiles) {
      if (t.hit) continue;
      g.paw(t.col * this.colW + this.colW / 2, t.y + this.tileH / 2, 30, PAL.ink);
    }
    g.rect(0, BOT, W, 1, PAL.accent);
    for (let i = 0; i < this.need; i++) g.rect(CX - this.need * 3 + i * 6, TOP + 4, 4, 4, i < this.hit ? PAL.accent : PAL.mid);
  }
}

// 28. RUN — Chrome-dino style: auto-run, tap to jump the cacti, survive to the end
class DinoRun extends Microgame {
  static meta = { id: 'run', env: 'field@270', prompt: 'JUMP!', hint: 'tap', duration: 5.0, winOnTimeout: true, minDuration: 3.2,
    how: 'TAP TO JUMP\nOVER THE CACTI' };
  init() {
    this.ground = BOT - 6;
    this.dogW = 30; this.dogH = 28;
    this.px = 42;
    this.y = 0;            // height above ground (positive = up)
    this.vy = 0;
    this.grav = 620; this.jump = 210;
    this.onGround = true;
    this.legT = 0;
    // obstacles: spaced so a single well-timed jump always clears each, and the
    // gaps are reachable at the scroll speed (verified by the oracle)
    this.speed = this.byD(120, 150, 185);
    this.need = this.byD(2, 3, 4); this.cleared = 0;
    // minimum horizontal gap = airtime * speed, so two cacti never trap the dog
    const airtime = 2 * this.jump / this.grav;      // ~0.68s
    const minGap = airtime * this.speed + 46;
    this.obs = [];
    let x = W + 30;
    for (let i = 0; i < this.need; i++) {
      this.obs.push({ x, h: this.byD(16, 18, 22) + Math.random() * 6, passed: false });
      x += minGap + Math.random() * 40;
    }
  }
  update(dt, input) {
    this.legT += dt;
    if (input.justDown && this.onGround) { this.vy = this.jump; this.onGround = false; Sfx.tap(); buzz(12); }
    // vertical physics
    this.vy -= this.grav * dt;
    this.y += this.vy * dt;
    if (this.y <= 0) { this.y = 0; this.vy = 0; this.onGround = true; }
    // scroll obstacles
    for (const o of this.obs) {
      o.x -= this.speed * dt;
      // collision: dog's box vs cactus, only when low enough
      const dogBottom = this.y, dogTop = this.y + this.dogH;
      if (Math.abs(o.x - this.px) < this.dogW / 2 - 2 && dogBottom < o.h - 2) { buzz(80); FX.shake(4); this.lose(); return; }
      if (!o.passed && o.x < this.px - this.dogW / 2) { o.passed = true; this.cleared++; Sfx.tick(); FX.hit(this.px, this.ground - 4, PAL.accent); }
    }
    if (this.cleared >= this.need) this.succeed();
  }
  draw(g) {
    g.clear();
    // ground line
    g.rect(0, this.ground, W, 2, PAL.mid);
    // cacti
    for (const o of this.obs) {
      if (o.x < -14) continue;
      g.rect(o.x - 4, this.ground - o.h, 8, o.h, PAL.bad);
      g.rect(o.x - 8, this.ground - o.h * 0.6, 4, 4, PAL.bad);
      g.rect(o.x + 4, this.ground - o.h * 0.75, 4, 4, PAL.bad);
    }
    // the shiba, drawn ~2x the hitbox so the padded 120px frame's dog matches
    // dogW/dogH. On the ground: the run gallop. Airborne: the dedicated jump
    // sprite keyed to the arc — launch while rising, tuck at the peak, reach
    // down while falling.
    const drawY = this.ground - this.dogH / 2 - this.y;
    if (this.onGround) {
      g.sprite('swiperight', this.px, drawY, { w: this.dogW * 2, h: this.dogH * 2, frame: Math.floor(this.legT * 14) % 9 });
    } else {
      const jf = this.vy > 60 ? 2 : this.vy < -60 ? 4 : 3;   // rising / falling / peak
      g.sprite('runjump', this.px, drawY, { w: this.dogW * 2, h: this.dogH * 2, frame: jf });
    }
    // progress pips
    for (let i = 0; i < this.need; i++) g.rect(W - 8 - i * 8, TOP + 4, 5, 5, i < this.cleared ? PAL.accent : PAL.mid);
  }
}

// 29. KNOCK — Angry-Birds style: sling the shiba to topple the block stack
class KnockStack extends Microgame {
  static meta = { id: 'knock', env: 'field@270', prompt: 'KNOCK IT!', hint: 'flick', duration: 5.0, minDuration: 3.2,
    how: 'PULL BACK, LET GO\nTO KNOCK IT DOWN' };
  init() {
    this.K = 6;                               // pull -> velocity (same as flick)
    this.ox = 34; this.oy = BOT - 40;         // slingshot on the lower-left
    this.ball = { x: this.ox, y: this.oy, r: 9, vx: 0, vy: 0, flying: false };
    this.aim = false; this.launched = false;
    this.settle = 0;

    // a stack of blocks on a platform to the right; knock enough off to win
    this.baseX = this.byD(120, 132, 144);     // stack column
    this.groundY = BOT - 6;
    this.need = this.byD(1, 2, 2);            // blocks that must be toppled
    this.count = this.byD(3, 3, 4);          // blocks in the stack
    this.blocks = [];
    const bw = 20, bh = 16;
    for (let i = 0; i < this.count; i++) {
      this.blocks.push({ x: this.baseX, y: this.groundY - bh / 2 - i * bh,
                         w: bw, h: bh, vx: 0, vy: 0, toppled: false });
    }
    this.knocked = 0;
  }
  update(dt, input) {
    if (!this.launched) {
      if (input.down) {
        this.aim = true;
        let px = input.x - this.ox, py = input.y - this.oy;
        const maxPull = 70, d = Math.hypot(px, py);
        if (d > maxPull) { px = px / d * maxPull; py = py / d * maxPull; }
        this.ball.x = Math.max(6, Math.min(W - 6, this.ox + px));
        this.ball.y = Math.min(BOT - 2, this.oy + py);
      } else if (this.aim) {
        this.ball.vx = (this.ox - this.ball.x) * this.K;
        this.ball.vy = (this.oy - this.ball.y) * this.K;
        this.ball.flying = true; this.launched = true; Sfx.tap(); buzz(15);
      }
      return;
    }

    // projectile
    if (this.ball.flying) {
      this.ball.x += this.ball.vx * dt; this.ball.y += this.ball.vy * dt;
      this.ball.vy += 240 * dt;
      // hit a standing block -> knock it flying
      for (const b of this.blocks) {
        if (b.toppled) continue;
        if (Math.abs(this.ball.x - b.x) < b.w / 2 + this.ball.r &&
            Math.abs(this.ball.y - b.y) < b.h / 2 + this.ball.r) {
          b.toppled = true; this.knocked++;
          b.vx = this.ball.vx * 0.4 + 40; b.vy = -80;
          this.ball.vx *= 0.5; this.ball.vy = -60;       // ball bounces on
          FX.hit(b.x, b.y, PAL.accent); Sfx.thud(); buzz(20);
          // blocks above a toppled one lose support and tumble too
          for (const a of this.blocks) if (!a.toppled && a.x === b.x && a.y < b.y) {
            a.toppled = true; this.knocked++; a.vx = 20 + Math.random() * 30; a.vy = -50;
          }
        }
      }
      if (this.knocked >= this.need) { this.succeed(); return; }
      // ball left the field -> that shot is spent; if not enough knocked, fail
      if (this.ball.y > BOT + 20 || this.ball.x > W + 20 || this.ball.x < -20) {
        this.settle += dt;
        if (this.settle > 0.3) { this.lose(); return; }
      }
    }
    // animate toppled blocks falling away
    for (const b of this.blocks) if (b.toppled) { b.x += b.vx * dt; b.y += b.vy * dt; b.vy += 240 * dt; }
  }
  draw(g) {
    g.clear();
    g.rect(0, this.groundY, W, 2, PAL.mid);
    // platform under the stack
    g.rect(this.baseX - 16, this.groundY - 2, 32, 4, PAL.mid);
    // blocks
    for (const b of this.blocks) {
      if (b.toppled && (b.y > BOT + 20)) continue;
      g.cRect(b.x, b.y, b.w, b.h, b.toppled ? PAL.mid : PAL.bad);
      g.box(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h, PAL.bg);
      g.line(b.x - b.w / 2 + 2, b.y - b.h / 2 + 2, b.x + b.w / 2 - 2, b.y + b.h / 2 - 2, PAL.bg, 1);   // crate brace
      g.line(b.x - b.w / 2 + 2, b.y + b.h / 2 - 2, b.x + b.w / 2 - 2, b.y - b.h / 2 + 2, PAL.bg, 1);
    }
    // slingshot fork
    g.line(this.ox - 5, this.oy + 12, this.ox - 5, BOT, PAL.mid, 2);
    // the shiba face as the projectile
    if (this.aim && !this.launched) {
      g.line(this.ox, this.oy, this.ball.x, this.ball.y, PAL.mid, 1);
      let px = this.ball.x, py = this.ball.y;
      let vx = (this.ox - this.ball.x) * this.K, vy = (this.oy - this.ball.y) * this.K;
      for (let i = 0; i < 12; i++) { px += vx * 0.05; py += vy * 0.05; vy += 240 * 0.05; if (py > BOT) break; g.rect(px - 1, py - 1, 2, 2, PAL.mid); }
    }
    g.sprite('face', this.ball.x, this.ball.y, { w: 20, h: 20, frame: this.launched ? 4 : 0 });
    if (!this.launched && !this.aim) g.text('DRAG BACK', CX, TOP + 20, 8, PAL.mid);
    for (let i = 0; i < this.need; i++) g.rect(W - 8 - i * 8, TOP + 4, 5, 5, i < this.knocked ? PAL.accent : PAL.mid);
  }
}

// 30. MOVE — wave your body at the camera and the shiba runs for the finish flag
class MoveCam extends Microgame {
  static meta = { id: 'move', env: 'park@250', cam: true, prompt: 'MOVE!', hint: 'move', duration: 5.0, minDuration: 4.0, photo: true,
    how: { cam: 'MOVE YOUR BODY TO MAKE\nTHE SHIBA RUN', touch: 'TAP FAST TO MAKE\nTHE SHIBA RUN' } };
  init() {
    this.fill = 0;
    this.legT = 0; this.dust = [];
    this.need = this.byD(1.0, 1.4, 1.8);
    Input.enableCam();
    this.paused = Input.camPending;
    this.wait = 0;
    this.flash = 0;
    this.note = 0;
  }
  update(dt, input) {
    if (this.paused) {
      this.wait += dt;
      if (!Input.camPending || this.wait > 1.5) this.paused = false;
      return;
    }
    this.fill += input.motion * dt * 1.4;
    // legs go as fast as you move; kick up dust while it's really running
    this.legT += dt * input.motion * 30;
    if (input.motion > 0.15 && Math.random() < input.motion) this.dust.push({ x: this.runX() - 14, y: 255, t: 0 });
    for (const d of this.dust) { d.t += dt; d.x -= 18 * dt; d.y -= 6 * dt; }
    this.dust = this.dust.filter(d => d.t < 0.4);
    const n = Math.floor(Math.min(1, this.fill / this.need) * 8);   // a rising scale as the meter fills
    if (n > this.note) { this.note = n; Sfx.step(n - 1); }
    if (this.fill >= this.need && !this.finished) {
      this.flash = 1;
      this.succeed();
    }
  }
  runX() { return 22 + Math.min(1, this.fill / this.need) * (W - 58); }
  draw(g) {
    g.clear();
    if (this.paused) {
      g.text('ALLOW CAMERA…', CX, CY - 6, 11, PAL.bg);
      g.text('(then move to make it run)', CX, CY + 12, 7, PAL.bg);
      return;
    }
    const m = Input.motion, gy = 250;
    // the race lane, and the finish flag waiting at the far end
    for (let x = 22; x < W - 26; x += 8) g.rect(x, gy + 10, 4, 1, PAL.ink);
    const fx = W - 18, fy = gy + 10;   // the flag stands on the lane, like the runner
    g.rect(fx, fy - 34, 2, 34, PAL.bg);
    for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++) g.rect(fx + 2 + c * 4, fy - 34 + r * 4, 4, 4, (r + c) % 2 ? PAL.bg : PAL.ink);
    // dust behind its paws, speed lines when it's flat out
    for (const d of this.dust) { ctx.globalAlpha = 1 - d.t / 0.4; g.rect(d.x, d.y, 3, 3, PAL.mid); ctx.globalAlpha = 1; }
    const rx = this.runX();
    if (m > 0.4) for (let i = 0; i < 3; i++) g.rect(rx - 34 - i * 5, gy - 16 + i * 9, 12 + i * 3, 2, PAL.bg);
    const frame = m > 0.05 ? Math.floor(this.legT) % 9 : 0;
    g.sprite('swiperight', rx, gy - 7, { w: 64, h: 64, frame });   // paws on the lane in the grass, not up among the trees
    g.text(Input.camReady ? 'WAVE TO RUN!' : 'TAP TO RUN!', CX - 12, TOP + 26, 9, PAL.bg);   // clear of the sun
    if (this.flash > 0 && Engine.state === 'PLAYING') { this.flash -= STEP; g.rect(0, 0, W, H, PAL.ink); }
  }

}

// 31. DRY OFF — big separate shakes at the camera, like a wet dog (Snapped! homage)
class DryShiba extends Microgame {
  static meta = { id: 'dry', env: 'bath', cam: true, prompt: 'DRY OFF!', hint: 'move', duration: 5.0, minDuration: 4.0, photo: true, photoCap: 'ALL FLUFFY!',
    how: { cam: 'SHAKE HARD, STOP,\nSHAKE AGAIN!', touch: 'TAP, TAP, TAP\nTO SHAKE IT OFF' } };
  init() {
    // Not MOVE's steady wiggle: a wet dog shakes in big bursts. Each burst is a
    // spike of motion that has to settle back down before the next one counts.
    this.bursts = 0; this.need = this.byD(3, 4, 5); this.ready = true;
    this.drops = [];
    Input.enableCam();
    this.paused = Input.camPending; this.wait = 0;
    this.wob = 0; this.pop = 0;
  }
  update(dt, input) {
    if (this.paused) { this.wait += dt; if (!Input.camPending || this.wait > 1.5) this.paused = false; return; }
    const m = input.motion;
    this.wob = m;
    if (this.pop > 0) this.pop -= dt;
    if (m < 0.15) this.ready = true;
    else if (m > 0.4 && this.ready) {
      this.ready = false; this.bursts++; this.pop = 0.25;
      Sfx.splash(); buzz(30); FX.shake(2);
      for (let i = 0; i < 14; i++) this.drops.push({ x: CX + (Math.random() - 0.5) * 40, y: CY, vx: (Math.random() - 0.5) * 220, vy: -60 - Math.random() * 90, t: 0 });
      if (this.bursts >= this.need && !this.finished) { this.succeed(); return; }
    }
    for (const d of this.drops) { d.t += dt; d.x += d.vx * dt; d.y += d.vy * dt; d.vy += 200 * dt; }
    this.drops = this.drops.filter(d => d.t < 0.6);
  }
  draw(g) {
    g.clear();
    if (this.paused) { g.text('ALLOW CAMERA…', CX, CY - 6, 11, PAL.ink); g.text('(then shake to dry)', CX, CY + 12, 7, PAL.mid); return; }
    // wet shiba drying out: frame tracks the shakes (wet -> fluffy), and it
    // jolts on each one
    const prog = Math.min(1, this.bursts / this.need);
    const fr = Math.max(0, Math.min(8, Math.floor(prog * 8.99)));
    const j = (Math.random() - 0.5) * (this.wob * 6 + this.pop * 30);
    g.sprite('dryshake', CX + j, CY - 4, { w: 56, h: 45, frame: fr });
    BathTime.tub(162);   // shaking off in the bath, not floating on the tiles
    for (const d of this.drops) { const k = 1 - d.t / 0.6; ctx.globalAlpha = k; g.circle(d.x, d.y, 2, PAL.ink); ctx.globalAlpha = 1; }
    g.text(this.ready ? (Input.camReady ? 'SHAKE!' : 'TAP!') : 'NOW STOP…', CX, TOP + 26, 10, this.ready ? PAL.accent : PAL.mid);
    for (let i = 0; i < this.need; i++) g.rect(CX - this.need * 6 + i * 12, BOT - 20, 8, 8, i < this.bursts ? PAL.accent : PAL.mid);
  }
}

// 32. LEAN — move to the side the arrow points (motion on that half of frame)
class LeanDodge extends Microgame {
  static meta = { id: 'lean', env: 'lawn', cam: true, prompt: 'LEAN!', hint: 'move', duration: 5.0, minDuration: 4.0, photo: true, photoCap: 'DODGED IT!',
    how: { cam: 'LEAN YOUR HEAD\nWHERE THE ARROW POINTS', touch: 'TAP THE SIDE\nTHE ARROW POINTS' } };
  init() {
    this.need = this.byD(2, 2, 3); this.hit = 0;
    Input.enableCam();
    this.paused = Input.camPending; this.wait = 0;
    this.dir = Math.random() < 0.5 ? 'L' : 'R';
    this.hold = 0; this.holdNeed = 0.3;          // shorter hold
    this.cool = 0;
  }
  newDir() { this.dir = Math.random() < 0.5 ? 'L' : 'R'; this.hold = 0; this.cool = 0.25; }
  update(dt, input) {
    if (this.paused) { this.wait += dt; if (!Input.camPending || this.wait > 1.5) this.paused = false; return; }
    if (this.cool > 0) { this.cool -= dt; return; }
    // forgiving: just need decent motion on the requested side. Leaning moves the
    // whole body so both sides light up — only require the correct side to be a
    // little stronger, not dominant, and accept a lower absolute amount.
    const want = this.dir === 'L' ? input.motionL : input.motionR;
    const other = this.dir === 'L' ? input.motionR : input.motionL;
    if (want > 0.18 && want >= other * 0.9) {
      this.hold += dt * 1.4;                       // fills a touch faster than real time
      if (this.hold >= this.holdNeed) {
        this.hit++; FX.hit(this.dir === 'L' ? 30 : W - 30, CY, PAL.accent); Sfx.tick(); buzz(15);
        if (this.hit >= this.need) { this.succeed(); return; }
        this.newDir();
      }
    } else { this.hold = Math.max(0, this.hold - dt * 0.4); }
  }
  // the brick flies in from the side you leaned away from
  stampPhoto(c) { PhotoFX.dodge(c, this.dir === 'L' ? 'R' : 'L'); }
  draw(g) {
    g.clear();
    if (this.paused) { g.text('ALLOW CAMERA…', CX, CY - 6, 11, PAL.ink); g.text('(then lean side to side)', CX, CY + 12, 7, PAL.mid); return; }
    const s = this.dir === 'L' ? -1 : 1;
    const prog = this.hold / this.holdNeed;                 // 0..1 how far you've held it
    // the shiba leans toward the side you must move: tilt + shift grow with progress
    const tilt = s * (0.35 + prog * 0.35);                  // radians
    const shift = s * (18 + prog * 22);
    ctx.save();
    ctx.translate(CX + shift, CY - 2);
    ctx.rotate(tilt);
    g.sprite('face', 0, 0, { w: 46, h: 46, frame: Math.floor(this.t * 8) % 3 });
    ctx.restore();
    // motion streaks on the side you're leaning, brighter as you hold
    if (prog > 0.05) {
      ctx.globalAlpha = 0.4 + prog * 0.4;
      for (let i = 0; i < 3; i++) g.line(CX + s * (30 + i * 8), CY - 14 + i * 14, CX + s * (44 + i * 8), CY - 14 + i * 14, PAL.accent, 2);
      ctx.globalAlpha = 1;
    }
    // arrow + label as the instruction
    const ax = this.dir === 'L' ? CX - 46 : CX + 46;
    ctx.save(); ctx.translate(ax, CY - 2);
    g.line(-10 * s, 0, 10 * s, 0, PAL.ink, 5);
    g.line(10 * s, 0, 3 * s, -8, PAL.ink, 5);
    g.line(10 * s, 0, 3 * s, 8, PAL.ink, 5);
    ctx.restore();
    g.text(this.dir === 'L' ? 'LEAN LEFT' : 'LEAN RIGHT', CX, BOT - 28, 10, PAL.accent);
    g.text(Input.camReady ? 'lean your head that way' : '(tap that side)', CX, TOP + 26, 7, PAL.mid);
    g.bar(CX - 30, BOT - 18, 60, 5, prog);
    for (let i = 0; i < this.need; i++) g.rect(CX - this.need * 4 + i * 8, TOP + 6, 5, 5, i < this.hit ? PAL.accent : PAL.mid);
  }
}

/* ── MORE CAMERA GAMES ────────────────────────────────────────────────────────
   These four read different things out of the same webcam sample that MOVE,
   DRY and LEAN use (see Input._sampleMotion):
     FREEZE  the *absence* of motion
     SWAT    where the motion is        (motionX / motionY)
     HIDE    frame brightness           (a hand over the lens)
     DANCE   motion in time with a beat
   Every one of them falls back to touch when the camera is denied or missing,
   so they stay in the pool on a desktop with no webcam.
─────────────────────────────────────────────────────────────────────────────── */

// The face sheet has a wink but no both-eyes-shut frame, so build one: copy
// the wink, paint fur over both eyes and draw two little closed-eye curves.
function sleepFace() {
  if (Assets.cache.sleepface || !Assets.get('face')) return;
  const a = Assets.get('face'), c = document.createElement('canvas');
  c.width = a.fw; c.height = a.fh;
  const x = c.getContext('2d');
  x.drawImage(a.img, 5 * a.fw, 0, a.fw, a.fh, 0, 0, a.fw, a.fh);
  const d = x.getImageData(0, 0, a.fw, a.fh);
  const px = (i, y) => { const k = (y * a.fw + i) * 4; return [d.data[k], d.data[k + 1], d.data[k + 2], d.data[k + 3]]; };
  const put = (i, y, v) => { const k = (y * a.fw + i) * 4; for (let n = 0; n < 4; n++) d.data[k + n] = v[n]; };
  const ink = px(21, 16);                                   // the wink's dark line
  for (const [l, r] of [[6, 11], [18, 24]]) {
    for (let y = 14; y <= 17; y++) for (let i = l; i <= r; i++) put(i, y, px(i, 13));   // fur from just above
  }
  for (const cx of [8, 21]) {                               // ‿ shut eyes
    put(cx - 2, 15, ink); put(cx + 2, 15, ink);
    put(cx - 1, 16, ink); put(cx, 16, ink); put(cx + 1, 16, ink);
  }
  x.putImageData(d, 0, 0);
  Assets.cache.sleepface = { img: c, fw: a.fw, fh: a.fh, frames: 1, fps: 1 };
}

// 33. FREEZE — hold perfectly still so you don't wake the sleeping shiba
class FreezeStatue extends Microgame {
  static meta = { id: 'freeze', env: 'bedroom@214', cam: true, prompt: 'FREEZE!', hint: 'still', duration: 4.6, minDuration: 3.8, winOnTimeout: true, photo: true, photoCap: 'SLEEPY TIME!',
    how: { cam: "HOLD STILL OR YOU'LL\nWAKE THE SHIBA", touch: "DON'T TOUCH OR YOU'LL\nWAKE THE SHIBA" } };
  init() {
    Input.enableCam();
    this.paused = Input.camPending; this.wait = 0;
    this.grace = 0.7;                          // a beat to settle before it counts
    // LEAN calls 0.18 "definitely leaning", so anything near that is a move,
    // not a twitch. Sitting still still reads a little motion — sensor grain,
    // mains flicker — so the bar also floats above the quietest reading this
    // round: a noisy camera can't fail you for holding perfectly still.
    this.base = this.byD(0.09, 0.065, 0.05);
    this.thr = this.base;
    this.noise = 1;                            // quietest motion while settling
    this.ox = 0; this.oy = 0;                  // how far the sleeper has shuffled
    this.hp = 1;                               // sleep meter — empty and it wakes up
    this.wob = 0;
    this.stirs = 0;                            // each one is a "huh?" and a twitch
    this.snoreT = 0.3;
    this.woke = false;
    sleepFace();
  }
  update(dt, input) {
    if (this.paused) { this.wait += dt; if (!Input.camPending || this.wait > 1.5) this.paused = false; return; }
    // the sleeper mirrors you: its head shuffles toward wherever the camera sees
    // movement (fast, so it tracks your face left/right/up) and eases back to
    // facing you when you hold still, so "you are moving" is unmistakable.
    if (input.motion > 0.04) {
      const tx = (input.motionX - 0.5) * 60, ty = (input.motionY - 0.5) * 40;
      this.ox += (tx - this.ox) * Math.min(1, dt * 16);
      this.oy += (ty - this.oy) * Math.min(1, dt * 16);
    } else {
      this.ox -= this.ox * Math.min(1, dt * 6);       // ease back to facing you
      this.oy -= this.oy * Math.min(1, dt * 6);
    }
    // The noise floor is learned only while settling — tracked across the whole
    // round it would take sustained movement for "quiet" and lift the bar above
    // it, and waving would pass. A settle reading above 0.08 isn't a grainy
    // sensor, it's someone who kept moving through GET READY, so it buys them
    // nothing; a genuinely noisy camera sits well below that and gets a little slack.
    if (this.grace > 0) {
      this.grace -= dt;
      this.noise = Math.min(this.noise, input.motion);
      this.thr = this.noise < 0.08 ? Math.min(0.12, Math.max(this.base, this.noise * 1.4 + 0.02)) : this.base;
      return;
    }
    const over = input.motion - this.thr;
    if (over > 0) {
      // strict: even a small shift drains fast and barely refills, so you must
      // hold genuinely still — a couple of seconds of fidgeting empties the meter
      this.hp -= (0.8 + over * 12) * dt;
      this.wob = Math.min(1, this.wob + over * dt * 6);
      const want = Math.min(6, 6 - Math.ceil(this.hp * 6));
      if (this.stirs < want) { this.stirs = want; Sfx.squeak(); }   // it stirs: "huh?"
      if (this.hp <= 0) { this.woke = true; Sfx.bark(); FX.shake(4); this.lose(); return; }
    } else {
      this.snoreT -= dt;                              // a soft snore while you hold still
      if (this.snoreT <= 0) { Sfx.snore(); this.snoreT = 1.1; }
      this.wob = Math.max(0, this.wob - dt * 2);
      this.hp = Math.min(1, this.hp + dt * 0.04);   // very slow refill — stillness is the only real recovery
    }
  }
  stampPhoto(c) { PhotoFX.sleepy(c); }
  draw(g) {
    g.clear();
    if (this.paused) { g.text('ALLOW CAMERA…', CX, CY - 6, 11, PAL.ink); g.text('(then hold still)', CX, CY + 12, 7, PAL.mid); return; }
    // a round dog bed on the bedroom floor
