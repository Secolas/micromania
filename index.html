    for (const p of this.plats) g.rect(p.x - this.pw / 2, p.y, this.pw, 4, p.used ? PAL.mid : PAL.accent);
    // jump sprite keyed to velocity: stretched tall (8) rising, crouched (0)
    // landing, mid frames in between for the transition
    const fr = Math.max(0, Math.min(8, Math.round(4 - this.vy / 55)));
    g.sprite('hopdog', this.x, this.y - 6, { w: 22, h: 22, frame: fr });
    for (let i = 0; i < this.need; i++) g.rect(4 + i * 8, TOP + 4, 5, 5, i < this.landed ? PAL.accent : PAL.mid);
  }
}

// 27. TILES — tap the black tiles as they fall, never miss one (Piano Tiles)
class PianoTiles extends Microgame {
  static meta = { id: 'tiles', prompt: 'TILES!', hint: 'tap', duration: 4.6 };
  init() {
    this.cols = 4; this.colW = W / this.cols;
    this.need = this.byD(3, 4, 5); this.hit = 0;
    this.tileH = 34;
    // Pace off the real time budget: tiles arrive evenly, the last reaching the
    // bottom at ~85% of the round so every tile is tappable in time.
    const budget = Math.max(1.2, this.timeLimit - 0.3);
    const interval = budget * 0.85 / this.need;      // seconds between arrivals
    this.fall = (BOT - TOP) / (budget * 0.6);        // travel top→bottom in 60% of budget
    this.tiles = [];
    for (let i = 0; i < this.need; i++) {
      // stagger start y so arrivals are `interval` apart
      const startY = TOP - this.tileH - i * interval * this.fall;
      this.tiles.push({ col: Math.floor(Math.random() * this.cols), y: startY, hit: false, missed: false });
    }
  }
  update(dt, input) {
    for (const t of this.tiles) {
      t.y += this.fall * dt;
      if (!t.hit && !t.missed && t.y > BOT) { t.missed = true; buzz(70); this.lose(); return; }  // let one fall past = fail
    }
    if (input.justDown) {
      const col = Math.floor(input.x / this.colW);
      // hit the lowest un-hit tile in that column that's within the play area
      let target = null;
      for (const t of this.tiles) if (!t.hit && t.col === col && t.y + this.tileH > TOP && t.y < BOT) { if (!target || t.y > target.y) target = t; }
      if (target) { target.hit = true; this.hit++; Sfx.tick(); FX.hit(input.x, target.y + this.tileH / 2, PAL.accent); if (this.hit >= this.need) this.succeed(); }
      else { buzz(40); FX.shake(2); }             // tapping empty space is just a whiff, not a loss
    }
  }
  draw(g) {
    g.clear();
    for (let c = 1; c < this.cols; c++) g.rect(c * this.colW, TOP, 1, BOT - TOP, PAL.mid);
    for (const t of this.tiles) {
      if (t.hit) continue;
      g.rect(t.col * this.colW + 2, t.y, this.colW - 4, this.tileH, PAL.ink);
    }
    g.rect(0, BOT, W, 1, PAL.accent);
    for (let i = 0; i < this.need; i++) g.rect(CX - this.need * 3 + i * 6, TOP + 4, 4, 4, i < this.hit ? PAL.accent : PAL.mid);
  }
}

// 28. RUN — Chrome-dino style: auto-run, tap to jump the cacti, survive to the end
class DinoRun extends Microgame {
  static meta = { id: 'run', prompt: 'JUMP!', hint: 'tap', duration: 5.0, winOnTimeout: true, minDuration: 3.2 };
  init() {
    this.ground = BOT - 6;
    this.dogW = 30; this.dogH = 28;
    this.px = 42;
    this.y = 0;            // height above ground (positive = up)
    this.vy = 0;
    this.grav = 620; this.jump = 210;
    this.onGround = true;
    this.legT = 0;
    // obstacles: spaced so a single well-timed jump always clears each, and the
    // gaps are reachable at the scroll speed (verified by the oracle)
    this.speed = this.byD(120, 150, 185);
    this.need = this.byD(2, 3, 4); this.cleared = 0;
    // minimum horizontal gap = airtime * speed, so two cacti never trap the dog
    const airtime = 2 * this.jump / this.grav;      // ~0.68s
    const minGap = airtime * this.speed + 46;
    this.obs = [];
    let x = W + 30;
    for (let i = 0; i < this.need; i++) {
      this.obs.push({ x, h: this.byD(16, 18, 22) + Math.random() * 6, passed: false });
      x += minGap + Math.random() * 40;
    }
  }
  update(dt, input) {
    this.legT += dt;
    if (input.justDown && this.onGround) { this.vy = this.jump; this.onGround = false; Sfx.tap(); buzz(12); }
    // vertical physics
    this.vy -= this.grav * dt;
    this.y += this.vy * dt;
    if (this.y <= 0) { this.y = 0; this.vy = 0; this.onGround = true; }
    // scroll obstacles
    for (const o of this.obs) {
      o.x -= this.speed * dt;
      // collision: dog's box vs cactus, only when low enough
      const dogBottom = this.y, dogTop = this.y + this.dogH;
      if (Math.abs(o.x - this.px) < this.dogW / 2 - 2 && dogBottom < o.h - 2) { buzz(80); FX.shake(4); this.lose(); return; }
      if (!o.passed && o.x < this.px - this.dogW / 2) { o.passed = true; this.cleared++; Sfx.tick(); FX.hit(this.px, this.ground - 4, PAL.accent); }
    }
    if (this.cleared >= this.need) this.succeed();
  }
  draw(g) {
    g.clear();
    // ground line
    g.rect(0, this.ground, W, 2, PAL.mid);
    // cacti
    for (const o of this.obs) {
      if (o.x < -14) continue;
      g.rect(o.x - 4, this.ground - o.h, 8, o.h, PAL.bad);
      g.rect(o.x - 8, this.ground - o.h * 0.6, 4, 4, PAL.bad);
      g.rect(o.x + 4, this.ground - o.h * 0.75, 4, 4, PAL.bad);
    }
    // the shiba: run cycle on the ground, leap pose while airborne
    const frame = this.onGround ? (Math.floor(this.legT * 14) % 4) : 5;
    const drawY = this.ground - this.dogH / 2 - this.y;
    g.sprite('runner', this.px, drawY, { w: this.dogW, h: this.dogH, frame });
    // progress pips
    for (let i = 0; i < this.need; i++) g.rect(W - 8 - i * 8, TOP + 4, 5, 5, i < this.cleared ? PAL.accent : PAL.mid);
  }
}

// 29. KNOCK — Angry-Birds style: sling the shiba to topple the block stack
class KnockStack extends Microgame {
  static meta = { id: 'knock', prompt: 'KNOCK IT!', hint: 'flick', duration: 5.0, minDuration: 3.2 };
  init() {
    this.K = 6;                               // pull -> velocity (same as flick)
    this.ox = 34; this.oy = BOT - 40;         // slingshot on the lower-left
    this.ball = { x: this.ox, y: this.oy, r: 9, vx: 0, vy: 0, flying: false };
    this.aim = false; this.launched = false;
    this.settle = 0;

    // a stack of blocks on a platform to the right; knock enough off to win
    this.baseX = this.byD(120, 132, 144);     // stack column
    this.groundY = BOT - 6;
    this.need = this.byD(1, 2, 2);            // blocks that must be toppled
    this.count = this.byD(3, 3, 4);          // blocks in the stack
    this.blocks = [];
    const bw = 20, bh = 16;
    for (let i = 0; i < this.count; i++) {
      this.blocks.push({ x: this.baseX, y: this.groundY - bh / 2 - i * bh,
                         w: bw, h: bh, vx: 0, vy: 0, toppled: false });
    }
    this.knocked = 0;
  }
  update(dt, input) {
    if (!this.launched) {
      if (input.down) {
        this.aim = true;
        let px = input.x - this.ox, py = input.y - this.oy;
        const maxPull = 70, d = Math.hypot(px, py);
        if (d > maxPull) { px = px / d * maxPull; py = py / d * maxPull; }
        this.ball.x = Math.max(6, Math.min(W - 6, this.ox + px));
        this.ball.y = Math.min(BOT - 2, this.oy + py);
      } else if (this.aim) {
        this.ball.vx = (this.ox - this.ball.x) * this.K;
        this.ball.vy = (this.oy - this.ball.y) * this.K;
        this.ball.flying = true; this.launched = true; Sfx.tap(); buzz(15);
      }
      return;
    }

    // projectile
    if (this.ball.flying) {
      this.ball.x += this.ball.vx * dt; this.ball.y += this.ball.vy * dt;
      this.ball.vy += 240 * dt;
      // hit a standing block -> knock it flying
      for (const b of this.blocks) {
        if (b.toppled) continue;
        if (Math.abs(this.ball.x - b.x) < b.w / 2 + this.ball.r &&
            Math.abs(this.ball.y - b.y) < b.h / 2 + this.ball.r) {
          b.toppled = true; this.knocked++;
          b.vx = this.ball.vx * 0.4 + 40; b.vy = -80;
          this.ball.vx *= 0.5; this.ball.vy = -60;       // ball bounces on
          FX.hit(b.x, b.y, PAL.accent); Sfx.tick(); buzz(20);
          // blocks above a toppled one lose support and tumble too
          for (const a of this.blocks) if (!a.toppled && a.x === b.x && a.y < b.y) {
            a.toppled = true; this.knocked++; a.vx = 20 + Math.random() * 30; a.vy = -50;
          }
        }
      }
      if (this.knocked >= this.need) { this.succeed(); return; }
      // ball left the field -> that shot is spent; if not enough knocked, fail
      if (this.ball.y > BOT + 20 || this.ball.x > W + 20 || this.ball.x < -20) {
        this.settle += dt;
        if (this.settle > 0.3) { this.lose(); return; }
      }
    }
    // animate toppled blocks falling away
    for (const b of this.blocks) if (b.toppled) { b.x += b.vx * dt; b.y += b.vy * dt; b.vy += 240 * dt; }
  }
  draw(g) {
    g.clear();
    g.rect(0, this.groundY, W, 2, PAL.mid);
    // platform under the stack
    g.rect(this.baseX - 16, this.groundY - 2, 32, 4, PAL.mid);
    // blocks
    for (const b of this.blocks) {
      if (b.toppled && (b.y > BOT + 20)) continue;
      g.cRect(b.x, b.y, b.w, b.h, b.toppled ? PAL.mid : PAL.bad);
      g.box(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h, PAL.bg);
    }
    // slingshot fork
    g.line(this.ox - 5, this.oy + 12, this.ox - 5, BOT, PAL.mid, 2);
    // the shiba face as the projectile
    if (this.aim && !this.launched) {
      g.line(this.ox, this.oy, this.ball.x, this.ball.y, PAL.mid, 1);
      let px = this.ball.x, py = this.ball.y;
      let vx = (this.ox - this.ball.x) * this.K, vy = (this.oy - this.ball.y) * this.K;
      for (let i = 0; i < 12; i++) { px += vx * 0.05; py += vy * 0.05; vy += 240 * 0.05; if (py > BOT) break; g.rect(px - 1, py - 1, 2, 2, PAL.mid); }
    }
    g.sprite('face', this.ball.x, this.ball.y, { w: 20, h: 20, frame: this.launched ? 4 : 0 });
    if (!this.launched && !this.aim) g.text('DRAG BACK', CX, TOP + 20, 8, PAL.mid);
    for (let i = 0; i < this.need; i++) g.rect(W - 8 - i * 8, TOP + 4, 5, 5, i < this.knocked ? PAL.accent : PAL.mid);
  }
}

// 30. MOVE — wave your body at the camera to fill the meter; snaps a photo on win
class MoveCam extends Microgame {
  static meta = { id: 'move', prompt: 'MOVE!', hint: 'move', duration: 5.0, minDuration: 4.0, photo: true };
  init() {
    this.fill = 0;
    this.need = this.byD(1.0, 1.4, 1.8);
    Input.enableCam();
    this.paused = Input.camPending;
    this.wait = 0;
    this.flash = 0;
  }
  update(dt, input) {
    if (this.paused) {
      this.wait += dt;
      if (!Input.camPending || this.wait > 1.5) this.paused = false;
      return;
    }
    this.fill += input.motion * dt * 1.4;
    if (this.fill >= this.need && !this.finished) {
      // snap the photo at the winning moment; the engine shows it after
      const shot = Input.snapPhoto();
      if (shot) Engine.lastPhoto = shot;
      this.flash = 1;
      this.succeed();
    }
  }
  draw(g) {
    g.clear();
    if (this.paused) {
      g.text('ALLOW CAMERA…', CX, CY - 6, 11, PAL.ink);
      g.text('(then move to fill it)', CX, CY + 12, 7, PAL.mid);
      return;
    }
    // live motion feedback: a pulsing ring that grows with how much you're moving
    const m = Input.motion;
    g.circle(CX, CY - 6, 14 + m * 30, m > 0.4 ? PAL.accent : PAL.mid);
    g.circle(CX, CY - 6, 10, PAL.ink);
    g.text(Input.camReady ? 'WAVE!' : 'TAP FAST!', CX, TOP + 26, 9, PAL.mid);
    g.bar(30, BOT - 18, W - 60, 8, this.fill / this.need);
    if (this.flash > 0) { this.flash -= STEP; g.rect(0, 0, W, H, PAL.ink); }
  }
}

// 31. DRY — shake fast at the camera to dry off the wet shiba (Snapped! homage)
class DryShiba extends Microgame {
  static meta = { id: 'dry', prompt: 'SHAKE!', hint: 'move', duration: 5.0, minDuration: 4.0, photo: true, photoCap: 'ALL FLUFFY!' };
  init() {
    this.dry = 0; this.need = this.byD(1.0, 1.4, 1.8);
    this.drops = [];
    Input.enableCam();
    this.paused = Input.camPending; this.wait = 0;
    this.wob = 0;
  }
  update(dt, input) {
    if (this.paused) { this.wait += dt; if (!Input.camPending || this.wait > 1.5) this.paused = false; return; }
    const m = input.motion;
    this.dry += m * dt * 1.5;
    this.wob = m;
    // fling water droplets when moving hard
    if (m > 0.4 && Math.random() < m) this.drops.push({ x: CX + (Math.random() - 0.5) * 40, y: CY, vx: (Math.random() - 0.5) * 120, vy: -60 - Math.random() * 60, t: 0 });
    for (const d of this.drops) { d.t += dt; d.x += d.vx * dt; d.y += d.vy * dt; d.vy += 200 * dt; }
    this.drops = this.drops.filter(d => d.t < 0.6);
    if (this.dry >= this.need && !this.finished) {
      const shot = Input.snapPhoto(); if (shot) Engine.lastPhoto = shot;
      this.succeed();
    }
  }
  draw(g) {
    g.clear();
    if (this.paused) { g.text('ALLOW CAMERA…', CX, CY - 6, 11, PAL.ink); g.text('(then shake to dry)', CX, CY + 12, 7, PAL.mid); return; }
    // wet shiba drying out: frame tracks the dryness meter (wet -> fluffy).
    // a little jitter on top sells the shake while you're moving.
    const prog = Math.min(1, this.dry / this.need);
    const fr = Math.max(0, Math.min(8, Math.floor(prog * 8.99)));
    const j = (Math.random() - 0.5) * this.wob * 8;
    g.sprite('dryshake', CX + j, CY - 4, { w: 46, h: 37, frame: fr });
    for (const d of this.drops) { const k = 1 - d.t / 0.6; ctx.globalAlpha = k; g.circle(d.x, d.y, 2, PAL.mid); ctx.globalAlpha = 1; }
    g.text(Input.camReady ? 'SHAKE FAST!' : 'TAP FAST!', CX, TOP + 26, 9, PAL.mid);
    g.bar(30, BOT - 18, W - 60, 8, this.dry / this.need);
  }
}

// 32. LEAN — move to the side the arrow points (motion on that half of frame)
class LeanDodge extends Microgame {
  static meta = { id: 'lean', prompt: 'LEAN!', hint: 'move', duration: 5.0, minDuration: 4.0, photo: true, photoCap: 'DODGED IT!' };
  init() {
    this.need = this.byD(2, 2, 3); this.hit = 0;
    Input.enableCam();
    this.paused = Input.camPending; this.wait = 0;
    this.dir = Math.random() < 0.5 ? 'L' : 'R';
    this.hold = 0; this.holdNeed = 0.3;          // shorter hold
    this.cool = 0;
  }
  newDir() { this.dir = Math.random() < 0.5 ? 'L' : 'R'; this.hold = 0; this.cool = 0.25; }
  update(dt, input) {
    if (this.paused) { this.wait += dt; if (!Input.camPending || this.wait > 1.5) this.paused = false; return; }
    if (this.cool > 0) { this.cool -= dt; return; }
    // forgiving: just need decent motion on the requested side. Leaning moves the
    // whole body so both sides light up — only require the correct side to be a
    // little stronger, not dominant, and accept a lower absolute amount.
    const want = this.dir === 'L' ? input.motionL : input.motionR;
    const other = this.dir === 'L' ? input.motionR : input.motionL;
    if (want > 0.18 && want >= other * 0.9) {
      this.hold += dt * 1.4;                       // fills a touch faster than real time
      if (this.hold >= this.holdNeed) {
        this.hit++; FX.hit(this.dir === 'L' ? 30 : W - 30, CY, PAL.accent); Sfx.tick(); buzz(15);
        if (this.hit >= this.need) {
          // it flies in from the side you leaned away from
          const shot = Input.snapPhoto();
          if (shot) { PhotoFX.dodge(shot, this.dir === 'L' ? 'R' : 'L'); Engine.lastPhoto = shot; }
          this.succeed(); return;
        }
        this.newDir();
      }
    } else { this.hold = Math.max(0, this.hold - dt * 0.4); }
  }
  draw(g) {
    g.clear();
    if (this.paused) { g.text('ALLOW CAMERA…', CX, CY - 6, 11, PAL.ink); g.text('(then lean side to side)', CX, CY + 12, 7, PAL.mid); return; }
    const s = this.dir === 'L' ? -1 : 1;
    const prog = this.hold / this.holdNeed;                 // 0..1 how far you've held it
    // the shiba leans toward the side you must move: tilt + shift grow with progress
    const tilt = s * (0.35 + prog * 0.35);                  // radians
    const shift = s * (18 + prog * 22);
    ctx.save();
    ctx.translate(CX + shift, CY - 2);
    ctx.rotate(tilt);
    g.sprite('face', 0, 0, { w: 46, h: 46, frame: Math.floor(this.t * 8) % 3 });
    ctx.restore();
    // motion streaks on the side you're leaning, brighter as you hold
    if (prog > 0.05) {
      ctx.globalAlpha = 0.4 + prog * 0.4;
      for (let i = 0; i < 3; i++) g.line(CX + s * (30 + i * 8), CY - 14 + i * 14, CX + s * (44 + i * 8), CY - 14 + i * 14, PAL.accent, 2);
      ctx.globalAlpha = 1;
    }
    // arrow + label as the instruction
    const ax = this.dir === 'L' ? CX - 46 : CX + 46;
    ctx.save(); ctx.translate(ax, CY - 2);
    g.line(-10 * s, 0, 10 * s, 0, PAL.ink, 5);
    g.line(10 * s, 0, 3 * s, -8, PAL.ink, 5);
    g.line(10 * s, 0, 3 * s, 8, PAL.ink, 5);
    ctx.restore();
    g.text(this.dir === 'L' ? 'LEAN LEFT' : 'LEAN RIGHT', CX, BOT - 28, 10, PAL.accent);
    g.text(Input.camReady ? 'lean your head that way' : '(tap that side)', CX, TOP + 26, 7, PAL.mid);
    g.bar(CX - 30, BOT - 18, 60, 5, prog);
    for (let i = 0; i < this.need; i++) g.rect(CX - this.need * 4 + i * 8, TOP + 6, 5, 5, i < this.hit ? PAL.accent : PAL.mid);
  }
}

/* ── MORE CAMERA GAMES ────────────────────────────────────────────────────────
   These four read different things out of the same webcam sample that MOVE,
   DRY and LEAN use (see Input._sampleMotion):
     FREEZE  the *absence* of motion
     SWAT    where the motion is        (motionX / motionY)
     HIDE    frame brightness           (a hand over the lens)
     DANCE   motion in time with a beat
   Every one of them falls back to touch when the camera is denied or missing,
   so they stay in the pool on a desktop with no webcam.
─────────────────────────────────────────────────────────────────────────────── */

// 33. FREEZE — hold perfectly still until the clock runs out
class FreezeStatue extends Microgame {
  static meta = { id: 'freeze', prompt: 'FREEZE!', hint: 'still', duration: 4.6, minDuration: 3.8, winOnTimeout: true, photo: true, photoCap: 'PERFECT STATUE!' };
  init() {
    Input.enableCam();
    this.paused = Input.camPending; this.wait = 0;
    this.grace = 0.7;                          // a beat to settle before it counts
    // LEAN calls 0.18 "definitely leaning", so anything near that is a move,
    // not a twitch. Sitting still still reads a little motion — sensor grain,
    // mains flicker — so the bar also floats above the quietest reading this
    // round: a noisy camera can't fail you for holding perfectly still.
    this.base = this.byD(0.16, 0.12, 0.09);
    this.thr = this.base;
    this.noise = 1;                            // quietest motion while settling
    this.ox = 0; this.oy = 0;                  // where the statue has been nudged
    this.hp = 1;                               // wobble meter — empty and you're caught
    this.wob = 0;
    this.cracks = [];
  }
  update(dt, input) {
    if (this.paused) { this.wait += dt; if (!Input.camPending || this.wait > 1.5) this.paused = false; return; }
    // the statue mirrors you: it drifts toward wherever the camera sees movement
    // and springs back when you hold still, so "you are moving" is visible
    const pull = Math.min(1, input.motion * 2.5);
    const tx = (input.motionX - 0.5) * 40 * pull, ty = (input.motionY - 0.5) * 24 * pull;
    this.ox += (tx - this.ox) * Math.min(1, dt * 8);
    this.oy += (ty - this.oy) * Math.min(1, dt * 8);
    // The noise floor is learned only while settling — tracked across the whole
    // round it would take sustained movement for "quiet" and lift the bar above
    // it, and waving would pass. A settle reading above 0.12 isn't a grainy
    // sensor, it's someone who kept moving through GET READY, so it buys them
    // nothing; a genuinely noisy camera sits well below that and does get slack.
    if (this.grace > 0) {
      this.grace -= dt;
      this.noise = Math.min(this.noise, input.motion);
      this.thr = this.noise < 0.12 ? Math.min(0.25, Math.max(this.base, this.noise * 1.8 + 0.03)) : this.base;
      return;
    }
    const over = input.motion - this.thr;
    if (over > 0) {
      // a real move empties the meter in about half a second; a small shift
      // costs a visible chunk but is survivable
      this.hp -= (0.35 + over * 7) * dt;
      this.wob = Math.min(1, this.wob + over * dt * 5);
      // the statue cracks a little further with every chunk of meter lost
      const want = Math.min(6, 6 - Math.ceil(this.hp * 6));
      while (this.cracks.length < want) this.cracks.push({ a: Math.random() * 6.2832, r: 17 + Math.random() * 5, l: 7 + Math.random() * 12 });
      if (this.hp <= 0) { FX.shake(4); this.lose(); return; }
    } else {
      this.wob = Math.max(0, this.wob - dt * 2);
      this.hp = Math.min(1, this.hp + dt * 0.15);   // slow, forgiving refill
    }
  }
  // winOnTimeout: the engine calls this when the clock runs out, so the photo
  // is snapped here rather than in update()
  succeed() {
    if (!this.finished) {
      const shot = Input.snapPhoto();
      if (shot) { PhotoFX.statue(shot); Engine.lastPhoto = shot; }
    }
    super.succeed();
  }
  draw(g) {
    g.clear();
    if (this.paused) { g.text('ALLOW CAMERA…', CX, CY - 6, 11, PAL.ink); g.text('(then hold still)', CX, CY + 12, 7, PAL.mid); return; }
    const j = (Math.random() - 0.5) * this.wob * 7;
    // plinth stays put — the statue shifting off it is the tell that you moved
    g.rect(CX - 28, CY + 22, 56, 5, PAL.mid);
    g.rect(CX - 22, CY + 27, 44, 4, PAL.mid);
    const hx = CX + this.ox + j, hy = CY - 6 + this.oy;
    ctx.save();
    ctx.translate(hx, hy);
    ctx.rotate(this.ox * 0.014);                     // leans the way you lean
    g.sprite('face', 0, 0, { w: 46, h: 46, frame: 0 });
    ctx.restore();
    for (const c of this.cracks) {
      g.line(hx + Math.cos(c.a) * c.r, hy + Math.sin(c.a) * c.r,
             hx + Math.cos(c.a) * (c.r + c.l), hy + Math.sin(c.a) * (c.r + c.l), PAL.bad, 1);
    }
    if (this.grace > 0) g.text('GET READY…', CX, TOP + 26, 9, PAL.mid);
    else g.text(Input.camReady ? 'DO NOT MOVE' : "DON'T TAP", CX, TOP + 26, 9, this.hp < 0.4 ? PAL.bad : PAL.accent);
    // live motion, with a tick at the line that starts draining the meter —
    // you can see the camera reacting, so a still round never feels like luck
    const mw = W - 60;
    g.rect(30, BOT - 30, mw, 3, PAL.mid);
    g.rect(30, BOT - 30, Math.min(1, Input.motion / 0.6) * mw, 3, Input.motion > this.thr ? PAL.bad : PAL.ink);
    g.rect(30 + Math.min(1, this.thr / 0.6) * mw, BOT - 33, 1, 9, PAL.accent);
    g.bar(30, BOT - 18, mw, 8, this.hp, this.hp < 0.4 ? PAL.bad : PAL.accent);
  }
}

// 34. SWAT — put your hand where the fly is; the camera tracks where you moved
class SwatFly extends Microgame {
  static meta = { id: 'swat', prompt: 'SWAT!', hint: 'move', duration: 5.0, minDuration: 4.2 };
  init() {
    Input.enableCam();
    Input.enableTilt(); Input.zeroTilt();      // hold the phone however you like
    this.paused = Input.camPending; this.wait = 0;
    this.need = this.byD(1, 2, 2);
    this.hit = 0;
    this.dwell = 0;
    this.dwellNeed = this.byD(0.20, 0.24, 0.28);
    this.hx = CX; this.hy = CY;                // the tracked hand
    this.trail = [];
    this.pop = 0;
    this.newFly();
  }
  newFly() {
    // kept off the edges (the motion centre rarely reaches a corner of the
    // frame) and away from where the hand already is, so it can't die on spawn
    for (let i = 0; i < 12; i++) {
      const x = 36 + Math.random() * (W - 72), y = TOP + 44 + Math.random() * (BOT - TOP - 96);
      if (Math.hypot(x - this.hx, y - this.hy) > 46 || i === 11) { this.fly = { x, y, t: 0 }; break; }
    }
    this.arm = 0.3;                            // no kill in the first moment
  }
  update(dt, input) {
    if (this.paused) { this.wait += dt; if (!Input.camPending || this.wait > 1.5) this.paused = false; return; }
    // Gyro aims far more precisely than the camera's centre-of-motion, so it
    // wins where it exists; otherwise motionX/Y (0..1 across the frame) does.
    let tx, ty;
    if (Input.tiltReady) {
      tx = CX + input.tiltX * (W / 2 - 14);
      ty = CY + input.tiltY * ((BOT - TOP) / 2 - 22);
    } else {
      tx = 12 + input.motionX * (W - 24);
      ty = TOP + 22 + input.motionY * (BOT - TOP - 44);
    }
    this.hx += (tx - this.hx) * Math.min(1, dt * (Input.tiltReady ? 14 : 9));
    this.hy += (ty - this.hy) * Math.min(1, dt * (Input.tiltReady ? 14 : 9));
    this.trail.push({ x: this.hx, y: this.hy, t: 0 });
    for (const p of this.trail) p.t += dt;
    this.trail = this.trail.filter(p => p.t < 0.22);

    // the fly drifts so it isn't a static dot to park a hand on
    this.fly.t += dt;
    this.fly.x += Math.cos(this.fly.t * 3.1) * 16 * dt;
    this.fly.y += Math.sin(this.fly.t * 4.4) * 16 * dt;

    if (this.pop > 0) this.pop -= dt;
    if (this.arm > 0) this.arm -= dt;
    const near = this.arm <= 0 && Math.hypot(this.hx - this.fly.x, this.hy - this.fly.y) < 22;
    // Aiming by tilt carries no swing to detect, so holding the swatter on the
    // fly is the swat — with a tap as a shortcut for the impatient. The camera
    // path keeps its own swing, where moving is the whole input.
    let swinging;
    if (Input.tiltReady) {
      this.dwell = near ? this.dwell + dt : Math.max(0, this.dwell - dt * 2);
      swinging = input.justDown || this.dwell >= this.dwellNeed;
    } else {
      swinging = Input.camReady ? input.motion > 0.12 : input.justDown;
    }
    if (near && swinging) {
      this.dwell = 0;
      this.hit++; this.pop = 0.22;
      Sfx.tick(); buzz(15); FX.hit(this.fly.x, this.fly.y, PAL.accent);
      if (this.hit >= this.need) { this.succeed(); return; }
      this.newFly();
    }
  }
  draw(g) {
    g.clear();
    if (this.paused) { g.text('ALLOW CAMERA…', CX, CY - 6, 11, PAL.ink); g.text('(then reach for the fly)', CX, CY + 12, 7, PAL.mid); return; }
    // the "fly": a little winged shiba that buzzes around. Uses the flydog
    // sprite once its art lands; until then it falls back to the drawn fly, so
    // this is safe to ship before the PNG is embedded.
    const f = this.fly;
    const bx = f.x + Math.sin(f.t * 33) * 1.5, by = f.y + Math.cos(f.t * 29) * 1.5;
    if (Assets.get('flydog')) {
      // wings flap fast (frame auto-cycles at the sheet's fps); aspect 80:63.
      // Nearest-neighbour keeps the pixel art crisp when scaled down.
      const sm = ctx.imageSmoothingEnabled; ctx.imageSmoothingEnabled = false;
      g.sprite('flydog', bx, by, { w: 30, h: 24 });
      ctx.imageSmoothingEnabled = sm;
    } else {
      const wg = Math.sin(f.t * 40) * 3;
      g.line(bx - 6, by - 4 + wg, bx, by - 1, PAL.mid, 2);
      g.line(bx + 6, by - 4 - wg, bx, by - 1, PAL.mid, 2);
      g.circle(bx, by, 4, PAL.ink);
      g.circle(bx, by - 3, 2, PAL.ink);
    }
    // hand: a ring where the camera thinks you are, with a short motion trail
    for (const p of this.trail) { ctx.globalAlpha = 1 - p.t / 0.22; g.circle(p.x, p.y, 3, PAL.mid); ctx.globalAlpha = 1; }
    const r = 13 + (this.pop > 0 ? this.pop * 40 : 0);
    g.circle(this.hx, this.hy, r, PAL.accent);
    g.circle(this.hx, this.hy, r - 3, PAL.bg);
    g.line(this.hx - 5, this.hy, this.hx + 5, this.hy, PAL.accent, 1);
    g.line(this.hx, this.hy - 5, this.hx, this.hy + 5, PAL.accent, 1);
    // the swatter closing while you hold it on target
    if (this.dwell > 0) {
      const k = Math.min(1, this.dwell / this.dwellNeed);
      g.circle(this.hx, this.hy, r + 7 - k * 7, PAL.bad);
      g.circle(this.hx, this.hy, r + 5 - k * 7, PAL.bg);
    }
    g.text(Input.tiltReady ? 'TILT TO AIM!' : Input.camReady ? 'REACH FOR IT!' : 'TAP IT!', CX, TOP + 26, 9, PAL.mid);
    for (let i = 0; i < this.need; i++) g.rect(W - 8 - i * 8, TOP + 4, 5, 5, i < this.hit ? PAL.accent : PAL.mid);
  }
}

// 35. HIDE — cover the lens with your hand until the searchlight gives up
class HideLens extends Microgame {
  static meta = { id: 'hide', prompt: 'HIDE!', hint: 'cover', duration: 4.6, minDuration: 3.8 };
  init() {
    Input.enableCam();
    this.paused = Input.camPending; this.wait = 0;
    this.settle = 0.4;                         // learn the room's light first
    this.base = 0.06;
    this.need = this.byD(0.7, 1.0, 1.3);       // seconds of darkness needed
    this.held = 0; this.cover = 0; this.dark = false;
  }
  update(dt, input) {
    if (this.paused) { this.wait += dt; if (!Input.camPending || this.wait > 1.5) this.paused = false; return; }
    // Baseline = the brightest the lens saw before the round got going, so
    // "covered" means dark *relative to this room*, not below a fixed number.
    if (this.settle > 0) { this.settle -= dt; this.base = Math.max(this.base, input.bright); return; }
    if (input.bright > this.base) this.base = input.bright;   // brightest seen wins
    this.cover = Math.max(0, Math.min(1, 1 - input.bright / this.base));
    this.dark = input.bright < this.base * 0.55;
    if (this.dark) {
      this.held += dt;
      if (this.held >= this.need && !this.finished) { this.succeed(); }
    } else this.held = Math.max(0, this.held - dt * 0.6);
  }
  draw(g) {
    g.clear();
    if (this.paused) { g.text('ALLOW CAMERA…', CX, CY - 6, 11, PAL.ink); g.text('(then cover the lens)', CX, CY + 12, 7, PAL.mid); return; }
    // searchlight sweeping over the hiding shiba
    const sw = Math.sin(this.t * 2.2) * 46;
    ctx.save();
    ctx.globalAlpha = 0.22 * (1 - this.cover);
    ctx.fillStyle = PAL.accent;
    ctx.beginPath();
    ctx.moveTo(CX + sw, TOP + 6);
    ctx.lineTo(CX + sw - 26, BOT - 22);
    ctx.lineTo(CX + sw + 26, BOT - 22);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    g.circle(CX + sw, TOP + 6, 4, PAL.accent);
    // the shiba, crouched behind a crate
    g.sprite('hero', CX, BOT - 52, { w: 27, h: 36, frame: Math.floor(this.t * 6) % 5 });
    g.rect(CX - 30, BOT - 40, 60, 18, PAL.mid);
    g.box(CX - 30, BOT - 40, 60, 18, PAL.ink);
    // the darkness the lens is actually seeing, painted over everything
    if (this.cover > 0.02) { ctx.globalAlpha = Math.min(0.92, this.cover); g.clear(); ctx.globalAlpha = 1; }
    g.text(this.settle > 0 ? 'GET READY…' : (Input.camReady ? 'COVER THE CAMERA!' : 'HOLD THE SCREEN!'), CX, TOP + 26, 9, this.dark ? PAL.accent : PAL.ink);
    g.bar(30, BOT - 18, W - 60, 8, this.held / this.need);
  }
}

// 36. DANCE — move on the beat: hit the ring each time it lands
class DanceBeat extends Microgame {
  static meta = { id: 'dance', prompt: 'DANCE!', hint: 'move', duration: 5.0, minDuration: 4.4, photo: true, photoCap: 'DANCE MACHINE!' };
  init() {
    Input.enableCam();
    this.paused = Input.camPending; this.wait = 0;
    this.need = this.byD(2, 3, 3);
    // beats spread over whatever the round length ended up being, so engine
    // speed changes the tempo instead of cutting the last beat off
    const first = 1.0, last = Math.max(first + 0.7, this.timeLimit - 0.7);
    this.beats = [];
    for (let i = 0; i < this.need; i++) {
      this.beats.push({ t: this.need > 1 ? first + (last - first) * i / (this.need - 1) : first, hit: false, miss: false });
    }
    this.win = 0.32;                           // ± window around a beat
    this.thr = this.byD(0.14, 0.17, 0.20);     // how big a move counts
    this.hits = 0; this.pop = 0;
  }
  update(dt, input) {
    if (this.paused) { this.wait += dt; if (!Input.camPending || this.wait > 1.5) this.paused = false; return; }
    if (this.pop > 0) this.pop -= dt;
    for (const b of this.beats) {
      if (b.hit || b.miss) continue;
      const off = this.t - b.t;                // this.t doesn't tick while paused
      if (Math.abs(off) <= this.win && input.motion > this.thr) {
        b.hit = true; this.hits++; this.pop = 0.22;
        Sfx.tick(); buzz(15); FX.hit(CX, CY - 6, PAL.accent);
        if (this.hits >= this.need) {
          const shot = Input.snapPhoto(); if (shot) Engine.lastPhoto = shot;
          this.succeed(); return;
        }
      } else if (off > this.win) { b.miss = true; Sfx.blip(180, 0.06); }
    }
    // every beat resolved and one was dropped — no point running out the clock
    if (!this.finished && this.beats.every(b => b.hit || b.miss)) this.lose();
  }
  draw(g) {
    g.clear();
    if (this.paused) { g.text('ALLOW CAMERA…', CX, CY - 6, 11, PAL.ink); g.text('(then move on the beat)', CX, CY + 12, 7, PAL.mid); return; }
    // the incoming beat, as a ring closing in on the shiba
    const nxt = this.beats.find(b => !b.hit && !b.miss);
    if (nxt) {
      const away = Math.abs(nxt.t - this.t);
      const r = 24 + Math.min(64, away * 78);
      const c = away <= this.win ? PAL.accent : PAL.mid;
      g.circle(CX, CY - 6, r + 2, c);
      g.circle(CX, CY - 6, r - 1, PAL.bg);
    }
    // shiba bobbing along with however hard you're moving
    const bob = Math.sin(this.t * 9) * 4 * Math.min(1, Input.motion * 2.5);
    const pop = this.pop > 0 ? this.pop * 24 : 0;
    g.sprite('face', CX, CY - 6 + bob, { w: 44 + pop, h: 44 + pop, frame: Math.floor(this.t * 8) % 3 });
    // the bar line: every beat as a pip, filled once you land it
    for (const b of this.beats) {
      const bx = 24 + (b.t / Math.max(0.01, this.timeLimit)) * (W - 48);
      g.rect(bx - 2, BOT - 20, 5, 5, b.hit ? PAL.accent : b.miss ? PAL.bad : PAL.mid);
    }
    g.rect(24, BOT - 13, W - 48, 1, PAL.mid);
    g.rect(24 + (Math.min(this.t, this.timeLimit) / Math.max(0.01, this.timeLimit)) * (W - 48) - 1, BOT - 16, 2, 7, PAL.ink);
    g.text(Input.camReady ? 'MOVE ON THE BEAT!' : 'TAP ON THE BEAT!', CX, TOP + 26, 9, PAL.mid);
  }
}

// ── BOSSES ───────────────────────────────────────────────────────────────────
/* Two bosses meant the pool strictly alternated — pick() skips the last id, so
   with a boss every eight rounds you always knew which one was coming. */

// B3. RED LIGHT — move on green, freeze on red. The camera boss: it is MOVE and
// FREEZE in one, switching between them while you play.
class RedLight extends Microgame {
  static meta = { id: 'redlight', prompt: 'RED LIGHT!', hint: 'still', duration: 5.6, minDuration: 5.0, photo: true, photoCap: 'YOU MADE IT!' };
  init() {
    Input.enableCam();
    this.paused = Input.camPending; this.wait = 0;
    this.fill = 0; this.need = this.byD(0.6, 0.8, 1.0);
    this.thr = this.byD(0.22, 0.18, 0.15);     // motion allowed while it is red
    // Filling the bar is not enough on its own: the first green alone was long
    // enough to finish it, so moving through the whole round used to win
    // without ever meeting a red light. The reds are the boss.
    this.needReds = this.byD(1, 2, 2);
    this.reds = 0;
    this.hp = 1;                               // caught meter, empty = out
    this.light = 'green'; this.phase = 0.9;
    this.grace = 0;                            // a beat to stop after it turns
    this.flash = 0;
  }
  // never turns red on the very first beat — you get to move first
  nextLight() {
    if (this.light === 'green') { this.light = 'amber'; this.phase = 0.35; }
    else if (this.light === 'amber') { this.light = 'red'; this.phase = 0.7 + Math.random() * 0.4; this.grace = 0.25; }
    else { this.light = 'green'; this.phase = 0.7 + Math.random() * 0.4; this.flash = 0.2; this.reds++; }
  }
  update(dt, input) {
    if (this.paused) { this.wait += dt; if (!Input.camPending || this.wait > 1.5) this.paused = false; return; }
    this.phase -= dt;
    if (this.flash > 0) this.flash -= dt;
    if (this.phase <= 0) this.nextLight();

    if (this.light === 'red') {
      if (this.grace > 0) { this.grace -= dt; return; }
      const over = input.motion - this.thr;
      if (over > 0) {
        this.hp -= (0.4 + over * 6) * dt;
        if (this.hp <= 0) { FX.shake(5); buzz(120); this.lose(); return; }
      }
    } else {
      // green and amber both count — amber is a warning, not a trap
      this.fill += input.motion * dt * 1.5;
      this.hp = Math.min(1, this.hp + dt * 0.2);
      if (this.fill >= this.need && this.reds >= this.needReds && !this.finished) {
        const shot = Input.snapPhoto(); if (shot) Engine.lastPhoto = shot;
        this.succeed();
      }
    }
  }
  draw(g) {
    g.clear();
    if (this.paused) { g.text('ALLOW CAMERA…', CX, CY - 6, 11, PAL.ink); g.text('(move on green, freeze on red)', CX, CY + 12, 6, PAL.mid); return; }
    const red = this.light === 'red', amber = this.light === 'amber';
    const lit = red ? PAL.bad : amber ? PAL.accent : PAL.accent;
    // the lamp, three bulbs with one of them on
    g.rect(CX - 13, TOP + 8, 26, 60, PAL.mid);
    g.circle(CX, TOP + 20, 8, red ? PAL.bad : PAL.bg);
    g.circle(CX, TOP + 38, 8, amber ? PAL.accent : PAL.bg);
    g.circle(CX, TOP + 56, 8, this.light === 'green' ? PAL.ink : PAL.bg);
    // the shiba: bouncing on green, dead still on red
    const bob = red ? 0 : Math.sin(this.t * 10) * 4 * Math.min(1, Input.motion * 2.5);
    g.sprite('face', CX, CY + 42 + bob, { w: 40, h: 40, frame: red ? 0 : Math.floor(this.t * 8) % 3 });
    g.text(red ? 'FREEZE!' : amber ? 'ABOUT TO STOP…' : 'GO GO GO!', CX, CY + 74, red ? 12 : 10, lit);
    // progress, and how close being caught is
    g.bar(24, BOT - 16, W - 48, 7, this.fill / this.need);
    if (this.hp < 1) g.bar(24, BOT - 26, W - 48, 4, this.hp, PAL.bad, PAL.bg);
    // one pip per red light you still have to sit through
    for (let i = 0; i < this.needReds; i++) g.rect(24 + i * 8, BOT - 34, 5, 5, i < this.reds ? PAL.accent : PAL.mid);
    if (this.flash > 0) { ctx.globalAlpha = this.flash * 2; g.rect(0, TOP, W, BOT - TOP, PAL.accent); ctx.globalAlpha = 1; }
  }
}

// B4. JUGGLE — keep every ball off the floor. Both other bosses are survive-by-
// dragging; this one is survive-by-tapping, and it splits your attention.
class Juggle extends Microgame {
  static meta = { id: 'juggle', prompt: 'JUGGLE!', hint: 'tap', duration: 5.5, winOnTimeout: true };
  init() {
    this.n = this.byD(2, 2, 3);
    this.grav = this.byD(120, 140, 160);
    this.floor = BOT - 4;
    this.balls = [];
    for (let i = 0; i < this.n; i++) {
      // spread out and dropped at staggered heights, so they never arrive together
      this.balls.push({
        x: 30 + (i + 0.5) * (W - 60) / this.n,
        y: TOP + 30 + i * 26,
        vx: (Math.random() - 0.5) * 26, vy: 0, r: 8, spin: Math.random() * 6.28
      });
    }
  }
  update(dt, input) {
    for (const b of this.balls) {
      b.vy += this.grav * dt;
      b.x += b.vx * dt; b.y += b.vy * dt;
      b.spin += b.vx * dt * 0.1;
      if (b.x < b.r + 2) { b.x = b.r + 2; b.vx = Math.abs(b.vx); }
      if (b.x > W - b.r - 2) { b.x = W - b.r - 2; b.vx = -Math.abs(b.vx); }
      if (b.y < TOP + b.r) { b.y = TOP + b.r; b.vy = Math.abs(b.vy) * 0.4; }
      if (b.y > this.floor) { buzz(80); FX.shake(4); this.lose(); return; }
    }
    // a tap bats up whichever ball it landed nearest, if it landed near one
    for (const t of input.taps) {
      let best = null, bd = 1e9;
      for (const b of this.balls) {
        const d = Math.hypot(b.x - t.x, b.y - t.y);
        if (d < bd) { bd = d; best = b; }
      }
      if (best && bd < 24) {
        best.vy = -this.byD(150, 160, 170);
        best.vx = Math.max(-75, Math.min(75, best.vx + (best.x - t.x) * 3));
        Sfx.tick(); buzz(12); FX.hit(best.x, best.y, PAL.accent);
      }
    }
  }
  draw(g) {
    g.clear();
    g.rect(0, this.floor + 2, W, 2, PAL.bad);
    for (const b of this.balls) {
      // falling fast and low reads as urgent, so it turns red on the way down
      const danger = b.vy > 0 && b.y > this.floor - 70;
      g.circle(b.x, b.y, b.r, danger ? PAL.bad : PAL.accent);
      g.circle(b.x + Math.cos(b.spin) * 3, b.y + Math.sin(b.spin) * 3, 2, PAL.bg);
      // a shadow on the floor, so you can read how much room is left
      ctx.globalAlpha = 0.35;
      g.rect(b.x - 6, this.floor, 12, 1, PAL.mid);
      ctx.globalAlpha = 1;
    }
    g.text('KEEP THEM UP!', CX, TOP + 20, 9, PAL.mid);
  }
}

// ── REGISTRY ─────────────────────────────────────────────────────────────────
const POOL = [
  TapBug, CatchCoin, RubClean, PullTissue, SodaShake, SwipeArrow, MashButton, HoldRelease, DontTap,
  StopBar, FollowDot, TapOrder, OddOneOut, FeedDog, WhackMole, PumpBalloon, CutRope,
  BlowSail, TracePath, GrabCount, FlickShot,
  Flappy, Crossy, Doodle, PianoTiles, DinoRun, KnockStack, MoveCam, DryShiba, LeanDodge,
  FreezeStatue, SwatFly, HideLens, DanceBeat
];
const BOSSES = [Dodge, Squeeze, RedLight, Juggle];

/* ── MASCOT ───────────────────────────────────────────────────────────────────
   The shiba is anchored on the shelf below the play field and NEVER moves — no
   slide, no hop, no bob. Moods change the animation frame only, so it reacts
   standing exactly where it stands:
     watch  happy idle, blinking now and then
     cheer  celebration cycle, on a win
     sad    droops and tears up, on a loss and on game over

   Because the shelf is outside TOP..BOT and swallows its own presses, the
   mascot cannot cover a target or steal a tap, and microgames need no special
   handling for it.
─────────────────────────────────────────────────────────────────────────────── */
const Mascot = {
  SW: 35, SH: 37,
  x: W - 20,
  y: BOT + SHELF / 2,   // fixed for every state — do not animate this
  mode: 'watch', t: 0, blink: 2,

  set(m) { if (m === this.mode) return; this.mode = m; this.t = 0; },

  update(dt) {
    this.t += dt;
    if (this.mode !== 'cheer') {
      this.blink -= dt;
      if (this.blink < -0.14) this.blink = 1.6 + Math.random() * 2.8;
    }
  },

  // Frame ranges are documented on the ART.shiba entry near the top of the file.
  frame() {
    if (this.mode === 'cheer') return 1 + Math.floor(this.t * 14) % 7;       // loops while shown
    if (this.mode === 'sad') return 9 + Math.min(7, Math.floor(this.t * 9)); // plays once, holds on tears
    return this.blink < 0 ? 8 : 0;                                           // happy idle, with a blink
  },

  draw(g) {
    g.rect(0, BOT, W, 1, PAL.mid);                                      // shelf divider
    g.sprite('shiba', this.x, this.y, { w: this.SW, h: this.SH, frame: this.frame() });
  }
};

/* =============================================================================
   ENGINE — states: TITLE > PROMPT > PLAYING > RESULT > (SPEEDUP) > ... GAMEOVER
============================================================================= */
const Engine = {
  state: 'TITLE', timer: 0, time: 0,
  lives: 4, score: 0, round: 0, combo: 0, best: 0, speed: 1,
  game: null, isBoss: false, result: null, lastId: null,
  BOSS_EVERY: 8, SPEEDUP_EVERY: 4,

  reset() {
    this.lives = 4; this.score = 0; this.round = 0; this.combo = 0; this.speed = 1;
    this.lastId = null;
  },

  pick(list) {
    let cand = list.filter(C => C.meta.id !== this.lastId);
    if (!cand.length) cand = list;
    return cand[Math.floor(Math.random() * cand.length)];
  },

  difficulty() {
    if (this.round < 6) return 1;
    if (this.round < 14) return 2;
    return 3;
  },

  startRound(forceClass, forceDiff) {
    this.round++;
    FX.parts.length = 0; FX.fl = 0;   // no effects bleed across rounds
    this.isBoss = !forceClass && this.round % this.BOSS_EVERY === 0;
    const C = forceClass || this.pick(this.isBoss ? BOSSES : POOL);
    this.lastId = C.meta.id;
    const diff = forceDiff || (this.isBoss ? 3 : this.difficulty());
    this.game = new C(diff);
    this.game.meta = C.meta;
    this.duration = (C.meta.duration || 3.5) / this.speed * (this.isBoss ? 1.6 : 1);
    // some games (physics-heavy: flappy, crossy) need a floor so extreme engine
    // speed can't shrink the round below what's physically completable
    if (C.meta.minDuration) this.duration = Math.max(this.duration, C.meta.minDuration);
    this.game.timeLimit = this.duration;
    this.game.init();
    this.state = 'PROMPT';
    this.timer = this.isBoss ? 1.0 : 0.7;
  },

  update(dt) {
    this.time += dt;
    // a PLAYING game may request a pause (e.g. blow waiting on mic permission);
    // freeze the round clock so it can't be lost while blocked
    const paused = this.state === 'PLAYING' && this.game && this.game.paused;
    if (!paused) this.timer -= dt;
    Mascot.update(dt);
    const s = this.state;

    if (s === 'TITLE' || s === 'GAMEOVER') {
      Mascot.set(s === 'TITLE' ? 'watch' : 'sad');
      if (Input.justDown && this.timer <= 0) {
        Input.enableMotion();
        Input.enableTilt();
        Input.enableMic();
        Sfx.unlock();
        this.reset();
        this.state = 'READY';
        this.timer = 3.2;          // 3 · 2 · 1 · GO, then the first prompt
        this.readyLast = 4;
      }
      return;
    }

    // 3-2-1-GO before the very first microgame of a run. The rhythm — a beat to
    // breathe, then the scramble — is the whole point of the opening.
    if (s === 'READY') {
      Mascot.set('watch');
      const n = Math.ceil(this.timer - 0.2);   // 3,2,1 then 0 == GO
      if (n !== this.readyLast && n >= 0) {
        this.readyLast = n;
        if (n > 0) { Sfx.tick(); buzz(15); FX.shake(1.5); }
        else { Sfx.blip(990, 0.14); buzz(40); FX.flash(PAL.accent, 0.4); FX.shake(3); }
      }
      if (this.timer <= 0) this.startRound();
      return;
    }

    if (s === 'PROMPT') {
      Mascot.set('watch');
      if (this.timer <= 0) { this.state = 'PLAYING'; this.timer = this.duration; }
      return;
    }

    if (s === 'PLAYING') {
      Mascot.set('watch');
      if (this.game.paused) { this.game.update(dt, Input); return; }  // frozen; let it poll its unpause
      this.game.t += dt;
      this.game.update(dt, Input);
      const out = this.timer <= 0;
      if (out && !this.game.finished) {
        if (this.game.meta.winOnTimeout) this.game.succeed(); else this.game.lose();
      }
      if (this.game.finished) {
        if (this.game.won) {
          this.score++; this.combo++; this.result = 'WIN'; Sfx.win(); buzz(20); Mascot.set('cheer');
          FX.flash(PAL.accent, 0.45);
          FX.burst(Mascot.x, Mascot.y - 8, PAL.accent, 12 + Math.min(12, this.combo * 2), 80);
          if (this.combo >= 3) FX.shake(3);   // a little extra on a streak
        } else {
          if (!this.testClass) this.lives--;
          this.combo = 0; this.result = 'FAIL'; Sfx.fail(); buzz(120); Mascot.set('sad');
          FX.flash(PAL.bad, 0.55); FX.shake(5);
        }
        this.best = Math.max(this.best, this.score);
        this.state = 'RESULT'; this.timer = 0.9;
      }
      return;
    }

    if (s === 'RESULT') {
      if (this.timer > 0) return;
      // if the just-won game captured a photo, show it before moving on
      if (this.result === 'WIN' && this.game && this.game.meta.photo && Engine.lastPhoto) {
        this.photoCap = this.game.meta.photoCap || 'NICE MOVES!';
        this.state = 'PHOTO'; this.timer = 2.6; this.photoReveal = 0;
        return;
      }
      // test mode: replay the same game forever, never lose lives or advance
      if (this.testClass) { this.lives = 4; this.startRound(this.testClass, this.testDiff); return; }
      if (this.lives <= 0) { this.state = 'GAMEOVER'; this.timer = 0.8; return; }
      if (this.round % this.SPEEDUP_EVERY === 0) {
        this.speed = Math.min(2.6, this.speed + 0.12);
        this.state = 'SPEEDUP'; this.timer = 0.9;
      } else { this.startRound(); }
      return;
    }

    if (s === 'SPEEDUP') {
      Mascot.set('watch');
      if (this.timer <= 0) this.startRound();
    }

    if (s === 'PHOTO') {
      this.photoReveal = Math.min(1, (this.photoReveal || 0) + dt * 1.2);
      if (this.timer <= 0 || Input.justDown) {
        Engine.lastPhoto = null;
        if (this.testClass) { this.lives = 4; this.startRound(this.testClass, this.testDiff); return; }
        if (this.lives <= 0) { this.state = 'GAMEOVER'; this.timer = 0.8; return; }
        this.startRound();
      }
    }
  },

  // ── DRAW ───────────────────────────────────────────────────────────────────
  draw() {
    FX.pre();
    this.drawScene();
    Mascot.draw(g);
    if (this.state === 'PLAYING') {
      const pct = Math.max(0, this.timer / this.duration);
      // timer bar pulses in the final second
      let c = pct < 0.25 ? PAL.bad : PAL.accent;
      if (pct < 0.25 && Math.floor(this.time * 12) % 2) c = PAL.ink;
      g.rect(0, H - 6, W * pct, 6, c);
      // DEBUG: what the camera is actually reading, for tuning thresholds on a
      // real phone — a real lens reads nothing like a webcam test pattern
      const hint = this.game.meta.hint;
      if (DEBUG && ['move', 'still', 'cover'].includes(hint)) {
        const cam = Input.camReady ? 'cam' : Input.camDenied ? 'NOCAM' : '…';
        const tl = Input.tiltReady ? ' T' + Input.tiltX.toFixed(2) + '/' + Input.tiltY.toFixed(2) : ' notilt';
        g.text(cam + ' m' + Input.motion.toFixed(2) + ' x' + Input.motionX.toFixed(2) +
               ' y' + Input.motionY.toFixed(2) + ' b' + Input.bright.toFixed(2) + tl,
               2, H - 8, 6, PAL.mid, 'left');
      } else if (DEBUG && (hint === 'shake' || hint === 'blow')) {
        g.text('shake' + Input.shake.toFixed(2) + (Input.gyroReady ? ' gyro' : ' NOGYRO') +
               ' blow' + Input.blow.toFixed(2) + (Input.micReady ? ' mic' : ' NOMIC'),
               2, H - 8, 6, PAL.mid, 'left');
      }
    }
    FX.post();
  },

  drawScene() {
    g.clear();
    const s = this.state;

    if (s === 'TITLE') {
      g.text('MICRO', CX, CY - 34, 26, PAL.ink);
      g.text('MANIA', CX, CY - 8, 26, PAL.accent);
      g.rect(CX - 40, CY + 4, 80, 1, PAL.mid);
      g.text(POOL.length + BOSSES.length + ' microgames', CX, CY + 22, 8, PAL.mid);
      if (Math.floor(this.time * 2) % 2) g.text('TAP TO START', CX, CY + 64, 10, PAL.ink);
      if (this.best) g.text('BEST ' + this.best, CX, BOT, 8, PAL.mid);
      return;
    }

    if (s === 'GAMEOVER') {
      g.text('GAME', CX, CY - 24, 24, PAL.bad);
      g.text('OVER', CX, CY + 2, 24, PAL.bad);
      g.text('SCORE ' + this.score, CX, CY + 36, 10, PAL.ink);
      g.text('BEST ' + this.best, CX, CY + 52, 8, PAL.mid);
      if (Math.floor(this.time * 2) % 2) g.text('TAP TO RETRY', CX, CY + 84, 9, PAL.mid);
      return;
    }

    if (s === 'READY') {
      const n = Math.ceil(this.timer - 0.2);
      this.drawHud();
      if (n > 0) {
        // each number pops in large and shrinks as its second elapses
        const frac = (this.timer - 0.2) - (n - 1);   // 1 -> 0 across the second
        const size = 40 + (1 - frac) * 26;
        ctx.globalAlpha = Math.min(1, frac * 2.5);
        g.text(String(n), CX, CY + size * 0.35, size, PAL.ink);
        ctx.globalAlpha = 1;
        g.text('GET READY', CX, TOP + 40, 11, PAL.mid);
      } else {
        const p = Math.min(1, (-this.timer + 0.2) * 6);
        g.rect(0, CY - 30, W, 60, PAL.accent);
        g.text('GO!', CX, CY + 12, 34 + p * 6, PAL.bg);
      }
      return;
    }

    if (s === 'PROMPT') {
      const m = this.game.meta;
      if (this.isBoss) {
        g.rect(0, 0, W, H, PAL.bad);
        g.text('BOSS', CX, CY - 46, 20, PAL.ink);
      }
      g.rect(0, CY - 34, W, 44, this.isBoss ? PAL.ink : PAL.accent);
      g.text(m.prompt, CX, CY - 4, m.prompt.length > 9 ? 13 : m.prompt.length > 6 ? 18 : 22, PAL.bg);
      g.hint(m.hint, CX, CY + 40);
      this.drawHud();
      return;
    }

    if (s === 'PLAYING') {
      this.game.draw(g);
      this.drawHud();
      return;
    }

    if (s === 'RESULT') {
      const win = this.result === 'WIN';
      g.clear(win ? PAL.bg : PAL.bad);
      g.text(win ? 'GOOD!' : 'FAIL!', CX, CY - 6, 24, win ? PAL.accent : PAL.ink);
      if (win && this.combo > 1) g.text('x' + this.combo + ' STREAK', CX, CY + 18, 9, PAL.mid);
      this.drawHud();
      return;
    }

    if (s === 'SPEEDUP') {
      g.text('SPEED', CX, CY - 12, 22, PAL.accent);
      g.text('UP!', CX, CY + 14, 22, PAL.accent);
      g.text('x' + this.speed.toFixed(2), CX, CY + 44, 9, PAL.mid);
      this.drawHud();
    }

    if (s === 'PHOTO') {
      g.clear();
      const photo = Engine.lastPhoto;
      const pw = 120, ph = 90, px = CX - pw / 2, py = CY - ph / 2 - 6;
      // polaroid frame
      g.rect(px - 6, py - 6, pw + 12, ph + 30, PAL.ink);
      if (photo) {
        // draw pixelated + tinted to the game's palette for a retro look
        ctx.save();
        ctx.imageSmoothingEnabled = false;
        const rev = Math.min(1, this.photoReveal || 1);
        ctx.globalAlpha = rev;
        ctx.drawImage(photo, px, py, pw, ph);
        ctx.restore();
        // scanlines, kept faint — at this scale a line every third row banded
        // the whole picture, and any tint on top just tinted the person
        ctx.globalAlpha = 0.08;
        for (let y = py; y < py + ph; y += 4) g.rect(px, y, pw, 1, PAL.bg);
        ctx.globalAlpha = 1;
      } else {
        g.text('NO PHOTO', CX, CY, 10, PAL.mid);
      }
      g.text(this.photoCap || 'NICE MOVES!', CX, py + ph + 14, 9, PAL.bg);
      if (Math.floor(this.time * 2) % 2) g.text('TAP', CX, BOT - 6, 8, PAL.mid);
      this.drawHud();
    }
  },

  drawHud() {
    // lives as little shiba faces; spent lives shown as a faded marker
    for (let i = 0; i < 4; i++) {
      if (i < this.lives) g.sprite('face', 11 + i * 13, 9, { w: 13, h: 13, frame: 0 });
      else { g.rect(6 + i * 13, 5, 9, 9, PAL.mid); }
    }
    g.text(String(this.score), W - 6, 13, 9, PAL.ink, 'right');
    g.rect(0, TOP - 1, W, 1, PAL.mid);
  }
};

// ── LOOP ─────────────────────────────────────────────────────────────────────
let acc = 0, last = 0, running = true;
function frame(t) {
  if (!last) last = t;
  let dt = (t - last) / 1000; last = t;
  if (dt > 0.25) dt = STEP;          // returning from background: don't fast-forward
  if (running) {
    acc += dt;
    let guard = 0;
    while (acc >= STEP && guard++ < 5) {
      Input.beginStep();
      Engine.update(STEP);
      FX.update(STEP);
      acc -= STEP;
    }
    Engine.draw();
  }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => {
  running = !document.hidden;
  last = 0; acc = 0;
  if (running && Engine.state === 'PLAYING') { Engine.state = 'PROMPT'; Engine.timer = 0.6; }
});

Assets.load().then(() => requestAnimationFrame(frame));

// ── TEST MENU ────────────────────────────────────────────────────────────────
const devEl = document.getElementById('dev');
if (!DEBUG) { devEl.style.display = 'none'; }
else {
  const list = document.getElementById('devList');
  document.getElementById('devToggle').onclick = () => {
    list.style.display = list.style.display === 'block' ? 'none' : 'block';
  };
  let testDiff = 1;      // difficulty the menu launches at
  let loop = true;       // test mode: replay the picked game

  const mk = (tag, txt, cls) => { const e = document.createElement(tag); if (txt) e.textContent = txt; if (cls) e.className = cls; return e; };

  function rebuild() {
    list.innerHTML = '';

    // controls row: difficulty 1/2/3
    const drow = mk('div', null, 'devrow');
    drow.appendChild(mk('span', 'DIFF', 'devlab'));
    [1, 2, 3].forEach(d => {
      const btn = mk('button', String(d), d === testDiff ? 'devsel' : '');
      btn.onclick = () => { testDiff = d; rebuild(); };
      drow.appendChild(btn);
    });
    list.appendChild(drow);

    // loop toggle
    const lrow = mk('div', null, 'devrow');
    lrow.appendChild(mk('span', 'LOOP', 'devlab'));
    const lbtn = mk('button', loop ? 'ON' : 'OFF', loop ? 'devsel' : '');
    lbtn.onclick = () => { loop = !loop; rebuild(); };
    lrow.appendChild(lbtn);
    list.appendChild(lrow);

    list.appendChild(mk('div', 'MICROGAMES', 'devhead'));
    const launch = (C) => {
      Input.enableMotion(); Input.enableTilt(); Input.enableMic(); Sfx.unlock();
      Engine.reset();
      Engine.testClass = loop ? C : null;
      Engine.testDiff = testDiff;
      Engine.lives = 4;
      Engine.startRound(C, testDiff);
      list.style.display = 'none';
    };
    POOL.forEach(C => {
      const b = mk('button', C.meta.id + '  ·  ' + C.meta.prompt);
      b.onclick = () => launch(C);
      list.appendChild(b);
    });

    list.appendChild(mk('div', 'BOSSES', 'devhead'));
    BOSSES.forEach(C => {
      const b = mk('button', C.meta.id + '  ·  ' + C.meta.prompt);
      b.onclick = () => launch(C);
      list.appendChild(b);
    });

    list.appendChild(mk('div', 'RUN', 'devhead'));
    const normal = mk('button', '▶ play full run (no test loop)');
    normal.onclick = () => { Engine.testClass = null; Engine.reset(); Engine.state = 'TITLE'; Engine.timer = 0; list.style.display = 'none'; };
    list.appendChild(normal);
    const mute = mk('button', '🔇 toggle mute');
    mute.onclick = () => { Sfx.muted = !Sfx.muted; mute.textContent = Sfx.muted ? '🔊 unmute' : '🔇 toggle mute'; };
    list.appendChild(mute);
  }
  rebuild();
}
</script>
