<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#101010">
<meta name="apple-mobile-web-app-title" content="SHIBA MANIA">

<title>SHIBA MANIA</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #000; color: #f0f0f0;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    touch-action: none;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
    background: #101010;
  }
  /* dev panel — flip DEBUG to false to hide entirely */
  #dev {
    position: fixed; top: env(safe-area-inset-top, 0px); right: 0;
    z-index: 10; font-size: 10px; text-align: right;
  }
  #devToggle {
    background: #101010; color: #ffd23f; border: 1px solid #ffd23f;
    padding: 8px 10px; font: inherit; font-size: 12px; font-weight: bold;
  }
  #devList { display: none; background: #101010f2; border: 1px solid #333; padding: 4px; max-height: 78vh; overflow: auto; min-width: 148px; }
  #devList .devrow { display: flex; align-items: center; gap: 3px; margin: 2px 0; }
  #devList .devlab { color: #6b6b6b; font-size: 9px; width: 30px; }
  #devList .devhead { color: #ffd23f; font-size: 8px; margin: 6px 2px 2px; letter-spacing: 1px; }
  #devList .devrow button { flex: 1; }
  #devList .devsel { background: #ffd23f !important; color: #101010 !important; border-color: #ffd23f !important; }
  #devList button {
    display: block; width: 100%; text-align: left; margin: 2px 0;
    background: none; color: #f0f0f0; border: 1px solid #333; padding: 5px 8px;
    font: inherit; font-size: 10px;
  }
</style>
</head>
<body>
<div id="stage"><canvas id="game" width="180" height="320"></canvas></div>
<div id="dev"><button id="devToggle">DEV</button><div id="devList"></div></div>

                      playing; a game's stampPhoto(canvas) can draw on it (PhotoFX)
        photoCap      caption printed under that photo (default 'NICE MOVES!')
        env           backdrop: 'lawn' 'sky' 'bath' 'snow' 'field@Y' 'room@Y' (see Env)
        cam           true = played with the camera: the shelf shows the live
                      view while it runs (a game can veto it with a usesCam getter)
        how           how to play, shown under the prompt ("TAP THE DOG"; '\n'
                      for a second line). For a sensor game, one line per way of
                      playing it, best first — { tilt, cam, mic, motion, touch }
                      — and the first the player actually has is shown.
   3. Add the class to POOL (normal games) or BOSSES (boss stages).
   That's it — prompts, timer, difficulty, HUD and scoring are handled for you.

   ── HOW TO DROP IN PIXELLAB ART ─────────────────────────────────────────────
   Fill in Assets.manifest with sprite sheets (horizontal strips):
        bug: { src: 'art/bug.png', fw: 16, fh: 16, frames: 2, fps: 8 }
   Then call g.sprite('bug', x, y). Until the file exists, sprite() draws a
   labelled placeholder box, so every game stays playable with zero art.

   ── DESIGN CONSTRAINTS ──────────────────────────────────────────────────────
   Virtual resolution 180x320 (9:16), integer-scaled to the screen.
   Five colours only (PAL). Keep new art inside that palette.
============================================================================= */

// readouts. Off for players; add ?dev (or #dev) to the address to turn it on.
// It stays on for that browser afterwards (some in-app browsers drop the
// query on reload); ?nodev turns it off again.
const DEBUG = (() => {
  const want = /[?&#]dev\b/.test(location.search + location.hash), off = /[?&#]nodev\b/.test(location.search + location.hash);
  try {
    if (off) localStorage.removeItem('micromania.dev');
    else if (want) localStorage.setItem('micromania.dev', '1');
    return !off && (want || localStorage.getItem('micromania.dev') === '1');
  } catch (e) { return want && !off; }
})();

const TOP = 18;                // HUD band: lives + score

const BOT = H - 6 - SHELF;     // bottom of the play field (276)

/* Vertical layout:  0-18 HUD | 18-276 PLAY FIELD | 276-314 SHELF | 314-320 TIMER
   Microgames own TOP..BOT and nothing else. The shelf is drawn by the engine,
   so a game can never be obscured by the mascot and never needs to avoid it. */

// ── SCALING ──────────────────────────────────────────────────────────────────
function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const scale = Math.max(1, Math.min(vw / W, vh / H));
  canvas.style.width  = Math.floor(W * scale) + 'px';
  canvas.style.height = Math.floor(H * scale) + 'px';
  // Draw at the screen's own resolution, not 180x320 stretched up: stretched,
  // 7-8px text smeared into unreadable blocks. Games still draw in virtual
  // pixels through the transform, and sprites stay pixel-crisp (smoothing off).
  const k = Math.min(6, Math.max(1, Math.round(scale * (window.devicePixelRatio || 1))));
  canvas.width = W * k; canvas.height = H * k;
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.imageSmoothingEnabled = false;   // resizing the canvas resets this
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
resize();

// ── AUDIO (tiny blips; replace with samples later) ───────────────────────────
const Sfx = {
  ac: null,
  muted: (() => { try { return localStorage.getItem('micromania.muted') === '1'; } catch (e) { return false; } })(),
  toggleMute() {
    this.muted = !this.muted;
    try { localStorage.setItem('micromania.muted', this.muted ? '1' : '0'); } catch (e) {}
  },
  unlock() {
    // iOS suspends the context again after the tab is backgrounded, so every
    // touch re-resumes it, not just the first one
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) { this.ac = new AC(); this.wire(); }
  },
  // The mix: effects and music each into the master, through a compressor so
  // a busy moment never clips, with a little room (a short reverb) on both.
  wire() {
    const ac = this.ac;
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 8; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.15;
    comp.connect(ac.destination);
    this.master = ac.createGain(); this.master.gain.value = 0.9; this.master.connect(comp);
    const len = Math.floor(ac.sampleRate * 0.45), ir = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
    this.verb = ac.createConvolver(); this.verb.buffer = ir;
    const wet = ac.createGain(); wet.gain.value = 0.2; this.verb.connect(wet).connect(this.master);
    this.out = ac.createGain(); this.out.connect(this.master);
    const send = ac.createGain(); send.gain.value = 0.22; this.out.connect(send).connect(this.verb);
    const n = ac.sampleRate;
    this.noiseBuf = ac.createBuffer(1, n, ac.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  },
  // ── the two building blocks ─────────────────────────────────────────────────
  // a note: oscillator f (Hz), optional slide to f1, vibrato, filter, a quick
  // attack and an exponential fade over dur; t = when (audio clock), bus = where
  tone(o) {
    if (!this.ac || this.muted || !this.out) return;
    const ac = this.ac, t = o.t != null ? o.t : ac.currentTime, dur = o.dur || 0.1, a = o.a || 0.004, vol = o.vol == null ? 0.05 : o.vol;
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(o.f, t);
    if (o.f1) osc.frequency.exponentialRampToValueAtTime(o.f1, t + (o.slide || dur));
    if (o.detune) osc.detune.value = o.detune;
    if (o.vib) {
      const l = ac.createOscillator(), lg = ac.createGain();
      l.frequency.value = o.vibRate || 6; lg.gain.value = o.f * o.vib;
      l.connect(lg).connect(osc.frequency); l.start(t); l.stop(t + dur + 0.05);
    }
    let node = osc;
    if (o.lp || o.bp || o.hp) {
      const f = ac.createBiquadFilter();
      f.type = o.lp ? 'lowpass' : o.bp ? 'bandpass' : 'highpass';
      f.frequency.setValueAtTime(o.lp || o.bp || o.hp, t);
      if (o.ff) f.frequency.exponentialRampToValueAtTime(o.ff, t + dur);
      f.Q.value = o.q || 1; node.connect(f); node = f;
    }
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g).connect(o.bus || this.out);
    osc.start(t); osc.stop(t + dur + 0.03);
  },
  // filtered noise: hits, hats, crunches, splashes, whooshes (ff = sweep to)
  hiss(o) {
    if (!this.ac || this.muted || !this.out) return;
    const ac = this.ac, t = o.t != null ? o.t : ac.currentTime, dur = o.dur || 0.08, vol = o.vol == null ? 0.05 : o.vol;
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = this.noiseBuf;
    f.type = o.lp ? 'lowpass' : o.bp ? 'bandpass' : 'highpass';
    f.frequency.setValueAtTime(o.lp || o.bp || o.hp || 800, t);
    if (o.ff) f.frequency.exponentialRampToValueAtTime(o.ff, t + dur);
    f.Q.value = o.q || 0.8;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + (o.a || 0.002)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(o.bus || this.out);
    src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.02);
  },
  now() { return this.ac ? this.ac.currentTime : 0; },
  hz(name) {   // 'C5', 'F#4', 'Bb3' -> Hz
    const m = /^([A-G])([#b]?)(-?\d)$/.exec(name); if (!m) return 0;
    const n = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (+m[3] + 1) * 12;
    return 440 * Math.pow(2, (n - 69) / 12);
  },
  // a bright little run of notes (the jingles): [name, at, dur] each
  run(notes, o = {}) {
    const t0 = this.now();
    for (const [n, at, dur] of notes) {
      const f = this.hz(n);
      this.tone({ f, t: t0 + at, dur, type: o.type || 'square', vol: o.vol || 0.045, lp: o.lp || 5000, vib: o.vib, vibRate: 6 });
      if (o.fat) this.tone({ f: f / 2, t: t0 + at, dur, type: 'triangle', vol: (o.vol || 0.045) * 1.4 });
    }
  },
  // the old calls, kept: games use these directly
  blip(freq, dur = 0.07, type = 'square', vol = 0.05) { this.tone({ f: freq, dur, type, vol, lp: 6000 }); },
  slide(f0, f1, dur = 0.1, type = 'square', vol = 0.05) { this.tone({ f: f0, f1, dur, type, vol, lp: 6000 }); },
  noise(dur = 0.08, vol = 0.06, hp = 800) { this.hiss({ dur, vol, hp }); },

  // ── the sounds ──────────────────────────────────────────────────────────────
  // a shiba "wuf-wuf": a buzzy voice dropping in pitch through a mouth-shaped
  // band, with a puff of breath on each
  bark() {
    const t = this.now();
    for (const [at, k] of [[0, 1], [0.13, 0.85]]) {
      this.tone({ t: t + at, f: 620 * k, f1: 300 * k, dur: 0.12, type: 'sawtooth', vol: 0.11, bp: 1050, q: 1.6 });
      this.tone({ t: t + at, f: 300 * k, f1: 190 * k, dur: 0.1, type: 'square', vol: 0.035, lp: 900 });
      this.hiss({ t: t + at, dur: 0.06, vol: 0.05, bp: 1700, q: 1.2 });
    }
  },
  growl()  { this.tone({ f: 125, f1: 95, dur: 0.38, type: 'sawtooth', vol: 0.14, lp: 650, vib: 0.12, vibRate: 28 }); },
  boop()   { this.tone({ f: 330, f1: 990, dur: 0.11, type: 'sine', vol: 0.12, vib: 0.02 }); this.tone({ f: 660, f1: 1980, dur: 0.06, type: 'triangle', vol: 0.03 }); },
  squeak() { this.tone({ f: 1350, f1: 2100, dur: 0.08, type: 'sine', vol: 0.12, vib: 0.05, vibRate: 30 }); },
  crunch() { const t = this.now(); for (const [at, f, v] of [[0, 2200, 0.22], [0.045, 3200, 0.16], [0.09, 1800, 0.13]]) this.hiss({ t: t + at, dur: 0.045, vol: v, bp: f, q: 1.4 }); },
  chomp()  { const t = this.now(); for (const at of [0, 0.1]) { this.hiss({ t: t + at, dur: 0.05, vol: 0.12, lp: 900 }); this.tone({ t: t + at, f: 230, f1: 120, dur: 0.05, type: 'sine', vol: 0.06 }); } },
  splash() { this.hiss({ dur: 0.32, vol: 0.22, bp: 900, ff: 280, q: 0.7 }); this.hiss({ dur: 0.2, vol: 0.06, hp: 3000 }); },
  whoosh() { this.hiss({ dur: 0.18, vol: 0.2, bp: 500, ff: 3500, q: 0.8 }); },
  thud()   { this.tone({ f: 170, f1: 48, dur: 0.17, type: 'sine', vol: 0.2 }); this.hiss({ dur: 0.06, vol: 0.06, lp: 400 }); },
  fizz(k)  { this.hiss({ dur: 0.07, vol: 0.012 + k * 0.035, hp: 2600 + k * 3400 }); },     // soda pressure, k 0..1
  roll(k)  { this.hiss({ dur: 0.05, vol: 0.015 + k * 0.05, hp: 260 }); },                    // a ball rolling, k = speed 0..1
  sniff()  { const t = this.now(); this.hiss({ t, dur: 0.05, vol: 0.09, bp: 3200, ff: 4200 }); this.hiss({ t: t + 0.09, dur: 0.06, vol: 0.08, bp: 3200, ff: 4600 }); },
  heart()  { const t = this.now(); this.tone({ t, f: 110, f1: 55, dur: 0.1, type: 'sine', vol: 0.16 }); this.tone({ t: t + 0.15, f: 95, f1: 50, dur: 0.09, type: 'sine', vol: 0.11 }); },
  snore()  { this.tone({ f: 92, f1: 70, dur: 0.48, type: 'sawtooth', vol: 0.07, lp: 500, vib: 0.06, vibRate: 22 }); },
  // tonal, not noise, so a blow game's mic can't take it for another puff
  poof()   { this.tone({ f: 760, f1: 210, dur: 0.14, type: 'sine', vol: 0.14 }); },
  // one note of a rising major scale, step 0..7: a marimba, progress you can hear
  step(i) {
    const f = 523 * [1, 9 / 8, 5 / 4, 4 / 3, 3 / 2, 5 / 3, 15 / 8, 2][Math.max(0, Math.min(7, i))];
    this.tone({ f, dur: 0.14, type: 'sine', vol: 0.14 }); this.tone({ f: f * 4, dur: 0.035, type: 'sine', vol: 0.03 });
  },
  tap()  { this.tone({ f: 880, f1: 1320, dur: 0.05, type: 'sine', vol: 0.16 }); this.tone({ f: 1760, dur: 0.015, type: 'square', vol: 0.025 }); },
  tick() { this.tone({ f: 1700, dur: 0.03, type: 'sine', vol: 0.14 }); this.hiss({ dur: 0.02, vol: 0.07, bp: 2500 }); },   // a woodblock
  // WarioWare stings ───────────────────────────────────────────────────────────
  // a win: "ding-ding-DING!" up the chord, the last one ringing
  win() {
    this.run([['C6', 0, 0.09], ['E6', 0.06, 0.09], ['G6', 0.12, 0.1]], { vol: 0.06 });
    this.run([['C7', 0.18, 0.38]], { vol: 0.09, vib: 0.012, type: 'triangle' });
    this.tone({ f: this.hz('C7'), t: this.now() + 0.18, dur: 0.3, type: 'square', vol: 0.018, lp: 5000 });
    this.hiss({ t: this.now() + 0.18, dur: 0.22, vol: 0.02, hp: 6500 });
  },
  // a fail: the "bwom-bwom" buzzer
  fail() {
    const t = this.now();
    this.tone({ t, f: 196, f1: 185, dur: 0.18, type: 'sawtooth', vol: 0.09, lp: 900, vib: 0.03, vibRate: 8 });
    this.tone({ t: t + 0.2, f: 147, f1: 104, dur: 0.38, type: 'sawtooth', vol: 0.1, lp: 750, vib: 0.03, vibRate: 7 });
  },
  // the "get ready" lick before every game (a growl of drums for a boss)
  prompt(boss) {
    if (boss) { this.run([['A2', 0, 0.12], ['A2', 0.14, 0.12], ['F2', 0.28, 0.12], ['E2', 0.42, 0.4]], { type: 'sawtooth', vol: 0.07, lp: 900, fat: true }); return; }
    this.run([['G5', 0, 0.05], ['A5', 0.06, 0.05], ['B5', 0.12, 0.05], ['D6', 0.18, 0.14]], { vol: 0.04 });
    this.hiss({ t: this.now() + 0.18, dur: 0.05, vol: 0.04, hp: 7000 });
  },
  // the countdown's GO!: a chord stab and a cymbal
  go() {
    this.run([['C5', 0, 0.28], ['E5', 0, 0.28], ['G5', 0, 0.28], ['C6', 0, 0.3]], { vol: 0.035, fat: true });
    this.hiss({ dur: 0.6, vol: 0.06, hp: 4000 });
  },
  // SPEED UP!: a siren up, then a fanfare
  speedup() {
    this.tone({ f: 392, f1: 1568, slide: 0.42, dur: 0.46, type: 'square', vol: 0.045, lp: 4000, vib: 0.03, vibRate: 12 });
    this.run([['G5', 0.46, 0.08], ['C6', 0.54, 0.08], ['E6', 0.62, 0.08], ['G6', 0.7, 0.3]], { vol: 0.045 });
  },
  // STAGE CLEAR: a proper fanfare
  clear() {
    this.run([['C5', 0, 0.1], ['E5', 0.09, 0.1], ['G5', 0.18, 0.1], ['C6', 0.27, 0.16], ['G5', 0.45, 0.08], ['C6', 0.54, 0.5]], { vol: 0.045, fat: true });
    this.run([['E6', 0.54, 0.5], ['G6', 0.54, 0.5]], { vol: 0.025 });
    this.hiss({ t: this.now() + 0.54, dur: 0.7, vol: 0.06, hp: 3500 });
  },
  // GAME OVER: the sad slide down
  gameover() {
    this.run([['G4', 0, 0.2], ['F#4', 0.22, 0.2], ['F4', 0.44, 0.2]], { type: 'triangle', vol: 0.09 });
    this.run([['E4', 0.66, 0.9]], { type: 'triangle', vol: 0.1, vib: 0.02 });
    this.run([['C3', 0.66, 0.9]], { type: 'square', vol: 0.03, lp: 600 });
  }
};

// ── MUSIC ────────────────────────────────────────────────────────────────────
/* Chiptune songs, WarioWare-style: a bouncy title tune, a funky groove under
   the microgames that speeds up with every SPEED UP, a darker boss theme and a
   laid-back shop. Each song is written as 16th-note steps per part:
     note (C5, F#4, Bb3) = play  ·  '-' = hold the note before  ·  '.' = rest
   drums: k kick, s snare, h hat, o open hat, c crash. chords: a chord per bar
   and a rhythm of x's. Parts loop independently, so a one-bar drum line runs
   under a four-bar melody. Notes are scheduled a beat ahead on the audio clock,
   so it never drifts with the frame rate, through a gain bus that fades on
   and off. It goes quiet during mic games, so the speaker can't read as a blow. */
const Music = {
  VOL: 0.2,   // under the effects, not over them
  bus: null, on: false, track: null, next: 0, i: 0,
  SONGS: {
    menu: { bpm: 104, lead: 'square', bass: 'triangle',
      L: 'E5 . G5 . C6 . G5 . A5 - G5 . E5 . D5 . | C5 . E5 . A5 . E5 . G5 - E5 . C5 . D5 . | F5 . A5 . C6 . A5 . G5 - F5 . E5 . D5 . | D5 . G5 . B5 . G5 . F5 - E5 . D5 - - .',
      B: 'C3 . . C3 G2 . . . C3 . . C3 G2 . E2 . | A2 . . A2 E2 . . . A2 . . A2 E2 . C3 . | F2 . . F2 C3 . . . F2 . . F2 C3 . A2 . | G2 . . G2 D3 . . . G2 . . G2 D3 . B2 .',
      D: 'k . h . s . h . k . h k s . h .',
      C: ['C', 'Am', 'F', 'G'], X: '. . . . x . . . . . . . x . . .' },
    game: { bpm: 120, speedy: true, lead: 'square', bass: 'square', bassLp: 700,
      L: 'G4 . Bb4 C5 . . Bb4 . G4 . F4 . G4 - - . | . . Eb5 . D5 . C5 . Bb4 . G4 . C5 - - . | C5 . Eb5 F5 . . Eb5 . C5 . Bb4 . C5 - - . | . . G5 . F5 . Eb5 . D5 . Bb4 . C5 - - .',
      B: 'C2 . C3 . . C2 Eb2 . F2 . . F2 G2 . Bb2 C3 | C2 . C3 . . C2 Eb2 . F2 . F3 . Eb3 . C3 Bb2',
      D: 'k . h . s . h k . k h . s . o .',
      C: ['Cm7', 'F7'], X: '. . x . . . x . . x . . x . . .' },
    boss: { bpm: 132, speedy: true, lead: 'sawtooth', leadLp: 1800, bass: 'square', bassLp: 500,
      L: 'A4 - - - C5 - B4 - A4 - - - E4 - - - | F4 - - - A4 - G#4 - E4 - - - - - - -',
      B: 'A1 . A2 . A1 . A2 . A1 . A2 . G2 . A2 . | F1 . F2 . F1 . F2 . E1 . E2 . G#2 . E2 .',
      D: 'k . . k s . . . k . k . s . . s' },
    shop: { bpm: 92, lead: 'triangle', bass: 'triangle', drumVol: 0.5,
      L: 'A5 - - - G5 . F5 . E5 - - - . . . . | G5 - - - F5 . E5 . D5 - - - . . . . | F5 - - - E5 . D5 . C5 - - - . . . . | E5 - - - D5 . C5 . Bb4 - - - C5 . . .',
      B: 'F2 . . . A2 . . . C3 . . . A2 . . . | E2 . . . G2 . . . B2 . . . G2 . . . | D2 . . . F2 . . . A2 . . . F2 . . . | C2 . . . E2 . . . G2 . . . Bb2 . . .',
      D: 'k . h . s . h . k . h . s . h h',

  parse(str) { return str.split(/\s+/).filter(s => s && s !== '|'); },
  chord(name) {   // 'Cm7' -> note names around octave 4

  // called every frame with the song that should be playing now (or null)
  update(track) {

    if (!want) { this.track = null; return; }
    if (track !== this.track) { this.track = track; this.i = 0; this.next = now + 0.06; }
    const S = this.SONGS[track];
    const step = 15 / (S.bpm * (S.speedy ? Math.min(2, Engine.speed || 1) : 1));   // a 16th note
    if (this.next < now - 0.2) this.next = now + 0.02;   // the tab was asleep: don't burst
    while (this.next < now + 0.12) { this.play(S, this.i, this.next, step); this.next += step; this.i++; }

  // how long the note at k lasts: itself plus every '-' after it
  len(part, k) { let n = 1; while (part[(k + n) % part.length] === '-') n++; return n; },
  play(S, i, t, step) {

    const b = S.b[i % S.b.length];

    else if (d === 'c') Sfx.hiss({ t, dur: 0.6, vol: 0.06 * dv, hp: 3500, bus });
  }
};

// ── INPUT ────────────────────────────────────────────────────────────────────
/* One abstraction for touch + mouse. Games read only what they need:
     x, y            pointer position in virtual pixels
     down            currently pressed
     justDown/justUp edge flags (one step)
     dx, dy          movement this step
     moveDist        hypot(dx, dy) — use for rub/scrub games
     holdTime        seconds held
     taps[]          taps completed this step: {x, y}
     swipe           {dir, dist, vx, vy} on release, one step
     shake           0..1 energy (accelerometer, or fast wiggling)
*/
const Input = {
  x: CX, y: CY, down: false, justDown: false, justUp: false,
  dx: 0, dy: 0, moveDist: 0, holdTime: 0,
  taps: [], swipe: null, shake: 0, blow: 0, loud: 0, motionReady: false,
  _rawDx: 0, _rawDy: 0, _sx: 0, _sy: 0, _st: 0, _travel: 0,
  _pendingTaps: [], _pendingSwipe: null, _shakeRaw: 0, _lastAcc: null,
  _mic: null, _micData: null, _blowRaw: 0, micReady: false, micDenied: false, micPending: false, blowOk: false,
  // gyroscope: peak rotation rate seen since the last step, in deg/s summed
  // across the three axes. Shaking a phone spins it as much as it slings it,
  // and the gyro reads that far more cleanly than the accelerometer does.
  _gyroPeak: 0, gyroReady: false,
  // camera: optical-flow motion + photo capture. motion is a 0..1 "how much are
  // you moving" value; camReady/camDenied/camPending mirror the mic pattern.
  _cam: null, _camVideo: null, _camCanvas: null, _camCtx: null, _prevFrame: null,
  motion: 0, motionL: 0, motionR: 0, camReady: false, camDenied: false, camPending: false, camW: 48, camH: 36,
  // where the movement is, in player space (mirrored to match a selfie view):
  // motionX 0 = your left edge, 1 = your right; motionY 0 = top, 1 = bottom.
  // Only updated while something is actually moving, so it holds its last real
  // position instead of drifting on sensor noise.
  motionX: 0.5, motionY: 0.5,
  // average frame brightness 0..1 — falls to near zero with a hand over the lens
  bright: 1,
  // device tilt for aim games, -1..1 on each axis, relative to however the
  // phone was being held when the game started (see zeroTilt)
  tiltX: 0, tiltY: 0, tiltReady: false,
  _tiltOn: false, _tiltG: 0, _tiltB: 0, _tiltZero: null, _wantZero: false,

  attach(el) {
    const toVirtual = e => {
      const r = el.getBoundingClientRect();
      return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
    };
    el.addEventListener('pointerdown', e => {
      el.setPointerCapture?.(e.pointerId);
      const p = toVirtual(e);
      this.x = p.x; this.y = p.y;
      this.down = true;
      // A press that starts on the mascot shelf raises no tap/justDown, so the
      // shiba can never trigger or fail a microgame. Dragging and swiping from
      // there still works (people swipe up from the bottom of the screen).
      // the engine's own buttons (mute, the sensors screen) eat their press the
      // same way, so a microgame never sees it
      this._uiPress = Engine.press(p);
      this._shelfPress = p.y > BOT || this._uiPress;
      this._justDownRaw = !this._shelfPress;
      this._sx = p.x; this._sy = p.y; this._st = performance.now(); this._travel = 0;

    }, { passive: false });
    el.addEventListener('pointermove', e => {
      const p = toVirtual(e);
      this._rawDx += p.x - this.x; this._rawDy += p.y - this.y;
      this._travel += Math.hypot(p.x - this.x, p.y - this.y);
      this.x = p.x; this.y = p.y;
      e.preventDefault();
    }, { passive: false });
    const end = e => {
      if (!this.down) return;
      const p = toVirtual(e);
      this.x = p.x; this.y = p.y;
      this.down = false; this._justUpRaw = true;
      const dt = performance.now() - this._st;
      const dx = p.x - this._sx, dy = p.y - this._sy;
      const dist = Math.hypot(dx, dy);
      if (dist < 8 && dt < 300) {
        if (!this._shelfPress) this._pendingTaps.push({ x: p.x, y: p.y });
      } else if (dist > 16 && dt < 500) {
        const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
        // start/end points included so games can test what the swipe crossed
        this._pendingSwipe = { dir, dist, vx: dx / (dt / 1000), vy: dy / (dt / 1000), x0: this._sx, y0: this._sy, x1: p.x, y1: p.y };
      }

      // the release counts as a user gesture, and iOS refuses the motion and
      // tilt permission prompts outside one.
      if (e.type === 'pointerup') {
        if (this._uiPress) Engine.permRelease(p);
        else if (!this._shelfPress) Engine.release(p);
      }

    };
    el.addEventListener('pointerup', end, { passive: false });
    el.addEventListener('pointercancel', end, { passive: false });
    el.addEventListener('contextmenu', e => e.preventDefault());

    // desktop testing: space / arrows map to tap + swipe
    window.addEventListener('keydown', e => {
      if (e.repeat) return;
      if (e.code === 'Space') this._pendingTaps.push({ x: this.x, y: this.y });
      const map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
      if (map[e.code]) this._pendingSwipe = { dir: map[e.code], dist: 40, vx: 0, vy: 0 };
    });
  },

  // Microphone for "blow" games. Best-effort: if the mic is denied or absent,
  // micReady stays false and blow games fall back to fast tapping in beginStep.
  // Camera for motion-control + photo games. Best-effort like the mic: if denied
  // or absent, camReady stays false and the game falls back to tapping.
  enableCam() {
    if (this._cam || this.camDenied || this.camPending) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { this.camDenied = true; return; }
    this.camPending = true;
    navigator.mediaDevices.getUserMedia({ video: this.CAM_SPEC, audio: false })
      .then(stream => this._useCam(stream))
      .catch(err => { this.camDenied = true; this.camPending = false; this._why('cam', err); });
  },
  // why a sensor isn't available: refused (BLOCKED, only the browser's site
  // settings can undo it) or simply missing (NONE)
  _why(k, err) { this[k + 'Blocked'] = !!err && err.name === 'NotAllowedError'; this[k + 'Missing'] = !this[k + 'Blocked']; },
  // the SETTINGS switches: off stops the device now and keeps it off
  stopCam() {
    try { this._cam && this._cam.getTracks().forEach(t => t.stop()); } catch (e) {}
    if (this._camVideo) { this._camVideo.remove(); this._camVideo = null; }
    this._cam = null; this.camReady = false; this.camPending = false; this._prevFrame = null;
    this._camGen = (this._camGen || 0) + 1; this._dropFrame(); this.motion = 0;
  },
  stopMic() {
    try { this._micStream && this._micStream.getTracks().forEach(t => t.stop()); } catch (e) {}
    this._micStream = null; this._mic = null; this.micReady = false; this.micPending = false; this.loud = 0; this.blow = 0;
  },
  CAM_SPEC: { facingMode: 'user', width: 320, height: 240 },
  _useCam(stream) {
    // A video that isn't in the page gets paused by phones when the tab or app
    // is backgrounded, and nothing restarts it: the feed froze on its last
    // frame and motion read 0 for good. So it lives in the page (invisible),
    // and a watchdog in _sampleMotion restarts it if frames stop arriving.
    if (this._camVideo) this._camVideo.remove();
    const v = document.createElement('video');
    v.autoplay = true; v.playsInline = true; v.muted = true;
    v.setAttribute('playsinline', ''); v.setAttribute('muted', '');
    // tucked behind the game canvas rather than see-through: some phones stop
    // feeding a video they think nobody can see
    v.style.cssText = 'position:fixed;left:50%;top:50%;width:2px;height:2px;pointer-events:none;z-index:-1';
    document.body.appendChild(v);
    v.srcObject = stream;
    v.play().catch(() => {});
    this._camLastT = -1; this._camStuck = 0; this._camSince = performance.now(); this._camSeen = 0;
    this._readFrames(stream);

    // locked); get it back rather than sit on a dead stream
    try { stream.getVideoTracks()[0].addEventListener('ended', () => this.restartCam()); } catch (e) {}
    const cc = document.createElement('canvas');
    cc.width = this.camW; cc.height = this.camH;
    this._cam = stream; this._camVideo = v;
    // widest the lens goes, where the browser lets us set it (Android Chrome)
    try {
      const tr = stream.getVideoTracks()[0], caps = tr.getCapabilities && tr.getCapabilities();
      if (caps && caps.zoom) tr.applyConstraints({ advanced: [{ zoom: caps.zoom.min }] }).catch(() => {});
    } catch (e) {}
    this._camCanvas = cc; this._camCtx = cc.getContext('2d', { willReadFrequently: true });
    this.camReady = true; this.camPending = false;
  },

  // Where the browser can (Chrome, Android), take frames straight off the
  // camera track: they keep coming whatever the browser thinks of the hidden
  // video. One frame is held at a time, and the one before is closed, or the
  // camera runs out of buffers and stalls.
  _readFrames(stream) {
    this._dropFrame();

    if (typeof MediaStreamTrackProcessor === 'undefined') return;
    let reader;
    try { reader = new MediaStreamTrackProcessor({ track: stream.getVideoTracks()[0] }).readable.getReader(); } catch (e) { return; }
    const pump = () => reader.read().then(({ value, done }) => {
      if (done) return;
      if (gen !== this._camGen) { value.close(); reader.cancel().catch(() => {}); return; }

  _dropFrame() { if (this._frame) { try { this._frame.close(); } catch (e) {} this._frame = null; } },
  // what to draw the camera from: the newest track frame if one is fresh,
  // else the video once it has a picture; null while nothing has arrived
  _camSrc() {

  _camSize(src) { return src.displayWidth ? [src.displayWidth, src.displayHeight] : [src.videoWidth, src.videoHeight]; },

  // Drop a dead camera stream and ask for a fresh one. Permission is already
  // granted by now, so phones hand it straight back with no popup.
  restartCam() {
    if (this._camRestarting || this.camDenied) return;
    this._camRestarting = true;
    try { this._cam && this._cam.getTracks().forEach(t => t.stop()); } catch (e) {}
    this._cam = null; this.camReady = false; this._prevFrame = null; this._camGen++; this._dropFrame();

  // Coming back to the game: wake the camera and the audio up again.
  wake() {

      if (!tr || tr.readyState === 'ended') this.restartCam();
      else if (v.paused) v.play().catch(() => {});
      this._camLastT = -1; this._camStuck = 0; this._camSince = performance.now();
    }
    if (Sfx.ac && Sfx.ac.state === 'suspended') Sfx.ac.resume().catch(() => {});

    const mt = this._micStream && this._micStream.getAudioTracks()[0];

  // Camera and mic in one request, so the player sees one popup on the sensors
  // screen instead of one each, mid-round. If a device is missing (a laptop
  // with no camera) the pair fails as a whole, so each is then asked for alone;
  // a refusal is a refusal of both.
  enableAV() {
    const camDone = this._cam || this.camDenied || this.camPending;
    const micDone = this._mic || this.micDenied || this.micPending;
    if (camDone && micDone) return;
    if (camDone || micDone || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      this.enableCam(); this.enableMic(); return;
    }
    this.camPending = this.micPending = true;
    navigator.mediaDevices.getUserMedia({ video: this.CAM_SPEC, audio: true }).then(stream => {
      this._useCam(new MediaStream(stream.getVideoTracks()));
      this._useMic(new MediaStream(stream.getAudioTracks()));
    }).catch(err => {

      if (err && err.name === 'NotAllowedError') { this.camDenied = this.micDenied = true; this._why('cam', err); this._why('mic', err); return; }

  // Sample the camera each step: downscale, diff against the last frame. One
  // pass produces everything the camera games read — how much you moved
  // (motion), which half you moved in (motionL/R), where the movement was
  // (motionX/Y) and how bright the frame is (bright).
  _sampleMotion() {
    if (!this.camReady || !this._camVideo) return;
    // watchdog: pictures should keep arriving, from the track or the video.
    // None for a second, nudge the video to play; none for 2.5s (4s while a
    // fresh camera is still warming up), get a new camera stream.
    const v = this._camVideo, now = performance.now();
    if (v.readyState >= 2 && v.currentTime !== this._camLastT) { this._camLastT = v.currentTime; this._camSeen = Math.max(this._camSeen, now); }
    if (!document.hidden) {
      const quiet = (now - Math.max(this._camSeen, this._camSince)) / 1000;
      if (quiet > 1 && v.paused) v.play().catch(() => {});
      if (quiet > (this._camSeen ? 2.5 : 4)) { this.restartCam(); return; }
    }
    const src = this._camSrc(); if (!src) return;
    const cx = this._camCtx, w = this.camW, h = this.camH;
    cx.drawImage(src, 0, 0, w, h);
    const cur = cx.getImageData(0, 0, w, h).data;
    if (this._prevFrame) {
      let diff = 0, left = 0, right = 0, sx = 0, sy = 0, lum = 0;
      // sum luminance change; also split by screen half. The camera is mirrored
      // when shown, so the RAW left half is the player's right — we flip below.
      for (let i = 0; i < cur.length; i += 16) {
        const d = Math.abs(cur[i] - this._prevFrame[i]) + Math.abs(cur[i + 1] - this._prevFrame[i + 1]) + Math.abs(cur[i + 2] - this._prevFrame[i + 2]);
        diff += d;
        const p = i / 4, px = p % w, py = (p / w) | 0;
        if (px < w / 2) right += d; else left += d;   // flipped for the mirror view
        sx += d * px; sy += d * py;                   // diff-weighted centre of motion
        lum += cur[i] + cur[i + 1] + cur[i + 2];

      const n = cur.length / 16;
      const norm = diff / n / 60;
      this.motion = Math.min(1, this.motion * 0.6 + norm * 0.8);
      const half = n / 2;
      this.motionL = Math.min(1, this.motionL * 0.5 + (left / half / 60) * 0.9);
      this.motionR = Math.min(1, this.motionR * 0.5 + (right / half / 60) * 0.9);
      // below this floor the "movement" is just sensor grain and the centre
      // would jump around the frame, so the last real position is kept.
      if (diff > n * 8) {
        const mx = 1 - (sx / diff) / w;               // flipped, like the halves
        const my = (sy / diff) / h;
        this.motionX += (mx - this.motionX) * 0.35;
        this.motionY += (my - this.motionY) * 0.35;
      }
      this.bright += (lum / n / 3 / 255 - this.bright) * 0.35;
    }
    this._prevFrame = cur.slice(0);
  },

  // Grab a still from the camera, in the colours the camera saw. The whole
  // frame, never cropped: a phone's selfie feed is portrait, and cropping it
  // to a 4:3 landscape polaroid kept only a band across the middle — a face
  // held close for BLOW came out as nothing but nose. long = longest side.
  snapPhoto(long = 120) {
    const src = this._camSrc(); if (!src) return null;
    const [sw, sh] = this._camSize(src);
    if (!sw || !sh) return null;
    const k = long / Math.max(sw, sh);
    const c = document.createElement('canvas');
    c.width = Math.round(sw * k); c.height = Math.round(sh * k);
    this.drawLive(c.getContext('2d'), 0, 0, c.width, c.height);
    return c;   // a canvas, so a game can stamp it (see stampPhoto)
  },
  // width / height of the camera picture (4:3 until the feed reports)
  camAspect() {
    const src = this._camSrc(), [sw, sh] = src ? this._camSize(src) : [0, 0];
    return sw && sh ? sw / sh : 4 / 3;
  },
  // the live camera, mirrored like a mirror, into a rect of its own aspect
  drawLive(c, x, y, w, h) {
    const src = this._camSrc(); if (!src) return false;
    c.save(); c.translate(x + w, y); c.scale(-1, 1);
    c.drawImage(src, 0, 0, w, h);
    c.restore();
    return true;
  },

  enableMic() {
    if (this._mic || this.micDenied || this.micPending) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { this.micDenied = true; return; }
    this.micPending = true;                       // decision not made yet
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(stream => this._useMic(stream))
      .catch(err => { this.micDenied = true; this.micPending = false; this._why('mic', err); });
  },
  _useMic(stream) {
    Sfx.unlock();
    const ac = Sfx.ac || new (window.AudioContext || window.webkitAudioContext)();

// ── FX ───────────────────────────────────────────────────────────────────────
/* Engine-level juice, shared by every microgame. Nothing here changes game
   logic — effects are cosmetic and time-based, so a paused/backgrounded tab just
   freezes them. Games and the engine poke it through the small API at the top:
     FX.shake(power)         camera kick, decays on its own
     FX.flash(color, power)  full-screen tint that fades
     FX.burst(x,y,color,n)   a spray of particles
     FX.hit(x,y,color)       shorthand: a few sparks + a tiny shake
   FX.pre() applies the shake transform, FX.post() draws flash+particles on top. */
const FX = {
  sh: 0, shT: 0, fl: 0, flC: PAL.ink, parts: [],
  reduce: false,   // honours prefers-reduced-motion

  shake(p) { if (this.reduce) return; this.sh = Math.min(6, Math.max(this.sh, p)); },
  flash(c = PAL.ink, p = 0.5) { this.flC = c; this.fl = Math.max(this.fl, this.reduce ? p * 0.4 : p); },
  burst(x, y, c = PAL.ink, n = 8, spread = 60) {
    if (this.reduce) n = Math.min(n, 3);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.2832, s = 12 + Math.random() * spread;
      this.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 10, life: 0.4 + Math.random() * 0.4, t: 0, c });
    }
  },
  hit(x, y, c = PAL.accent) { this.burst(x, y, c, 6, 45); this.shake(2); },

  update(dt) {
    if (this.sh > 0) { this.sh = Math.max(0, this.sh - dt * 22); this.shT += dt * 60; }
    if (this.fl > 0) this.fl = Math.max(0, this.fl - dt * 2.4);
    for (const p of this.parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt; }
    this.parts = this.parts.filter(p => p.t < p.life);
  },
  pre() {
    if (this.sh <= 0) { this.dx = this.dy = 0; return; }
    this.dx = Math.sin(this.shT * 1.7) * this.sh;
    this.dy = Math.cos(this.shT * 2.3) * this.sh;

  },
  post() {

      g.rect(p.x - 1.5, p.y - 1.5, 3, 3, p.c);

      case 'trace': this.line(x - 9, y + 5, x - 3, y - 6, c, 2); this.line(x - 3, y - 6, x + 3, y + 5, c, 2); this.line(x + 3, y + 5, x + 9, y - 6, c, 2); break;
      case 'count': this.circle(x - 8, y, 3, c); this.circle(x, y, 3, c); this.circle(x + 8, y, 3, PAL.mid); break;
      case 'flick': this.circle(x - 8, y + 6, 4, c); this.line(x - 8, y + 6, x + 6, y - 6, PAL.mid, 2); this.line(x + 6, y - 6, x + 2, y - 5, PAL.mid, 2); this.line(x + 6, y - 6, x + 5, y - 1, PAL.mid, 2); break;
      // 'move' with a line through it — hold still for the camera
      case 'still': this.box(x - 10, y - 7, 20, 14, c); this.circle(x, y, 3, c); this.line(x - 13, y + 11, x + 13, y - 11, PAL.bad, 2); break;
      // a palm coming down over the lens
      case 'cover': this.circle(x, y + 4, 5, PAL.mid); this.cRect(x, y - 3, 20, 8, c); for (let i = 0; i < 3; i++) this.line(x - 6 + i * 6, y - 8, x - 6 + i * 6, y - 12, c, 2); break;
    }
  }
};

/* ── PHOTO FILTERS ────────────────────────────────────────────────────────────
   Stamped onto a camera still before the engine shows it as a polaroid. They
   draw in the photo's own pixel space (120x90) and in the five palette colours,
   so they read as pixel art sitting on a real photograph.
─────────────────────────────────────────────────────────────────────────────── */
const PhotoFX = {
  // A birthday cake with candles you have just blown out, for BLOW. Sized off
  // the canvas rather than in fixed pixels, so a bigger still still works.
  cake(c) {
    const x = c.getContext('2d'), w = c.width, h = c.height;
    const box = (a, b, ww, hh, col) => { x.fillStyle = col; x.fillRect(Math.round(a), Math.round(b), Math.round(ww), Math.round(hh)); };
    const cw = Math.round(w * 0.46), cx0 = Math.round((w - cw) / 2);
    const ch = Math.round(h * 0.20), cy0 = h - ch - Math.round(h * 0.04);

    // candles first — the cake is drawn over their feet
    const n = 3, gap = cw / (n + 1), cl = Math.round(h * 0.17);
    for (let i = 0; i < n; i++) {
      const px = Math.round(cx0 + gap * (i + 1)) - 1, top = cy0 - cl;
      for (let sy = 0; sy < cl; sy += 3) box(px, top + sy, 3, 2, (sy / 3) % 2 ? PAL.bad : PAL.ink);
      box(px + 1, top - 2, 1, 2, PAL.bg);                                  // wick
      // a curl of smoke: the flame went out a moment ago
      for (let k = 0; k < 4; k++) box(px + 1 + Math.round(Math.sin(k * 1.6) * 2), top - 5 - k * 3, 1, 2, PAL.mid);
    }
    box(cx0, cy0, cw, 3, PAL.ink);                                         // frosting
    box(cx0, cy0 + 3, cw, ch - 3, PAL.accent);                             // cake
    for (let i = 2; i < cw - 2; i += 8) box(cx0 + i, cy0 + 3, 3, ch - 3, PAL.ink);   // stripes
    box(cx0 - 4, cy0 + ch, cw + 8, 2, PAL.mid);                            // plate
  },

  // The thing you just leaned out of the way of, for LEAN — it comes in past
  // the ear you leaned away from, so the picture matches the dodge you made.
  // `from` is the side it flies in from: 'L' or 'R'.
  dodge(c, from) {
    const x = c.getContext('2d'), w = c.width, h = c.height;
    const box = (a, b, ww, hh, col) => { x.fillStyle = col; x.fillRect(Math.round(a), Math.round(b), Math.round(ww), Math.round(hh)); };
    const dir = from === 'L' ? 1 : -1;                       // travel direction
    const bx = from === 'L' ? Math.round(w * 0.26) : Math.round(w * 0.74);
    const by = Math.round(h * 0.34), r = Math.round(h * 0.11);

    // speed lines trailing back to the edge it came from
    for (let i = 0; i < 5; i++) {
      const ly = by - r + Math.round((r * 2 / 4) * i);
      const tail = Math.round((w * 0.3) * (0.5 + Math.abs(2 - i) * 0.25));
      box(bx - dir * (r + 2) - (dir > 0 ? tail : 0), ly, tail, 2, i % 2 ? PAL.ink : PAL.accent);
    }
    // a brick, pixel-round at the corners so it reads as thrown, not placed
    box(bx - r, by - r + 2, r * 2, r * 2 - 4, PAL.bad);
    box(bx - r + 2, by - r, r * 2 - 4, r * 2, PAL.bad);
    box(bx - r + 3, by - r + 3, r - 1, 2, PAL.ink);          // highlight
    // the near miss: a puff of dust where it went past
    for (let i = 0; i < 3; i++) {
      const px = bx + dir * (r + 4 + i * 5), py = by + (i % 2 ? -6 : 7);
      box(px, py, 3, 3, PAL.mid);
    }
  },

  // Soap bubbles drifting across the shot, for BLOW.
  bubbles(c) {
    const x = c.getContext('2d'), w = c.width, h = c.height;
    const ring = (bx, by, r) => {
      x.strokeStyle = PAL.ink; x.lineWidth = Math.max(1, r / 6);
      x.beginPath(); x.arc(bx, by, r, 0, 6.2832); x.stroke();
      x.beginPath(); x.arc(bx, by, r * 0.65, -2.4, -1.8); x.stroke();      // shine
    };
    ring(w * 0.22, h * 0.24, w * 0.13); ring(w * 0.8, h * 0.3, w * 0.09);
    ring(w * 0.7, h * 0.78, w * 0.15); ring(w * 0.14, h * 0.72, w * 0.06); ring(w * 0.5, h * 0.1, w * 0.05);
  },

  // Zzz rising off you and a crescent moon, for FREEZE — you held so still
  // the shiba slept right through it.
  sleepy(c) {
    const x = c.getContext('2d'), w = c.width, h = c.height;
    const box = (a, b, ww, hh, col) => { x.fillStyle = col; x.fillRect(Math.round(a), Math.round(b), Math.round(ww), Math.round(hh)); };
    // Zzz in a bold face with a dark rim, so it reads on any photo
    const z = (zx, zy, sz) => {
      x.font = 'bold ' + Math.round(sz) + 'px ui-monospace, monospace'; x.textAlign = 'center';
      x.lineWidth = Math.max(2, sz / 7); x.strokeStyle = PAL.bg; x.strokeText('Z', zx, zy);
      x.fillStyle = PAL.ink; x.fillText('Z', zx, zy);
    };
    const s0 = w * 0.11;
    z(w * 0.66, h * 0.36, s0); z(w * 0.77, h * 0.25, s0 * 1.35); z(w * 0.88, h * 0.12, s0 * 1.75);
    // a crescent moon in the top corner
    const mr = Math.round(w * 0.08), mx = Math.round(w * 0.14), my = Math.round(h * 0.12);
    const m = document.createElement('canvas'); m.width = m.height = mr * 2 + 2;   // cut on its own canvas,
    const mc = m.getContext('2d');                                                // not out of the photo
    mc.fillStyle = PAL.accent; mc.beginPath(); mc.arc(mr + 1, mr + 1, mr, 0, 6.2832); mc.fill();
    mc.globalCompositeOperation = 'destination-out';
    mc.beginPath(); mc.arc(mr * 1.5 + 1, mr * 0.65 + 1, mr * 0.85, 0, 6.2832); mc.fill();
    x.drawImage(m, mx - mr - 1, my - mr - 1);
  }
};


/* ── ALBUM ────────────────────────────────────────────────────────────────────
   Every action shot you win is kept on this phone (localStorage, as small
   JPEGs), newest last, so the best moments outlive the run they came from.
   Nothing is uploaded; SHARE hands one picture to the phone's share sheet. */
const Album = {
  KEY: 'micromania.album', MAX: 30,
  items: null, imgs: {},
  load() {
    if (this.items) return this.items;
    try { this.items = JSON.parse(localStorage.getItem(this.KEY) || '[]'); } catch (e) { this.items = []; }
    if (!Array.isArray(this.items)) this.items = [];
    return this.items;
  },
  add(canvas, cap, game) {
    this.load();
    let src;
    try { src = canvas.toDataURL('image/jpeg', 0.85); } catch (e) { return; }
    const last = this.items[this.items.length - 1];
    const at = Math.max(Date.now(), last ? last.at + 1 : 0);   // unique: it keys the decoded image
    this.items.push({ src, cap, game, at });
    while (this.items.length > this.MAX) this.items.shift();
    this.save();
  },
  remove(i) { this.load(); this.items.splice(i, 1); this.save(); },
  // storage full: drop the oldest until it fits, rather than lose the new one
  save() {
    for (;;) {
      try { localStorage.setItem(this.KEY, JSON.stringify(this.items)); return; }
      catch (e) { if (!this.items.length) return; this.items.shift(); }
    }
  },
  // a decoded picture for an entry, or null while it is still decoding
  img(it) {
    let im = this.imgs[it.at];
    if (!im) { im = this.imgs[it.at] = new Image(); im.src = it.src; }
    return im.complete && im.naturalWidth ? im : null;
  },
  newest(k) { const a = this.load(); return a[a.length - 1 - k]; }
};

/* ── SCENERY ──────────────────────────────────────────────────────────────────
   Backdrops behind the microgames, so each one reads as a place — a lawn, a
   living room, the sky — rather than shapes on black. They use a small extra
   palette of dark, muted tones, so the sprites and the five play colours still
   pop in front of them; the HUD, prompts and shelf stay black.
   A game picks one with `env` in its meta:
     'lawn'  grass seen from above          'sky'   dusk sky, drifting clouds
     'bath'  bathroom tiles                 'snow'  a night ski slope
     'field@Y'  side view: sky down to a horizon, grass from the ground at Y
     'room@Y'   a living room: wallpaper down to a floor at Y ('wall@Y' is the same)
     'sunny@Y'  a bright day: blue sky, the sun, a flowery meadow from Y
     'beach@Y'  a beach from above: sea down to the waterline at Y, then sand
     'park@Y'   the sunny day with a row of trees and a bench, grass from Y
     'nature@Y' the sunny day with far mountains and a pine forest, meadow from Y
     'disco@Y'  a dark club: light beams, a mirror ball, a checkered dance floor from Y
     'night@Y'  outside at night: moon, stars, a house with a lit window, grass from Y
     'bedroom@Y' the living room after dark: dimmed, a window with the moon in it
   Each is painted once into a 180x320 canvas and blitted after that, so it
   costs nothing per frame; only the clouds, surf, disco lights and stars are drawn live.
─────────────────────────────────────────────────────────────────────────────── */
const SCENE = {
  sky0: '#131c31', sky1: '#27395b', cloud: '#34496f', star: '#4d5f82',
  hill: '#1d3526', grass: '#284b2f', grassHi: '#386840', grassLo: '#203e26',
  wall: '#33262d', wallHi: '#3b2c34', skirt: '#24191a', floor: '#45301f', floorLo: '#35251a',
  tile: '#1b303a', tileHi: '#21394a', grout: '#2b4655',
  snow: '#24324a', snowHi: '#344660', pine: '#1a2b33',
  // a bright day, for the one game that should feel like one
  day0: '#3b7cc4', day1: '#6aa5dc', dayCloud: '#e6f0fa', dayHill: '#3f8a47',
  meadow: '#4a9a4f', meadowHi: '#62b466', stem: '#3d7a35',
  // the beach, for FETCH
  sea0: '#2a74ad', sea1: '#3a8cc9', wetSand: '#b99460', sand: '#dcc08a', sandLo: '#c8a86e',
  // the park, for LEAP
  leaf: '#2f7a3a', leafHi: '#3f9449', trunk: '#6b4a2e',
  // the open countryside, for SWAT: far blue mountains and a pine forest edge
  mount: '#5f88b6', mountHi: '#e6f0fa', forest: '#2a6634',
  // the couch in CHARGE: shade and shine on the red upholstery
  couchLo: '#b8332a', couchHi: '#ff8a7a',
  // the disco, for DANCE: a dark club, a checkered floor
  club: '#1a1426', clubHi: '#241b36', tileA: '#2e2246', tileB: '#3d2d5c',
  // a night outside, for HIDE
  // the road in CROSS
  road: '#2a2d30',
  night0: '#070b18', night1: '#141d36', nightGrass: '#14261a', nightGrassHi: '#1c3423', house: '#0d1220',
};
const Env = {
  cache: {},
  paint(spec) {
    let c = this.cache[spec];
    if (!c) c = this.cache[spec] = this.build(spec);
    ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, W, H);
    ctx.drawImage(c, 0, 0, W, H);
    if (spec === 'sky') this.clouds();
    if (spec.startsWith('sunny') || spec.startsWith('park') || spec.startsWith('nature')) this.dayClouds();
    if (spec.startsWith('beach')) this.surf(+spec.split('@')[1]);
    if (spec.startsWith('disco')) this.discoLights(+spec.split('@')[1]);
    if (spec.startsWith('night')) this.stars(+spec.split('@')[1]);
  },
  // floor tiles lighting up on the beat, and sparkles off the mirror ball
  discoLights(y) {
    const beat = Math.floor(Engine.time * 116 / 60 * Math.min(2, Engine.speed || 1));
    const cols = [PAL.accent, PAL.bad, PAL.ink];
    ctx.globalAlpha = 0.28;
    for (let r = 0, ty = y; ty < BOT; ty += 14, r++) for (let cx = 0, k = 0; cx < W; cx += 18, k++) {
      if ((k * 7 + r * 3 + beat) % 5) continue;
      ctx.fillStyle = cols[(k + r + beat) % 3];
      ctx.fillRect(cx + 1, ty + 1, 16, 12);
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = PAL.ink;
    for (let i = 0; i < 6; i++) {
      if ((beat + i) % 3) continue;
      const sx = (i * 41 + beat * 13) % W, sy = TOP + 30 + (i * 23 + beat * 7) % Math.max(10, y - TOP - 40);
      ctx.fillRect(sx, sy, 2, 2);
    }
  },
  // stars twinkling over the night garden
  stars(y) {
    const t = Engine.time;
    ctx.fillStyle = PAL.ink;
    for (let i = 0; i < 9; i++) {
      if ((Math.floor(t * 2) + i * 2) % 7 === 0) continue;   // one or two blink off at a time
      const sx = (i * 53 + 17) % W, sy = TOP + 8 + (i * 31) % Math.max(10, (y - TOP) * 0.55);
      ctx.fillRect(sx, sy, 1, 1);
      if (i % 3 === 0) { ctx.globalAlpha = 0.5; ctx.fillRect(sx - 1, sy, 3, 1); ctx.fillRect(sx, sy - 1, 1, 3); ctx.globalAlpha = 1; }
    }
  },
  // the waterline washing in and out, and the sun glinting off the sea
  surf(y) {
    const t = Engine.time, tide = Math.sin(t * 0.9) * 3;
    ctx.fillStyle = PAL.ink;
    for (let x = 0; x < W; x += 3) ctx.fillRect(x, Math.round(y + tide + Math.sin(x / 9 + t * 2) * 1.5), 3, 2);
    ctx.globalAlpha = 0.35;
    ctx.fillRect(0, Math.round(y + tide + 3), W, 1);
    ctx.globalAlpha = 1;
    for (let i = 0; i < 6; i++) {
      if ((Math.floor(t * 3) + i) % 4) continue;
      ctx.fillStyle = PAL.accent; ctx.fillRect((i * 37 + 11) % W, TOP + 6 + (i * 13) % Math.max(4, y - TOP - 10), 2, 1);
    }
  },
  // fat white clouds, drifting slowly across a sunny sky
  dayClouds() {
    const t = Engine.time;
    for (let i = 0; i < 3; i++) {
      const x = ((i * 83 + t * (3 + i * 2)) % (W + 70)) - 35, y = TOP + 46 + i * 28;   // below the instruction line at TOP+26
      ctx.fillStyle = SCENE.dayCloud;
      ctx.fillRect(Math.round(x - 14), Math.round(y), 28, 6);
      ctx.fillRect(Math.round(x - 9), Math.round(y - 4), 14, 4);
      ctx.fillRect(Math.round(x + 1), Math.round(y - 7), 10, 7);
    }
  },
  // a few clouds drifting across the sky, drawn live so they move
  clouds() {
    const t = Engine.time;
    for (let i = 0; i < 4; i++) {
      const sp = 4 + i * 3, x = ((i * 67 + t * sp) % (W + 60)) - 30, y = TOP + 20 + i * 58;
      this.cloud(ctx, x, y, 18 + (i % 2) * 8);
    }
  },
  cloud(x, cx, cy, w) {
    x.fillStyle = SCENE.cloud;
    x.fillRect(Math.round(cx - w / 2), Math.round(cy), Math.round(w), 4);
    x.fillRect(Math.round(cx - w / 3), Math.round(cy - 3), Math.round(w * 0.45), 3);
    x.fillRect(Math.round(cx), Math.round(cy - 5), Math.round(w * 0.3), 5);
  },
  build(spec) {
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    let seed = 1234;                                   // same scene every time
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const R = (a, b, w, h, col) => { x.fillStyle = col; x.fillRect(Math.round(a), Math.round(b), Math.round(w), Math.round(h)); };
    const mix = (a, b, k) => {                         // blend two #rrggbb colours
      const p = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16));
      const A = p(a), B = p(b);
      return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * k).toString(16).padStart(2, '0')).join('');
    };
    // dusk sky in flat bands, as pixel art does gradients
    const sky = (y0, y1) => {
      const bands = 8, h = (y1 - y0) / bands;
      for (let i = 0; i < bands; i++) R(0, y0 + i * h, W, h + 1, mix(SCENE.sky0, SCENE.sky1, i / (bands - 1)));
      for (let i = 0; i < 14; i++) R(rnd() * W, y0 + rnd() * (y1 - y0) * 0.5, 1, 1, SCENE.star);
    };
    const tufts = (y0, y1, n) => {
      for (let i = 0; i < n; i++) {
        const tx = rnd() * W, ty = y0 + rnd() * (y1 - y0);
        R(tx, ty, 1, 2, SCENE.grassHi); R(tx + 2, ty - 1, 1, 3, SCENE.grassHi);
      }
    };
    const [kind, arg] = spec.split('@');
    const y = arg ? +arg : BOT;
    if (kind === 'lawn') {
      // mown stripes, darker patches, tufts and the odd flower
      for (let i = 0; i < W; i += 30) R(i, TOP, 15, BOT - TOP, SCENE.grass), R(i + 15, TOP, 15, BOT - TOP, SCENE.grassLo);
      tufts(TOP, BOT, 70);
      for (let i = 0; i < 7; i++) { const fx = rnd() * W, fy = TOP + rnd() * (BOT - TOP); R(fx, fy, 2, 2, i % 2 ? PAL.accent : PAL.ink); }
    } else if (kind === 'sky') {
      sky(TOP, BOT);
    } else if (kind === 'field') {
      sky(TOP, y);
      // rolling hills on the horizon, then the grass
      for (let i = 0; i < W; i++) { const hh = 6 + Math.sin(i / 17) * 4 + Math.sin(i / 7) * 2; R(i, y - hh, 1, hh, SCENE.hill); }
      this.cloud(x, 40, TOP + 26, 26); this.cloud(x, 132, TOP + 44, 20);
      R(0, y, W, BOT - y, SCENE.grass);
      R(0, y, W, 2, SCENE.grassHi);
      tufts(y + 3, BOT, Math.max(4, (BOT - y) / 2));
    } else if (kind === 'room' || kind === 'wall' || kind === 'bedroom') {
      // striped wallpaper, skirting, floorboards. (A little framed picture
      // used to hang here; at this size it read as a stray UI box.)
      for (let i = 0; i < W; i += 12) R(i, TOP, 6, y - TOP, SCENE.wall), R(i + 6, TOP, 6, y - TOP, SCENE.wallHi);
      R(0, y - 4, W, 4, SCENE.skirt);
      R(0, y, W, BOT - y, SCENE.floor);
      for (let fy = y + 7, row = 0; fy < BOT; fy += 7, row++) {
        R(0, fy, W, 1, SCENE.floorLo);
        for (let fx = (row % 2) * 22; fx < W; fx += 44) R(fx, fy - 7, 1, 7, SCENE.floorLo);
      }
      if (kind === 'bedroom') {
        // lights out: dim the whole room, then a window onto the night
        x.globalAlpha = 0.45; R(0, TOP, W, BOT - TOP, PAL.bg); x.globalAlpha = 1;
        const wx = 124, wy = TOP + 40, ww = 40, wh = 44;
        R(wx - 3, wy - 3, ww + 6, wh + 6, SCENE.skirt);                         // frame
        R(wx, wy, ww, wh, SCENE.night1);
        R(wx, wy, ww, wh / 2, SCENE.night0);
        x.fillStyle = PAL.ink; x.beginPath(); x.arc(wx + 27, wy + 13, 7, 0, 6.2832); x.fill();
        x.fillStyle = SCENE.night0; x.beginPath(); x.arc(wx + 30, wy + 10, 6, 0, 6.2832); x.fill();
        for (const [sx, sy] of [[6, 6], [14, 26], [33, 32], [8, 37]]) R(wx + sx, wy + sy, 1, 1, PAL.ink);
        R(wx + ww / 2 - 1, wy, 2, wh, SCENE.skirt); R(wx, wy + wh / 2 - 1, ww, 2, SCENE.skirt);   // glazing bars
        R(wx - 6, wy + wh + 3, ww + 12, 3, SCENE.skirt);                        // sill
      }
    } else if (kind === 'sunny' || kind === 'park' || kind === 'nature') {
      const bands = 8, h = (y - TOP) / bands;
      for (let i = 0; i < bands; i++) R(0, TOP + i * h, W, h + 1, mix(SCENE.day0, SCENE.day1, i / (bands - 1)));
      // the sun, rays and all, in the top corner
      const sx = W - 30, sy = TOP + 28;
      x.fillStyle = PAL.accent;
      for (let k = 0; k < 8; k++) {
        const a = k * Math.PI / 4;
        R(sx + Math.cos(a) * 17 - 1.5, sy + Math.sin(a) * 17 - 1.5, 3, 3, PAL.accent);
        R(sx + Math.cos(a) * 21 - 1, sy + Math.sin(a) * 21 - 1, 2, 2, PAL.accent);
      }
      x.beginPath(); x.arc(sx, sy, 12, 0, 6.2832); x.fill();
      if (kind === 'nature') {
        // far mountains with snowy tips, then a pine forest along the horizon
        for (const [mx, mh, mw] of [[22, 58, 46], [78, 80, 58], [140, 64, 50], [190, 50, 40]]) {
          for (let k = 0; k < mh; k++) {
            const half = mw * k / mh;
            R(mx - half, y - mh + k, half * 2 + 1, 1, k < mh * 0.22 ? SCENE.mountHi : SCENE.mount);
          }
        }
        for (let tx = -4; tx < W + 8; tx += 9 + rnd() * 5) {
          const th = 14 + rnd() * 12;
          for (let k = 0; k < th; k++) R(tx - k * 0.32, y - th + k, k * 0.64 + 1, 1, SCENE.forest);
          R(tx - 1, y - 3, 2, 3, SCENE.trunk);
        }
      }
      for (let i = 0; i < W; i++) { const hh = 7 + Math.sin(i / 19) * 4 + Math.sin(i / 6) * 1.5; R(i, y - hh, 1, hh, SCENE.dayHill); }
      if (kind === 'park') {

      // the checkered dance floor

      x.fillStyle = mix(SCENE.night0, SCENE.night1, Math.floor(52 / h) / (bands - 1));   // the sky band it sits in
      x.beginPath(); x.arc(37, TOP + 52, 10, 0, 6.2832); x.fill();
      // a house over the fence, one window still lit
      const hx = W - 62, hy = y - 46;

      R(hx + 8, hy + 10, 9, 9, PAL.accent); R(hx + 12, hy + 10, 1, 9, SCENE.house); R(hx + 8, hy + 14, 9, 1, SCENE.house);
      R(hx + 27, hy + 10, 9, 9, SCENE.night1);
      // a picket fence across the garden

      R(0, y - 14, W, 2, SCENE.night1); R(0, y - 6, W, 2, SCENE.night1);
      R(0, y, W, BOT - y, SCENE.nightGrass);
      R(0, y, W, 2, SCENE.nightGrassHi);
      for (let i = 0; i < 12; i++) { const tx = rnd() * W, ty = y + 4 + rnd() * (BOT - y - 6); R(tx, ty, 1, 2, SCENE.nightGrassHi); R(tx + 2, ty - 1, 1, 3, SCENE.nightGrassHi); }
    } else if (kind === 'beach') {
      R(0, TOP, W, y - TOP, SCENE.sea0);
      for (let i = 0; i < 22; i++) R(rnd() * W, TOP + rnd() * (y - TOP - 3), 6 + rnd() * 10, 1, SCENE.sea1);   // swell
      R(0, y, W, 46, SCENE.wetSand);
      R(0, y + 46, W, BOT - y - 46, SCENE.sand);
      for (let i = 0; i < 60; i++) R(rnd() * W, y + 48 + rnd() * (BOT - y - 50), 1, 1, SCENE.sandLo);     // grain
      for (let i = 0; i < 5; i++) { const sx = 50 + rnd() * 80, sy = y + 60 + rnd() * 90; R(sx, sy, 3, 2, PAL.ink); R(sx + 1, sy - 1, 1, 1, PAL.bad); }   // shells
      // a striped towel, and a beach umbrella seen from above
      for (let i = 0; i < 8; i++) R(10, BOT - 72 + i * 6, 28, 6, i % 2 ? PAL.ink : PAL.bad);
      const ux = W - 30, uy = BOT - 62;
      for (let k = 0; k < 8; k++) {
        x.fillStyle = k % 2 ? PAL.ink : PAL.bad;
        x.beginPath(); x.moveTo(ux, uy); x.arc(ux, uy, 20, k * Math.PI / 4, (k + 1) * Math.PI / 4); x.closePath(); x.fill();
      }
      R(ux - 2, uy - 2, 4, 4, PAL.accent);
    } else if (kind === 'bath') {
      for (let ty = TOP; ty < BOT; ty += 16) for (let tx = 0; tx < W; tx += 16) {
        const th = Math.min(16, BOT - ty);   // the last row is cut at the field's edge, not left hanging into the shelf
        R(tx, ty, 16, th, SCENE.grout); R(tx + 1, ty + 1, 14, Math.max(0, th - 2), ((tx + ty) / 16) % 2 ? SCENE.tile : SCENE.tileHi);
      }
    } else if (kind === 'snow') {
      R(0, TOP, W, BOT - TOP, SCENE.snow);
      for (let i = 0; i < 26; i++) { const sx = rnd() * W, sy = TOP + rnd() * (BOT - TOP); R(sx, sy, 10 + rnd() * 16, 1, SCENE.snowHi); }
      // pines down both edges of the run
      for (let ty = TOP + 10; ty < BOT; ty += 34) for (const tx of [6, W - 6]) {
        const ox = tx + (rnd() - 0.5) * 6;
        for (let k = 0; k < 4; k++) R(ox - 1 - k * 1.5, ty + k * 3, 3 + k * 3, 3, SCENE.pine);
      }
    }
    return c;
  }
};

// ── MICROGAME BASE ───────────────────────────────────────────────────────────
class Microgame {
  static meta = { id: 'base', prompt: 'DO IT!', hint: 'tap', duration: 3.5, winOnTimeout: false };
  constructor(difficulty) {
    this.d = difficulty;       // 1 | 2 | 3
    this.won = false;
    this.finished = false;
    this.t = 0;                // seconds since this game started
    this.timeLimit = 3.5;      // set by the engine before init() — use it to pace physics
  }
  init() {}
  update(dt, input) {}
  draw(g) {}
  succeed() { if (!this.finished) { this.won = true; this.finished = true; } }
  lose()    { if (!this.finished) { this.won = false; this.finished = true; } }
  // helper: linear pick by difficulty
  byD(a, b, c) { return this.d <= 1 ? a : this.d === 2 ? b : c; }
  // A fake-out: the same scene under a DON'T prompt, won by keeping your hands
  // off. Never the first time a game is met, so its real rule is learned first.
  fakeOut(chance, prompt, how) {
    const m = this.constructor.meta;
    if (!Engine.seen.has(m.id) || Math.random() >= chance) return false;
    this.meta = { ...m, prompt, how, hint: 'wait', winOnTimeout: true, photo: false };
    return true;
  }
}
