/* ── MASCOT ───────────────────────────────────────────────────────────────────
   The shiba is anchored on the shelf below the play field and NEVER moves — no
   slide, no hop, no bob. Moods change the animation frame only, so it reacts
   standing exactly where it stands:
     watch  happy idle, blinking now and then
     cheer  celebration cycle, on a win
     sad    droops and tears up, on a loss and on game over

   Because the shelf is outside TOP..BOT and swallows its own presses, the
   mascot cannot cover a target or steal a tap, and microgames need no special
   handling for it.
─────────────────────────────────────────────────────────────────────────────── */
// ── JUICE ────────────────────────────────────────────────────────────────────
/* The same verdict for every microgame, classic or RUN, boss or not, so a win
   always feels like a win: a split-second hit-stop flash with a ring bursting
   from where the action was, GOOD! slammed in big and settling with a wobble,
   confetti from both top corners and a streak badge; a fail gets FAIL! slammed
   in red. The mascot's jump for joy lives in Mascot.draw. */
const Juice = {
  t: 9, won: false, streak: 0, ax: CX, ay: CY, bits: [],
  HIT: 0.12,                                        // the hit-stop flash
  start(won, streak, ax, ay) {
    this.t = 0; this.won = won; this.streak = streak; this.ax = ax; this.ay = ay;
    if (won) this.confetti(40);
  },
  confetti(n) {
    const cols = [PAL.accent, PAL.bad, PAL.ink, SCENE.meadowHi];
    for (let i = 0; i < n; i++) {
      const left = i % 2 === 0;
      this.bits.push({ x: left ? 6 : W - 6, y: TOP + 8, vx: (left ? 1 : -1) * (40 + Math.random() * 120), vy: -60 - Math.random() * 150,
                       c: cols[i % cols.length], r: Math.random() * 6, life: 1.4 + Math.random() * 0.4, t: -this.HIT });
    }
  },
  update(dt) {
    this.t += dt;
    for (const b of this.bits) { b.t += dt; if (b.t < 0) continue; b.x += b.vx * dt; b.y += b.vy * dt; b.vy += 260 * dt; b.r += dt * 9; }
    this.bits = this.bits.filter(b => b.t < b.life && b.y < H + 10);
  },
  get hitting() { return this.won && this.t < this.HIT; },
  // over the frozen game: a white wash and a ring bursting from the action
  drawFlash() {
    const k = this.t / this.HIT;
    ctx.globalAlpha = 0.35 * (1 - k); g.rect(0, 0, W, H, PAL.ink); ctx.globalAlpha = 1;
    ctx.strokeStyle = PAL.ink; ctx.lineWidth = 4 * (1 - k) + 1;
    ctx.beginPath(); ctx.arc(this.ax, this.ay, 10 + k * 50, 0, 6.2832); ctx.stroke();
  },
  // GOOD! / FAIL! slammed in big and tilted, settling with a wobble
  stamp(x, y, size) {
    const t = Math.max(0, this.t - (this.won ? this.HIT : 0)), k = Math.min(1, t / 0.25);
    const c = 1.7, back = 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2);
    const sc = 2.2 - 1.2 * back, rot = (this.won ? -0.12 : 0.1) + Math.sin(t * 20) * 0.03 * (1 - k);
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sc, sc);
    g.outline(this.won ? 'GOOD!' : 'FAIL!', 0, size * 0.35, size, this.won ? PAL.accent : PAL.ink);   // FAIL! in white: the fail screen is already red
    ctx.restore();
  },
  // a red badge that pops in under the stamp when you're on a streak
  badge(x, y) {
    if (!this.won || this.streak < 2) return;
    const k = Math.max(0, Math.min(1, (this.t - 0.35) / 0.3)); if (!k) return;
    const c = 1.7, sc = 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2);
    ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
    g.rect(-38, -9, 76, 16, PAL.bad); g.text('x' + this.streak + ' STREAK!', 0, 3, 9, PAL.ink);
    ctx.restore();
  },
  drawConfetti() {
    for (const b of this.bits) {
      if (b.t < 0) continue;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.globalAlpha = Math.min(1, (b.life - b.t) * 3);
      g.rect(-2, -1, 4, 2, b.c); ctx.restore();
    }
  }
};

// ── WIPE ─────────────────────────────────────────────────────────────────────
/* Between microgames the screen closes down to a shiba-head-shaped window,
   holds a beat on black, then opens again on the next game. The state switch happens at the shut moment (run's callback), and
   the engine stands still until then so nothing advances twice. */
const Wipe = {
  CLOSE: 0.42, HOLD: 0.1, OPEN: 0.42, BIG: 680,
  t: -1, cb: null, fired: false,
  run(cb) { this.t = 0; this.cb = cb; this.fired = false; },
  get busy() { return this.t >= 0 && !this.fired; },   // still closing or shut
  update(dt) {
    if (this.t < 0) return;
    this.t += dt;
    if (!this.fired && this.t >= this.CLOSE) { this.fired = true; Sfx.boop(); const cb = this.cb; this.cb = null; cb(); }
    if (this.t >= this.CLOSE + this.HOLD + this.OPEN) this.t = -1;
  },
  // a smooth shiba head (ears, cheeks, chin) as a path, height h at (cx, cy)
  head(cx, cy, h) {
    const P = (u, v) => [cx + u * h, cy + v * h];
    const q = (a, b, u, v) => ctx.quadraticCurveTo(...P(a, b), ...P(u, v));
    const c = (a, b, d, e, u, v) => ctx.bezierCurveTo(...P(a, b), ...P(d, e), ...P(u, v));
    ctx.moveTo(...P(0, -0.24));
    q(0.1, -0.26, 0.17, -0.31); ctx.lineTo(...P(0.31, -0.47)); q(0.36, -0.53, 0.39, -0.46);   // right ear
    q(0.47, -0.3, 0.46, -0.12);
    c(0.56, 0.04, 0.53, 0.27, 0.3, 0.39); q(0.15, 0.48, 0, 0.48);                            // cheek, chin
    q(-0.15, 0.48, -0.3, 0.39); c(-0.53, 0.27, -0.56, 0.04, -0.46, -0.12);
    q(-0.47, -0.3, -0.39, -0.46); q(-0.36, -0.53, -0.31, -0.47); ctx.lineTo(...P(-0.17, -0.31));   // left ear
    q(-0.1, -0.26, 0, -0.24);
    ctx.closePath();
  },
  draw() {
    if (this.t < 0) return;
    const t = this.t, A = this.CLOSE, B = A + this.HOLD;
    let h = 0;
    if (t < A) h = this.BIG * Math.pow(1 - t / A, 2);           // closing in
    else if (t >= B) h = this.BIG * Math.pow((t - B) / this.OPEN, 2);   // opening out
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, W, H);
    if (h > 0.5) this.head(CX, CY, h);
    ctx.fillStyle = PAL.bg; ctx.fill('evenodd');
    ctx.restore();
  }
};

const Mascot = {
  SW: 35, SH: 37,
  x: W - 20,
  y: BOT + SHELF / 2,   // fixed for every state — do not animate this
  mode: 'watch', t: 0, blink: 2,

  set(m) { if (m === this.mode) return; this.mode = m; this.t = 0; },

  update(dt) {
    this.t += dt;
    if (this.mode !== 'cheer') {
      this.blink -= dt;
      if (this.blink < -0.14) this.blink = 1.6 + Math.random() * 2.8;
    }
  },

  // Frame ranges are documented on the ART.shiba entry near the top of the file.
  frame() {
    if (this.mode === 'cheer') return 1 + Math.floor(this.t * 14) % 7;       // loops while shown
    if (this.mode === 'sad') return 9 + Math.min(7, Math.floor(this.t * 9)); // plays once, holds on tears
    return this.blink < 0 ? 8 : 0;                                           // happy idle, with a blink
  },

  draw(g) {
    g.rect(0, BOT, W, 1, PAL.mid);                                      // shelf divider
    g.sprite('shiba', this.x, this.y, { w: this.SW, h: this.SH, frame: this.frame() });   // never moves: the art is cut flat at its feet
  }
};

/* ── RUN MODE ─────────────────────────────────────────────────────────────────
   The roguelike layer, Balatro-style, over the same microgames. A run is worlds
   of three stages; a stage gives you a few games to reach a score target. Each
   win scores chips x mult (mult is your streak), treats bought in the shop
   between stages bend that sum, and missing a target ends the run.
   Inside a stage nothing changes: it is the same game-after-game rush, and all
   the choosing happens between stages, so the pace never stops mid-stage.
─────────────────────────────────────────────────────────────────────────────── */
const Run = {
  GAMES: 5,          // games per stage — CHONK adds one
  SLOTS: 5,          // treat slots — CHONK takes one
  // art is [sprite, frame, scale?] — scale for sheets with roomy frames, like
  // the 120px runners; GOLDEN BONE draws its own bone
  TREATS: [
    // one treat per group of games (see group() below)
    { id: 'paws',  name: 'QUICK PAWS',  tag: 'PAWS', art: ['whack', 0],      price: 4, group: 'TAP',    lines: ['TAP GAMES', '+15 CHIPS'] },
    { id: 'zoom',  name: 'ZOOMIES',     tag: 'ZOOM', art: ['swiperight', 0, 1.6], price: 5, group: 'DRAG', lines: ['DRAG GAMES', '+20 CHIPS'] },
    { id: 'star',  name: 'CAMERA STAR', tag: 'STAR', art: ['flydog', 3],     price: 6, group: 'CAMERA', lines: ['CAMERA GAMES', 'x2 CHIPS'] },
    { id: 'lung',  name: 'BIG LUNGS',   tag: 'LUNG', art: ['pumpdog', 6],    price: 5, group: 'BLOW',   lines: ['BLOW GAMES', '+4 MULT'] },
    { id: 'wiggle', name: 'WIGGLE BUTT', tag: 'WIGL', art: ['dryshake', 0],  price: 5, group: 'SHAKE',  lines: ['SHAKE GAMES', '+4 MULT'] },
    { id: 'hot',   name: 'HOT STREAK',  tag: 'HOT',  art: ['face', 0],       price: 6, lines: ['STREAK MULT', 'COUNTS x2'] },
    { id: 'good',  name: 'GOOD BOY',    tag: 'GOOD', art: ['shiba', 3],      price: 5, lines: ['1ST FAIL EACH', 'STAGE IS FREE'] },
    { id: 'fast',  name: 'SPEEDY',      tag: 'FAST', art: ['runjump', 2],    price: 4, lines: ['SPEED BONUS', 'x2'] },
    { id: 'gold',  name: 'GOLDEN BONE', tag: 'GOLD', art: null,              price: 4, lines: ['+3 BONES', 'EVERY STAGE'] },
    { id: 'chonk', name: 'CHONK',       tag: 'CHNK', art: ['shaketable', 0], price: 4, lines: ['+1 GAME/STAGE', '-1 SLOT'] },
  ],
  // Every microgame belongs to one group, by what you actually do with the
  // phone — not by its pictogram, which says MOVE for tilting too:
  //   BLOW    the mic (blow, shout)        SHAKE   the phone itself (shake, tilt)
  //   CAMERA  your body in front of it     DRAG    finger along the glass (drag, swipe, rub)
  //   TAP     everything else on the glass (tap, mash, hold, wait)
  // A game can name its own with meta.group.
  group(m) {
    if (m.group) return m.group;
    const how = typeof m.how === 'object' && m.how ? m.how : {};
    if (how.mic) return 'BLOW';
    if (how.tilt || how.motion) return 'SHAKE';
    if (how.cam || m.cam) return 'CAMERA';
    if (['drag', 'trace', 'flick', 'swipe', 'rub'].includes(m.hint)) return 'DRAG';
    return 'TAP';
  },
  // owned treats that boost this game's group
  boosts(m) { const g = this.group(m); return this.TREATS.filter(t => t.group === g && this.has(t.id)); },

  world: 1, stage: 0, bones: 0, treats: [], score: 0, left: 0, played: 0, streak: 0,
  freeFail: false, last: null, payout: [], shop: [], reroll: 2,
  info: null,          // the owned treat whose card is open, or null
  msg: '', msgT: 0,    // a short shop message ("SLOTS FULL…")
  // furthest stage ever reached, counted 0 = 1-1, 1 = 1-2, ...
  best: (() => { try { return +localStorage.getItem('micromania.bestRun') || 0; } catch (e) { return 0; } })(),

  has(id) { return this.treats.includes(id); },
  treat(id) { return this.TREATS.find(t => t.id === id); },
  games() { return this.GAMES + (this.has('chonk') ? 1 : 0); },
  slots() { return this.SLOTS - (this.has('chonk') ? 1 : 0); },
  bossStage() { return this.stage === 2; },
  target() { return Math.round([150, 220, 320][this.stage] * Math.pow(1.6, this.world - 1) / 10) * 10; },
  reached() { return (this.world - 1) * 3 + this.stage; },
  label(i = this.reached()) { return (Math.floor(i / 3) + 1) + '-' + (i % 3 + 1); },

  start() { this.world = 1; this.stage = 0; this.bones = 4; this.treats = []; },

  beginStage() {
    this.score = 0; this.left = this.games(); this.played = 0; this.streak = 0;
    this.freeFail = this.has('good');
    // a touch faster every stage, a step faster every world
    Engine.speed = Math.min(2.6, 1 + (this.world - 1) * 0.2 + this.stage * 0.06);
    Engine.state = 'STAGE'; Engine.timer = 1.8;
  },

  // the boss stage opens on a boss; every other game comes from the pool
  nextGame() {
    const boss = this.bossStage() && this.played === 0;
    Engine.startRound(Engine.pick(boss ? BOSSES : POOL), boss ? 3 : Math.min(3, this.world), boss);
  },

  // Score a finished game. remain is the share of the round clock left over,
  // which is the speed bonus. Every line that adds to the sum is kept in rows,
  // so the tally can show which treats fired.
  onResult(won, remain) {
    const m = Engine.game.meta, rows = [];
    this.played++;
    if (!won) {
      if (this.freeFail) { this.freeFail = false; rows.push(['GOOD BOY', 'FREE TRY', PAL.accent]); }
      else {
        this.left--;
        if (this.streak) rows.push(['STREAK', 'LOST', PAL.bad]);
        this.streak = 0;
      }
      this.last = { won, rows, points: 0, from: this.score };
      return;
    }
    this.left--;
    let chips = Engine.isBoss ? 80 : 30;
    rows.push([Engine.isBoss ? 'BOSS' : 'WIN', '+' + chips, PAL.ink]);
    let bonus = m.winOnTimeout ? 10 : Math.round(25 * remain);
    if (this.has('fast')) bonus *= 2;
    if (bonus) { chips += bonus; rows.push([this.has('fast') ? 'SPEEDY' : 'SPEED', '+' + bonus, this.has('fast') ? PAL.accent : PAL.ink]); }
    const grp = this.group(m);
    if (this.has('paws') && grp === 'TAP')  { chips += 15; rows.push(['QUICK PAWS', '+15', PAL.accent]); }
    if (this.has('zoom') && grp === 'DRAG') { chips += 20; rows.push(['ZOOMIES', '+20', PAL.accent]); }
    if (this.has('star') && grp === 'CAMERA') { chips *= 2; rows.push(['CAMERA STAR', 'x2 CHIPS', PAL.accent]); }
    let mult = 1 + this.streak * (this.has('hot') ? 2 : 1);
    if (this.streak) rows.push([this.has('hot') ? 'HOT STREAK' : 'STREAK', '+' + (mult - 1) + ' MULT', this.has('hot') ? PAL.accent : PAL.bad]);
    if (this.has('lung') && grp === 'BLOW')  { mult += 4; rows.push(['BIG LUNGS', '+4 MULT', PAL.accent]); }
    if (this.has('wiggle') && grp === 'SHAKE') { mult += 4; rows.push(['WIGGLE BUTT', '+4 MULT', PAL.accent]); }
    this.streak++;
    const points = chips * mult;
    this.last = { won, rows, chips, mult, points, from: this.score };
    this.score += points;
  },

  // after the tally (and any photo): stage cleared, run over, or next game
  after() {
    if (this.score >= this.target()) this.clear();
    else if (this.left <= 0) this.over();
    else this.nextGame();
  },

  clear() {
    const rows = [[this.bossStage() ? 'BOSS STAGE' : 'STAGE CLEAR', this.bossStage() ? 5 : 3]];
    if (this.left) rows.push(['GAMES LEFT x' + this.left, this.left]);
    const interest = Math.min(5, Math.floor(this.bones / 5));
    if (interest) rows.push(['INTEREST', interest]);
    if (this.has('gold')) rows.push(['GOLDEN BONE', 3]);
    this.payout = rows;
    this.bones += rows.reduce((n, r) => n + r[1], 0);
    this.saveBest(this.reached() + 1);
    Engine.state = 'CLEAR'; Engine.timer = 2.4;
    Sfx.clear(); FX.flash(PAL.accent, 0.4); Juice.confetti(60);
  },

  over() {
    this.saveBest(this.reached());
    Engine.state = 'GAMEOVER'; Engine.timer = 0.8; Sfx.gameover();
  },

  saveBest(i) {
    if (i <= this.best) return;
    this.best = i;
    try { localStorage.setItem('micromania.bestRun', String(i)); } catch (e) {}
  },

  nextStage() {
    this.stage++;
    if (this.stage > 2) { this.stage = 0; this.world++; }
    this.beginStage();
  },

  // ── SHOP ─────────────────────────────────────────────────────────────────
  CARD(i) { return { x: 4 + i * 59, y: TOP + 86, w: 54, h: 104 }; },
  REROLL: { x: 8, y: BOT - 28, w: 76, h: 22 },
  NEXT: { x: W - 84, y: BOT - 28, w: 76, h: 22 },

  openShop() { this.reroll = 2; this.stock(); Engine.state = 'SHOP'; Engine.timer = 0.3; },

  stock() {
    // no BIG LUNGS for a player whose mic is blocked: only treats for groups
    // that can actually come up
    const live = new Set([...POOL, ...BOSSES].filter(C => Engine.playable(C)).map(C => this.group(C.meta)));
    const pool = this.TREATS.filter(t => !this.has(t.id) && (!t.group || live.has(t.group))).map(t => t.id);
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    this.shop = pool.slice(0, 3);
  },

  canBuy(t) {
    const slots = t.id === 'chonk' ? this.SLOTS - 1 : this.slots();
    return this.bones >= t.price && this.treats.length < slots;
  },

  // ── YOUR TREATS: tap one to read it; in the shop, to sell it ─────────────
  ownedY() { return Engine.state === 'SHOP' ? TOP + 44 : CY + 66; },
  ownedHit(p) {
    const y = this.ownedY();
    for (let i = 0; i < this.treats.length; i++) if (Engine.hit({ x: 8 + i * 33, y, w: 30, h: 34 }, p)) return i;
    return -1;
  },
  PANEL: { x: 18, y: CY - 78, w: 144, h: 152 },
  SELL: { x: CX - 50, y: CY + 38, w: 100, h: 22 },
  sellPrice(t) { return Math.max(1, Math.floor(t.price / 2)); },
  say(m) { this.msg = m; this.msgT = 2; Sfx.fail(); FX.shake(2); },

  // with a treat's card open, SELL sells it (shop only) and any other tap closes it
  infoTap(p) {
    if (Engine.state === 'SHOP' && Engine.hit(this.SELL, p)) {
      const t = this.treat(this.info);
      this.bones += this.sellPrice(t);
      this.treats = this.treats.filter(id => id !== t.id);
      Sfx.tap(); FX.burst(CX, this.SELL.y + 11, PAL.accent, 10, 60);
    }
    this.info = null;
  },

  shopUpdate(input) {
    if (this.msgT > 0) this.msgT -= STEP;
    if (Engine.timer > 0) return;
    for (const tp of input.taps) {
      if (this.info) { this.infoTap(tp); continue; }
      const o = this.ownedHit(tp);
      if (o >= 0) { this.info = this.treats[o]; Sfx.tap(); continue; }
      for (let i = 0; i < 3; i++) if (Engine.hit(this.CARD(i), tp)) this.buy(i);
      if (Engine.hit(this.REROLL, tp)) {
        if (this.bones >= this.reroll && this.shop.length) { this.bones -= this.reroll; this.reroll++; this.stock(); Sfx.tap(); }
        else { Sfx.fail(); FX.shake(2); }
      }
      if (Engine.hit(this.NEXT, tp)) { Sfx.tap(); this.nextStage(); return; }
    }
  },

  buy(i) {
    const id = this.shop[i]; if (!id) return;
    const t = this.treat(id), c = this.CARD(i);
    if (this.bones < t.price) { this.say('NOT ENOUGH BONES'); return; }
    if (!this.canBuy(t)) { this.say('SLOTS FULL - TAP ONE TO SELL'); return; }
    this.bones -= t.price; this.treats.push(id); this.shop[i] = null;
    Sfx.win(); buzz(20); FX.burst(c.x + c.w / 2, c.y + c.h / 2, PAL.accent, 14, 70);
  },

  // ── DRAW ─────────────────────────────────────────────────────────────────
  bone(x, y, c = PAL.ink, k = 1) {
    const r = (a, b, w, h) => g.rect(x + a * k, y + b * k, w * k, h * k, c);
    r(0, 1, 6, 2); r(-1, 0, 2, 2); r(-1, 2, 2, 2); r(5, 0, 2, 2); r(5, 2, 2, 2);
  },

  // a treat's picture centred on x, y at about size s
  drawArt(t, x, y, s) {
    if (!t.art) { const k = Math.max(2, Math.round(s / 13)); this.bone(x - 3 * k, y - 2 * k, PAL.accent, k); return; }
    const sz = s * (t.art[2] || 1);
    if (t.id === 'zoom') for (let i = 0; i < 3; i++)   // speed lines trailing the runner
      g.rect(x - s * 0.5 - i * s * 0.04, y - s * 0.12 + i * s * 0.12, s * 0.2, Math.max(1, s / 26), PAL.mid);
    g.sprite(t.art[0], x, y, { w: sz, h: sz, frame: t.art[1] });
  },

  // a treat as a card: big in the shop, small in your row
  drawTreat(t, x, y, w, h, small) {
    g.rect(x, y, w, h, small ? PAL.mid : PAL.ink);
    g.rect(x + 2, y + 2, w - 4, h - 4, PAL.bg);
    if (small) { this.drawArt(t, x + w / 2, y + 13, 20); g.text(t.tag, x + w / 2, y + h - 4, 8, PAL.ink); return; }
    // 8px text wrapped to the card: the name on top, the effect bottom-up above the price
    const name = g.wrap(t.name, w - 6), desc = t.lines.flatMap(l => g.wrap(l, w - 6));
    name.forEach((l, i) => g.text(l, x + w / 2, y + 12 + i * 9, 8, PAL.ink));
    const top = y + 12 + (name.length - 1) * 9 + 6, bot = y + h - 16 - desc.length * 9 - 1;   // the art fills the gap between
    this.drawArt(t, x + w / 2, (top + bot) / 2, Math.min(30, bot - top));
    desc.forEach((l, i) => g.text(l, x + w / 2, y + h - 16 - (desc.length - 1 - i) * 9, 8, PAL.ink));
  },

  drawOwned(y) {
    const n = Math.max(this.slots(), this.treats.length);
    for (let i = 0; i < n; i++) {
      const x = 8 + i * 33;
      if (this.treats[i]) this.drawTreat(this.treat(this.treats[i]), x, y, 30, 34, true);
      else { g.box(x, y, 30, 34, PAL.mid); g.text('+', x + 15, y + 21, 10, PAL.mid); }
    }
  },

  drawHud() {
    g.text(this.label(), 4, 13, 9, PAL.ink, 'left');
    this.bone(W - 34, 6);
    g.text(String(this.bones), W - 6, 13, 9, PAL.ink, 'right');
    g.rect(0, TOP - 1, W, 1, PAL.mid);
    // games left and stage progress only mean something while a stage is on
    if (Engine.state === 'CLEAR' || Engine.state === 'SHOP') return;
    const n = this.games();
    for (let i = 0; i < n; i++) g.rect(28 + i * 6, 6, 4, 6, i < this.left ? PAL.accent : PAL.mid);
    g.rect(0, TOP - 2, W * Math.min(1, this.score / this.target()), 2, PAL.accent);
  },

  drawStage() {
    const boss = this.bossStage();
    g.text('WORLD ' + this.world, CX, CY - 56, 11, PAL.mid);
    g.text(boss ? 'BOSS STAGE' : 'STAGE ' + (this.stage + 1) + ' / 3', CX, CY - 32, 16, boss ? PAL.bad : PAL.ink);
    g.text('TARGET', CX, CY - 4, 9, PAL.mid);
    g.text(String(this.target()), CX, CY + 24, 26, PAL.accent);
    g.text(this.games() + ' GAMES TO SCORE IT', CX, CY + 46, 8, PAL.ink);
    if (this.treats.length) {
      g.text('YOUR TREATS  ·  TAP TO SEE', CX, CY + 61, 6, PAL.mid);
      this.drawOwned(CY + 66);
    }
    this.drawInfo();
  },

  // an owned treat's card, opened over whatever screen it was tapped on
  drawInfo() {
    if (!this.info) return;
    const t = this.treat(this.info), P = this.PANEL;
    ctx.globalAlpha = 0.75; g.rect(0, TOP, W, BOT - TOP, PAL.bg); ctx.globalAlpha = 1;
    g.rect(P.x, P.y, P.w, P.h, PAL.accent);
    g.rect(P.x + 2, P.y + 2, P.w - 4, P.h - 4, PAL.bg);
    g.text(t.name, CX, P.y + 18, 10, PAL.accent);
    this.drawArt(t, CX, P.y + 56, 52);
    t.lines.forEach((l, i) => g.text(l, CX, P.y + 96 + i * 11, 8, PAL.ink));
    if (Engine.state === 'SHOP') {
      const S = this.SELL;
      g.rect(S.x, S.y, S.w, S.h, PAL.bad);
      g.text('SELL  +' + this.sellPrice(t), CX, S.y + 15, 9, PAL.ink);
    }
    g.text('TAP ELSEWHERE TO CLOSE', CX, P.y + P.h - 5, 6, PAL.mid);
  },

  drawTally() {
    const L = this.last;
    Juice.stamp(CX, TOP + 30, 20);
    if (L.won && Engine.snap) Engine.drawPolaroid(Engine.snap, W - 24, TOP + 28, 34, 0.08);
    g.text(Engine.game.meta.prompt, CX, TOP + 54, 7, PAL.mid);
    L.rows.forEach(([a, v, c], i) => {
      g.text(a, 14, TOP + 70 + i * 12, 8, PAL.mid, 'left');
      g.text(v, W - 14, TOP + 70 + i * 12, 8, c, 'right');
    });
    if (L.won) {
      const y = TOP + 140;
      g.rect(14, y, 64, 18, PAL.ink); g.text(String(L.chips), 46, y + 13, 11, PAL.bg);
      g.text('x', CX, y + 13, 11, PAL.ink);
      g.rect(W - 78, y, 64, 18, PAL.bad); g.text(String(L.mult), W - 46, y + 13, 11, PAL.ink);
      g.text('= ' + L.points, CX, y + 42, 16, PAL.accent);
    }
    // the stage bar fills from where it was to where it is now
    const y = TOP + 200, goal = this.target();
    const k = Math.min(1, (1.8 - Engine.timer) / 0.6);
    const shown = Math.round(L.from + (this.score - L.from) * Math.max(0, k));
    g.text('SCORE', 8, y, 7, PAL.mid, 'left');
    g.text(shown + ' / ' + goal, W - 8, y, 8, PAL.ink, 'right');
    g.rect(8, y + 4, W - 16, 5, PAL.mid);
    g.rect(8, y + 4, (W - 16) * Math.min(1, shown / goal), 5, PAL.accent);
    const msg = this.score >= goal ? ['TARGET HIT!', PAL.accent]
              : this.left <= 0 ? ['OUT OF GAMES', PAL.bad]
              : [this.left + (this.left === 1 ? ' GAME' : ' GAMES') + ' LEFT', PAL.ink];
    g.text(msg[0], CX, y + 28, 10, msg[1]);
  },

  drawClear() {
    g.text(this.stage === 2 ? 'WORLD ' + this.world : 'STAGE', CX, CY - 64, 18, PAL.accent);
    g.text('CLEAR!', CX, CY - 42, 18, PAL.accent);
    this.payout.forEach(([a, v], i) => {
      g.text(a, 20, CY - 12 + i * 13, 8, PAL.mid, 'left');
      g.text('+' + v, W - 20, CY - 12 + i * 13, 8, PAL.ink, 'right');
    });
    const y = CY - 12 + this.payout.length * 13 + 10;
    this.bone(CX - 22, y - 7, PAL.accent);
    g.text(String(this.bones), CX - 10, y, 12, PAL.accent, 'left');
    if (Math.floor(Engine.time * 2) % 2) g.text('TAP FOR THE SHOP', CX, BOT - 10, 8, PAL.mid);
  },

  drawShop() {
    g.text('TREAT SHOP', CX, TOP + 24, 14, PAL.accent);
    g.text('YOUR TREATS', 8, TOP + 40, 7, PAL.mid, 'left');
    if (this.treats.length) g.text('TAP TO SEE / SELL', W - 8, TOP + 40, 6, PAL.mid, 'right');
    this.drawOwned(TOP + 44);
    for (let i = 0; i < 3; i++) {
      const c = this.CARD(i), id = this.shop[i];
      if (!id) { g.box(c.x, c.y, c.w, c.h, PAL.mid); g.text(this.shop.length ? 'SOLD' : 'EMPTY', c.x + c.w / 2, c.y + c.h / 2, 8, PAL.mid); continue; }
      const t = this.treat(id), ok = this.canBuy(t);
      this.drawTreat(t, c.x, c.y, c.w, c.h, false);
      this.bone(c.x + c.w / 2 - 10, c.y + c.h - 11, ok ? PAL.accent : PAL.mid);
      g.text(String(t.price), c.x + c.w / 2 + 2, c.y + c.h - 5, 8, ok ? PAL.accent : PAL.mid, 'left');
    }
    if (this.msgT > 0) g.text(this.msg, CX, this.CARD(0).y + 118, 7, PAL.bad);
    else g.text('TAP A TREAT TO BUY IT', CX, this.CARD(0).y + 118, 7, PAL.mid);
    const R = this.REROLL, N = this.NEXT;
    g.box(R.x, R.y, R.w, R.h, PAL.mid); g.text('REROLL ' + this.reroll, R.x + R.w / 2, R.y + 15, 8, PAL.ink);
    g.rect(N.x, N.y, N.w, N.h, PAL.accent); g.text('NEXT >', N.x + N.w / 2, N.y + 15, 9, PAL.bg);
    this.drawInfo();
  },

  drawOver() {
    Engine.drawAlbum(TOP + 44);
    g.text('RUN', CX, CY - 30, 24, PAL.bad);
    g.text('OVER', CX, CY - 4, 24, PAL.bad);
    g.text('REACHED ' + this.label(), CX, CY + 26, 10, PAL.ink);
    g.text(this.score + ' / ' + this.target(), CX, CY + 42, 8, PAL.mid);
    g.text('BEST ' + this.label(this.best), CX, CY + 56, 8, PAL.mid);
    Engine.drawShareButton();
  }
};

/* =============================================================================
   ENGINE — states: TITLE > PROMPT > PLAYING > RESULT > (SPEEDUP) > ... GAMEOVER
   RUN mode adds STAGE (intro) > games > CLEAR > SHOP between stages
============================================================================= */
const Engine = {
  state: 'TITLE', timer: 0, time: 0,
  lives: 4, score: 0, round: 0, combo: 0, speed: 1,
  // best survives a reload; storage can throw (private mode), so it is optional
  best: (() => { try { return +localStorage.getItem('micromania.best') || 0; } catch (e) { return 0; } })(),
  game: null, isBoss: false, result: null, lastId: null,
  // games met this session: the first time, the prompt card stays up long
  // enough to read how to play it
  seen: new Set(),
  // camera/mic/motion: null = not asked yet (show the sensors screen before
  // the first run), true = allowed, false = the player picked touch only
  sensors: null,
  mode: 'classic',   // 'classic' = endless lives run, 'run' = the roguelike (see Run)
  // a still of the player taken the moment they win any game, shown on the
  // result screen; the last few of a run make the game-over strip
  snap: null, album: [],
  BOSS_EVERY: 8, SPEEDUP_EVERY: 4,

  reset() {
    this.lives = 4; this.score = 0; this.round = 0; this.combo = 0; this.speed = 1;
    this.lastId = null;
  },

  // Can this game be played with what the player has allowed? A game that
  // needs a sensor (its how-to lists one besides touch) is only dealt when at
  // least one of those sensors is live or still being asked for — a blocked
  // mic means no blowing games at all, not blowing games played by tapping.
  playable(C) {
    const how = C.meta.how;
    const needs = how && typeof how === 'object' ? Object.keys(how).filter(k => k !== 'touch') : [];
    if (!needs.length) return true;
    const live = {
      mic: Input.micReady || Input.micPending,
      cam: Input.camReady || Input.camPending,
      tilt: Input.tiltReady,
      motion: Input.motionReady,
    };
    return needs.some(k => live[k]);
  },

  pick(list) {
    const ok = list.filter(C => this.playable(C));
    if (ok.length) list = ok;
    let cand = list.filter(C => C.meta.id !== this.lastId);
    if (!cand.length) cand = list;
    return cand[Math.floor(Math.random() * cand.length)];
  },

  difficulty() {
    if (this.round < 6) return 1;
    if (this.round < 14) return 2;
    return 3;
  },

  startRound(forceClass, forceDiff, forceBoss) {
    this.round++;
    FX.parts.length = 0; FX.fl = 0;   // no effects bleed across rounds
    Engine.lastPhoto = null;          // a shot from a lost round must not show after a later win
    this.shot = null; this.shotBest = 0; this.shotAt = -1; this.shotFlash = 0;
    this.isBoss = !!forceBoss || (!forceClass && this.round % this.BOSS_EVERY === 0);
    const C = forceClass || this.pick(this.isBoss ? BOSSES : POOL);
    this.lastId = C.meta.id;
    const diff = forceDiff || (this.isBoss ? 3 : this.difficulty());
    this.game = new C(diff);
    this.game.meta = C.meta;
    this.duration = (C.meta.duration || 3.5) / this.speed * (this.isBoss ? 1.6 : 1);
    // some games (physics-heavy: flappy, crossy) need a floor so extreme engine
    // speed can't shrink the round below what's physically completable
    if (C.meta.minDuration) this.duration = Math.max(this.duration, C.meta.minDuration);
    this.game.timeLimit = this.duration;
    this.game.init();
    this.state = 'PROMPT';
    this.timer = this.isBoss ? 1.0 : 0.7;
    Sfx.prompt(this.isBoss);
    if (!this.seen.has(C.meta.id)) { this.seen.add(C.meta.id); this.timer += 1.1; }
  },

  // The how-to line for the input this player will really use: a camera game
  // played on touch says "TAP FAST", not "MOVE YOUR BODY".
  howTo(m) {
    const h = m.how;
    if (!h || typeof h === 'string') return h || '';
    const has = {
      tilt: Input.tiltReady,
      cam: Input.camReady || Input.camPending,
      mic: Input.micReady || Input.micPending,
      motion: Input._motionOn && (navigator.maxTouchPoints > 0),
    };
    for (const k in h) if (k === 'touch' || has[k]) return h[k];
    return h.touch || '';
  },

  update(dt) {
    this.time += dt;
    // a PLAYING game may request a pause (e.g. blow waiting on mic permission);
    // freeze the round clock so it can't be lost while blocked
    Wipe.update(dt); Juice.update(dt);
    // the title plays its intro every time you arrive (not back from the album)
    if (this.state !== this._lastState) {
      if (this.state === 'TITLE') { this.titleT = ['ALBUM', 'SETTINGS'].includes(this._lastState) ? 9 : 0; this.titleSfx = 0; }
      this._lastState = this.state;
    }
    if (this.state === 'TITLE') this.titleIntro(dt);
    if (Wipe.busy) { Mascot.update(dt); return; }   // closing on the last game: hold everything
    const paused = this.state === 'PLAYING' && this.game && this.game.paused;
    if (!paused) this.timer -= dt;
    Mascot.update(dt);
    const s = this.state;

    // starting a run is handled in release(), inside the tap itself
    if (s === 'TITLE' || s === 'GAMEOVER' || s === 'ALBUM' || s === 'SETTINGS') {
      Mascot.set(s === 'GAMEOVER' ? 'sad' : 'watch');
      return;
    }

    if (s === 'PERMS') {
      Mascot.set('watch');
      // ALLOW was tapped: wait out the popup, then go. The cap only matters if
      // a browser never answers — the games still fall back on their own.
      if (this.permWait && ((!Input.camPending && !Input.micPending) || this.timer < -20)) {
        this.sensors = true;
        this.startRun();
      }
      return;
    }

    // 3-2-1-GO before the very first microgame of a run. The rhythm — a beat to
    // breathe, then the scramble — is the whole point of the opening.
    if (s === 'READY') {
      Mascot.set('watch');
      const n = Math.ceil(this.timer - 0.2);   // 3,2,1 then 0 == GO
      if (n !== this.readyLast && n >= 0) {
        this.readyLast = n;
        if (n > 0) { Sfx.tick(); buzz(15); FX.shake(1.5); }
        else { Sfx.go(); buzz(40); FX.flash(PAL.accent, 0.4); FX.shake(3); }
      }
      if (this.timer <= 0) { if (this.mode === 'run') Run.beginStage(); else this.startRound(); }
      return;
    }

    // RUN mode's between-stage screens; each can be tapped past
    if (s === 'STAGE') {
      Mascot.set('watch');
      // a treat's card holds the intro until it is closed
      if (Run.info) { this.timer += dt; for (const tp of Input.taps) Run.infoTap(tp); return; }
      for (const tp of Input.taps) {
        const o = Run.ownedHit(tp);
        if (o >= 0) { Run.info = Run.treats[o]; Sfx.tap(); return; }
        if (this.timer < 1.4) this.timer = 0;   // any other tap skips the intro
      }
      if (this.timer <= 0) Run.nextGame();
      return;
    }
    if (s === 'CLEAR') {
      Mascot.set('cheer');
      if (this.timer <= 0 || (Input.justDown && this.timer < 1.9)) Run.openShop();
      return;
    }
    if (s === 'SHOP') {
      Mascot.set('watch');
      Run.shopUpdate(Input);
      return;
    }

    if (s === 'PROMPT') {
      Mascot.set('watch');
      if (this.timer <= 0) { this.state = 'PLAYING'; this.timer = this.duration; }
      return;
    }

    if (s === 'PLAYING') {
      Mascot.set('watch');
      if (this.game.paused) { this.game.update(dt, Input); return; }  // frozen; let it poll its unpause
      this.game.t += dt;
      this.game.update(dt, Input);
      this.trackShot();
      const out = this.timer <= 0;
      this.timer_ = this.timer;   // round clock left, for RUN's speed bonus
      if (out && !this.game.finished && !this.game.playingOut) {   // a jump in the air gets to land
        if (this.game.meta.winOnTimeout) this.game.succeed();
        else { this.game.lose(); FX.burst(12, H - 9, PAL.bad, 18, 90); Sfx.noise(0.3, 0.09, 120); }   // the bomb goes off
      }
      if (this.game.finished) {
        if (this.game.won) {
          this.score++; this.combo++; this.result = 'WIN'; Sfx.win(); buzz(20); Mascot.set('cheer');
          // the action shot: the best moment caught while playing, stamped
          this.snap = null;
          if (this.game.meta.photo && this.shootsNow()) {
            const shot = this.shot || Input.snapPhoto();
            if (shot) {
              if (this.game.stampPhoto) this.game.stampPhoto(shot);
              this.snap = Engine.lastPhoto = shot;
              this.album.push(shot); if (this.album.length > 4) this.album.shift();
              Album.add(shot, this.game.meta.photoCap || 'NICE MOVES!', this.game.meta.prompt);
            }
          }
          FX.burst(Mascot.x, Mascot.y - 8, PAL.accent, 12 + Math.min(12, this.combo * 2), 80);
          if (this.combo >= 3) FX.shake(3);   // a little extra on a streak
          // the flash bursts from your finger in a touch game, else mid-screen
          const touch = ['TAP', 'DRAG'].includes(Run.group(this.game.meta)) && Input.y > TOP && Input.y < BOT;
          Juice.start(true, this.mode === 'run' ? 0 : this.combo, touch ? Input.x : CX, touch ? Input.y : CY);
        } else {
          if (!this.testClass && this.mode === 'classic') this.lives--;
          this.snap = null;
          this.combo = 0; this.result = 'FAIL'; Sfx.fail(); buzz(120); Mascot.set('sad');
          FX.flash(PAL.bad, 0.55); FX.shake(5);
          Juice.start(false, 0, CX, CY);
        }
        if (this.score > this.best && !this.testClass && this.mode === 'classic') {
          this.best = this.score;
          try { localStorage.setItem('micromania.best', String(this.best)); } catch (e) {}
        }
        this.state = 'RESULT'; this.timer = 0.9;
        if (this.mode === 'run') { Run.onResult(this.game.won, Math.max(0, this.timer_ / this.duration)); this.timer = 1.8; }
      }
      return;
    }

    if (s === 'RESULT') {
      if (this.mode === 'run' && Input.justDown && this.timer < 1.4) this.timer = 0;   // skip the tally
      if (this.timer > 0) return;
      // if the just-won game caught an action shot, show it before moving on
      if (this.result === 'WIN' && this.game && this.game.meta.photo && Engine.lastPhoto) {
        this.photoCap = this.game.meta.photoCap || 'NICE MOVES!';
        this.state = 'PHOTO'; this.timer = 2.2; this.photoReveal = 0;
        return;
      }
      this.advance();
      return;
    }

    if (s === 'SPEEDUP') {
      Mascot.set('watch');
      if (this.timer <= 0) this.startRound();
    }

    if (s === 'PHOTO') {
      this.photoReveal = Math.min(1, (this.photoReveal || 0) + dt * 4);   // a quick camera flash, gone in a quarter second
      if (this.timer <= 0 || Input.justDown) {
        Engine.lastPhoto = null;
        this.advance();
      }
    }
  },

  // the backing beat kicks in on GO and runs until GAME OVER, but not on menus or in
  // the shop, and drops out while a mic game listens for your blow
  // which song plays now (null = none): the title tune on the menus, the
  // groove (or the boss theme) through the games, the shop tune in the shop.
  // The countdown, SPEED UP, STAGE CLEAR and GAME OVER have their own stings.
  musicTrack() {
    const s = this.state;
    if (['TITLE', 'SETTINGS', 'ALBUM', 'PERMS'].includes(s)) return 'menu';
    if (s === 'SHOP') return 'shop';
    if (!['STAGE', 'PROMPT', 'PLAYING', 'RESULT', 'PHOTO'].includes(s)) return null;
    const how = this.game && this.game.meta.how;
    if ((s === 'PROMPT' || s === 'PLAYING') && how && how.mic && (Input.micReady || Input.micPending)) return null;
    if (s === 'PLAYING' && this.game.meta.ownBeat) return null;   // DANCE keeps its own time
    return this.isBoss && s !== 'STAGE' ? 'boss' : 'game';
  },

  // WarioWare Snapped!-style: no posing. While a photo game is played the
  // camera keeps the frame with the most action in it — the biggest wave,
  // shake, lean or dance move, the hardest blow, or for FREEZE the stillest
  // moment — and that is the picture. Grabs are throttled and only taken when
  // the moment beats the best so far; the shelf view blinks on each one.
  shootsNow() {
    const gm = this.game;
    return Input.camReady && !('usesCam' in gm && !gm.usesCam);
  },
  trackShot() {
    const gm = this.game, m = gm.meta;
    if (!m.photo || !this.shootsNow() || gm.t < 0.25 || gm.finished) return;
    const by = m.hint === 'blow' ? 'blow' : m.hint === 'shout' ? 'loud' : m.hint === 'still' ? 'still' : 'motion';
    const v = by === 'blow' ? Input.blow : by === 'loud' ? Input.loud : by === 'still' ? 1 - Input.motion : Input.motion;
    if (v > this.shotBest + 0.03 && this.time - this.shotAt > 0.15) {
      const shot = Input.snapPhoto();
      if (shot) { this.shot = shot; this.shotBest = v; this.shotAt = this.time; this.shotFlash = 0.12; }
    }
  },

  // ── BUTTONS ────────────────────────────────────────────────────────────────
  // Called straight from the pointer events, so the permission prompts they
  // raise are inside a user gesture. press() returns true to eat the press.
  PERM_ALLOW: { x: CX - 50, y: CY + 22, w: 100, h: 24 },
  PERM_SKIP:  { x: CX - 50, y: CY + 54, w: 100, h: 24 },
  RUN_SPEED: 80, RUN_X: 46, RUN_GROUND: 180,
  // the menu options, all the same size and style (Super Mario's title menu)
  BTN_RUN:     { x: CX - 50, y: 182, w: 100, h: 24 },
  BTN_CLASSIC: { x: CX - 50, y: 206, w: 100, h: 24 },
  BTN_ALBUM:   { x: CX - 50, y: 230, w: 100, h: 24 },
  BTN_SET:     { x: CX - 50, y: 254, w: 100, h: 24 },
  // SETTINGS: one switch per row, BACK like the album's
  SET_ROWS: [
    { k: 'sound', label: 'SOUND', y: TOP + 40 },
    { k: 'music', label: 'MUSIC', y: TOP + 64 },
    { k: 'vibe',  label: 'VIBRATION', y: TOP + 88 },
    { k: 'cam',   label: 'CAMERA', y: TOP + 140 },
    { k: 'mic',   label: 'MICROPHONE', y: TOP + 164 },
    { k: 'motion', label: 'MOTION', y: TOP + 188 },
  ],
  setSwitch(r) { return { x: W - 72, y: r.y - 4, w: 54, h: 20 }; },
  SET_INSTALL: { x: CX - 62, y: H - 48, w: 124, h: 22 },
  installEvt: null,
  installed() { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; },
  TITLE_INTRO: 1.9,          // seconds until the title has settled and its buttons work
  ALB_BACK:    { x: 16, y: TOP + 2, w: 40, h: 16 },   // inside the menu frame (see menuPanel)
  ALB_PREV:    { x: 16, y: BOT - 26, w: 30, h: 20 },
  ALB_NEXT:    { x: W - 46, y: BOT - 26, w: 30, h: 20 },
  // the menu-style screens: black with drifting paw prints and a pixel frame,
  // and no mascot on the shelf
  MENU_SCREENS: ['SETTINGS', 'ALBUM', 'PERMS', 'GAMEOVER'],
  menuBg() {
    g.rect(0, 0, W, H, PAL.bg);
    const t = (this.time * 6) % 24, c = '#1c1c1c';
    for (let yy = -24; yy < H + 24; yy += 24) for (let xx = -24; xx < W + 24; xx += 24) {
      const px = Math.round(xx + t + ((yy / 24) % 2 ? 12 : 0)), py = Math.round(yy + t);
      g.rect(px, py, 5, 4, c); g.rect(px - 3, py - 4, 2, 2, c); g.rect(px, py - 6, 2, 2, c); g.rect(px + 3, py - 6, 2, 2, c); g.rect(px + 6, py - 4, 2, 2, c);
    }
  },
  menuPanel() {
    const x = 8, y = 8, w = W - 16, h = H - 16, c = PAL.mid;
    ctx.globalAlpha = 0.9; g.rect(x, y, w, h, PAL.bg); ctx.globalAlpha = 1;
    g.rect(x + 2, y, w - 4, 1, c); g.rect(x + 2, y + h - 1, w - 4, 1, c);
    g.rect(x, y + 2, 1, h - 4, c); g.rect(x + w - 1, y + 2, 1, h - 4, c);
    for (const [cx, cy] of [[x + 1, y + 1], [x + w - 2, y + 1], [x + 1, y + h - 2], [x + w - 2, y + h - 2]]) g.rect(cx, cy, 1, 1, c);   // notched corners
  },
  ALB_SHARE:   { x: CX - 50, y: BOT - 46, w: 100, h: 20 },
  ALB_DEL:     { x: CX - 30, y: BOT - 21, w: 60, h: 16 },
  BTN_SHARE:   { x: CX - 50, y: CY + 66, w: 100, h: 22 },
  hit(b, p) { return p.x >= b.x && p.x < b.x + b.w && p.y >= b.y && p.y < b.y + b.h; },

  press(p) {
    return this.state === 'PERMS';   // the sensors screen is buttons only
  },

  release(p) {
    const s = this.state;
    if (s === 'TITLE' && (this.titleT || 0) < this.TITLE_INTRO) { this.titleT = 9; this.titleSfx = 99; return; }
    if (s === 'TITLE' && this.timer <= 0 && this.hit(this.BTN_ALBUM, p)) {
      Sfx.unlock(); Sfx.tap();
      this.state = 'ALBUM'; this.albumPage = 0; this.albumSel = -1; this.albumDel = false;
      return;
    }
    if (s === 'ALBUM') { this.albumRelease(p); return; }
    if (s === 'TITLE' && this.timer <= 0 && this.hit(this.BTN_SET, p)) { Sfx.unlock(); Sfx.tap(); this.state = 'SETTINGS'; return; }
    if (s === 'SETTINGS') { this.settingsRelease(p); return; }
    if (s === 'TITLE' && this.timer <= 0) {
      const mode = this.hit(this.BTN_RUN, p) ? 'run' : this.hit(this.BTN_CLASSIC, p) ? 'classic' : null;
      if (!mode) return;
      this.mode = mode;
      Sfx.unlock(); Sfx.tap();
      if (this.sensors === null) { this.state = 'PERMS'; this.timer = 0.3; this.permWait = false; }
      else this.startRun();
    } else if (s === 'GAMEOVER' && this.timer <= 0) {
      // share runs inside this tap: the share sheet only opens from a gesture
      if (this.hit(this.BTN_SHARE, p)) { Sfx.tap(); this.share(); return; }
      this.state = 'TITLE'; this.timer = 0.2;   // back to pick a mode
    }
  },

  // ── TITLE ──
  // The letters of SHIBA then MANIA drop in and bounce, the shiba dashes in,
  // skids and sits, and the buttons slide up. Tapping skips straight to the end.
  titleIntro(dt) {
    this.titleT = (this.titleT || 0) + dt;
    const t = this.titleT;
    // a tick as each letter lands, a bark as the shiba arrives
    const beats = [0.2, 0.27, 0.34, 0.41, 0.48, 0.55, 0.62, 0.69, 0.76, 0.83, 1.22];
    while (this.titleSfx < beats.length && t >= beats[this.titleSfx]) {
      if (this.titleSfx === beats.length - 1) Sfx.bark(); else Sfx.tick();
      this.titleSfx++;
    }
    // the runner: the world scrolls past, the shiba hops each bush and
    // snaps up the bone floating over it
    const R = this.runner || (this.runner = { scroll: 0, y: 0, vy: 0, legT: 0, got: -1, pops: [] });
    R.scroll += this.RUN_SPEED * dt; R.legT += dt;
    const next = this.runBush(this.runBushAfter(R.scroll + this.RUN_X - 12));
    if (R.y === 0 && next.x - R.scroll - this.RUN_X < 26 && t > 1.0) R.vy = 190;
    if (R.vy || R.y > 0) { R.vy -= 620 * dt; R.y = Math.max(0, R.y + R.vy * dt); if (R.y === 0) R.vy = 0; }
    for (let i = this.runBushAfter(R.scroll - 20); ; i++) {
      const b = this.runBush(i), bx = b.x - R.scroll; if (bx > W) break;
      if (i > R.got && Math.abs(bx - this.RUN_X) < 10 && R.y > 18) { R.got = i; R.pops.push({ x: bx, y: this.RUN_GROUND - 42, t: 0 }); }
    }
    for (const p of R.pops) { p.t += dt; p.x -= this.RUN_SPEED * dt; }
    R.pops = R.pops.filter(p => p.t < 0.6);
  },
  // bushes sit along the run at a steady, slightly uneven spacing
  runBush(i) { return { x: 200 + i * 130 + ((i * 47) % 60), i }; },
  runBushAfter(wx) { let i = Math.max(0, Math.floor((wx - 260) / 130)); while (this.runBush(i).x < wx) i++; return i; },
  drawTitle() {
    const t = this.titleT == null ? 9 : this.titleT;
    const bounce = (k) => { if (k <= 0) return 0; if (k >= 1) return 1; const n = 7.5625, d = 2.75;
      if (k < 1 / d) return n * k * k; if (k < 2 / d) return n * (k -= 1.5 / d) * k + 0.75;
      if (k < 2.5 / d) return n * (k -= 2.25 / d) * k + 0.9375; return n * (k -= 2.625 / d) * k + 0.984375; };
    const back = (k) => { k = Math.max(0, Math.min(1, k)); const c = 1.7; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
    Env.paint('sunny@180');
    g.rect(0, 0, W, TOP, SCENE.day0);   // the title is full-bleed: sky to the top edge, meadow to the bottom
    const Rn = this.runner || { scroll: 0, y: 0, legT: t, pops: [] }, sc = Rn.scroll, gy = this.RUN_GROUND;
    // the far hills drift by at half speed, the meadow at full speed
    g.rect(0, gy - 14, W, 14, SCENE.day1);
    for (let i = 0; i < W; i++) { const u = i + sc * 0.5, hh = 7 + Math.sin(u / 19) * 4 + Math.sin(u / 6) * 1.5; g.rect(i, gy - hh, 1, hh, SCENE.dayHill); }
    g.rect(0, gy, W, H - gy, SCENE.meadow); g.rect(0, gy, W, 2, SCENE.meadowHi);
    for (let i = 0; i < 18; i++) {
      const tx = ((i * 41 - sc) % (W + 20) + W + 20) % (W + 20) - 10, ty = gy + 8 + (i * 23) % (H - gy - 12);
      g.rect(tx, ty, 1, 3, SCENE.stem); g.rect(tx + 2, ty + 1, 1, 2, SCENE.stem);
      if (i % 4 === 0) g.rect(tx + 1, ty - 1, 2, 2, i % 8 ? PAL.ink : PAL.accent);
    }
    ctx.globalAlpha = 0.25; g.rect(0, 0, W, H, PAL.bg); ctx.globalAlpha = 1;
    // bushes to hop, each with a bone floating over it until the shiba grabs it
    for (let i = this.runBushAfter(sc - 20); ; i++) {
      const bx = this.runBush(i).x - sc; if (bx > W + 12) break;
      for (const [col, d] of [[SCENE.grassLo, 1], [SCENE.leafHi, 0]]) {   // dark rim, then the leaves
        ctx.fillStyle = col; for (const [ox, r] of [[-7, 6], [0, 9], [7, 6]]) { ctx.beginPath(); ctx.arc(bx + ox, gy + 1, r + d, Math.PI, 0); ctx.fill(); }
      }
      g.rect(bx - 4, gy - 6, 3, 2, SCENE.meadowHi); g.rect(bx + 5, gy - 3, 2, 2, SCENE.meadowHi);
      if (i > (this.runner ? this.runner.got : -1)) g.bone(bx, gy - 42 + Math.sin(this.time * 4 + i) * 1.5, 14);
    }
    for (const p of Rn.pops) {   // a grabbed bone pops up and fades, with a sparkle
      ctx.globalAlpha = 1 - p.t / 0.6; g.bone(p.x, p.y - p.t * 30, 12);
      const r = 6 + p.t * 18; g.rect(p.x - r, p.y, 3, 1, PAL.accent); g.rect(p.x + r - 3, p.y, 3, 1, PAL.accent); g.rect(p.x, p.y - r, 1, 3, PAL.accent);
      ctx.globalAlpha = 1;
    }
    // the logo, letter by letter, bobbing gently once it has landed
    const word = (w, y0, col, start) => {
      const size = 26, step = size * 0.62, x0 = CX - (w.length - 1) * step / 2;
      [...w].forEach((ch, i) => {
        const k = (t - start - i * 0.07) / 0.55; if (k <= 0) return;
        const y = -20 + (y0 + 20) * bounce(k), idle = t > this.TITLE_INTRO ? Math.sin(this.time * 3 + i * 0.6) * 1.5 : 0;
        g.outline(ch, x0 + i * step, y + idle, size, col);
      });
    };
    word('SHIBA', 70, PAL.ink, 0.0);
    word('MANIA', 98, PAL.accent, 0.35);
    if (t > 1.0) { ctx.globalAlpha = Math.min(1, (t - 1.0) * 3); g.outline(POOL.length + BOSSES.length + ' MICROGAMES', CX, 118, 8, PAL.ink); ctx.globalAlpha = 1; }
    // the shiba runs in from the left, then keeps running: hop, grab, land
    const rx = t < 1.2 ? -30 + (this.RUN_X + 30) * (1 - Math.pow(1 - Math.max(0, (t - 0.3) / 0.9), 3)) : this.RUN_X;
    const ry = gy - 14 - (Rn.y || 0);
    if (!Rn.y) {
      g.sprite('swiperight', rx, ry, { w: 60, h: 56, frame: Math.floor(Rn.legT * 14) % 9 });
      if (Math.floor(Rn.legT * 7) % 2) g.rect(rx - 18, gy - 3, 3, 2, PAL.mid);   // a puff of dust off the back foot
    } else g.sprite('runjump', rx, ry, { w: 60, h: 56, frame: Rn.vy > 60 ? 2 : Rn.vy < -60 ? 4 : 3 });
    // sparkles around the logo once it has settled
    if (t > 1.6) for (let i = 0; i < 5; i++) {
      if ((Math.floor(this.time * 4) + i) % 3) continue;
      const sx = 22 + (i * 37) % 136, sy = 48 + (i * 23) % 64;
      g.rect(sx - 2, sy, 5, 1, PAL.accent); g.rect(sx, sy - 2, 1, 5, PAL.accent);
    }
    // the buttons slide up into place, one after another
    const R = this.BTN_RUN, C = this.BTN_CLASSIC, A = this.BTN_ALBUM;
    const up = (i) => (1 - back((t - 1.3 - i * 0.08) / 0.45)) * 150;   // from below the bottom edge
    // the menu: white outlined words, all alike
    const opts = [[R, 'RUN'], [C, 'CLASSIC'], [A, 'ALBUM'], [this.BTN_SET, 'SETTINGS']];
    opts.forEach(([b, label], i) => g.outline(label, CX, b.y + up(i) + b.h / 2 + 5, 14, PAL.ink));
    const best = [];
    if (Run.best) best.push('RUN ' + Run.label(Run.best));
    if (this.best) best.push('CLASSIC ' + this.best);
    if (best.length && t > this.TITLE_INTRO) g.outline('BEST  ' + best.join('  ·  '), CX, H - 24, 8, PAL.ink);
  },

  // ── SHARE ──────────────────────────────────────────────────────────────────
  // A picture of the run: the photo strip, the result and where to play.
  // Built at full size, not from the 180x320 screen, so it holds up in a chat.
  shareCard() {
    const c = document.createElement('canvas'); c.width = 720; c.height = 960;
    const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
    const text = (str, tx, ty, size, col) => {
      x.fillStyle = col; x.font = 'bold ' + size + 'px ui-monospace, monospace';
      x.textAlign = 'center'; x.fillText(str, tx, ty);
    };
    const polaroid = (img, px, py, size, tilt) => {
      const a = img.width / img.height, w = a < 1 ? size * a : size, h = a < 1 ? size : size / a, b = size / 16;
      x.save(); x.translate(px, py); x.rotate(tilt);
      x.fillStyle = PAL.ink; x.fillRect(-w / 2 - b, -h / 2 - b, w + b * 2, h + b * 4);
      x.drawImage(img, -w / 2, -h / 2, w, h);
      x.restore();
    };
    x.fillStyle = PAL.bg; x.fillRect(0, 0, 720, 960);
    text('SHIBA', 360, 120, 96, PAL.ink);
    text('MANIA', 360, 212, 96, PAL.accent);
    const n = this.album.length;
    if (n === 0) {
      const a = Assets.get('shiba');
      if (a) x.drawImage(a.img, a.fw, 0, a.fw, a.fh, 210, 300, 300, 317);   // the cheering shiba
    } else if (n <= 2) {
      this.album.forEach((img, i) => polaroid(img, 360 + (i - (n - 1) / 2) * 330, 470, 300, i % 2 ? 0.05 : -0.05));
    } else {
      this.album.forEach((img, i) => polaroid(img, 205 + (i % 2) * 310, 375 + Math.floor(i / 2) * 240, 190, i % 2 ? 0.06 : -0.06));
    }
    const result = this.mode === 'run' ? 'REACHED ' + Run.label() : 'SCORE ' + this.score;
    text(result, 360, 860, 60, PAL.ink);
    text(location.host || 'SHIBA MANIA', 360, 920, 26, TEXT_MID);
    return c;
  },

  share(c, words) {
    c = c || this.shareCard();
    const url = c.toDataURL('image/png');
    words = words || (this.mode === 'run' ? 'I reached ' + Run.label() + ' in SHIBA MANIA RUN mode!' : 'I scored ' + this.score + ' in SHIBA MANIA!');
    try {
      // the phone's own share sheet, with the picture attached
      const bin = atob(url.split(',')[1]), buf = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
      const file = new File([buf], 'shibamania.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: 'SHIBA MANIA', text: words + ' ' + location.href }).catch(() => {});
        return;
      }
    } catch (e) {}
    // no share sheet (most desktops): save the picture instead
    const a = document.createElement('a'); a.href = url; a.download = 'shibamania.png';

  },

  drawShareButton() {

  // ── ALBUM SCREEN ───────────────────────────────────────────────────────────
  // A grid of polaroids, six to a page, newest first; tap one to see it big,
  // share it, or delete it (a second tap confirms).
  ALB_PER: 6,
  albumCell(k) {   // centre of grid slot k on a page: three across, two down
    return { x: CX + (k % 3 - 1) * 50, y: TOP + 74 + Math.floor(k / 3) * 92 };
  },
  albumRelease(p) {
    const n = Album.load().length, pages = Math.max(1, Math.ceil(n / this.ALB_PER));
    if (this.hit(this.ALB_BACK, p)) {
      Sfx.tap();
      if (this.albumSel >= 0) { this.albumSel = -1; this.albumDel = false; }
      else { this.state = 'TITLE'; this.timer = 0.2; }
      return;
    }
    if (this.albumSel >= 0) {
      const it = Album.newest(this.albumSel);
      if (!it) { this.albumSel = -1; return; }
      if (this.hit(this.ALB_SHARE, p)) {
        Sfx.tap();
        const im = Album.img(it);
        if (im) this.share(this.photoCard(im, it), 'My shiba moment in SHIBA MANIA: ' + it.cap);
      } else if (this.hit(this.ALB_DEL, p)) {
        if (!this.albumDel) { this.albumDel = true; Sfx.tap(); return; }
        Album.remove(Album.load().length - 1 - this.albumSel);
        Sfx.thud(); this.albumSel = -1; this.albumDel = false;
        this.albumPage = Math.min(this.albumPage, Math.max(0, Math.ceil(Album.load().length / this.ALB_PER) - 1));
      } else this.albumDel = false;
      return;
    }
    if (this.hit(this.ALB_PREV, p) && this.albumPage > 0) { this.albumPage--; Sfx.tap(); return; }
    if (this.hit(this.ALB_NEXT, p) && this.albumPage < pages - 1) { this.albumPage++; Sfx.tap(); return; }
    for (let k = 0; k < this.ALB_PER; k++) {
      const i = this.albumPage * this.ALB_PER + k; if (i >= n) break;
      const c = this.albumCell(k);
      if (Math.abs(p.x - c.x) < 28 && Math.abs(p.y - c.y) < 40) { this.albumSel = i; this.albumDel = false; Sfx.tap(); return; }
    }
  },
  drawAlbumScreen() {
    const items = Album.load(), n = items.length;
    const B = this.ALB_BACK;
    g.box(B.x, B.y, B.w, B.h, PAL.mid); g.text('BACK', B.x + B.w / 2, B.y + 11, 7, PAL.ink);
    if (this.albumSel >= 0) {
      const it = Album.newest(this.albumSel); if (!it) return;
      const im = Album.img(it);
      if (im) this.drawPolaroid(im, CX, CY - 36, 100, -0.03);
      g.text(it.cap, CX, CY + 52, 11, PAL.accent);
      const d = new Date(it.at);
      g.text((it.game || '') + '  ·  ' + d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }).toUpperCase(), CX, CY + 66, 7, PAL.mid);
      const S = this.ALB_SHARE, D = this.ALB_DEL;
      g.rect(S.x, S.y, S.w, S.h, PAL.accent); g.text('SHARE', CX, S.y + 14, 10, PAL.bg);
      g.box(D.x, D.y, D.w, D.h, this.albumDel ? PAL.bad : PAL.mid);
      g.text(this.albumDel ? 'SURE?' : 'DELETE', CX, D.y + 12, 7, this.albumDel ? PAL.bad : PAL.mid);
      return;
    }
    g.text('ALBUM', CX, TOP + 16, 12, PAL.accent);
    g.text(n + (n === 1 ? ' PHOTO' : ' PHOTOS'), W - 16, TOP + 14, 7, PAL.mid, 'right');
    if (!n) {
      g.sprite('face', CX, CY - 18, { w: 46, h: 46, frame: 5 });
      g.text('NO PHOTOS YET', CX, CY + 22, 10, PAL.ink);

    }
    const pages = Math.ceil(n / this.ALB_PER);
    for (let k = 0; k < this.ALB_PER; k++) {
      const i = this.albumPage * this.ALB_PER + k; if (i >= n) break;
      const it = Album.newest(i), im = Album.img(it), c = this.albumCell(k);
      if (im) this.drawPolaroid(im, c.x, c.y, 52, (i % 3 - 1) * 0.05);
      else g.rect(c.x - 20, c.y - 26, 40, 52, PAL.mid);

    if (pages > 1) {

      if (this.albumPage < pages - 1) { g.box(N.x, N.y, N.w, N.h, PAL.mid); g.text('>', N.x + N.w / 2, N.y + 14, 10, PAL.ink); }

  },
  // one photo as a shareable card: the polaroid big, its caption, the game
  photoCard(im, it) {

  // ── SETTINGS ───────────────────────────────────────────────────────────────
  // what each switch reads: ON / OFF, or why a sensor can't be used
  setState(k) {
    if (k === 'sound') return Sfx.muted ? 'OFF' : 'ON';
    if (k === 'music') return Prefs.music ? 'ON' : 'OFF';
    if (k === 'vibe') return Prefs.vibe ? 'ON' : 'OFF';
    if (k === 'cam' || k === 'mic') {
      if (Input[k + 'Ready']) return 'ON';
      if (Input[k + 'Pending']) return '…';
      if (Prefs.get(k + 'Off', false)) return 'OFF';
      return Input[k + 'Blocked'] ? 'BLOCKED' : Input[k + 'Missing'] ? 'NONE' : 'OFF';
    }
    if (Input.motionOff) return 'OFF';
    if (Input.motionReady || Input.tiltReady) return 'ON';
    return Input._motionOn ? 'NONE' : 'OFF';
  },
  settingsRelease(p) {
    if (this.hit(this.ALB_BACK, p)) { Sfx.tap(); this.state = 'TITLE'; this.timer = 0.2; return; }
    if (this.installEvt && this.hit(this.SET_INSTALL, p)) {   // inside the tap, so Chrome shows its install popup
      Sfx.tap(); const e = this.installEvt;
      e.prompt(); e.userChoice.then(() => { this.installEvt = null; }).catch(() => {});
      return;
    }
    const r = this.SET_ROWS.find(r => this.hit({ x: 0, y: r.y - 6, w: W, h: 24 }, p));
    if (!r) return;
    const on = this.setState(r.k) === 'ON' || this.setState(r.k) === '…';
    Sfx.unlock();
    if (r.k === 'sound') Sfx.toggleMute();
    else if (r.k === 'music') { Prefs.music = !Prefs.music; Prefs.set('music', Prefs.music); }
    else if (r.k === 'vibe') { Prefs.vibe = !Prefs.vibe; Prefs.set('vibe', Prefs.vibe); buzz(30); }
    else if (r.k === 'cam' || r.k === 'mic') {
      Prefs.set(r.k + 'Off', on);
      if (on) { r.k === 'cam' ? Input.stopCam() : Input.stopMic(); Input[r.k + 'Denied'] = true; }
      else {
        // asked from here, inside the tap, so the browser can show its popup;
        // a sensor refused at the browser level stays BLOCKED until it's allowed there
        Input[r.k + 'Denied'] = Input[r.k + 'Blocked'] = Input[r.k + 'Missing'] = false;
        r.k === 'cam' ? Input.enableCam() : Input.enableMic();
        if (this.sensors !== true) this.sensors = true;   // a choice is made: skip the sensors screen
      }
    } else if (r.k === 'motion') {
      Input.motionOff = on; Prefs.set('motionOff', on);
      if (on) { Input.motionReady = Input.tiltReady = Input.gyroReady = false; }
      else { Input.enableMotion(); Input.enableTilt(); }
    }
    Sfx.tap();
  },
  drawSettings() {
    const B = this.ALB_BACK;
    g.box(B.x, B.y, B.w, B.h, PAL.mid); g.text('BACK', B.x + B.w / 2, B.y + 11, 7, PAL.ink);
    g.text('SETTINGS', CX, TOP + 16, 12, PAL.accent);
    g.text('SENSORS', 18, TOP + 122, 7, TEXT_MID, 'left');
    g.rect(18, TOP + 126, W - 36, 1, PAL.mid);
    let blocked = false;
    for (const r of this.SET_ROWS) {
      const st = this.setState(r.k), S = this.setSwitch(r), on = st === 'ON';
      if (st === 'BLOCKED') blocked = true;
      g.text(r.label, 18, r.y + 10, 9, PAL.ink, 'left');
      if (on) { g.rect(S.x, S.y, S.w, S.h, PAL.accent); g.text('ON', S.x + S.w / 2, S.y + 14, 9, PAL.bg); }
      else {
        const c = st === 'BLOCKED' ? PAL.bad : PAL.mid;
        g.box(S.x, S.y, S.w, S.h, c); g.text(st, S.x + S.w / 2, S.y + 14, st.length > 3 ? 7 : 9, st === 'BLOCKED' ? PAL.bad : PAL.ink);
      }
    }
    g.text('OFF: THOSE GAMES ARE SKIPPED', CX, TOP + 216, 7, TEXT_MID);
    if (blocked) {
      g.text('BLOCKED: ALLOW IT IN YOUR', CX, TOP + 232, 7, PAL.bad);
      g.text("BROWSER'S SITE SETTINGS", CX, TOP + 242, 7, PAL.bad);
    }
    // put it on the home screen, to open like an app and play offline
    const I = this.SET_INSTALL;
    if (this.installed()) g.text('INSTALLED ON THIS PHONE', CX, I.y + 15, 8, PAL.ink);
    else if (this.installEvt) { g.rect(I.x, I.y, I.w, I.h, PAL.accent); g.text('ADD TO HOME SCREEN', CX, I.y + 15, 9, PAL.bg); }
    else if (/iphone|ipad|ipod/i.test(navigator.userAgent)) { g.text('ADD TO HOME SCREEN:', CX, I.y + 8, 8, PAL.ink); g.text('TAP SHARE, THEN ADD', CX, I.y + 19, 8, PAL.ink); }
    else g.text('INSTALL: BROWSER MENU', CX, I.y + 15, 8, PAL.ink);
  },

  // The sensors screen eats its presses (see press), so its buttons are
  // checked here on the raw release instead.
  permRelease(p) {
    if (this.state !== 'PERMS' || this.permWait || this.timer > 0) return;
    if (this.hit(this.PERM_ALLOW, p)) {
      Sfx.tap();
      this.permWait = true; this.timer = 0;
      Input.enableAV(); Input.enableMotion(); Input.enableTilt();
    } else if (this.hit(this.PERM_SKIP, p)) {
      // touch only: every game takes its touch fallback, and none asks again
      Sfx.tap();
      this.sensors = false;
      Input.camDenied = Input.micDenied = true;
      this.startRun();
    }
  },

  startRun() {
    if (this.sensors) { Input.enableAV(); Input.enableMotion(); Input.enableTilt(); }
    this.reset();
    this.album = []; this.snap = null;
    if (this.mode === 'run') Run.start();
    this.state = 'READY';
    this.timer = 3.2;          // 3 · 2 · 1 · GO, then the first prompt
    this.readyLast = 4;
  },

  // After a round's result (and its photo, if any): game over, a speed-up, or
  // straight on. Shared so a photo win can't skip the speed-up — SQUID is a
  // boss on a multiple of SPEEDUP_EVERY, so that used to happen every run.
  advance() { Wipe.run(() => this.advanceNow()); },
  advanceNow() {
    // test mode: replay the same game forever, never lose lives or advance
    if (this.testClass) { this.lives = 4; this.startRound(this.testClass, this.testDiff); return; }
    if (this.mode === 'run') { Run.after(); return; }
    if (this.lives <= 0) { this.state = 'GAMEOVER'; this.timer = 0.8; Sfx.gameover(); return; }
    if (this.round % this.SPEEDUP_EVERY === 0) {
      this.speed = Math.min(2.6, this.speed + 0.12);
      this.state = 'SPEEDUP'; this.timer = 0.9; Sfx.speedup();
    } else { this.startRound(); }
  },

  // ── DRAW ───────────────────────────────────────────────────────────────────
  draw() {
    FX.pre();
    this.drawScene();
    if (this.state !== 'TITLE' && !this.MENU_SCREENS.includes(this.state)) Mascot.draw(g);   // the title has its own shiba; menu screens have none
    Juice.drawConfetti();
    if (this.state === 'PLAYING') {
      this.drawFuse(Math.max(0, this.timer / this.duration));
      // DEBUG: what the camera is actually reading, for tuning thresholds on a
      // real phone — a real lens reads nothing like a webcam test pattern
      const hint = this.game.meta.hint;
      const dx = Input.camReady ? 34 + Math.round(32 * Input.camAspect()) : 26;   // clear of the bomb and live view
      if (DEBUG && ['move', 'still', 'cover'].includes(hint)) {
        const cam = Input.camReady ? 'cam' : Input.camDenied ? 'NOCAM' : '…';
        const tl = Input.tiltReady ? ' T' + Input.tiltX.toFixed(2) + '/' + Input.tiltY.toFixed(2) : ' notilt';
        g.text(cam + ' m' + Input.motion.toFixed(2) + ' x' + Input.motionX.toFixed(2) +
               ' y' + Input.motionY.toFixed(2) + ' b' + Input.bright.toFixed(2) + tl,
               dx, H - 8, 6, PAL.mid, 'left');
      } else if (DEBUG && (hint === 'shake' || hint === 'blow')) {
        g.text('shake' + Input.shake.toFixed(2) + (Input.gyroReady ? ' gyro' : ' NOGYRO') +
               ' blow' + Input.blow.toFixed(2) + (Input.micReady ? (Input.blowOk ? ' PUFF' : ' mic') : ' NOMIC'),
               dx, H - 8, 6, PAL.mid, 'left');
      }
    }
    FX.post();
    this.drawCamView();
    Wipe.draw();
  },

  // In a camera game the shelf shows what the camera sees, mirrored like a
  // mirror, with a blinking REC dot — so the player knows it is watching and
  // can see themselves move, instead of guessing whether it is working.
  // The round clock as a lit fuse burning toward a bomb in the bottom-left
  // corner. The last quarter the bomb flashes red and the spark spits harder.
  drawFuse(pct) {
    // the bomb sits wholly inside the shelf; a plain cord runs out from under it
    // along the bottom and burns back toward it, a small spark at the tip
    const bx = 12, by = H - 13, cy = H - 4, x0 = bx + 5, end = x0 + (W - x0 - 6) * pct, late = pct < 0.25;
    const t = this.time, hot = late && Math.floor(t * 8) % 2;
    g.rect(x0, cy, end - x0, 2, TEXT_MID); g.rect(x0, by + 5, 2, cy - by - 5, TEXT_MID);   // drawn first, so the bomb covers where it goes in
    for (let x = x0 + 6; x < end - 2; x += 4) g.rect(x, cy, 1, 1, PAL.ink);   // a twist every few pixels
    g.circle(bx, by, 9, PAL.ink); g.circle(bx, by, 8, hot ? PAL.bad : PAL.mid);
    g.circle(bx - 3, by - 3, 2, TEXT_MID);
    // the spark: a flickering star, with a few bits jumping up off it
    const f = Math.floor(t * 20) % 2, r = late ? 3 : 2;
    g.rect(end - r, cy, r * 2 + 1, 2, PAL.accent); g.rect(end - 1, cy - r + 1, 2, r * 2, PAL.accent);
    g.rect(end, cy, 1, 1, f ? PAL.ink : PAL.bad);
    for (let i = 0; i < (late ? 5 : 3); i++) {
      const k = ((t * 3 + i * 0.37) % 1), a = i * 2.1 + t;
      g.rect(end + Math.cos(a) * 5 * k, cy - 7 * k, 1, 1, i % 2 ? PAL.accent : PAL.bad);
    }
  },

  drawCamView() {
    if (this.state !== 'PROMPT' && this.state !== 'PLAYING') return;
    const gm = this.game; if (!gm || !Input.camReady) return;
    const on = 'usesCam' in gm ? gm.usesCam : (gm.meta.cam || gm.meta.photo);
    if (!on) return;
    const a = Input.camAspect(), h = 32, w = Math.round(h * a), x = 28, y = BOT + 3;   // right of the bomb
    g.rect(x - 1, y - 1, w + 2, h + 2, PAL.ink);
    if (!Input.drawLive(ctx, x, y, w, h)) g.rect(x, y, w, h, PAL.mid);
    if (Math.floor(this.time * 2) % 2) g.circle(x + 4, y + 4, 2, PAL.bad);
    if (this.shotFlash > 0) {                       // shutter: a shot was just caught
      this.shotFlash -= STEP;
      ctx.globalAlpha = Math.min(1, this.shotFlash * 8); g.rect(x, y, w, h, PAL.ink); ctx.globalAlpha = 1;
    }
  },

  drawScene() {
    g.clear();
    const s = this.state;
    if (this.MENU_SCREENS.includes(s)) { this.menuBg(); this.menuPanel(); }

    if (s === 'TITLE') { this.drawTitle(); return; }

    if (s === 'ALBUM') { this.drawAlbumScreen(); return; }
    if (s === 'SETTINGS') { this.drawSettings(); return; }

    if (s === 'PERMS') {
      g.text('CAMERA + MIC', CX, CY - 62, 12, PAL.accent);
      g.text('SOME GAMES SEE YOU MOVE', CX, CY - 40, 7, PAL.ink);
      g.text('OR HEAR YOU BLOW', CX, CY - 30, 7, PAL.ink);
      g.text('PHOTOS STAY ON THIS PHONE', CX, CY - 12, 7, PAL.mid);
      if (this.permWait) { g.text('TAP ALLOW IN THE POPUP', CX, CY + 38, 8, PAL.ink); return; }
      const A = this.PERM_ALLOW, S = this.PERM_SKIP;
      g.rect(A.x, A.y, A.w, A.h, PAL.accent);
      g.text('ALLOW', CX, A.y + 16, 10, PAL.bg);
      g.box(S.x, S.y, S.w, S.h, PAL.mid);
      g.text('TOUCH ONLY', CX, S.y + 16, 9, PAL.ink);
      return;
    }

    if (s === 'GAMEOVER' && this.mode === 'run') { Run.drawOver(); return; }
    if (s === 'STAGE') { this.drawHud(); Run.drawStage(); return; }
    if (s === 'CLEAR') { this.drawHud(); Run.drawClear(); return; }
    if (s === 'SHOP')  { this.drawHud(); Run.drawShop(); return; }

    if (s === 'GAMEOVER') {
      this.drawAlbum(TOP + 44);
      g.text('GAME', CX, CY - 24, 24, PAL.bad);
      g.text('OVER', CX, CY + 2, 24, PAL.bad);
      g.text('SCORE ' + this.score, CX, CY + 36, 10, PAL.ink);
      g.text('BEST ' + this.best, CX, CY + 52, 8, PAL.mid);
      this.drawShareButton();
      return;
    }

    if (s === 'READY') {
      const n = Math.ceil(this.timer - 0.2);
      this.drawHud();
      if (n > 0) {
        // each number pops in large and shrinks as its second elapses
        const frac = (this.timer - 0.2) - (n - 1);   // 1 -> 0 across the second
        const size = 40 + (1 - frac) * 26;
        ctx.globalAlpha = Math.min(1, frac * 2.5);
        g.text(String(n), CX, CY + size * 0.35, size, PAL.ink);
        ctx.globalAlpha = 1;
        g.text('GET READY', CX, TOP + 40, 11, PAL.mid);
      } else {
        const p = Math.min(1, (-this.timer + 0.2) * 6);
        g.rect(0, CY - 30, W, 60, PAL.accent);
        g.text('GO!', CX, CY + 12, 34 + p * 6, PAL.bg);
      }
      return;
    }

    if (s === 'PROMPT') {
      const m = this.game.meta;
      // a dimmed look at where the next game happens, behind its instructions
      if (m.env) { Env.paint(m.env); ctx.globalAlpha = 0.62; g.rect(0, 0, W, H, PAL.bg); ctx.globalAlpha = 1; }
      if (this.isBoss) {
        g.rect(0, 0, W, H, PAL.bad);
        g.text('BOSS', CX, CY - 46, 20, PAL.ink);
      }
      g.rect(0, CY - 34, W, 44, this.isBoss ? PAL.ink : PAL.accent);
      g.text(m.prompt, CX, CY - 4, m.prompt.length > 9 ? 13 : m.prompt.length > 6 ? 18 : 22, PAL.bg);
      g.hint(m.hint, CX, CY + 40);
      if (this.mode === 'run') {
        const b = Run.boosts(m), y = this.isBoss ? CY - 66 : CY - 46;
        g.text(Run.group(m) + ' GAME' + (b.length ? '  ·  ' + b.map(t => t.name).join(' + ') + '!' : ''), CX, y, 8, b.length ? PAL.accent : PAL.ink);
      }
      this.howTo(m).split('\n').forEach((line, i) => g.text(line, CX, CY + 72 + i * 13, 9, PAL.ink));
      this.drawHud();
      return;
    }

    if (s === 'PLAYING') {
      g.env = this.game.meta.env || null;
      this.game.draw(g);
      g.env = null;
      this.drawHud();
      return;
    }

    // the first split second of a win: the game frozen, flashed — for every
    // game in both modes — before the verdict comes in
    if (s === 'RESULT' && Juice.hitting) {
      g.env = this.game.meta.env || null; this.game.draw(g); g.env = null;
      Juice.drawFlash(); this.drawHud(); return;
    }
    if (s === 'RESULT' && this.mode === 'run') { this.drawHud(); Run.drawTally(); return; }

    if (s === 'RESULT') {
      const win = this.result === 'WIN';
      // the game's last frame stays behind the verdict, dimmed — so the wipe
      // closes on the place you just played, not on a blank screen
      g.env = this.game.meta.env || null; this.game.draw(g); g.env = null;
      ctx.globalAlpha = win ? 0.6 : 0.7; g.rect(0, 0, W, H, win ? PAL.bg : PAL.bad); ctx.globalAlpha = 1;
      Juice.stamp(CX, CY - 12, 24);
      Juice.badge(CX, CY + 18);
      // photo games get the big polaroid next; the rest show their candid here
      if (win && this.snap && !this.game.meta.photo) this.drawPolaroid(this.snap, CX, CY + 62, 64, -0.06);
      this.drawHud();
      return;
    }

    if (s === 'SPEEDUP') {
      g.text('SPEED', CX, CY - 12, 22, PAL.accent);
      g.text('UP!', CX, CY + 14, 22, PAL.accent);
      g.text('x' + this.speed.toFixed(2), CX, CY + 44, 9, PAL.mid);
      this.drawHud();
    }

    if (s === 'PHOTO') {
      g.clear();
      const photo = Engine.lastPhoto;
      // the polaroid takes the camera's shape: portrait on a phone
      const asp = photo ? photo.width / photo.height : Input.camAspect();
      const pw = asp < 1 ? Math.round(120 * asp) : 120, ph = asp < 1 ? 120 : Math.round(120 / asp);
      const px = CX - pw / 2, py = CY - ph / 2 - 6;
      g.rect(px - 6, py - 6, pw + 12, ph + 30, PAL.ink);
      if (photo) {
        // draw pixelated + tinted to the game's palette for a retro look
        ctx.save();
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(photo, px, py, pw, ph);   // shown at once: a fade-in left a blank card for a second
        ctx.restore();
        ctx.globalAlpha = 1 - Math.min(1, this.photoReveal || 0); g.rect(px, py, pw, ph, PAL.ink); ctx.globalAlpha = 1;
        // scanlines, kept faint — at this scale a line every third row banded
        // the whole picture, and any tint on top just tinted the person
        ctx.globalAlpha = 0.08;
        for (let y = py; y < py + ph; y += 4) g.rect(px, y, pw, 1, PAL.bg);
        ctx.globalAlpha = 1;
      } else {
        g.text('NO PHOTO', CX, CY, 10, PAL.mid);
      }
      g.text(this.photoCap || 'NICE MOVES!', CX, py + ph + 14, 9, PAL.bg);
      if (Math.floor(this.time * 2) % 2) g.text('TAP', CX, BOT - 6, 8, PAL.mid);
      this.drawHud();
    }
  },

  // a small tilted polaroid of a camera still, centred on x, y
  drawPolaroid(img, x, y, size, tilt = 0) {
    const a = img.width / img.height;
    const w = a < 1 ? size * a : size, h = a < 1 ? size : size / a;
    const b = Math.max(2, Math.round(size / 18));
    ctx.save(); ctx.translate(x, y); ctx.rotate(tilt);
    g.rect(-w / 2 - b, -h / 2 - b, w + b * 2, h + b * 4, PAL.ink);
    ctx.drawImage(img, -w / 2, -h / 2, w, h);
    ctx.restore();
  },

  // the run's last few candids, laid out like photos on a table
  drawAlbum(y) {
    const n = this.album.length; if (!n) return;
    this.album.forEach((img, i) => this.drawPolaroid(img, CX + (i - (n - 1) / 2) * 42, y, 36, i % 2 ? 0.07 : -0.07));
  },

  drawHud() {
    if (this.mode === 'run') { Run.drawHud(); return; }
    // lives as little shiba faces; spent lives shown as a faded marker
    for (let i = 0; i < 4; i++) {
      if (i < this.lives) g.sprite('face', 11 + i * 13, 9, { w: 13, h: 13, frame: 0 });
      else { g.rect(6 + i * 13, 5, 9, 9, PAL.mid); }
    }
    g.text(String(this.score), W - 6, 13, 9, PAL.ink, 'right');
    g.rect(0, TOP - 1, W, 1, PAL.mid);
  }
};

// ── LOOP ─────────────────────────────────────────────────────────────────────
let acc = 0, last = 0, running = true;
function frame(t) {
  if (!last) last = t;
  let dt = (t - last) / 1000; last = t;
  if (dt > 0.25) dt = STEP;          // returning from background: don't fast-forward
  if (running) {
    acc += dt;
    let guard = 0;
    while (acc >= STEP && guard++ < 5) {
      Input.beginStep();
      Engine.update(STEP);
      FX.update(STEP);
      acc -= STEP;
    }
    Music.update(Engine.musicTrack());
    Engine.draw();
  }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => {
  running = !document.hidden;
  last = 0; acc = 0;
  if (running) Input.wake();          // the camera and audio paused while we were away
  if (running && Engine.state === 'PLAYING') { Engine.state = 'PROMPT'; Engine.timer = 0.6; }
});

// Already granted on an earlier visit: no need for the sensors screen, the
// popup won't show again anyway. Browsers that can't say ask as usual.
try {
  Promise.all(['camera', 'microphone'].map(name => navigator.permissions.query({ name })))
    .then(rs => { if (rs.every(r => r.state === 'granted') && Engine.sensors === null) Engine.sensors = true; })
    .catch(() => {});
} catch (e) {}

Assets.load().then(() => requestAnimationFrame(frame));

// Install to the home screen and play offline (see sw.js and manifest.webmanifest).
// Chrome offers the install through beforeinstallprompt, kept for the SETTINGS
// button; iPhones only have Share > Add to Home Screen, which SETTINGS explains.
if ('serviceWorker' in navigator && (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname))) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); Engine.installEvt = e; });
window.addEventListener('appinstalled', () => { Engine.installEvt = null; });

// ── TEST MENU ────────────────────────────────────────────────────────────────
const devEl = document.getElementById('dev');
if (!DEBUG) { devEl.style.display = 'none'; }
else {
  const list = document.getElementById('devList');
  document.getElementById('devToggle').onclick = () => {
    list.style.display = list.style.display === 'block' ? 'none' : 'block';
  };
  let testDiff = 1;      // difficulty the menu launches at
  let loop = true;       // test mode: replay the picked game

  const mk = (tag, txt, cls) => { const e = document.createElement(tag); if (txt) e.textContent = txt; if (cls) e.className = cls; return e; };

  function rebuild() {
    list.innerHTML = '';

    // controls row: difficulty 1/2/3
    const drow = mk('div', null, 'devrow');
    drow.appendChild(mk('span', 'DIFF', 'devlab'));
    [1, 2, 3].forEach(d => {
      const btn = mk('button', String(d), d === testDiff ? 'devsel' : '');
      btn.onclick = () => { testDiff = d; rebuild(); };
      drow.appendChild(btn);
    });
    list.appendChild(drow);

    // loop toggle
    const lrow = mk('div', null, 'devrow');
    lrow.appendChild(mk('span', 'LOOP', 'devlab'));
    const lbtn = mk('button', loop ? 'ON' : 'OFF', loop ? 'devsel' : '');
    lbtn.onclick = () => { loop = !loop; rebuild(); };
    lrow.appendChild(lbtn);
    list.appendChild(lrow);

    list.appendChild(mk('div', 'MICROGAMES', 'devhead'));
    const launch = (C) => {
      Input.enableMotion(); Input.enableTilt(); Input.enableMic(); Sfx.unlock();
      if (Engine.sensors === null) Engine.sensors = true;
      Engine.reset();
      Engine.mode = 'classic';
      Engine.testClass = loop ? C : null;
      Engine.testDiff = testDiff;
      Engine.lives = 4;
      Engine.startRound(C, testDiff);
      list.style.display = 'none';
    };
    POOL.forEach(C => {
      const b = mk('button', C.meta.id + '  ·  ' + C.meta.prompt);
      b.onclick = () => launch(C);
      list.appendChild(b);
    });

    list.appendChild(mk('div', 'BOSSES', 'devhead'));
    BOSSES.forEach(C => {
      const b = mk('button', C.meta.id + '  ·  ' + C.meta.prompt);
      b.onclick = () => launch(C);
      list.appendChild(b);
    });

    list.appendChild(mk('div', 'RUN', 'devhead'));
    const normal = mk('button', '▶ play full run (no test loop)');
    normal.onclick = () => { Engine.testClass = null; Engine.reset(); Engine.state = 'TITLE'; Engine.timer = 0; list.style.display = 'none'; };
    list.appendChild(normal);
  }
  rebuild();
}
</script>
