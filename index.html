<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#101010">
<title>MICROMANIA</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #000; color: #f0f0f0;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    touch-action: none;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
    background: #101010;
  }
  /* dev panel — flip DEBUG to false to hide entirely */
  #dev {
    position: fixed; top: env(safe-area-inset-top, 0px); right: 0;
    z-index: 10; font-size: 10px; text-align: right;
  }
  #devToggle {
    background: #101010; color: #6b6b6b; border: 1px solid #333;
    padding: 6px 8px; font: inherit; font-size: 10px;
  }
  #devList { display: none; background: #101010f2; border: 1px solid #333; padding: 4px; max-height: 78vh; overflow: auto; min-width: 148px; }
  #devList .devrow { display: flex; align-items: center; gap: 3px; margin: 2px 0; }
  #devList .devlab { color: #6b6b6b; font-size: 9px; width: 30px; }
  #devList .devhead { color: #ffd23f; font-size: 8px; margin: 6px 2px 2px; letter-spacing: 1px; }
  #devList .devrow button { flex: 1; }
  #devList .devsel { background: #ffd23f !important; color: #101010 !important; border-color: #ffd23f !important; }
  #devList button {
    display: block; width: 100%; text-align: left; margin: 2px 0;
    background: none; color: #f0f0f0; border: 1px solid #333; padding: 5px 8px;
    font: inherit; font-size: 10px;
  }
</style>
</head>
<body>
<div id="stage"><canvas id="game" width="180" height="320"></canvas></div>
<div id="dev"><button id="devToggle">DEV</button><div id="devList"></div></div>

<script>
/* =============================================================================
   MICROMANIA — a mobile microgame engine (WarioWare-style)
   Single file, no dependencies. Rename freely.

   ── HOW TO ADD A MICROGAME ──────────────────────────────────────────────────
   1. Copy any class in the MICROGAMES section.
   2. Give it a `static meta` block:
        id            unique string
        prompt        the shouty instruction ("TAP!")
        hint          control pictogram: tap|drag|swipe|rub|shake|mash|hold|wait
                      |blow|move|still|cover|trace|count|flick
        duration      seconds at speed 1.0 (engine divides by current speed)
        minDuration   floor on the round length, for games speed can't shrink
        winOnTimeout  true = survive-the-clock game (default false)
        photo         true = a win shows the camera still in Engine.lastPhoto
        photoCap      caption printed under that photo (default 'NICE MOVES!')
   3. Add the class to POOL (normal games) or BOSSES (boss stages).
   That's it — prompts, timer, difficulty, HUD and scoring are handled for you.

   ── HOW TO DROP IN PIXELLAB ART ─────────────────────────────────────────────
   Fill in Assets.manifest with sprite sheets (horizontal strips):
        bug: { src: 'art/bug.png', fw: 16, fh: 16, frames: 2, fps: 8 }
   Then call g.sprite('bug', x, y). Until the file exists, sprite() draws a
   labelled placeholder box, so every game stays playable with zero art.

   ── DESIGN CONSTRAINTS ──────────────────────────────────────────────────────
   Virtual resolution 180x320 (9:16), integer-scaled to the screen.
   Five colours only (PAL). Keep new art inside that palette.
============================================================================= */

const DEBUG = true;

// ── CONFIG ───────────────────────────────────────────────────────────────────
const W = 180, H = 320;        // virtual pixels
const TOP = 18;                // HUD band: lives + score
const SHELF = 38;              // mascot shelf — NOT play space, no input, no gameplay
const BOT = H - 6 - SHELF;     // bottom of the play field (276)
const CX = W / 2, CY = (TOP + BOT) / 2;
/* Vertical layout:  0-18 HUD | 18-276 PLAY FIELD | 276-314 SHELF | 314-320 TIMER
   Microgames own TOP..BOT and nothing else. The shelf is drawn by the engine,
   so a game can never be obscured by the mascot and never needs to avoid it. */
const STEP = 1 / 60;           // fixed timestep

const PAL = {
  bg:     '#101010',
  ink:    '#f0f0f0',
  mid:    '#6b6b6b',
  accent: '#ffd23f',
  bad:    '#ff4b3e'
};

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// ── SCALING ──────────────────────────────────────────────────────────────────
function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const scale = Math.max(1, Math.min(vw / W, vh / H));
  canvas.style.width  = Math.floor(W * scale) + 'px';
  canvas.style.height = Math.floor(H * scale) + 'px';
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
resize();

// ── ASSETS (PixelLab hook) ───────────────────────────────────────────────────
const Assets = {
  // Add entries here as art lands. Sheets are horizontal frame strips.
  manifest: {
    shiba:  { src: ART.shiba,          fw: 35, fh: 37, frames: 17, fps: 14 },
    catcher:{ src: ART.catcher,        fw: 40, fh: 56, frames: 5,  fps: 8  },
    // bug:    { src: 'art/bug.png',    fw: 16, fh: 16, frames: 2, fps: 8 },
    // coin:   { src: 'art/coin.png',   fw: 8,  fh: 8,  frames: 4, fps: 10 },
    hero:   { src: ART.hero,           fw: 18, fh: 24, frames: 5,  fps: 8  },
    runner: { src: ART.runner,         fw: 34, fh: 32, frames: 9,  fps: 14 },
    face:   { src: ART.face,           fw: 31, fh: 32, frames: 9,  fps: 6  },
    plane:  { src: ART.plane,          fw: 35, fh: 31, frames: 9,  fps: 16 },
    pump:   { src: ART.pump,           fw: 18, fh: 39, frames: 9,  fps: 12 },
    dryshake:{ src: ART.dryshake,      fw: 38, fh: 31, frames: 9,  fps: 10 },
    pumpdog:{ src: ART.pumpdog,        fw: 52, fh: 52, frames: 9,  fps: 12 },
    hopdog: { src: ART.hopdog,         fw: 28, fh: 28, frames: 9,  fps: 12 },
    ordersign:{ src: ART.ordersign,    fw: 34, fh: 65, frames: 3,  fps: 1  },
    whack:  { src: ART.whack,          fw: 48, fh: 48, frames: 9,  fps: 12 },
    flydog: { src: ART.flydog,        fw: 80, fh: 63, frames: 9,  fps: 14 },
  },
  cache: {},
  load() {
    const jobs = Object.entries(this.manifest).map(([name, def]) => new Promise(res => {
      const img = new Image();
      img.onload  = () => { this.cache[name] = Object.assign({ img, frames: 1, fps: 8 }, def); res(); };
      img.onerror = () => { console.warn('[assets] missing:', def.src); res(); };
      img.src = def.src;
    }));
    return Promise.all(jobs);
  },
  get(name) { return this.cache[name] || null; }
};

// ── AUDIO (tiny blips; replace with samples later) ───────────────────────────
const Sfx = {
  ac: null, muted: false,
  unlock() {
    if (this.ac) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) this.ac = new AC();
  },
  blip(freq, dur = 0.07, type = 'square', vol = 0.05) {
    if (!this.ac || this.muted) return;
    const o = this.ac.createOscillator(), gn = this.ac.createGain();
    o.type = type; o.frequency.value = freq;
    gn.gain.value = vol;
    gn.gain.exponentialRampToValueAtTime(0.0001, this.ac.currentTime + dur);
    o.connect(gn).connect(this.ac.destination);
    o.start(); o.stop(this.ac.currentTime + dur);
  },
  tap()  { this.blip(660, 0.05); },
  win()  { this.blip(880, 0.08); setTimeout(() => this.blip(1320, 0.10), 70); },
  fail() { this.blip(180, 0.20, 'sawtooth'); },
  tick() { this.blip(1200, 0.02, 'square', 0.03); }
};

// ── INPUT ────────────────────────────────────────────────────────────────────
/* One abstraction for touch + mouse. Games read only what they need:
     x, y            pointer position in virtual pixels
     down            currently pressed
     justDown/justUp edge flags (one step)
     dx, dy          movement this step
     moveDist        hypot(dx, dy) — use for rub/scrub games
     holdTime        seconds held
     taps[]          taps completed this step: {x, y}
     swipe           {dir, dist, vx, vy} on release, one step
     shake           0..1 energy (accelerometer, or fast wiggling)
*/
const Input = {
  x: CX, y: CY, down: false, justDown: false, justUp: false,
  dx: 0, dy: 0, moveDist: 0, holdTime: 0,
  taps: [], swipe: null, shake: 0, blow: 0,
  _rawDx: 0, _rawDy: 0, _sx: 0, _sy: 0, _st: 0, _travel: 0,
  _pendingTaps: [], _pendingSwipe: null, _shakeRaw: 0, _lastAcc: null,
  _mic: null, _micData: null, _blowRaw: 0, micReady: false, micDenied: false, micPending: false,
  // gyroscope: peak rotation rate seen since the last step, in deg/s summed
  // across the three axes. Shaking a phone spins it as much as it slings it,
  // and the gyro reads that far more cleanly than the accelerometer does.
  _gyroPeak: 0, gyroReady: false,
  // camera: optical-flow motion + photo capture. motion is a 0..1 "how much are
  // you moving" value; camReady/camDenied/camPending mirror the mic pattern.
  _cam: null, _camVideo: null, _camCanvas: null, _camCtx: null, _prevFrame: null,
  motion: 0, motionL: 0, motionR: 0, camReady: false, camDenied: false, camPending: false, camW: 48, camH: 36,
  // where the movement is, in player space (mirrored to match a selfie view):
  // motionX 0 = your left edge, 1 = your right; motionY 0 = top, 1 = bottom.
  // Only updated while something is actually moving, so it holds its last real
  // position instead of drifting on sensor noise.
  motionX: 0.5, motionY: 0.5,
  // average frame brightness 0..1 — falls to near zero with a hand over the lens
  bright: 1,
  // device tilt for aim games, -1..1 on each axis, relative to however the
  // phone was being held when the game started (see zeroTilt)
  tiltX: 0, tiltY: 0, tiltReady: false,
  _tiltOn: false, _tiltG: 0, _tiltB: 0, _tiltZero: null, _wantZero: false,

  attach(el) {
    const toVirtual = e => {
      const r = el.getBoundingClientRect();
      return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
    };
    el.addEventListener('pointerdown', e => {
      el.setPointerCapture?.(e.pointerId);
      const p = toVirtual(e);
      this.x = p.x; this.y = p.y;
      this.down = true;
      // A press that starts on the mascot shelf raises no tap/justDown, so the
      // shiba can never trigger or fail a microgame. Dragging and swiping from
      // there still works (people swipe up from the bottom of the screen).
      this._shelfPress = p.y > BOT;
      this._justDownRaw = !this._shelfPress;
      this._sx = p.x; this._sy = p.y; this._st = performance.now(); this._travel = 0;
      Sfx.unlock();
      e.preventDefault();
    }, { passive: false });
    el.addEventListener('pointermove', e => {
      const p = toVirtual(e);
      this._rawDx += p.x - this.x; this._rawDy += p.y - this.y;
      this._travel += Math.hypot(p.x - this.x, p.y - this.y);
      this.x = p.x; this.y = p.y;
      e.preventDefault();
    }, { passive: false });
    const end = e => {
      if (!this.down) return;
      const p = toVirtual(e);
      this.x = p.x; this.y = p.y;
      this.down = false; this._justUpRaw = true;
      const dt = performance.now() - this._st;
      const dx = p.x - this._sx, dy = p.y - this._sy;
      const dist = Math.hypot(dx, dy);
      if (dist < 8 && dt < 300) {
        if (!this._shelfPress) this._pendingTaps.push({ x: p.x, y: p.y });
      } else if (dist > 16 && dt < 500) {
        const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
        // start/end points included so games can test what the swipe crossed
        this._pendingSwipe = { dir, dist, vx: dx / (dt / 1000), vy: dy / (dt / 1000), x0: this._sx, y0: this._sy, x1: p.x, y1: p.y };
      }
      e.preventDefault();
    };
    el.addEventListener('pointerup', end, { passive: false });
    el.addEventListener('pointercancel', end, { passive: false });
    el.addEventListener('contextmenu', e => e.preventDefault());

    // desktop testing: space / arrows map to tap + swipe
    window.addEventListener('keydown', e => {
      if (e.repeat) return;
      if (e.code === 'Space') this._pendingTaps.push({ x: this.x, y: this.y });
      const map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
      if (map[e.code]) this._pendingSwipe = { dir: map[e.code], dist: 40, vx: 0, vy: 0 };
    });
  },

  // Microphone for "blow" games. Best-effort: if the mic is denied or absent,
  // micReady stays false and blow games fall back to fast tapping in beginStep.
  // Camera for motion-control + photo games. Best-effort like the mic: if denied
  // or absent, camReady stays false and the game falls back to tapping.
  enableCam() {
    if (this._cam || this.camDenied || this.camPending) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { this.camDenied = true; return; }
    this.camPending = true;
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 320, height: 240 }, audio: false }).then(stream => {
      const v = document.createElement('video');
      v.autoplay = true; v.playsInline = true; v.muted = true;
      v.srcObject = stream;
      v.play().catch(() => {});
      const cc = document.createElement('canvas');
      cc.width = this.camW; cc.height = this.camH;
      this._cam = stream; this._camVideo = v;
      this._camCanvas = cc; this._camCtx = cc.getContext('2d', { willReadFrequently: true });
      this.camReady = true; this.camPending = false;
    }).catch(() => { this.camDenied = true; this.camPending = false; });
  },

  // Sample the camera each step: downscale, diff against the last frame. One
  // pass produces everything the camera games read — how much you moved
  // (motion), which half you moved in (motionL/R), where the movement was
  // (motionX/Y) and how bright the frame is (bright).
  _sampleMotion() {
    if (!this.camReady || !this._camVideo || this._camVideo.readyState < 2) return;
    const cx = this._camCtx, w = this.camW, h = this.camH;
    cx.drawImage(this._camVideo, 0, 0, w, h);
    const cur = cx.getImageData(0, 0, w, h).data;
    if (this._prevFrame) {
      let diff = 0, left = 0, right = 0, sx = 0, sy = 0, lum = 0;
      // sum luminance change; also split by screen half. The camera is mirrored
      // when shown, so the RAW left half is the player's right — we flip below.
      for (let i = 0; i < cur.length; i += 16) {
        const d = Math.abs(cur[i] - this._prevFrame[i]) + Math.abs(cur[i + 1] - this._prevFrame[i + 1]) + Math.abs(cur[i + 2] - this._prevFrame[i + 2]);
        diff += d;
        const p = i / 4, px = p % w, py = (p / w) | 0;
        if (px < w / 2) right += d; else left += d;   // flipped for the mirror view
        sx += d * px; sy += d * py;                   // diff-weighted centre of motion
        lum += cur[i] + cur[i + 1] + cur[i + 2];
      }
      const n = cur.length / 16;
      const norm = diff / n / 60;
      this.motion = Math.min(1, this.motion * 0.6 + norm * 0.8);
      const half = n / 2;
      this.motionL = Math.min(1, this.motionL * 0.5 + (left / half / 60) * 0.9);
      this.motionR = Math.min(1, this.motionR * 0.5 + (right / half / 60) * 0.9);
      // below this floor the "movement" is just sensor grain and the centre
      // would jump around the frame, so the last real position is kept.
      if (diff > n * 8) {
        const mx = 1 - (sx / diff) / w;               // flipped, like the halves
        const my = (sy / diff) / h;
        this.motionX += (mx - this.motionX) * 0.35;
        this.motionY += (my - this.motionY) * 0.35;
      }
      this.bright += (lum / n / 3 / 255 - this.bright) * 0.35;
    }
    this._prevFrame = cur.slice(0);
  },

  // Grab a still from the camera for the photo payoff, in the colours the
  // camera saw. It is cover-cropped rather than scaled to fit: squeezing a
  // phone's portrait selfie frame into the 4:3 polaroid came out wide.
  snapPhoto(fw = 120, fh = 90) {
    if (!this.camReady || !this._camVideo) return null;
    const v = this._camVideo;
    const sw = v.videoWidth || fw, sh = v.videoHeight || fh;
    // largest centred crop that already has the polaroid's shape
    const k = Math.max(fw / sw, fh / sh);
    const cw = fw / k, ch = fh / k;
    const c = document.createElement('canvas'); c.width = fw; c.height = fh;
    const cx = c.getContext('2d');
    cx.save(); cx.scale(-1, 1);
    cx.drawImage(v, (sw - cw) / 2, (sh - ch) / 2, cw, ch, -fw, 0, fw, fh);   // mirrored
    cx.restore();
    return c;   // a canvas, so a game could filter it further
  },

  enableMic() {
    if (this._mic || this.micDenied || this.micPending) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { this.micDenied = true; return; }
    this.micPending = true;                       // decision not made yet
    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
      Sfx.unlock();
      const ac = Sfx.ac || new (window.AudioContext || window.webkitAudioContext)();
      Sfx.ac = ac;
      if (ac.state === 'suspended') ac.resume();  // iOS: context starts suspended
      const src = ac.createMediaStreamSource(stream);
      const an = ac.createAnalyser();
      an.fftSize = 256;
      src.connect(an);
      this._mic = an;
      this._micData = new Uint8Array(an.frequencyBinCount);
      this.micReady = true;
      this.micPending = false;
    }).catch(() => { this.micDenied = true; this.micPending = false; });
  },

  // Gyro/tilt, for aiming. gamma is the left-right tilt, beta the front-back
  // one, both in degrees. Same best-effort shape as the mic and camera: if the
  // device has no sensor or refuses permission, tiltReady stays false and the
  // games that want it use their camera or touch path instead.
  enableTilt() {
    if (this._tiltOn) return;
    this._tiltOn = true;
    const add = () => window.addEventListener('deviceorientation', e => {
      if (e.gamma == null || e.beta == null) return;
      this._tiltG = e.gamma; this._tiltB = e.beta;
      this.tiltReady = true;
    });
    const DO = window.DeviceOrientationEvent;
    if (DO && typeof DO.requestPermission === 'function') {
      DO.requestPermission().then(st => { if (st === 'granted') add(); }).catch(() => {});
    } else if (DO) { add(); }
  },
  // Whatever the phone is doing now becomes centre. Called at the start of a
  // tilt game so it plays the same lying in bed as sitting at a desk. Deferred
  // if no reading has arrived yet — the first one to land becomes the zero.
  zeroTilt() {
    if (this.tiltReady) this._tiltZero = { g: this._tiltG, b: this._tiltB };
    else { this._tiltZero = null; this._wantZero = true; }
  },

  enableMotion() {
    const add = () => window.addEventListener('devicemotion', e => {
      // rotation rate — the gyro proper. Peak rather than sum, so the reading
      // does not depend on how often the device fires the event.
      const rr = e.rotationRate;
      if (rr) {
        const spin = Math.abs(rr.alpha || 0) + Math.abs(rr.beta || 0) + Math.abs(rr.gamma || 0);
        if (spin > this._gyroPeak) this._gyroPeak = spin;
        if (spin > 25) this.gyroReady = true;      // real readings are arriving
      }
      const a = e.accelerationIncludingGravity; if (!a) return;
      if (this._lastAcc) {
        const d = Math.abs(a.x - this._lastAcc.x) + Math.abs(a.y - this._lastAcc.y) + Math.abs(a.z - this._lastAcc.z);
        this._shakeRaw += d;
      }
      this._lastAcc = { x: a.x, y: a.y, z: a.z };
    });
    const DM = window.DeviceMotionEvent;
    if (DM && typeof DM.requestPermission === 'function') {
      DM.requestPermission().then(s => { if (s === 'granted') add(); }).catch(() => {});
    } else if (DM) { add(); }
  },

  beginStep() {
    this.dx = this._rawDx; this.dy = this._rawDy;
    this._rawDx = 0; this._rawDy = 0;
    this.moveDist = Math.hypot(this.dx, this.dy);
    this.justDown = !!this._justDownRaw; this.justUp = !!this._justUpRaw;
    this._justDownRaw = false; this._justUpRaw = false;
    this.taps = this._pendingTaps; this._pendingTaps = [];
    this.swipe = this._pendingSwipe; this._pendingSwipe = null;
    this.holdTime = this.down ? this.holdTime + STEP : 0;
    // shake: gyro spin first, then accelerometer energy, then fast pointer
    // wiggling. A hard shake tops 500 deg/s across the axes.
    const wiggle = this.down ? this.moveDist * 1.2 : 0;
    // Divisor and weight tuned for real phones: a light spin should not fill the
    // meter on its own — it takes a genuinely hard, sustained shake. The
    // accelerometer and pointer-wiggle fallbacks below are deliberately left
    // alone; this only raises the bar for the gyro.
    const spin = Math.min(1, this._gyroPeak / 1300);
    this.shake = Math.min(1, this.shake * 0.90 + (spin * 0.12 + this._shakeRaw * 0.02 + wiggle * 0.02));
    this._shakeRaw = 0; this._gyroPeak = 0;
    // blow: mic loudness if we have it, otherwise fast tapping stands in for a puff
    let raw = 0;
    if (this.micReady && this._mic) {
      this._mic.getByteFrequencyData(this._micData);
      // low-frequency energy — a breath is broadband but bottom-heavy
      let sum = 0; const bins = Math.min(24, this._micData.length);
      for (let i = 2; i < bins; i++) sum += this._micData[i];
      raw = Math.max(0, (sum / (bins - 2) - 22) / 90);   // noise floor subtracted
    } else {
      raw = this.justDown ? 0.9 : 0;                     // tap fallback
    }
    this.blow = Math.min(1, this.blow * 0.75 + raw);
    this._blowRaw = 0;
    // tilt: 20 degrees off centre reaches the edge, so a small comfortable
    // lean covers the whole play field
    if (this.tiltReady && this._wantZero) { this._tiltZero = { g: this._tiltG, b: this._tiltB }; this._wantZero = false; }
    if (this.tiltReady && this._tiltZero) {
      this.tiltX = Math.max(-1, Math.min(1, (this._tiltG - this._tiltZero.g) / 20));
      this.tiltY = Math.max(-1, Math.min(1, (this._tiltB - this._tiltZero.b) / 20));
    }
    // camera motion: sampled from the webcam, or fast tapping as a fallback
    this._sampleMotion();
    if (!this.camReady) {
      this.motion = Math.min(1, this.motion * 0.82 + (this.justDown ? 0.5 : 0));
      // tap fallback for left/right games: tap left half = motionL, right = motionR
      this.motionL = Math.max(0, this.motionL * 0.82 + (this.justDown && this.x < W / 2 ? 0.6 : 0));
      this.motionR = Math.max(0, this.motionR * 0.82 + (this.justDown && this.x >= W / 2 ? 0.6 : 0));
      // the finger stands in for the hand: it aims the point, and holding it
      // down is what "covering the lens" means with no lens to cover.
      this.motionX = Math.max(0, Math.min(1, this.x / W));
      this.motionY = Math.max(0, Math.min(1, (this.y - TOP) / (BOT - TOP)));
      this.bright += ((this.down ? 0.02 : 1) - this.bright) * 0.25;
    }
  },
  travel() { return this._travel; },
  resetTravel() { this._travel = 0; }
};
Input.attach(canvas);

function buzz(ms) { navigator.vibrate?.(ms); }

// ── FX ───────────────────────────────────────────────────────────────────────
/* Engine-level juice, shared by every microgame. Nothing here changes game
   logic — effects are cosmetic and time-based, so a paused/backgrounded tab just
   freezes them. Games and the engine poke it through the small API at the top:
     FX.shake(power)         camera kick, decays on its own
     FX.flash(color, power)  full-screen tint that fades
     FX.burst(x,y,color,n)   a spray of particles
     FX.hit(x,y,color)       shorthand: a few sparks + a tiny shake
   FX.pre() applies the shake transform, FX.post() draws flash+particles on top. */
const FX = {
  sh: 0, shT: 0, fl: 0, flC: PAL.ink, parts: [],
  reduce: false,   // honours prefers-reduced-motion

  shake(p) { if (this.reduce) return; this.sh = Math.min(6, Math.max(this.sh, p)); },
  flash(c = PAL.ink, p = 0.5) { this.flC = c; this.fl = Math.max(this.fl, this.reduce ? p * 0.4 : p); },
  burst(x, y, c = PAL.ink, n = 8, spread = 60) {
    if (this.reduce) n = Math.min(n, 3);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.2832, s = 12 + Math.random() * spread;
      this.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 10, life: 0.4 + Math.random() * 0.4, t: 0, c });
    }
  },
  hit(x, y, c = PAL.accent) { this.burst(x, y, c, 6, 45); this.shake(2); },

  update(dt) {
    if (this.sh > 0) { this.sh = Math.max(0, this.sh - dt * 22); this.shT += dt * 60; }
    if (this.fl > 0) this.fl = Math.max(0, this.fl - dt * 2.4);
    for (const p of this.parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt; }
    this.parts = this.parts.filter(p => p.t < p.life);
  },
  pre() {
    if (this.sh <= 0) { this.dx = this.dy = 0; return; }
    this.dx = Math.sin(this.shT * 1.7) * this.sh;
    this.dy = Math.cos(this.shT * 2.3) * this.sh;
    ctx.save(); ctx.translate(Math.round(this.dx), Math.round(this.dy));
  },
  post() {
    if (this.sh > 0) ctx.restore();
    for (const p of this.parts) {
      const k = 1 - p.t / p.life;
      ctx.globalAlpha = k;
      g.rect(p.x - 1.5, p.y - 1.5, 3, 3, p.c);
    }
    ctx.globalAlpha = 1;
    if (this.fl > 0) {
      ctx.globalAlpha = Math.min(0.6, this.fl);
      g.rect(0, 0, W, H, this.flC);
      ctx.globalAlpha = 1;
    }
  }
};
try { FX.reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}


// ── RENDERER ─────────────────────────────────────────────────────────────────
const g = {
  clear(c = PAL.bg) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); },
  rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); },
  box(x, y, w, h, c, lw = 1) { ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.strokeRect(Math.round(x) + 0.5, Math.round(y) + 0.5, Math.round(w) - 1, Math.round(h) - 1); },
  cRect(x, y, w, h, c) { this.rect(x - w / 2, y - h / 2, w, h, c); },
  circle(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill(); },
  line(x1, y1, x2, y2, c, lw = 1) { ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); },
  text(str, x, y, size = 8, c = PAL.ink, align = 'center', bold = true) {
    ctx.fillStyle = c;
    ctx.font = (bold ? 'bold ' : '') + size + 'px ui-monospace, monospace';
    ctx.textAlign = align;
    ctx.fillText(str, Math.round(x), Math.round(y));
    ctx.textAlign = 'left';
  },
  bar(x, y, w, h, pct, c = PAL.accent, bg = PAL.mid) {
    this.rect(x, y, w, h, bg);
    this.rect(x, y, Math.max(0, Math.min(1, pct)) * w, h, c);
  },
  // Draws a PixelLab sprite, or a labelled placeholder if the art isn't in yet.
  sprite(name, x, y, o = {}) {
    const a = Assets.get(name);
    const w = o.w || (a ? a.fw : 16), h = o.h || (a ? a.fh : 16);
    if (!a) {
      this.cRect(x, y, w, h, o.color || PAL.accent);
      this.box(x - w / 2, y - h / 2, w, h, PAL.bg);
      return;
    }
    const frame = o.frame != null ? o.frame : Math.floor(Engine.time * a.fps) % a.frames;
    ctx.save();
    ctx.translate(Math.round(x), Math.round(y));
    if (o.flip) ctx.scale(-1, 1);
    ctx.drawImage(a.img, frame * a.fw, 0, a.fw, a.fh, -w / 2, -h / 2, w, h);
    ctx.restore();
  },
  // control pictograms shown on the prompt card
  hint(kind, x, y) {
    const c = PAL.ink;
    switch (kind) {
      case 'tap':   this.circle(x, y, 4, c); this.box(x - 9, y - 9, 18, 18, PAL.mid); break;
      case 'drag':  this.circle(x - 7, y, 3, PAL.mid); this.circle(x + 7, y, 4, c); this.line(x - 4, y, x + 3, y, PAL.mid); break;
      case 'swipe': this.line(x, y + 7, x, y - 6, c, 2); this.line(x, y - 7, x - 4, y - 3, c, 2); this.line(x, y - 7, x + 4, y - 3, c, 2); break;
      case 'rub':   for (let i = 0; i < 4; i++) this.line(x - 8 + i * 4, y + (i % 2 ? 5 : -5), x - 4 + i * 4, y + (i % 2 ? -5 : 5), c, 2); break;
      case 'shake': this.cRect(x, y, 8, 12, c); this.line(x - 12, y, x - 8, y, PAL.mid, 2); this.line(x + 8, y, x + 12, y, PAL.mid, 2); break;
      case 'mash':  this.circle(x - 6, y + 3, 3, PAL.mid); this.circle(x, y, 4, c); this.circle(x + 6, y - 3, 3, PAL.mid); break;
      case 'hold':  this.circle(x, y, 4, c); this.box(x - 9, y - 9, 18, 18, PAL.mid); this.box(x - 12, y - 12, 24, 24, PAL.mid); break;
      case 'wait':  this.circle(x, y, 7, PAL.mid); this.line(x, y, x, y - 5, c, 2); this.line(x, y, x + 4, y, c, 2); break;
      case 'blow':  this.circle(x - 6, y, 5, c); for (let i = 0; i < 3; i++) this.line(x, y - 4 + i * 4, x + 10, y - 6 + i * 6, PAL.mid, 2); break;
      case 'move':  this.box(x - 10, y - 7, 20, 14, c); this.circle(x, y, 3, c); this.line(x - 14, y, x - 11, y, PAL.mid, 2); this.line(x + 11, y, x + 14, y, PAL.mid, 2); this.line(x, y - 11, x, y - 8, PAL.mid, 2); break;
      case 'trace': this.line(x - 9, y + 5, x - 3, y - 6, c, 2); this.line(x - 3, y - 6, x + 3, y + 5, c, 2); this.line(x + 3, y + 5, x + 9, y - 6, c, 2); break;
      case 'count': this.circle(x - 8, y, 3, c); this.circle(x, y, 3, c); this.circle(x + 8, y, 3, PAL.mid); break;
      case 'flick': this.circle(x - 8, y + 6, 4, c); this.line(x - 8, y + 6, x + 6, y - 6, PAL.mid, 2); this.line(x + 6, y - 6, x + 2, y - 5, PAL.mid, 2); this.line(x + 6, y - 6, x + 5, y - 1, PAL.mid, 2); break;
      // 'move' with a line through it — hold still for the camera
      case 'still': this.box(x - 10, y - 7, 20, 14, c); this.circle(x, y, 3, c); this.line(x - 13, y + 11, x + 13, y - 11, PAL.bad, 2); break;
      // a palm coming down over the lens
      case 'cover': this.circle(x, y + 4, 5, PAL.mid); this.cRect(x, y - 3, 20, 8, c); for (let i = 0; i < 3; i++) this.line(x - 6 + i * 6, y - 8, x - 6 + i * 6, y - 12, c, 2); break;
    }
  }
};

/* ── PHOTO FILTERS ────────────────────────────────────────────────────────────
   Stamped onto a camera still before the engine shows it as a polaroid. They
   draw in the photo's own pixel space (120x90) and in the five palette colours,
   so they read as pixel art sitting on a real photograph.
─────────────────────────────────────────────────────────────────────────────── */
const PhotoFX = {
  // A birthday cake with candles you have just blown out, for BLOW. Sized off
  // the canvas rather than in fixed pixels, so a bigger still still works.
  cake(c) {
    const x = c.getContext('2d'), w = c.width, h = c.height;
    const box = (a, b, ww, hh, col) => { x.fillStyle = col; x.fillRect(Math.round(a), Math.round(b), Math.round(ww), Math.round(hh)); };
    const cw = Math.round(w * 0.46), cx0 = Math.round((w - cw) / 2);
    const ch = Math.round(h * 0.20), cy0 = h - ch - Math.round(h * 0.04);

    // candles first — the cake is drawn over their feet
    const n = 3, gap = cw / (n + 1), cl = Math.round(h * 0.17);
    for (let i = 0; i < n; i++) {
      const px = Math.round(cx0 + gap * (i + 1)) - 1, top = cy0 - cl;
      for (let sy = 0; sy < cl; sy += 3) box(px, top + sy, 3, 2, (sy / 3) % 2 ? PAL.bad : PAL.ink);
      box(px + 1, top - 2, 1, 2, PAL.bg);                                  // wick
      // a curl of smoke: the flame went out a moment ago
      for (let k = 0; k < 4; k++) box(px + 1 + Math.round(Math.sin(k * 1.6) * 2), top - 5 - k * 3, 1, 2, PAL.mid);
    }
    box(cx0, cy0, cw, 3, PAL.ink);                                         // frosting
    box(cx0, cy0 + 3, cw, ch - 3, PAL.accent);                             // cake
    for (let i = 2; i < cw - 2; i += 8) box(cx0 + i, cy0 + 3, 3, ch - 3, PAL.ink);   // stripes
    box(cx0 - 4, cy0 + ch, cw + 8, 2, PAL.mid);                            // plate
  },

  // The thing you just leaned out of the way of, for LEAN — it comes in past
  // the ear you leaned away from, so the picture matches the dodge you made.
  // `from` is the side it flies in from: 'L' or 'R'.
  dodge(c, from) {
    const x = c.getContext('2d'), w = c.width, h = c.height;
    const box = (a, b, ww, hh, col) => { x.fillStyle = col; x.fillRect(Math.round(a), Math.round(b), Math.round(ww), Math.round(hh)); };
    const dir = from === 'L' ? 1 : -1;                       // travel direction
    const bx = from === 'L' ? Math.round(w * 0.26) : Math.round(w * 0.74);
    const by = Math.round(h * 0.34), r = Math.round(h * 0.11);

    // speed lines trailing back to the edge it came from
    for (let i = 0; i < 5; i++) {
      const ly = by - r + Math.round((r * 2 / 4) * i);
      const tail = Math.round((w * 0.3) * (0.5 + Math.abs(2 - i) * 0.25));
      box(bx - dir * (r + 2) - (dir > 0 ? tail : 0), ly, tail, 2, i % 2 ? PAL.ink : PAL.accent);
    }
    // a brick, pixel-round at the corners so it reads as thrown, not placed
    box(bx - r, by - r + 2, r * 2, r * 2 - 4, PAL.bad);
    box(bx - r + 2, by - r, r * 2 - 4, r * 2, PAL.bad);
    box(bx - r + 3, by - r + 3, r - 1, 2, PAL.ink);          // highlight
    // the near miss: a puff of dust where it went past
    for (let i = 0; i < 3; i++) {
      const px = bx + dir * (r + 4 + i * 5), py = by + (i % 2 ? -6 : 7);
      box(px, py, 3, 3, PAL.mid);
    }
  },

  // A plinth and a laurel, for FREEZE. The person is left in their own colours
  // — the marble is the props, not a grey wash over somebody's face.
  statue(c) {
    const x = c.getContext('2d'), w = c.width, h = c.height;
    const box = (a, b, ww, hh, col) => { x.fillStyle = col; x.fillRect(Math.round(a), Math.round(b), Math.round(ww), Math.round(hh)); };
    // plinth across the bottom, stepped like cut stone
    const pw = Math.round(w * 0.62), px0 = Math.round((w - pw) / 2), ph = Math.round(h * 0.23);
    const py0 = h - ph;
    box(px0 - 6, py0, pw + 12, 3, PAL.ink);                  // cap
    box(px0, py0 + 3, pw, ph - 3, PAL.mid);                  // body
    box(px0 + 4, py0 + 7, pw - 8, ph - 12, PAL.ink);         // inset panel
    // block letters, drawn as bars — a real font would not survive this size
    const word = Math.round(pw * 0.62), wx = Math.round((w - word) / 2), wy = py0 + Math.round(ph * 0.42);
    for (let i = 0; i < 5; i++) box(wx + i * Math.round(word / 5), wy, Math.round(word / 7), 5, PAL.mid);
    // laurel arcing over the head
    const lr = Math.round(w * 0.3), ly = Math.round(h * 0.30);
    for (let i = 0; i <= 12; i++) {
      const a = Math.PI + (i / 12) * Math.PI;                // left to right, over the top
      const lx = w / 2 + Math.cos(a) * lr, lyy = ly + Math.sin(a) * lr * 0.5;
      box(lx - 1, lyy - 1, 3, 3, PAL.ink);
      if (i % 2) box(lx - 2, lyy - 4, 2, 3, PAL.accent);     // leaves
    }
    // chipped corners, so it reads as old stone
    box(2, 2, 7, 3, PAL.ink); box(2, 2, 3, 7, PAL.ink);
    box(w - 9, 2, 7, 3, PAL.ink); box(w - 5, 2, 3, 7, PAL.ink);
  }
};

// ── MICROGAME BASE ───────────────────────────────────────────────────────────
class Microgame {
  static meta = { id: 'base', prompt: 'DO IT!', hint: 'tap', duration: 3.5, winOnTimeout: false };
  constructor(difficulty) {
    this.d = difficulty;       // 1 | 2 | 3
    this.won = false;
    this.finished = false;
    this.t = 0;                // seconds since this game started
    this.timeLimit = 3.5;      // set by the engine before init() — use it to pace physics
  }
  init() {}
  update(dt, input) {}
  draw(g) {}
  succeed() { if (!this.finished) { this.won = true; this.finished = true; } }
  lose()    { if (!this.finished) { this.won = false; this.finished = true; } }
  // helper: linear pick by difficulty
  byD(a, b, c) { return this.d <= 1 ? a : this.d === 2 ? b : c; }
}

/* =============================================================================
   MICROGAMES — add new ones here, then register in POOL / BOSSES at the bottom
============================================================================= */

// 1. TAP — hit the moving bug
class TapBug extends Microgame {
  static meta = { id: 'tap', prompt: 'TAP!', hint: 'tap', duration: 3.2 };
  init() {
    this.miss = 0;
    this.bug = { x: 24 + Math.random() * (W - 48), y: TOP + 26 + Math.random() * (BOT - TOP - 52), r: 9 };
    const sp = this.byD(18, 34, 52);
    const a = Math.random() * 6.28;
    this.vx = Math.cos(a) * sp; this.vy = Math.sin(a) * sp;
  }
  update(dt, input) {
    this.bug.x += this.vx * dt; this.bug.y += this.vy * dt;
    if (this.bug.x < 12 || this.bug.x > W - 12) this.vx *= -1;
    if (this.bug.y < TOP + 12 || this.bug.y > BOT - 12) this.vy *= -1;
    if (input.justDown) {
      if (Math.hypot(input.x - this.bug.x, input.y - this.bug.y) < this.bug.r + 9) { FX.hit(this.bug.x, this.bug.y, PAL.accent); this.succeed(); }
      else this.miss = 0.15;
    }
  }
  draw(g) {
    g.clear();
    if (this.miss > 0) { this.miss -= STEP; g.circle(Input.x, Input.y, 6, PAL.bad); }
    // laughing shiba face as the tap target (cycles frames 0-2, the open-mouth laughs)
    const fr = Math.floor(this.t * 6) % 3;
    g.sprite('face', this.bug.x, this.bug.y, { w: 22, h: 22, frame: fr });
  }
}

// 2. DRAG — catch every coin in the basket
class CatchCoin extends Microgame {
  static meta = { id: 'catch', prompt: 'CATCH!', hint: 'drag', duration: 4.0 };
  init() {
    this.bx = CX;
    this.need = this.byD(1, 2, 3);
    this.got = 0;
    // Catch shiba drawn at hero size to unify sprite scale across games.
    // Art is 40x56; drawn at h=DOGH tall, width scales the same ratio.
    this.dogH = 24; this.dogW = Math.round(40 * this.dogH / 56);   // 17
    // Paws sit at sprite-local y 16/56; the catch line is at the paws:
    //   dogY = catchLine + (dogH/2 - 16*dogH/56)
    this.pawOff = (this.dogH / 2) - (16 * this.dogH / 56);         // ~5
    this.floor = BOT - this.dogH - 4;         // catch line, leaves the sprite on the shelf edge
    this.dogY = this.floor + this.pawOff;     // sprite centre
    this.catchTol = Math.round(this.dogW / 2) + 4;                 // paw span + a little grace
    this.startY = TOP + 8;

    // Fit every coin inside the round: the last one must land with time to spare,
    // so fall speed is derived from timeLimit instead of hardcoded.
    const budget = Math.max(1.2, this.timeLimit - 0.5);
    const gap = this.need > 1 ? Math.min(0.8, budget * 0.35 / (this.need - 1)) : 0;
    const travel = budget - gap * (this.need - 1);
    const speed = Math.max(55, (this.floor - this.startY) / travel);

    this.coins = [];
    for (let i = 0; i < this.need; i++) {
      this.coins.push({ x: 22 + Math.random() * (W - 44), y: this.startY, sp: speed, delay: i * gap, done: false });
    }
  }
  update(dt, input) {
    // follows your finger, and keeps the last position after you lift it
    this.bx += (input.x - this.bx) * Math.min(1, dt * 18);
    this.bx = Math.max(this.dogW / 2 + 2, Math.min(W - this.dogW / 2 - 2, this.bx));

    for (const c of this.coins) {
      if (c.done) continue;
      if (c.delay > 0) { c.delay -= dt; continue; }
      c.y += c.sp * dt;
      if (c.y >= this.floor) {                    // resolve at the floor, no tunnelling
        c.done = true;
        if (Math.abs(c.x - this.bx) < this.catchTol) {
          this.got++; Sfx.tick(); FX.hit(c.x, this.floor, PAL.accent);
          if (this.got >= this.need) this.succeed();
        } else { this.lose(); }
      }
    }
  }
  draw(g) {
    g.clear();
    // coins first, so a landing coin passes behind the dog's head
    for (const c of this.coins) {
      if (c.done) continue;
      if (c.delay > 0) { g.rect(c.x - 1, this.startY - 6, 2, 3, PAL.mid); continue; }  // drop marker
      g.sprite('coin', c.x, c.y, { w: 9, h: 9, color: PAL.accent });
    }
    g.sprite('catcher', this.bx, this.dogY, { w: this.dogW, h: this.dogH, color: PAL.ink,
             frame: Math.floor(this.t * 8) % 5 });
    for (let i = 0; i < this.need; i++) g.rect(CX - this.need * 4 + i * 8, TOP + 5, 5, 5, i < this.got ? PAL.accent : PAL.mid);
  }
}

// 3. RUB — scrub the panel clean
class RubClean extends Microgame {
  static meta = { id: 'rub', prompt: 'RUB!', hint: 'rub', duration: 3.6 };
  init() { this.dirt = 1; this.rate = this.byD(0.010, 0.0075, 0.006); }
  update(dt, input) {
    if (input.down) this.dirt -= input.moveDist * this.rate;
    if (this.dirt <= 0) { this.dirt = 0; this.succeed(); }
  }
  draw(g) {
    g.clear();
    const bw = 100, bh = 100;
    g.rect(CX - bw / 2, CY - bh / 2, bw, bh, PAL.accent);
    g.text('CLEAN', CX, CY + 3, 10, PAL.bg);
    const s = this.dirt * bw;
    g.rect(CX - s / 2, CY - s / 2, s, s, PAL.mid);
    if (Input.down) g.circle(Input.x, Input.y, 5, PAL.ink);
  }
}

// 4. SWIPE UP — pull the tissues out
class PullTissue extends Microgame {
  static meta = { id: 'pull', prompt: 'PULL DOWN!', hint: 'swipe', duration: 4.0 };
  init() {
    this.pulled = 0; this.need = this.byD(2, 3, 4);
    this.sheetY = 0;        // animates the sheet sliding out on each pull
    this.cue = 0;           // pulsing arrow
  }
  update(dt, input) {
    this.cue += dt * 4;
    if (this.sheetY > 0) this.sheetY = Math.max(0, this.sheetY - dt * 4);   // retract between pulls
    // a downward swipe yanks one sheet out
    if (input.swipe && input.swipe.dir === 'down') {
      this.pulled++; Sfx.tick(); buzz(10);
      this.sheetY = 1;
      FX.hit(CX, CY + 20, PAL.ink);
      if (this.pulled >= this.need) this.succeed();
    }
  }
  draw(g) {
    g.clear();
    // dispenser box mounted at the top
    const boxY = TOP + 14, boxH = 34;
    g.rect(CX - 34, boxY, 68, boxH, PAL.mid);
    g.rect(CX - 34, boxY, 68, 4, PAL.ink);
    g.text('TISSUES', CX, boxY + 22, 8, PAL.bg);
    // slot
    g.rect(CX - 20, boxY + boxH - 3, 40, 3, PAL.bg);
    // the sheet hanging out of the slot — visibly slides down when pulled
    const hang = 26 + this.sheetY * 34;
    const sheetTop = boxY + boxH - 2;
    g.rect(CX - 16, sheetTop, 32, hang, PAL.ink);
    g.rect(CX - 16, sheetTop, 32, hang, PAL.ink);
    g.box(CX - 16, sheetTop, 32, hang, PAL.mid);
    // your grab point + a pulsing DOWN arrow so the gesture is obvious
    const ay = sheetTop + hang + 8 + Math.sin(this.cue) * 3;
    g.line(CX, sheetTop + hang, CX, ay, PAL.accent, 2);
    g.line(CX, ay, CX - 5, ay - 5, PAL.accent, 2);
    g.line(CX, ay, CX + 5, ay - 5, PAL.accent, 2);
    // progress pips
    for (let i = 0; i < this.need; i++) g.rect(CX - this.need * 5 + i * 10, BOT - 10, 7, 7, i < this.pulled ? PAL.accent : PAL.mid);
  }
}

// 5. SHAKE — build up pressure (accelerometer or frantic wiggling)
class SodaShake extends Microgame {
  static meta = { id: 'shake', prompt: 'SHAKE!', hint: 'shake', duration: 3.6 };
  init() { this.fill = 0; this.need = this.byD(1.4, 1.8, 2.3); }
  update(dt, input) {
    this.fill += input.shake * dt * 2.2;
    if (this.fill >= this.need) this.succeed();
  }
  draw(g) {
    g.clear();
    const j = (Math.random() - 0.5) * (this.fill / this.need) * 6;
    g.cRect(CX + j, CY - 6, 30, 54, PAL.bad);
    g.rect(CX - 15 + j, CY - 33, 30, 6, PAL.mid);
    g.bar(30, BOT - 16, W - 60, 8, this.fill / this.need);
  }
}

// 6. SWIPE — follow the arrow, in order
class SwipeArrow extends Microgame {
  static meta = { id: 'swipe', prompt: 'SWIPE!', hint: 'swipe', duration: 4.0 };
  init() {
    const dirs = ['up', 'down', 'left', 'right'];
    this.seq = Array.from({ length: this.byD(1, 2, 3) }, () => dirs[Math.floor(Math.random() * 4)]);
    this.i = 0;
  }
  update(dt, input) {
    if (!input.swipe) return;
    if (input.swipe.dir === this.seq[this.i]) {
      this.i++; Sfx.tick(); buzz(10); FX.burst(CX, CY, PAL.ink, 5, 40);
      if (this.i >= this.seq.length) this.succeed();
    } else { buzz(40); FX.shake(3); this.lose(); }
  }
  draw(g) {
    g.clear();
    const d = this.seq[this.i];
    const ang = { up: -Math.PI / 2, down: Math.PI / 2, left: Math.PI, right: 0 }[d];
    ctx.save(); ctx.translate(CX, CY); ctx.rotate(ang);
    g.line(-22, 0, 20, 0, PAL.ink, 6);
    g.line(20, 0, 8, -12, PAL.ink, 6);
    g.line(20, 0, 8, 12, PAL.ink, 6);
    ctx.restore();
    for (let k = 0; k < this.seq.length; k++) g.circle(CX - (this.seq.length - 1) * 6 + k * 12, CY + 46, 3, k < this.i ? PAL.accent : PAL.mid);
  }
}

// 7. MASH — tap fast
class MashButton extends Microgame {
  static meta = { id: 'mash', prompt: 'MASH!', hint: 'mash', duration: 3.4 };
  init() { this.count = 0; this.need = this.byD(6, 10, 14); }
  update(dt, input) {
    if (input.justDown) { this.count++; Sfx.tap(); buzz(8); FX.burst(CX, CY, PAL.accent, 4, 40); FX.shake(1.2); if (this.count >= this.need) this.succeed(); }
  }
  draw(g) {
    g.clear();
    const r = Input.down ? 30 : 34;
    g.circle(CX, CY, r, Input.down ? PAL.accent : PAL.ink);
    g.text(this.need - this.count, CX, CY + 6, 16, PAL.bg);
    g.bar(30, BOT - 16, W - 60, 8, this.count / this.need);
  }
}

// 8. HOLD — release inside the marked zone
class HoldRelease extends Microgame {
  static meta = { id: 'hold', prompt: 'HOLD!', hint: 'hold', duration: 4.2 };
  init() {
    this.p = 0; this.dir = 1;
    this.speed = this.byD(0.55, 0.8, 1.1);
    this.zone = this.byD(0.22, 0.16, 0.11);
    this.zoneAt = 0.35 + Math.random() * 0.4;
    this.armed = false;
  }
  update(dt, input) {
    if (input.down) {
      this.armed = true;
      this.p += this.dir * this.speed * dt;
      if (this.p > 1) { this.p = 1; this.dir = -1; }
      if (this.p < 0) { this.p = 0; this.dir = 1; }
    } else if (this.armed) {
      if (Math.abs(this.p - this.zoneAt) < this.zone / 2) this.succeed(); else this.lose();
    }
  }
  draw(g) {
    g.clear();
    const x = 24, w = W - 48, y = CY - 60, h = 120;
    g.rect(x, y, w, h, PAL.mid);
    g.rect(x, y + (1 - this.zoneAt - this.zone / 2) * h, w, this.zone * h, PAL.accent);
    const py = y + (1 - this.p) * h;
    g.rect(x - 4, py - 2, w + 8, 4, PAL.ink);
    g.text(this.armed ? 'RELEASE' : 'PRESS', CX, BOT - 2, 7, PAL.mid);
  }
}

// 9. DODGE — survive the falling blocks (boss-capable)
class Dodge extends Microgame {
  static meta = { id: 'dodge', prompt: 'DODGE!', hint: 'drag', duration: 5.0, winOnTimeout: true };
  init() {
    this.px = CX; this.py = BOT - 26;
    this.blocks = [];
    this.spawn = 0.15;
    this.every = this.byD(0.62, 0.50, 0.42);
    this.fall = this.byD(85, 105, 128);
  }
  update(dt, input) {
    // tracks your finger directly; a lerp left safe columns unreachable
    if (input.down) this.px = input.x;
    this.px = Math.max(10, Math.min(W - 10, this.px));
    this.spawn -= dt;
    if (this.spawn <= 0) {
      this.spawn = this.every;
      // keep each new block clear of any still-high one so a gap always exists
      let x = 14 + Math.random() * (W - 28);
      for (let k = 0; k < 20; k++) {
        if (this.blocks.every(b => b.y > TOP + 50 || Math.abs(b.x - x) > 52)) break;
        x = 14 + Math.random() * (W - 28);
      }
      this.blocks.push({ x, y: TOP - 8, w: 10 + Math.random() * 12 });
    }
    for (const b of this.blocks) {
      b.y += this.fall * dt;
      // hitbox is the body core (~7px), not the drawn 18px sprite, so ears/tail
      // clipping a block doesn't feel unfair
      if (Math.abs(b.y - this.py) < 9 && Math.abs(b.x - this.px) < b.w / 2 + 7) { buzz(60); this.lose(); }
    }
    this.blocks = this.blocks.filter(b => b.y < BOT + 12);
  }
  draw(g) {
    g.clear();
    for (const b of this.blocks) g.cRect(b.x, b.y, b.w, 8, PAL.bad);
    g.sprite('hero', this.px, this.py - 4, { w: 18, h: 24, color: PAL.ink, frame: Math.floor(this.t * 8) % 5 });
    g.rect(0, BOT - 4, W, 4, PAL.mid);
  }
}

// 10. WAIT — do nothing. The classic trap.
class DontTap extends Microgame {
  static meta = { id: 'dont', prompt: "DON'T!", hint: 'wait', duration: 3.0, winOnTimeout: true };
  init() { this.pulse = 0; }
  update(dt, input) {
    this.pulse += dt * 6;
    if (input.justDown) { buzz(60); this.lose(); }
  }
  draw(g) {
    g.clear();
    const r = 30 + Math.sin(this.pulse) * 4;
    g.circle(CX, CY, r, PAL.bad);
    g.text('TAP ME', CX, CY + 4, 10, PAL.ink);
    g.text('(no)', CX, CY + 52, 8, PAL.mid);
  }
}

// 11. TAP TIMING — stop the sweeping marker inside the band
class StopBar extends Microgame {
  static meta = { id: 'stop', prompt: 'STOP!', hint: 'tap', duration: 3.4 };
  init() {
    this.p = Math.random(); this.dir = Math.random() < 0.5 ? 1 : -1;
    // >= 2.4 units of travel guarantees the marker crosses the band from any
    // starting point, however short the round has become.
    this.speed = Math.max(this.byD(0.75, 1.05, 1.45), 2.4 / this.timeLimit);
    this.band = this.byD(0.26, 0.18, 0.12);
    this.at = 0.28 + Math.random() * 0.44;
  }
  update(dt, input) {
    this.p += this.dir * this.speed * dt;
    if (this.p > 1) { this.p = 1; this.dir = -1; }
    if (this.p < 0) { this.p = 0; this.dir = 1; }
    if (input.justDown) {
      if (Math.abs(this.p - this.at) < this.band / 2) this.succeed(); else this.lose();
    }
  }
  draw(g) {
    g.clear();
    const x = 20, w = W - 40, y = CY - 14, h = 28;
    g.rect(x, y, w, h, PAL.mid);
    g.rect(x + (this.at - this.band / 2) * w, y, this.band * w, h, PAL.accent);
    g.rect(x + this.p * w - 2, y - 6, 4, h + 12, PAL.ink);
  }
}

// 12. TRACKING — keep your finger on the runaway dot
class FollowDot extends Microgame {
  static meta = { id: 'follow', prompt: 'FOLLOW!', hint: 'drag', duration: 4.6, winOnTimeout: true };
  init() {
    this.x = CX; this.y = CY;
    const sp = this.byD(34, 52, 74);
    const a = Math.random() * 6.2832;
    this.vx = Math.cos(a) * sp; this.vy = Math.sin(a) * sp;
    this.r = this.byD(20, 17, 14);
    this.off = 0; this.grace = 0.7;     // time to get your finger there
  }
  update(dt, input) {
    this.x += this.vx * dt; this.y += this.vy * dt;
    if (this.x < 16 || this.x > W - 16) this.vx *= -1;
    if (this.y < TOP + 16 || this.y > BOT - 16) this.vy *= -1;
    this.grace -= dt;
    if (this.grace > 0) return;
    const on = input.down && Math.hypot(input.x - this.x, input.y - this.y) < this.r;
    this.off = on ? 0 : this.off + dt;
    if (this.off > 0.42) this.lose();
  }
  draw(g) {
    g.clear();
    const held = this.off === 0 && this.grace <= 0;
    g.circle(this.x, this.y, this.r, held ? PAL.accent : PAL.mid);
    g.circle(this.x, this.y, 4, PAL.ink);
    if (this.off > 0 && this.grace <= 0) g.bar(30, BOT - 14, W - 60, 5, 1 - this.off / 0.42, PAL.bad, PAL.mid);
  }
}

// 13. SEQUENCE — tap the targets in numbered order
class TapOrder extends Microgame {
  static meta = { id: 'order', prompt: 'IN ORDER!', hint: 'tap', duration: 4.2 };
  init() {
    this.n = this.byD(3, 4, 5); this.i = 0; this.r = 17;
    // r stays 17 for spacing — it is what makes 5 signs fit — while the sprite
    // is drawn bigger over it, and hitR gives the bigger sign a matching target
    this.sh = 62;                 // drawn sprite height
    this.hitR = 27;
    this.pts = [];
    let guard = 0;
    while (this.pts.length < this.n && guard++ < 500) {
      const p = { x: 28 + Math.random() * (W - 56), y: TOP + 34 + Math.random() * (BOT - TOP - 74) };
      // space by sprite size so the tall signs don't overlap
      if (this.pts.every(q => Math.hypot(q.x - p.x, (q.y - p.y) * 0.7) > this.r * 2.7)) this.pts.push(p);
    }
    this.n = this.pts.length;
  }
  update(dt, input) {
    if (!input.justDown) return;
    // nearest, not first in range: with a target this size two of them can both
    // cover a tap, and index order would sometimes blame the wrong sign
    let k = -1, best = this.hitR;
    for (let j = 0; j < this.n; j++) {
      const d = Math.hypot(input.x - this.pts[j].x, input.y - this.pts[j].y);
      if (d < best) { best = d; k = j; }
    }
    if (k < 0) return;
    if (k === this.i) { this.i++; Sfx.tick(); FX.hit(this.pts[k].x, this.pts[k].y, PAL.accent); if (this.i >= this.n) this.succeed(); }
    else if (k > this.i) { this.lose(); }
  }
  draw(g) {
    g.clear();
    // draw back-to-front by y so overlapping signs stack naturally
    const order = this.pts.map((p, k) => k).sort((a, b) => this.pts[a].y - this.pts[b].y);
    for (const k of order) {
      const p = this.pts[k];
      const done = k < this.i;
      const next = k === this.i;                 // the one you should tap now
      const fr = done ? 2 : 0;
      const sw = this.sh * 34 / 65;
      if (done) ctx.globalAlpha = 0.45;
      g.sprite('ordersign', p.x, p.y, { w: sw, h: this.sh, frame: fr });
      ctx.globalAlpha = 1;
      // The shiba holds a blank placard low on the sprite. Measured on the art:
      // ~15/34 wide, ~22/65 tall, centred 63% of the way down. EVERY unsolved
      // sign gets a chip that shape — accent for the next one, cream for the
      // rest — so the number sits inside the board instead of spilling over the
      // belly, and the red numbers match the highlighted one in size and place.
      if (!done) {
        const bCY = p.y + (0.63 - 0.5) * this.sh;
        const bW = 15 / 65 * this.sh, bH = 22 / 65 * this.sh;
        g.rect(p.x - bW / 2, bCY - bH / 2, bW, bH, next ? PAL.accent : PAL.ink);
        const f = Math.round(bH * 0.72);
        g.text(String(k + 1), p.x, bCY + f * 0.36, f, next ? PAL.bg : PAL.bad);
      }
    }
  }
}

// 14. DISCRIMINATION — one of these is not like the others
class OddOneOut extends Microgame {
  static meta = { id: 'odd', prompt: 'ODD ONE!', hint: 'tap', duration: 3.8 };
  init() {
    const cols = this.byD(2, 3, 3), rows = this.byD(2, 2, 3);
    this.cells = []; this.r = this.byD(18, 14, 12);
    const gw = (W - 40) / cols, gh = (BOT - TOP - 50) / rows;
    for (let ry = 0; ry < rows; ry++) for (let cx = 0; cx < cols; cx++) {
      this.cells.push({ x: 20 + gw * (cx + 0.5), y: TOP + 30 + gh * (ry + 0.5) });
    }
    this.odd = Math.floor(Math.random() * this.cells.length);
    this.square = Math.random() < 0.5;   // which shape is the majority
  }
  update(dt, input) {
    if (!input.justDown) return;
    for (let k = 0; k < this.cells.length; k++) {
      const c = this.cells[k];
      if (Math.abs(input.x - c.x) < this.r + 4 && Math.abs(input.y - c.y) < this.r + 4) {
        if (k === this.odd) this.succeed(); else this.lose();
        return;
      }
    }
  }
  draw(g) {
    g.clear();
    this.cells.forEach((c, k) => {
      const sq = (k === this.odd) ? !this.square : this.square;
      if (sq) g.cRect(c.x, c.y, this.r * 1.8, this.r * 1.8, PAL.ink);
      else g.circle(c.x, c.y, this.r, PAL.ink);
    });
  }
}

// 15. DRAG TO TARGET — get the treat to the dog
class FeedDog extends Microgame {
  static meta = { id: 'feed', prompt: 'FEED!', hint: 'drag', duration: 4.4 };
  init() {
    this.dx = CX; this.dy = TOP + 42;
    this.sway = this.byD(0, 26, 42);
    this.tx = 26 + Math.random() * (W - 52); this.ty = BOT - 30;
    this.held = false;
  }
  update(dt, input) {
    this.dx = CX + Math.sin(this.t * 1.9) * this.sway;
    if (input.down) {
      if (!this.held && Math.hypot(input.x - this.tx, input.y - this.ty) < 22) this.held = true;
      if (this.held) { this.tx = input.x; this.ty = input.y; }
    } else { this.held = false; }
    if (Math.hypot(this.tx - this.dx, this.ty - (this.dy + 6)) < 16) this.succeed();
  }
  draw(g) {
    g.clear();
    g.sprite('face', this.dx, this.dy, { w: 36, h: 37, frame: Math.floor(this.t * 6) % 9 });
    g.cRect(this.tx, this.ty, 14, 7, PAL.accent);            // the treat
    g.cRect(this.tx - 7, this.ty, 5, 9, PAL.accent);
    g.cRect(this.tx + 7, this.ty, 5, 9, PAL.accent);
    if (!this.held) g.text('GRAB', this.tx, this.ty + 18, 7, PAL.mid);
  }
}

// 16. REACTION — whack each one before it drops
class WhackMole extends Microgame {
  static meta = { id: 'whack', prompt: 'WHACK!', hint: 'mash', duration: 4.4 };
  init() {
    this.need = this.byD(2, 3, 4); this.hit = 0; this.r = 18;
    this.sw = 46;                          // drawn sprite size
    this.holes = [];
    for (let ry = 0; ry < 2; ry++) for (let cx = 0; cx < 3; cx++) {
      this.holes.push({ x: 30 + cx * 60, y: TOP + 70 + ry * 100 });
    }
    // each mole's window is derived from the real round length, so it always fits
    const budget = Math.max(1.1, this.timeLimit - 0.35);
    this.up = budget / this.need * 0.92;
    this.left = this.up;
    this.cur = Math.floor(Math.random() * this.holes.length);
  }
  update(dt, input) {
    this.left -= dt;
    if (this.left <= 0) { this.lose(); return; }
    if (input.justDown) {
      const h = this.holes[this.cur];
      if (Math.hypot(input.x - h.x, input.y - (h.y - 4)) < this.r + 8) {
        this.hit++; Sfx.tick(); buzz(12); FX.hit(h.x, h.y, PAL.accent);
        if (this.hit >= this.need) { this.succeed(); return; }
        let nx = this.cur;
        while (nx === this.cur) nx = Math.floor(Math.random() * this.holes.length);
        this.cur = nx; this.left = this.up;
      }
    }
  }
  /* The sheet bakes the ground into every frame, but not the same ground: the
     popped frames sit the dog on a raised mound low in the cell (widest row 42)
     while the empty frame is a flat hole higher up (widest row 29). Stepping
     through the frames therefore made the hole change shape and jump position
     as the mole came up. So the hole is now always frame 8, drawn identically
     in every cell, and the mole is frame 0 clipped to above the rim and slid
     up through it — which also rises smoothly instead of in nine steps.
     Rows below are in the 48px sprite's own pixels. */
  drawMole(g, x, y, pop) {
    const RIM = 30;    // the hole's near lip; the dog is cut off here
    const RISE = 26;   // far enough that pop 0 leaves the dog fully out of sight
    const k = this.sw / 48;
    ctx.save();
    ctx.beginPath();
    ctx.rect(x - this.sw / 2, y - this.sw / 2, this.sw, RIM * k);
    ctx.clip();
    g.sprite('whack', x, y + (1 - pop) * RISE * k, { w: this.sw, h: this.sw, frame: 0 });
    ctx.restore();
  }
  draw(g) {
    g.clear();
    // every cell gets the same hole, including the live one
    for (const hole of this.holes) g.sprite('whack', hole.x, hole.y, { w: this.sw, h: this.sw, frame: 8 });
    const h = this.holes[this.cur];
    const pop = Math.min(1, (this.up - this.left) * 6);
    this.drawMole(g, h.x, h.y, pop);
    for (let i = 0; i < this.need; i++) g.rect(CX - this.need * 4 + i * 8, TOP + 6, 5, 5, i < this.hit ? PAL.accent : PAL.mid);
  }
}

// 17. RESTRAINT — pump into the band, then stop before it bursts
class PumpBalloon extends Microgame {
  static meta = { id: 'pump', prompt: 'PUMP!', hint: 'mash', duration: 4.2 };
  init() {
    this.f = 0; this.still = 0; this.bounce = 0;
    this.band = this.byD(0.26, 0.19, 0.13);
    // how long you must stop for, shortened when the round itself is short
    this.stillNeed = Math.max(0.24, Math.min(0.42, this.timeLimit * 0.16));
    // FAIRNESS INVARIANT: inc < band, so some multiple of inc always lands
    // inside the band. Without this the balloon can be impossible to stop.
    this.inc = Math.max(0.05, this.band * 0.6);
    // cap the target so the taps needed fit the time actually available
    const cap = this.inc * 4.0 * Math.max(0.4, this.timeLimit - this.stillNeed);
    this.at = Math.max(0.3, Math.min(0.52 + Math.random() * 0.26, cap));
  }
  update(dt, input) {
    if (input.justDown) {
      this.f += this.inc; this.still = 0; Sfx.tap(); this.bounce = 1; buzz(10);
      if (this.f > this.at + this.band / 2) { buzz(90); this.lose(); }
    } else {
      this.still += dt;
      if (this.still > this.stillNeed && Math.abs(this.f - this.at) <= this.band / 2) this.succeed();
    }
    if (this.bounce > 0) this.bounce = Math.max(0, this.bounce - dt * 6);
  }
  draw(g) {
    g.clear();
    // pressure gauge on the right edge
    const x = W - 16, y = TOP + 24, h = BOT - TOP - 54;
    g.rect(x, y, 10, h, PAL.mid);
    g.rect(x, y + (1 - this.at - this.band / 2) * h, 10, this.band * h, PAL.accent);   // target band
    g.rect(x - 3, y + (1 - Math.min(1, this.f)) * h - 1, 16, 3, this.f > this.at + this.band / 2 ? PAL.bad : PAL.ink);
    // the shiba pumping — frame follows fill (balloon inflates 0 -> 8)
    const fr = Math.max(0, Math.min(8, Math.round(this.f * 8)));
    const wob = (this.bounce || 0) * 2;
    g.sprite('pumpdog', CX - 6, CY + 10 - wob, { w: 78, h: 78, frame: fr });
    g.text(this.still > 0.12 ? 'HOLD!' : 'PUMP!', CX - 6, TOP + 18, 9, this.still > 0.12 ? PAL.accent : PAL.mid);
  }
}

// 18. PRECISION SWIPE — cut the marked rope, only that one
class CutRope extends Microgame {
  static meta = { id: 'cut', prompt: 'CUT!', hint: 'swipe', duration: 4.0 };
  init() {
    this.n = this.byD(2, 3, 4);
    this.ropes = [];
    const gap = (W - 40) / (this.n - 1 || 1);
    for (let i = 0; i < this.n; i++) this.ropes.push({ x: 20 + gap * i + (this.n === 1 ? gap / 2 : 0) });
    this.target = Math.floor(Math.random() * this.n);
    this.y0 = TOP + 40; this.y1 = BOT - 46;
    this.cut = -1;            // which rope got cut (-1 = none yet)
    this.cutAt = 0;          // y where the swipe crossed
    this.anim = 0;           // seconds since the cut, drives the split + fall
  }
  update(dt, input) {
    if (this.cut >= 0) {                    // playing the split animation
      this.anim += dt;
      if (this.anim > 0.35) { if (this.cut === this.target) this.succeed(); else this.lose(); }
      return;
    }
    const sw = input.swipe;
    if (!sw) return;
    const midY = (sw.y0 + sw.y1) / 2;
    if (midY < this.y0 - 12 || midY > this.y1 + 12) return;      // swiped off the ropes
    for (let i = 0; i < this.n; i++) {
      const rx = this.ropes[i].x;
      if ((sw.x0 - rx) * (sw.x1 - rx) < 0) {                     // the swipe crossed this rope
        this.cut = i;
        this.cutAt = Math.max(this.y0 + 8, Math.min(this.y1 - 8, midY));
        this.anim = 0;
        FX.hit(rx, this.cutAt, i === this.target ? PAL.accent : PAL.bad);
        if (i === this.target) { Sfx.win(); } else { buzz(70); FX.shake(3); }
        return;
      }
    }
  }
  draw(g) {
    g.clear();
    this.ropes.forEach((r, i) => {
      const on = i === this.target;
      const col = on ? PAL.accent : PAL.mid;
      if (i === this.cut) {
        // rope split into two pieces at the cut point
        const k = this.anim / 0.35;
        const recoil = k * 10;
        g.rect(r.x - 1, this.y0, 3, (this.cutAt - recoil) - this.y0, col);   // top piece springs up
        const botTop = this.cutAt + recoil + k * 40;                          // bottom piece + weight fall away
        g.rect(r.x - 1, botTop, 3, Math.max(0, this.y1 - botTop), col);
        if (on) g.cRect(r.x, Math.min(BOT + 20, this.y1 + k * 60), 9, 9, PAL.bad);   // weight drops
      } else {
        g.rect(r.x - 1, this.y0, 3, this.y1 - this.y0, col);
        if (on) { g.cRect(r.x, this.y0 - 6, 11, 11, PAL.accent); g.cRect(r.x, this.y1, 9, 9, PAL.bad); }
      }
    });
    // anchor beam the ropes hang from
    g.rect(0, this.y0 - 4, W, 4, PAL.ink);
    if (this.cut < 0) g.text('SWIPE ACROSS THE GOLD ROPE', CX, BOT - 8, 7, PAL.mid);
  }
}

// 19. BOSS — thread the gaps
class Squeeze extends Microgame {
  static meta = { id: 'squeeze', prompt: 'SQUEEZE!', hint: 'drag', duration: 5.0, winOnTimeout: true };
  init() {
    this.px = CX; this.py = BOT - 26;
    this.gap = this.byD(66, 54, 44);   // widened to clear the 18px-wide dog
    this.sp = this.byD(70, 92, 116);
    this.walls = [];
    this.next = 0.2;
    this.every = this.byD(1.5, 1.2, 0.95);
  }
  update(dt, input) {
    if (input.down) this.px += (input.x - this.px) * Math.min(1, dt * 16);
    this.px = Math.max(8, Math.min(W - 8, this.px));
    this.next -= dt;
    if (this.next <= 0) {
      this.next = this.every;
      this.walls.push({ y: TOP - 6, gx: this.gap / 2 + 6 + Math.random() * (W - this.gap - 12) });
    }
    for (const w of this.walls) {
      const was = w.y;
      w.y += this.sp * dt;
      if (was < this.py && w.y >= this.py) {          // crossing the player's row
        if (Math.abs(this.px - w.gx) > this.gap / 2 - 8) { buzz(80); this.lose(); return; }
      }
    }
    this.walls = this.walls.filter(w => w.y < BOT + 10);
  }
  draw(g) {
    g.clear();
    for (const w of this.walls) {
      g.rect(0, w.y - 4, w.gx - this.gap / 2, 8, PAL.bad);
      g.rect(w.gx + this.gap / 2, w.y - 4, W - (w.gx + this.gap / 2), 8, PAL.bad);
    }
    g.sprite('hero', this.px, this.py - 4, { w: 18, h: 24, color: PAL.ink, frame: Math.floor(this.t * 8) % 5 });
    g.rect(0, BOT - 3, W, 3, PAL.mid);
  }
}

// 20. BLOW — puff to fill the sail / spin the pinwheel (mic, or tap-fallback)
class BlowSail extends Microgame {
  static meta = { id: 'blow', prompt: 'BLOW!', hint: 'blow', duration: 4.2, photo: true, photoCap: 'MAKE A WISH!' };
  init() {
    this.fill = 0;
    this.need = this.byD(0.9, 1.3, 1.7);
    this.spin = 0;
    // If the mic permission is still pending, pause the round rather than start
    // it unfairly. Cap the wait so a slow/ignored prompt falls back to tapping.
    Input.enableMic();
    // for the photo payoff only — the round never waits on the camera, and
    // goes without a picture if it is denied or absent
    Input.enableCam();
    this.paused = Input.micPending;
    this.wait = 0;
  }
  update(dt, input) {
    if (this.paused) {
      this.wait += dt;
      // unpause when the decision lands, or after a short grace (then tap-fallback).
      // The round timer is frozen while paused, so this wait costs no play time.
      if (!Input.micPending || this.wait > 1.2) this.paused = false;
      return;
    }
    this.fill += input.blow * dt * 1.6;
    this.spin += input.blow * dt * 14;
    if (this.fill >= this.need && !this.finished) {
      const shot = Input.snapPhoto();
      if (shot) { PhotoFX.cake(shot); Engine.lastPhoto = shot; }
      this.succeed();
    }
  }
  draw(g) {
    g.clear();
    if (this.paused) {
      g.text('ALLOW MIC…', CX, CY - 6, 12, PAL.ink);
      g.text('(tap Allow to blow)', CX, CY + 12, 7, PAL.mid);
      return;
    }
    // little boat
    g.rect(CX - 26, BOT - 40, 52, 12, PAL.mid);
    g.rect(CX - 1, CY - 30, 2, 74, PAL.ink);
    const bulge = 6 + (this.fill / this.need) * 34;
    ctx.fillStyle = PAL.accent;
    ctx.beginPath();
    ctx.moveTo(CX + 1, CY - 28);
    ctx.quadraticCurveTo(CX + 1 + bulge, CY, CX + 1, CY + 30);
    ctx.closePath(); ctx.fill();
    if (Input.micReady) g.text('BLOW!', CX, TOP + 30, 8, PAL.mid);
    else g.text('TAP FAST TO BLOW', CX, TOP + 30, 7, PAL.mid);
    g.bar(30, BOT - 16, W - 60, 6, this.fill / this.need);
  }
}

// 21. TRACE — drag along the dotted path from start to end without straying
class TracePath extends Microgame {
  static meta = { id: 'trace', prompt: 'TRACE!', hint: 'trace', duration: 4.8 };
  init() {
    // a polyline of 3-4 nodes; you must drag through each in order
    const n = this.byD(3, 4, 4);
    this.tol = this.byD(20, 16, 13);
    this.nodes = [];
    let x = 28, y = TOP + 40 + Math.random() * 40;
    this.nodes.push({ x, y });
    for (let i = 1; i < n; i++) {
      x += (W - 56) / (n - 1);
      y = TOP + 30 + Math.random() * (BOT - TOP - 70);
      this.nodes.push({ x, y });
    }
    this.i = 0; this.started = false; this.stray = 0;
  }
  segDist(px, py, a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const L = dx * dx + dy * dy || 1;
    let t = ((px - a.x) * dx + (py - a.y) * dy) / L;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (a.x + dx * t), py - (a.y + dy * t));
  }
  update(dt, input) {
    if (!input.down) { if (this.started) { this.stray += dt; if (this.stray > 0.35) this.lose(); } return; }
    this.stray = 0;
    if (!this.started) {
      if (Math.hypot(input.x - this.nodes[0].x, input.y - this.nodes[0].y) < this.tol) this.started = true;
      else return;
    }
    // advance through nodes as the finger reaches them
    if (this.i < this.nodes.length - 1) {
      const next = this.nodes[this.i + 1];
      const d = this.segDist(input.x, input.y, this.nodes[this.i], next);
      if (d > this.tol) { this.lose(); return; }         // strayed off the line
      if (Math.hypot(input.x - next.x, input.y - next.y) < this.tol) this.i++;
    }
    if (this.i >= this.nodes.length - 1) this.succeed();
  }
  draw(g) {
    g.clear();
    for (let k = 0; k < this.nodes.length - 1; k++) {
      const a = this.nodes[k], b = this.nodes[k + 1];
      const done = k < this.i;
      ctx.strokeStyle = done ? PAL.accent : PAL.mid;
      ctx.lineWidth = 2; ctx.setLineDash([3, 4]);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.setLineDash([]);
    }
    this.nodes.forEach((p, k) => g.circle(p.x, p.y, 4, k <= this.i ? PAL.accent : PAL.ink));
    g.circle(this.nodes[0].x, this.nodes[0].y, this.tol, PAL.mid);
    if (!this.started) g.text('START', this.nodes[0].x, this.nodes[0].y - this.tol - 4, 7, PAL.mid);
    const last = this.nodes[this.nodes.length - 1];
    g.cRect(last.x, last.y, 10, 10, PAL.bad);
  }
}

// 22. COUNT — tap exactly the number asked for, no more
class GrabCount extends Microgame {
  static meta = { id: 'count', prompt: 'GRAB 3!', hint: 'count', duration: 4.2 };
  init() {
    const total = this.byD(5, 7, 9);
    this.need = 2 + Math.floor(Math.random() * (this.byD(2, 3, 4)));
    this.static = false;
    this.items = [];
    let guard = 0;
    while (this.items.length < total && guard++ < 400) {
      const p = { x: 24 + Math.random() * (W - 48), y: TOP + 34 + Math.random() * (BOT - TOP - 64), taken: false };
      if (this.items.every(q => Math.hypot(q.x - p.x, q.y - p.y) > 26)) this.items.push(p);
    }
    this.got = 0;
    this.doneAt = null;
    this.meta = { ...GrabCount.meta, prompt: 'GRAB ' + this.need + '!' };
  }
  update(dt, input) {
    // win once they've held the right count briefly (guards against overgrab)
    if (this.got === this.need && this.doneAt != null && this.t - this.doneAt > 0.45) { this.succeed(); return; }
    if (!input.justDown) return;
    for (const it of this.items) {
      if (!it.taken && Math.hypot(input.x - it.x, input.y - it.y) < 15) {
        it.taken = true; this.got++; Sfx.tick(); FX.hit(it.x, it.y, PAL.accent);
        if (this.got > this.need) { this.lose(); return; }     // grabbed too many
        if (this.got === this.need) this.doneAt = this.t;
        return;
      }
    }
  }
  draw(g) {
    g.clear();
    for (const it of this.items) if (!it.taken) g.sprite('coin', it.x, it.y, { w: 12, h: 12, color: PAL.accent });
    g.text(this.got + ' / ' + this.need, CX, TOP + 26, 9, this.got > this.need ? PAL.bad : PAL.ink);
  }
}

// 23. FLICK — pull back and release to launch the ball into the target
class FlickShot extends Microgame {
  static meta = { id: 'flick', prompt: 'SHOOT!', hint: 'flick', duration: 4.6 };
  init() {
    this.K = 6;                              // pull -> velocity multiplier
    this.ox = CX; this.oy = BOT - 70;        // origin with room to pull downward
    this.ball = { x: this.ox, y: this.oy, vx: 0, vy: 0, flying: false };
    this.aim = false; this.launched = false;
    // target sits in the upper field, reachable by a pull within the lower area
    this.target = { x: 30 + Math.random() * (W - 60), y: TOP + 26 + Math.random() * 40, r: this.byD(17, 14, 11) };
    this.tvx = this.byD(0, 22, 38) * (Math.random() < 0.5 ? 1 : -1);
  }
  update(dt, input) {
    this.target.x += this.tvx * dt;
    if (this.target.x < 20 || this.target.x > W - 20) this.tvx *= -1;

    if (!this.launched) {
      if (input.down) {
        this.aim = true;
        // pull anywhere, but cap the pull distance so launch speed is bounded
        let px = input.x - this.ox, py = input.y - this.oy;
        const maxPull = 66, d = Math.hypot(px, py);
        if (d > maxPull) { px = px / d * maxPull; py = py / d * maxPull; }
        this.ball.x = Math.max(6, Math.min(W - 6, this.ox + px));
        // never let the aiming ball sit below the field, or the launch instantly
        // trips the out-of-bounds miss
        this.ball.y = Math.min(BOT - 2, this.oy + py);
      } else if (this.aim) {
        const pullx = this.ox - this.ball.x, pully = this.oy - this.ball.y;
        this.ball.vx = pullx * this.K; this.ball.vy = pully * this.K;
        this.ball.flying = true; this.launched = true; Sfx.tap(); buzz(15);
      }
    } else if (this.ball.flying) {
      this.ball.x += this.ball.vx * dt; this.ball.y += this.ball.vy * dt;
      this.ball.vy += 60 * dt;
      if (Math.hypot(this.ball.x - this.target.x, this.ball.y - this.target.y) < this.target.r + 4) {
        FX.hit(this.target.x, this.target.y, PAL.accent); this.succeed();
      }
      if (this.ball.y > BOT + 14 || this.ball.x < -14 || this.ball.x > W + 14) this.lose();
    }
  }
  draw(g) {
    g.clear();
    g.circle(this.target.x, this.target.y, this.target.r, PAL.mid);
    g.circle(this.target.x, this.target.y, this.target.r * 0.45, PAL.bad);
    g.circle(this.ox, this.oy, 3, PAL.mid);
    if (this.aim && !this.launched) {
      g.line(this.ox, this.oy, this.ball.x, this.ball.y, PAL.mid, 1);
      let px = this.ball.x, py = this.ball.y;
      let vx = (this.ox - this.ball.x) * this.K, vy = (this.oy - this.ball.y) * this.K;
      for (let i = 0; i < 12; i++) { px += vx * 0.05; py += vy * 0.05; vy += 60 * 0.05; if (py > BOT) break; g.rect(px - 1, py - 1, 2, 2, PAL.mid); }
    }
    g.circle(this.ball.x, this.ball.y, 5, PAL.accent);
    if (!this.launched && !this.aim) g.text('DRAG BACK', CX, BOT - 2, 7, PAL.mid);
  }
}

// 24. FLAPPY — tap to flap through the pipe gaps
class Flappy extends Microgame {
  static meta = { id: 'flappy', prompt: 'FLAP!', hint: 'mash', duration: 4.4, winOnTimeout: true, minDuration: 2.8 };
  init() {
    this.d = 1;                                // stays gentle — hardest verb on touch
    this.y = CY; this.vy = 0;
    this.grav = 170; this.flap = -84;          // floatier: a plane, not a bird
    this.planeW = 30; this.planeH = 26;        // drawn size
    this.hitW = 16; this.hitH = 12;            // collision box: fuselage only, not wings
    this.need = this.byD(1, 2, 2); this.passed = 0;
    this.gap = this.byD(104, 96, 96);          // wide enough to fly the plane through
    this.pipeW = 14; this.bx = 40;
    const budget = Math.max(2.2, this.timeLimit - 0.3);  // floor so fast speeds stay fair
    const span = W - this.bx + 30;
    const spacing = 74;
    const lastTravel = span + (this.need - 1) * spacing;
    this.speed = lastTravel / (budget * 0.92);
    this.pipes = [];
    let cy = CY;
    for (let i = 0; i < this.need; i++) {
      const maxStep = 26;                      // small centre drift = easy to track
      cy += (Math.random() * 2 - 1) * maxStep;
      cy = Math.max(TOP + this.gap / 2 + 8, Math.min(BOT - this.gap / 2 - 8, cy));
      this.pipes.push({ x: W + 30 + i * spacing, cy, scored: false });
    }
  }
  update(dt, input) {
    if (input.justDown) { this.vy = this.flap; Sfx.tap(); }
    this.vy += this.grav * dt; this.y += this.vy * dt;
    if (this.y < TOP + this.hitH / 2 || this.y > BOT - this.hitH / 2) { buzz(70); this.lose(); return; }
    for (const p of this.pipes) {
      p.x -= this.speed * dt;
      // collide the fuselage box (not the wings) against the pipe column
      if (Math.abs(p.x - this.bx) < this.pipeW / 2 + this.hitW / 2) {
        if (Math.abs(this.y - p.cy) > this.gap / 2 - this.hitH / 2) { buzz(70); this.lose(); return; }
      }
      if (!p.scored && p.x < this.bx - this.pipeW / 2) { p.scored = true; this.passed++; Sfx.tick(); FX.hit(this.bx, this.y, PAL.accent); }
    }
    if (this.passed >= this.need) this.succeed();
  }
  draw(g) {
    g.clear();
    for (const p of this.pipes) {
      g.rect(p.x - this.pipeW / 2, TOP, this.pipeW, p.cy - this.gap / 2 - TOP, PAL.bad);
      g.rect(p.x - this.pipeW / 2, p.cy + this.gap / 2, this.pipeW, BOT - (p.cy + this.gap / 2), PAL.bad);
    }
    g.sprite('plane', this.bx, this.y, { w: this.planeW, h: this.planeH, frame: Math.floor(this.t * 16) % 9 });
    for (let i = 0; i < this.need; i++) g.rect(CX - this.need * 4 + i * 8, TOP + 4, 5, 5, i < this.passed ? PAL.accent : PAL.mid);
  }
}

// 25. CROSSY — hop forward across lanes of traffic to the far side
class Crossy extends Microgame {
  static meta = { id: 'crossy', prompt: 'CROSS!', hint: 'tap', duration: 4.8, minDuration: 4.4 };
  init() {
    this.d = 1;                                // crossy stays gentle at all levels
    this.lanes = this.byD(2, 3, 3);
    this.laneH = (BOT - TOP - 24) / (this.lanes + 1);
    this.px = CX; this.row = 0;
    this.py = BOT - 12;
    this.cars = [];
    for (let L = 0; L < this.lanes; L++) {
      const dir = L % 2 ? 1 : -1;
      const sp = this.byD(22, 28, 34) * dir;   // slow enough that a gap always recurs in time
      for (let k = 0; k < 1; k++) this.cars.push({ lane: L, x: Math.random() * W, sp, w: 18 });
    }
    this.hopping = 0;
  }
  laneY(L) { return BOT - 12 - (L + 1) * this.laneH; }
  update(dt, input) {
    if (input.justDown && this.row <= this.lanes) { this.row++; this.hopping = 0.28; Sfx.tap(); buzz(10); }
    this.py += ((this.row === 0 ? BOT - 12 : this.row > this.lanes ? this.laneY(this.lanes - 1) - this.laneH : this.laneY(this.row - 1)) - this.py) * Math.min(1, dt * 20);
    for (const c of this.cars) {
      c.x += c.sp * dt;
      if (c.x < -14) c.x = W + 14; if (c.x > W + 14) c.x = -14;
      // hit only if the player is standing in that car's lane
      if (this.row - 1 === c.lane && Math.abs(c.x - this.px) < c.w / 2 + 4 && this.hopping <= 0) { buzz(80); this.lose(); return; }
    }
    if (this.hopping > 0) this.hopping -= dt;
    if (this.row > this.lanes) this.succeed();   // reached the far side
  }
  draw(g) {
    g.clear();
    for (let L = 0; L < this.lanes; L++) { const y = this.laneY(L); g.rect(0, y - this.laneH / 2, W, 1, PAL.mid); }
    g.rect(0, TOP, W, 3, PAL.accent);            // safe far side
    for (const c of this.cars) g.cRect(c.x, this.laneY(c.lane), c.w, 10, PAL.bad);
    g.sprite('hero', this.px, this.py, { w: 14, h: 14, color: PAL.ink });
  }
}

// 26. DOODLE — auto-bounce; steer to land on each rising platform
class Doodle extends Microgame {
  static meta = { id: 'doodle', prompt: 'HOP!', hint: 'drag', duration: 5.0, winOnTimeout: true };
  init() {
    this.x = CX; this.vy = 0;
    this.grav = 240; this.bounce = -210;
    this.pw = this.byD(58, 50, 44);            // wide platforms
    this.need = this.byD(2, 2, 3); this.landed = 0;
    const maxRise = (this.bounce * this.bounce) / (2 * this.grav);
    const step = Math.min((BOT - TOP - 30) / (this.need + 1), maxRise * 0.5);  // easy reach
    this.plats = [];
    let py = BOT - 20;
    for (let i = 0; i <= this.need; i++) { this.plats.push({ x: 20 + Math.random() * (W - 40), y: py, used: false }); py -= step; }
    this.plats[0].x = this.x = CX; this.y = this.plats[0].y - 6;
    this.cur = 0;
  }
  update(dt, input) {
    if (input.down) this.x += (input.x - this.x) * Math.min(1, dt * 20);   // snappy steering
    this.x = Math.max(8, Math.min(W - 8, this.x));
    this.vy += this.grav * dt; this.y += this.vy * dt;
    // bounce when falling onto the next platform within its width
    if (this.vy > 0) {
      for (const p of this.plats) {
        if (!p.used && Math.abs(this.y - p.y) < 9 && Math.abs(this.x - p.x) < this.pw / 2 + 3) {
          this.vy = this.bounce; if (p !== this.plats[0]) { p.used = true; this.landed++; Sfx.tick(); FX.hit(p.x, p.y, PAL.accent); }
        }
      }
    }
    if (this.y > BOT + 10) { buzz(70); this.lose(); return; }
    if (this.landed >= this.need) this.succeed();
  }
  draw(g) {
    g.clear();
