    ctx.fillStyle = SCENE.trunk; ctx.beginPath(); ctx.ellipse(CX, 222, 56, 16, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = PAL.bad; ctx.beginPath(); ctx.ellipse(CX, 220, 46, 10, 0, 0, 6.2832); ctx.fill();
    // the sleeper: both eyes shut, breathing slowly; it twitches and peeks
    // one eye open when you move, and is wide awake once you've woken it
    const j = (Math.random() - 0.5) * this.wob * 6;
    const breath = Math.sin(this.t * 2.6) * 2;
    const stirring = this.wob > 0.15 || this.hp < 0.35;
    ctx.save();
    ctx.translate(CX - 4 + this.ox * 0.25 + j, 192 - breath * 0.5 + this.oy * 0.15);
    ctx.rotate(this.woke ? 0 : -0.35 + Math.max(-0.15, Math.min(0.15, this.ox * 0.004)));
    g.sprite(this.woke ? 'face' : stirring ? 'face' : 'sleepface', 0, 0, { w: 70, h: 72 + breath, frame: this.woke ? 0 : stirring ? 5 : 0 });
    ctx.restore();
    if (this.woke) g.text('!', CX + 30, 150, 18, PAL.bad);
    else if (stirring) { g.text('?', CX + 28, 156 + Math.sin(this.t * 12) * 2, 14, PAL.bad); }
    else for (let i = 0; i < 3; i++) {            // Zzz drifting up while it sleeps
      const k = (this.t * 0.6 + i / 3) % 1;
      ctx.globalAlpha = 1 - k;
      g.text('Z', CX + 8 + k * 14 + i * 4, 160 - k * 48, 9 + i * 3, PAL.ink);   // left of the window, not over it
      ctx.globalAlpha = 1;
    }
    if (this.grace > 0) g.text('GET READY…', CX, TOP + 26, 9, PAL.mid);
    else g.text(Input.camReady ? "SHHH… DON'T MOVE" : "SHHH… DON'T TOUCH", CX, TOP + 26, 9, this.hp < 0.4 ? PAL.bad : PAL.ink);
    // live motion, with a tick at the line that starts waking it — you can
    // see the camera reacting, so a still round never feels like luck
    const mw = W - 60;
    g.rect(30, BOT - 30, mw, 3, PAL.mid);
    g.rect(30, BOT - 30, Math.min(1, Input.motion / 0.6) * mw, 3, Input.motion > this.thr ? PAL.bad : PAL.ink);
    g.rect(30 + Math.min(1, this.thr / 0.6) * mw, BOT - 33, 1, 9, PAL.accent);
    g.bar(30, BOT - 18, mw, 8, this.hp, this.hp < 0.4 ? PAL.bad : PAL.accent);
  }

}

// 34. SWAT — put your hand where the fly is; the camera tracks where you moved
class SwatFly extends Microgame {
  static meta = { id: 'swat', env: 'nature@242', cam: true, photo: true, photoCap: 'GOT IT!', prompt: 'SWAT!', hint: 'move', duration: 5.0, minDuration: 4.2,
    how: { tilt: 'TILT THE PHONE\nTO AIM AT THE FLY', cam: 'WAVE YOUR HAND\nAT THE FLY', touch: 'TAP THE FLY' } };
  init() {
    Input.enableCam();
    Input.enableTilt(); Input.zeroTilt();      // hold the phone however you like
    this.paused = Input.camPending; this.wait = 0;
    this.need = this.byD(1, 2, 2);
    this.hit = 0;
    this.dwell = 0;
    this.dwellNeed = this.byD(0.20, 0.24, 0.28);
    this.hx = CX; this.hy = CY;                // the tracked hand
    this.trail = [];
    this.pop = 0;
    this.newFly();
  }
  get usesCam() { return !Input.tiltReady; }
  newFly() {
    // kept off the edges (the motion centre rarely reaches a corner of the
    // frame) and away from where the hand already is, so it can't die on spawn
    for (let i = 0; i < 12; i++) {
      const x = 36 + Math.random() * (W - 72), y = TOP + 44 + Math.random() * (BOT - TOP - 96);
      if (Math.hypot(x - this.hx, y - this.hy) > 46 || i === 11) { this.fly = { x, y, t: 0 }; break; }
    }
    this.arm = 0.3;                            // no kill in the first moment
  }
  update(dt, input) {
    if (this.paused) { this.wait += dt; if (!Input.camPending || this.wait > 1.5) this.paused = false; return; }
    // Gyro aims far more precisely than the camera's centre-of-motion, so it
    // wins where it exists; otherwise motionX/Y (0..1 across the frame) does.
    let tx, ty;
    if (Input.tiltReady) {
      tx = CX + input.tiltX * (W / 2 - 14);
      ty = CY + input.tiltY * ((BOT - TOP) / 2 - 22);
    } else {
      tx = 12 + input.motionX * (W - 24);
      ty = TOP + 22 + input.motionY * (BOT - TOP - 44);
    }
    this.hx += (tx - this.hx) * Math.min(1, dt * (Input.tiltReady ? 14 : 9));
    this.hy += (ty - this.hy) * Math.min(1, dt * (Input.tiltReady ? 14 : 9));
    this.trail.push({ x: this.hx, y: this.hy, t: 0 });
    for (const p of this.trail) p.t += dt;
    this.trail = this.trail.filter(p => p.t < 0.22);

    // the fly drifts so it isn't a static dot to park a hand on
    this.fly.t += dt;
    this.fly.x += Math.cos(this.fly.t * 3.1) * 16 * dt;
    this.fly.y += Math.sin(this.fly.t * 4.4) * 16 * dt;

    if (this.pop > 0) this.pop -= dt;
    if (this.arm > 0) this.arm -= dt;
    const near = this.arm <= 0 && Math.hypot(this.hx - this.fly.x, this.hy - this.fly.y) < 22;
    // Aiming by tilt carries no swing to detect, so holding the swatter on the
    // fly is the swat — with a tap as a shortcut for the impatient. The camera
    // path keeps its own swing, where moving is the whole input.
    let swinging;
    if (Input.tiltReady) {
      this.dwell = near ? this.dwell + dt : Math.max(0, this.dwell - dt * 2);
      swinging = input.justDown || this.dwell >= this.dwellNeed;
    } else {
      swinging = Input.camReady ? input.motion > 0.12 : input.justDown;
    }
    if (near && swinging) {
      this.dwell = 0;
      this.hit++; this.pop = 0.22;
      Sfx.tick(); buzz(15); FX.hit(this.fly.x, this.fly.y, PAL.accent);
      if (this.hit >= this.need) { this.succeed(); return; }
      this.newFly();
    }
  }
  draw(g) {
    g.clear();
    if (this.paused) { g.text('ALLOW CAMERA…', CX, CY - 6, 11, PAL.bg); g.text('(then reach for the fly)', CX, CY + 12, 7, PAL.bg); return; }
    // the "fly": a little winged shiba that buzzes around. Uses the flydog
    // sprite once its art lands; until then it falls back to the drawn fly, so
    // this is safe to ship before the PNG is embedded.
    const f = this.fly;
    const bx = f.x + Math.sin(f.t * 33) * 1.5, by = f.y + Math.cos(f.t * 29) * 1.5;
    if (Assets.get('flydog')) {
      // wings flap fast (frame auto-cycles at the sheet's fps); aspect 80:63.
      // Nearest-neighbour keeps the pixel art crisp when scaled down.
      const sm = ctx.imageSmoothingEnabled; ctx.imageSmoothingEnabled = false;
      g.sprite('flydog', bx, by, { w: 30, h: 24 });
      ctx.imageSmoothingEnabled = sm;
    } else {
      const wg = Math.sin(f.t * 40) * 3;
      g.line(bx - 6, by - 4 + wg, bx, by - 1, PAL.mid, 2);
      g.line(bx + 6, by - 4 - wg, bx, by - 1, PAL.mid, 2);
      g.circle(bx, by, 4, PAL.ink);
      g.circle(bx, by - 3, 2, PAL.ink);
    }
    // hand: a ring where the camera thinks you are, with a short motion trail
    for (const p of this.trail) { ctx.globalAlpha = 1 - p.t / 0.22; g.circle(p.x, p.y, 3, PAL.mid); ctx.globalAlpha = 1; }
    // A hollow ring, not a filled disc: the shiba stays visible inside the
    // reticle right up until the hit, instead of being painted over by a solid
    // centre. Ticks sit on the rim so the middle stays clear too.
    const r = 13 + (this.pop > 0 ? this.pop * 40 : 0);
    ctx.strokeStyle = PAL.bg; ctx.lineWidth = 5;                 // dark rim so it reads on the bright sky
    ctx.beginPath(); ctx.arc(this.hx, this.hy, r, 0, 6.2832); ctx.stroke();
    ctx.strokeStyle = PAL.accent; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(this.hx, this.hy, r, 0, 6.2832); ctx.stroke();
    g.line(this.hx - r - 2, this.hy, this.hx - r + 3, this.hy, PAL.accent, 2);
    g.line(this.hx + r - 3, this.hy, this.hx + r + 2, this.hy, PAL.accent, 2);
    g.line(this.hx, this.hy - r - 2, this.hx, this.hy - r + 3, PAL.accent, 2);
    g.line(this.hx, this.hy + r - 3, this.hx, this.hy + r + 2, PAL.accent, 2);
    // the swatter closing while you hold it on target — a red ring drawing in
    if (this.dwell > 0) {
      const k = Math.min(1, this.dwell / this.dwellNeed);
      ctx.strokeStyle = PAL.bad; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(this.hx, this.hy, r + 7 - k * 6, 0, 6.2832); ctx.stroke();
    }
    g.text(Input.tiltReady ? 'TILT TO AIM!' : Input.camReady ? 'REACH FOR IT!' : 'TAP IT!', CX, TOP + 26, 9, PAL.bg);
    for (let i = 0; i < this.need; i++) { g.rect(W - 9 - i * 8, TOP + 3, 7, 7, PAL.bg); g.rect(W - 8 - i * 8, TOP + 4, 5, 5, i < this.hit ? PAL.accent : PAL.mid); }
  }
}

// 35. HIDE — cover the lens with your hand until the searchlight gives up
class HideLens extends Microgame {
  static meta = { id: 'hide', env: 'night@254', cam: true, prompt: 'HIDE!', hint: 'cover', duration: 4.6, minDuration: 3.8,
    how: { cam: 'COVER THE CAMERA\nWITH YOUR HAND', touch: 'HOLD YOUR FINGER\nON THE SCREEN' } };
  init() {
    Input.enableCam();
    this.paused = Input.camPending; this.wait = 0;
    this.settle = 0.4;                         // learn the room's light first
    this.base = 0.06;
    this.need = this.byD(0.7, 1.0, 1.3);       // seconds of darkness needed
    this.held = 0; this.cover = 0; this.dark = false;
    this.sniffT = 0.2; this.note = 0;
  }
  update(dt, input) {
    if (this.paused) { this.wait += dt; if (!Input.camPending || this.wait > 1.5) this.paused = false; return; }
    // Baseline = the brightest the lens saw before the round got going, so
    // "covered" means dark *relative to this room*, not below a fixed number.
    if (this.settle > 0) { this.settle -= dt; this.base = Math.max(this.base, input.bright); return; }
    if (input.bright > this.base) this.base = input.bright;   // brightest seen wins
    this.cover = Math.max(0, Math.min(1, 1 - input.bright / this.base));
    this.dark = input.bright < this.base * 0.55;
    this.sniffT -= dt;
    if (this.dark) {
      this.held += dt;
      const n = Math.floor(this.held / this.need * 4);   // hidden: a quiet rising count
      if (n > this.note && n < 4) { this.note = n; Sfx.step(n * 2); }
      if (this.held >= this.need && !this.finished) { this.succeed(); }
    } else {
      this.held = Math.max(0, this.held - dt * 0.6);
      this.note = Math.floor(this.held / this.need * 4);
      if (this.sniffT <= 0) { Sfx.sniff(); this.sniffT = 0.75; }   // the shiba sniffing for you
    }
  }
  draw(g) {
    g.clear();
    if (this.paused) { g.text('ALLOW CAMERA…', CX, CY - 6, 11, PAL.ink); g.text('(then cover the lens)', CX, CY + 12, 7, PAL.mid); return; }
    // searchlight sweeping over the hiding shiba
    const sw = Math.sin(this.t * 2.2) * 46;
    ctx.save();
    ctx.globalAlpha = 0.22 * (1 - this.cover);
    ctx.fillStyle = PAL.accent;
    ctx.beginPath();
    ctx.moveTo(CX + sw, TOP + 6);
    ctx.lineTo(CX + sw - 26, BOT - 22);
    ctx.lineTo(CX + sw + 26, BOT - 22);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    g.circle(CX + sw, TOP + 6, 4, PAL.accent);
    // the shiba, crouched behind a crate — nervous/alert when the light is on
    // it, ducked and relieved once you've covered the lens (gone dark)
    const hidFr = this.dark ? (5 + Math.floor(this.t * 6) % 4) : (Math.floor(this.t * 8) % 5);
    g.sprite('hidedog', CX, BOT - 50, { w: 52, h: 52, frame: hidFr });
    g.rect(CX - 30, BOT - 40, 60, 18, PAL.mid);
    g.box(CX - 30, BOT - 40, 60, 18, PAL.ink);
    // the darkness the lens is actually seeing, painted over everything
    if (this.cover > 0.02) { ctx.globalAlpha = Math.min(0.92, this.cover); g.clear(PAL.bg); ctx.globalAlpha = 1; }
    g.text(this.settle > 0 ? 'GET READY…' : (Input.camReady ? 'COVER THE CAMERA!' : 'HOLD THE SCREEN!'), CX, TOP + 26, 9, this.dark ? PAL.accent : PAL.ink);
    g.bar(30, BOT - 18, W - 60, 8, this.held / this.need);
  }
}

// 36. DANCE — move on the beat: hit the ring each time it lands
class DanceBeat extends Microgame {
  static meta = { id: 'dance', env: 'disco@232', cam: true, ownBeat: true, prompt: 'DANCE!', hint: 'move', duration: 5.0, minDuration: 4.4, photo: true, photoCap: 'DANCE MACHINE!',
    how: { cam: 'MOVE WHEN THE RING\nLANDS ON THE BEAT', touch: 'TAP ON THE BEAT' } };
  init() {
    Input.enableCam();
    this.paused = Input.camPending; this.wait = 0;
    this.need = this.byD(2, 3, 3);
    // beats spread over whatever the round length ended up being, so engine
    // speed changes the tempo instead of cutting the last beat off
    const first = 1.0, last = Math.max(first + 0.7, this.timeLimit - 0.7);
    this.beats = [];
    for (let i = 0; i < this.need; i++) {
      this.beats.push({ t: this.need > 1 ? first + (last - first) * i / (this.need - 1) : first, hit: false, miss: false });
    }
    this.win = 0.32;                           // ± window around a beat
    this.thr = this.byD(0.14, 0.17, 0.20);     // how big a move counts
    this.hits = 0; this.pop = 0;
  }
  update(dt, input) {
    if (this.paused) { this.wait += dt; if (!Input.camPending || this.wait > 1.5) this.paused = false; return; }
    if (this.pop > 0) this.pop -= dt;
    for (const b of this.beats) {
      if (b.hit || b.miss) continue;
      const off = this.t - b.t;                // this.t doesn't tick while paused
      if (Math.abs(off) <= this.win && input.motion > this.thr) {
        b.hit = true; this.hits++; this.pop = 0.22;
        Sfx.tick(); buzz(15); FX.hit(CX, CY - 6, PAL.accent);
        if (this.hits >= this.need) { this.succeed(); return; }
      } else if (off > this.win) { b.miss = true; Sfx.blip(180, 0.06); }
    }
    // every beat resolved and one was dropped — no point running out the clock
    if (!this.finished && this.beats.every(b => b.hit || b.miss)) this.lose();
  }
  draw(g) {
    g.clear();
    if (this.paused) { g.text('ALLOW CAMERA…', CX, CY - 6, 11, PAL.ink); g.text('(then move on the beat)', CX, CY + 12, 7, PAL.mid); return; }
    // the incoming beat, as a ring closing in on the shiba
    const nxt = this.beats.find(b => !b.hit && !b.miss);
    if (nxt) {
      const away = Math.abs(nxt.t - this.t);
      const r = 24 + Math.min(64, away * 78);
      const c = away <= this.win ? PAL.accent : PAL.mid;
      ctx.strokeStyle = c; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(CX, CY - 6, r + 0.5, 0, 6.2832); ctx.stroke();
    }
    // shiba bobbing along with however hard you're moving
    const bob = Math.sin(this.t * 9) * 4 * Math.min(1, Input.motion * 2.5);
    const pop = this.pop > 0 ? this.pop * 24 : 0;
    g.sprite('face', CX, CY - 6 + bob, { w: 44 + pop, h: 44 + pop, frame: Math.floor(this.t * 8) % 3 });
    // the bar line: every beat as a pip, filled once you land it
    for (const b of this.beats) {
      const bx = 24 + (b.t / Math.max(0.01, this.timeLimit)) * (W - 48);
      g.rect(bx - 2, BOT - 20, 5, 5, b.hit ? PAL.accent : b.miss ? PAL.bad : PAL.mid);
    }
    g.rect(24, BOT - 13, W - 48, 1, PAL.mid);
    g.rect(24 + (Math.min(this.t, this.timeLimit) / Math.max(0.01, this.timeLimit)) * (W - 48) - 1, BOT - 16, 2, 7, PAL.ink);
    g.text(Input.camReady ? 'MOVE ON THE BEAT!' : 'TAP ON THE BEAT!', CX, TOP + 26, 9, PAL.mid);
  }
}

// ── BOSSES ───────────────────────────────────────────────────────────────────
/* Two bosses meant the pool strictly alternated — pick() skips the last id, so
   with a boss every eight rounds you always knew which one was coming. */

// B3. RED LIGHT — move on green, freeze on red. The camera boss: it is MOVE and
// FREEZE in one, switching between them while you play.
class RedLight extends Microgame {
  static meta = { id: 'redlight', env: 'field@222', prompt: 'RED LIGHT!', hint: 'mash', duration: 5.6, minDuration: 5.0,
    how: 'TAP ON GREEN\nSTOP ON RED' };
  init() {
    // tap-based boss (no camera) — mash on green, stop on red. SQUID is the
    // camera version; this one is the touch twin.
    this.fill = 0;                             // 0..1 progress toward the finish
    this.tapGain = this.byD(0.085, 0.065, 0.052);   // per tap on green
    this.needReds = this.byD(1, 2, 2);         // reds you must survive too
    this.reds = 0;
    this.hp = 1;                               // caught meter — a tap on red drains it
    this.light = 'green'; this.phase = 0.9;
    this.grace = 0;                            // a beat to stop after it turns red
    this.flash = 0;
  }
  // never turns red on the very first beat — you get to move first
  nextLight() {
    if (this.light === 'green') { this.light = 'amber'; this.phase = 0.35; }
    else if (this.light === 'amber') { this.light = 'red'; this.phase = 0.7 + Math.random() * 0.4; this.grace = 0.25; }
    else { this.light = 'green'; this.phase = 0.7 + Math.random() * 0.4; this.flash = 0.2; this.reds++; }
  }
  update(dt, input) {
    this.phase -= dt;
    if (this.flash > 0) this.flash -= dt;
    if (this.phase <= 0) this.nextLight();

    if (this.light === 'red') {
      if (this.grace > 0) { this.grace -= dt; return; }
      // a tap while it is watching gets you caught — two strikes and you're out
      if (input.justDown) {
        this.hp -= 0.5; this.flash = 0.25; FX.shake(3); buzz(70);
        if (this.hp <= 0) { FX.shake(5); buzz(120); this.lose(); return; }
      }
    } else {
      // green and amber both count — amber is a warning, not a trap
      if (input.justDown) { this.fill = Math.min(1, this.fill + this.tapGain); Sfx.tap(); FX.hit(CX, CY + 40, PAL.accent); }
      this.hp = Math.min(1, this.hp + dt * 0.2);
      if (this.fill >= 1 && this.reds >= this.needReds && !this.finished) this.succeed();
    }
  }
  draw(g) {
    g.clear();
    const red = this.light === 'red', amber = this.light === 'amber';
    const lit = red ? PAL.bad : amber ? PAL.accent : PAL.accent;
    // the lamp, three bulbs with one of them on, on a pole that stands in the field
    const LX = W - 30;
    g.rect(LX - 2, TOP + 68, 4, 214 - TOP - 68, PAL.mid);
    g.rect(LX - 13, TOP + 8, 26, 60, PAL.mid);
    g.circle(LX, TOP + 20, 8, red ? PAL.bad : PAL.bg);
    g.circle(LX, TOP + 38, 8, amber ? PAL.accent : PAL.bg);
    g.circle(LX, TOP + 56, 8, this.light === 'green' ? PAL.ink : PAL.bg);
    // the shiba doll spins like SQUID: back turned on green (go), mid-spin on
    // amber, facing you on red (watching) — facedir frames 4=back, 2=profile, 0=front
    const bob = red ? 0 : Math.abs(Math.sin(this.t * 12)) * 4;   // bounces on green
    const df = red ? 0 : amber ? 2 : 4;
    g.sprite('facedir', CX - 10, 190 + bob, { w: 72, h: 72, frame: df });
    // it peeks over a hedge, so it's sitting in the field rather than floating over it
    g.rect(0, 216, W, 12, SCENE.leaf);
    ctx.fillStyle = SCENE.leaf; for (let hx = 6; hx < W; hx += 14) { ctx.beginPath(); ctx.arc(hx, 217, 8, Math.PI, 0); ctx.fill(); }
    g.rect(0, 226, W, 2, SCENE.grassLo);
    g.text(red ? 'FREEZE!' : amber ? 'ABOUT TO STOP…' : 'TAP! TAP! TAP!', CX - 10, 128, red ? 12 : 10, lit);
    // progress, and how close being caught is
    g.bar(24, BOT - 16, W - 48, 7, this.fill);
    if (this.hp < 1) g.bar(24, BOT - 26, W - 48, 4, this.hp, PAL.bad, PAL.bg);
    // one pip per red light you still have to sit through
    for (let i = 0; i < this.needReds; i++) g.rect(24 + i * 8, BOT - 34, 5, 5, i < this.reds ? PAL.accent : PAL.mid);
    if (this.flash > 0) { ctx.globalAlpha = this.flash * 2; g.rect(0, TOP, W, BOT - TOP, PAL.accent); ctx.globalAlpha = 1; }
  }
}

// B4. JUGGLE — keep every ball off the floor. Both other bosses are survive-by-
// dragging; this one is survive-by-tapping, and it splits your attention.
class Juggle extends Microgame {
  static meta = { id: 'juggle', env: 'lawn', prompt: 'JUGGLE!', hint: 'tap', duration: 5.5, winOnTimeout: true,
    how: 'TAP THE BALLS\nKEEP THEM UP' };
  init() {
    this.n = this.byD(2, 2, 3);
    this.grav = this.byD(120, 140, 160);
    this.floor = BOT - 4;
    this.balls = [];
    for (let i = 0; i < this.n; i++) {
      // spread out and dropped at staggered heights, so they never arrive together
      this.balls.push({
        x: 30 + (i + 0.5) * (W - 60) / this.n,
        y: TOP + 30 + i * 26,
        vx: (Math.random() - 0.5) * 26, vy: 0, r: 8, spin: Math.random() * 6.28
      });
    }
  }
  update(dt, input) {
    for (const b of this.balls) {
      b.vy += this.grav * dt;
      b.x += b.vx * dt; b.y += b.vy * dt;
      b.spin += b.vx * dt * 0.1;
      if (b.x < b.r + 2) { b.x = b.r + 2; b.vx = Math.abs(b.vx); }
      if (b.x > W - b.r - 2) { b.x = W - b.r - 2; b.vx = -Math.abs(b.vx); }
      if (b.y < TOP + b.r) { b.y = TOP + b.r; b.vy = Math.abs(b.vy) * 0.4; }
      if (b.y > this.floor) { buzz(80); FX.shake(4); this.lose(); return; }
    }
    // a tap bats up whichever ball it landed nearest, if it landed near one
    for (const t of input.taps) {
      let best = null, bd = 1e9;
      for (const b of this.balls) {
        const d = Math.hypot(b.x - t.x, b.y - t.y);
        if (d < bd) { bd = d; best = b; }
      }
      if (best && bd < 24) {
        best.vy = -this.byD(150, 160, 170);
        best.vx = Math.max(-75, Math.min(75, best.vx + (best.x - t.x) * 3));
        Sfx.boop(); buzz(12); FX.hit(best.x, best.y, PAL.accent);
      }
    }
  }
  draw(g) {
    g.clear();
    g.rect(0, this.floor + 2, W, 2, PAL.bad);
    for (const b of this.balls) {
      // falling fast and low reads as urgent, so it turns red on the way down
      const danger = b.vy > 0 && b.y > this.floor - 70;
      g.tennis(b.x, b.y, b.r, danger ? PAL.bad : PAL.accent);
      // a shadow on the floor, so you can read how much room is left
      ctx.globalAlpha = 0.35;
      g.rect(b.x - 6, this.floor, 12, 1, PAL.mid);
      ctx.globalAlpha = 1;
    }
    g.text('KEEP THEM UP!', CX, TOP + 20, 9, PAL.mid);
  }
}

/* ── MORE MICROGAMES ──────────────────────────────────────────────────────────
   Tilt (BALANCE, POUR, STEER), blow (CANDLES, PUFF) and touch (STACK, SORT).
   All reuse existing sprites/primitives and fall back to touch where a sensor
   is missing, so they stay playable on any device.
─────────────────────────────────────────────────────────────────────────────── */

// TILT — keep the ball on the see-saw plank until the clock runs out
class BalanceBall extends Microgame {
  static meta = { id: 'balance', env: 'field@200', prompt: 'BALANCE!', hint: 'move', duration: 5.0, minDuration: 4.2, winOnTimeout: true,
    how: { tilt: 'TILT THE PHONE\nKEEP THE BALL ON', touch: 'HOLD LEFT OR RIGHT\nTO TILT' } };
  init() {
    Input.enableTilt(); Input.zeroTilt();
    this.pos = 0; this.vel = 0; this.tilt = 0;
    this.grav = this.byD(1.6, 2.1, 2.6);
    this.half = 62;
    this.rollT = 0; this.edgeT = 0;
  }
  update(dt, input) {
    // gyro tilt, or drag left/right, or ease back to flat
    const want = Input.tiltReady ? input.tiltX
               : input.down ? Math.max(-1, Math.min(1, (input.x - CX) / (W / 2))) : this.tilt * 0.9;
    this.tilt += (Math.max(-1, Math.min(1, want)) - this.tilt) * Math.min(1, dt * 10);
    this.vel += this.tilt * this.grav * dt;
    this.vel *= 0.99;
    this.pos += this.vel * dt;
    // the ball rumbles as it rolls, and beeps faster the nearer it gets to the edge
    this.rollT -= dt; this.edgeT -= dt;
    const sp = Math.min(1, Math.abs(this.vel) * 1.5);
    if (sp > 0.08 && this.rollT <= 0) { Sfx.roll(sp); this.rollT = 0.05; }
    const edge = Math.abs(this.pos);
    if (edge > 0.65 && this.edgeT <= 0) { Sfx.blip(990, 0.04, 'square', 0.03); this.edgeT = 0.5 - (edge - 0.65) * 1.1; }
    if (Math.abs(this.pos) >= 1) { buzz(80); FX.shake(4); this.lose(); }
  }
  draw(g) {
    g.clear();
    const near = Math.abs(this.pos) > 0.7;
    // a stand from the grass (horizon at 200) up to the pivot, so the seesaw isn't hanging in the air
    g.rect(CX - 3, CY + 6, 6, 200 - CY - 2, PAL.mid); g.rect(CX - 12, 200, 24, 4, PAL.mid);
    ctx.save(); ctx.translate(CX, CY + 6); ctx.rotate(this.tilt * 0.5);
    g.rect(-this.half, -2, this.half * 2, 4, PAL.mid);       // plank
    g.rect(-5, 1, 10, 4, PAL.mid);                           // pivot
    const bx = this.pos * this.half;
    g.sprite('face', bx, -12, { w: 20, h: 20, frame: Math.floor(this.t * 8) % 3 });
    ctx.restore();
    // edge markers turn red as the ball nears the drop
    g.rect(CX - this.half - 3, CY + 4, 3, 8, near && this.pos < 0 ? PAL.bad : PAL.mid);
    g.rect(CX + this.half, CY + 4, 3, 8, near && this.pos > 0 ? PAL.bad : PAL.mid);
    g.text(Input.tiltReady ? 'HOLD IT LEVEL' : 'DRAG TO TILT', CX, TOP + 24, 8, near ? PAL.bad : PAL.mid);
  }
}

// TILT — fill the shiba's water bowl to the line, then stop
class PourCup extends Microgame {
  static meta = { id: 'pour', env: 'room@268', prompt: 'POUR!', hint: 'move', duration: 5.0, minDuration: 4.4,
    how: { tilt: 'TILT TO FILL THE BOWL\nSTOP AT THE LINE', touch: 'HOLD TO FILL THE BOWL\nSTOP AT THE LINE' } };
  init() {
    Input.enableTilt(); Input.zeroTilt();
    this.fill = 0;
    // a wide band so you don't have to be surgical; easier tiers are wider
    this.lo = this.byD(0.50, 0.56, 0.62);
    this.hi = this.byD(0.86, 0.82, 0.78);
    this.hold = 0; this.need = 0.4;
    this.pouring = false;
  }
  update(dt, input) {
    // Tilt to pour, level off to stop — with hysteresis so it is a real gesture,
    // not a knife-edge. Start pouring past ~10 degrees, stop only once you bring
    // it back under ~6; the gap between means hand tremor can't flicker it, and
    // you never have to hold a dead-exact angle. No gyro → hold a touch to pour,
    // release to stop.
    const t = Input.tiltReady ? Math.abs(input.tiltX) : (input.down ? 0.7 : 0);
    if (t > 0.5) this.pouring = true; else if (t < 0.3) this.pouring = false;
    if (this.pouring) this.fill += Math.min(1, t) * dt * 0.42;
    if (this.fill > 1) { buzz(100); FX.shake(3); Sfx.splash(); this.lose(); return; }   // overflow
    // once you have levelled off (not pouring) and the bowl is in the band, hold
    if (!this.pouring && this.fill >= this.lo && this.fill <= this.hi) { this.hold += dt; if (this.hold >= this.need) { Sfx.chomp(); this.succeed(); } }
    else this.hold = 0;
  }
  draw(g) {
    g.clear();
    const inBand = this.fill >= this.lo && this.fill <= this.hi;
    // the water jug, tipped by how much you are pouring, with the stream
    const t = Input.tiltReady ? Input.tiltX : (Input.down ? 0.6 : 0);
    const tip = Math.max(-1, Math.min(1, t)) * 0.7;
    ctx.save(); ctx.translate(CX - 4, TOP + 46); ctx.rotate(tip);
    g.rect(-11, -16, 22, 30, PAL.mid); g.rect(-8, -22, 10, 7, PAL.mid); g.rect(10, -10, 5, 14, PAL.mid);   // jug, spout, handle
    g.rect(-9, -4, 18, 16, PAL.ink);                                                                       // water inside
    ctx.restore();
    const cw = 52, ch = 66, cx0 = CX - cw / 2, cy0 = BOT - ch - 8;
    if (this.pouring) { ctx.globalAlpha = 0.8; g.rect(CX - 2, TOP + 56, 3, cy0 + ch - this.fill * ch - TOP - 56, PAL.ink); ctx.globalAlpha = 1; }
    // the dog's water bowl (tall, so the line is easy to see) and the shiba waiting by it
    g.rect(cx0 - 4, cy0 - 3, cw + 8, 4, PAL.bad);                   // rim
    g.rect(cx0, cy0, 3, ch, PAL.bad); g.rect(cx0 + cw - 3, cy0, 3, ch, PAL.bad); g.rect(cx0, cy0 + ch - 3, cw, 3, PAL.bad);
    g.rect(cx0 + 3, cy0 + ch - 3 - this.fill * (ch - 6), cw - 6, this.fill * (ch - 6), inBand ? PAL.accent : PAL.ink);
    g.line(cx0 - 6, cy0 + ch - this.lo * ch, cx0 + cw + 6, cy0 + ch - this.lo * ch, PAL.accent, 1);
    g.line(cx0 - 6, cy0 + ch - this.hi * ch, cx0 + cw + 6, cy0 + ch - this.hi * ch, PAL.accent, 1);
    g.sprite('shiba', cx0 - 26, BOT - 20, { w: 36, h: 38, frame: inBand ? 1 : 0 });   // sat on the floor by its bowl, clear of the mascot's corner
    const msg = this.fill > 0.92 ? 'STOP!'
              : (inBand && !this.pouring) ? 'HOLD STEADY!'
              : inBand ? 'LEVEL OFF!'
              : (Input.tiltReady ? 'TIP TO POUR' : 'HOLD TO POUR');
    g.text(msg, CX, TOP + 18, 8, this.fill > 0.92 ? PAL.bad : inBand ? PAL.accent : PAL.mid);
  }
}

// TILT — sled downhill through the flag gates
class SteerRun extends Microgame {
  static meta = { id: 'steer', env: 'snow', prompt: 'SLED!', hint: 'move', duration: 5.0, minDuration: 4.0,
    how: { tilt: 'TILT TO STEER\nTHROUGH THE FLAGS', touch: 'HOLD LEFT OR RIGHT\nTHROUGH THE FLAGS' } };
  init() {
    Input.enableTilt(); Input.zeroTilt();
    this.px = CX; this.runY = BOT - 30;
    this.need = this.byD(3, 3, 4); this.passed = 0;
    this.gap = this.byD(62, 52, 44);
    // paced off the real round: every gate arrives, the last at ~85% of it
    this.travel = 1.6;
    this.fall = (this.runY - (TOP - 10)) / this.travel;
    this.every = Math.max(0.5, (this.timeLimit * 0.85 - 0.2 - this.travel) / Math.max(1, this.need - 1));
    this.gates = []; this.spawned = 0; this.spawn = 0.2; this.lastX = CX;
    this.snow = Array.from({ length: 22 }, () => ({ x: Math.random() * W, y: TOP + Math.random() * (BOT - TOP) }));
    this.spray = [];
  }
  update(dt, input) {
    const t = Input.tiltReady ? input.tiltX : (input.down ? (input.x - CX) / (W / 2) : 0);
    this.px += Math.max(-1, Math.min(1, t)) * 120 * dt;
    this.px = Math.max(12, Math.min(W - 12, this.px));
    // the hill rushing past: snow specks stream up the screen
    for (const s of this.snow) { s.y -= this.fall * 0.9 * dt; if (s.y < TOP) { s.y = BOT; s.x = Math.random() * W; } }
    if (Math.abs(t) > 0.2 && Math.random() < 0.6) this.spray.push({ x: this.px - Math.sign(t) * 8, y: this.runY + 10, vx: -Math.sign(t) * 40, t: 0 });
    for (const p of this.spray) { p.t += dt; p.x += p.vx * dt; p.y -= 30 * dt; }
    this.spray = this.spray.filter(p => p.t < 0.3);
    this.spawn -= dt;
    if (this.spawn <= 0 && this.spawned < this.need) {
      this.spawn = this.every; this.spawned++;
      // reachable from the last gate in the time between them
      const reach = Math.min(70, 120 * this.every * 0.8);
      const gx = Math.max(this.gap / 2 + 8, Math.min(W - this.gap / 2 - 8, this.lastX + (Math.random() * 2 - 1) * reach));
      this.lastX = gx;
      this.gates.push({ x: gx, y: TOP - 10, done: false });
    }
    for (const gt of this.gates) {
      const was = gt.y; gt.y += this.fall * dt;
      if (!gt.done && was < this.runY && gt.y >= this.runY) {
        gt.done = true;
        if (Math.abs(this.px - gt.x) <= this.gap / 2 - 4) { this.passed++; Sfx.tick(); FX.hit(this.px, this.runY, PAL.accent); if (this.passed >= this.need) { this.succeed(); return; } }
        else { buzz(80); FX.shake(4); Sfx.thud(); this.lose(); return; }
      }
    }
    this.gates = this.gates.filter(gt => gt.y < BOT + 20);
  }
  draw(g) {
    g.clear();
    for (const s of this.snow) g.rect(s.x, s.y, 2, 2, PAL.mid);
    for (const gt of this.gates) {
      const l = gt.x - this.gap / 2, r = gt.x + this.gap / 2;
      g.rect(l - 1, gt.y - 14, 2, 18, PAL.ink); g.rect(r - 1, gt.y - 14, 2, 18, PAL.ink);   // poles
      g.rect(l + 1, gt.y - 14, 9, 6, PAL.accent); g.rect(r - 10, gt.y - 14, 9, 6, PAL.bad); // flags
    }
    for (const p of this.spray) { ctx.globalAlpha = 1 - p.t / 0.3; g.rect(p.x, p.y, 2, 2, PAL.ink); ctx.globalAlpha = 1; }
    // the sled under the shiba, leaning into the turn
    g.rect(this.px - 10, this.runY + 6, 20, 5, PAL.bad); g.rect(this.px - 12, this.runY + 11, 24, 2, PAL.ink);
    g.sprite('hero', this.px, this.runY - 2, { w: 22, h: 27, frame: 0 });
    for (let i = 0; i < this.need; i++) g.rect(W - 8 - i * 8, TOP + 4, 5, 5, i < this.passed ? PAL.accent : PAL.mid);
    g.outline(Input.tiltReady ? 'TILT TO STEER' : 'DRAG TO STEER', CX, TOP + 22, 8, TEXT_MID);   // rimmed: the gates scroll right through this line
  }
}

// BLOW — blow out every candle before the clock runs out
class BlowCandles extends Microgame {
  static meta = { id: 'candles', env: 'room@266', prompt: 'BLOW!', hint: 'blow', duration: 4.6, minDuration: 4.0, photo: true, photoCap: 'MAKE A WISH!',
    how: { mic: 'BLOW INTO THE MIC\nPUT OUT EVERY CANDLE', touch: 'TAP FAST\nTO BLOW' } };
  init() {
    Input.enableMic(); Input.enableCam();
    this.paused = Input.micPending; this.wait = 0;
    this.n = this.byD(3, 4, 5);
    this.lit = []; for (let i = 0; i < this.n; i++) this.lit.push(1);
  }
  update(dt, input) {
    if (this.paused) { this.wait += dt; if (!Input.micPending || this.wait > 1.2) this.paused = false; return; }
    if (input.blow > 0.3) {
      // snuff the candles left-to-right so progress is visible
      for (let i = 0; i < this.n; i++) {
        if (this.lit[i] > 0) {
          this.lit[i] = Math.max(0, this.lit[i] - input.blow * dt * 1.6);
          if (this.lit[i] <= 0) Sfx.poof();   // each candle goes out with a little fwip
          break;
        }
      }
    }
    if (this.lit.every(l => l <= 0) && !this.finished) this.succeed();
  }
  stampPhoto(c) { PhotoFX.cake(c); }
  draw(g) {
    g.clear();
    if (this.paused) { g.text('ALLOW MIC…', CX, CY - 6, 12, PAL.ink); g.text('(then blow)', CX, CY + 12, 7, PAL.mid); return; }
    const cw = 34 + this.n * 14, cx0 = CX - cw / 2, cakeY = BOT - 34;
    g.rect(cx0, cakeY, cw, 24, PAL.accent); g.rect(cx0, cakeY - 3, cw, 3, PAL.ink);
    for (let i = 0; i < this.n; i++) {
      const x = cx0 + (i + 0.5) * cw / this.n, top = cakeY - 20;
      g.rect(x - 1, top, 2, 18, PAL.mid);                   // candle
      if (this.lit[i] > 0) {                                // flame flickers while lit
        const f = 3 + Math.sin(this.t * 20 + i) * this.lit[i];
        g.circle(x, top - 3, Math.max(1, f * this.lit[i]), PAL.bad);
      } else { for (let k = 0; k < 3; k++) g.rect(x, top - 5 - k * 3, 1, 2, PAL.mid); }  // smoke
    }
    g.text(Input.micReady ? 'BLOW THEM OUT!' : 'TAP FAST!', CX, TOP + 24, 9, PAL.mid);
    const out = this.lit.filter(l => l <= 0).length;
    for (let i = 0; i < this.n; i++) g.rect(CX - this.n * 4 + i * 8, TOP + 6, 5, 5, i < out ? PAL.accent : PAL.mid);
  }
}

// DRAG — pull every seed off the dandelion, one by one (the blowing is BLOW and CANDLES)
class Dandelion extends Microgame {
  static meta = { id: 'puff', env: 'sunny@258', photo: true, photoCap: 'WHOOSH!', prompt: 'PLUCK!', hint: 'drag', duration: 4.8, minDuration: 4.2,
    how: 'DRAG EACH SEED\nOFF THE DANDELION' };
  init() {
    this.n = this.byD(6, 7, 8); this.seeds = [];
    for (let i = 0; i < this.n; i++) {
      const a = (i / this.n) * 6.2832 + Math.random() * 0.4, r = 13 + Math.random() * 11;
      this.seeds.push({ a, x: CX + Math.cos(a) * r, y: CY - 8 + Math.sin(a) * r, gone: false, vx: 0, vy: 0, t: 0, spin: 0 });
    }
    this.cleared = 0; this.cool = 0;
    this.held = null;   // the seed your finger is pulling
  }
  // a seed comes loose and floats off, the way it was pulled or blown
  release(s, vx, vy) {
    s.gone = true; s.vx = vx; s.vy = vy; s.spin = (Math.random() - 0.5) * 12;
    this.cleared++; Sfx.tick(); buzz(14); FX.hit(s.x, s.y, PAL.ink);
  }
  // grab a seed and drag it far enough from the head to pull it off
  pull(input) {
    const hx = CX, hy = CY - 8;
    if (input.justDown && !this.held) {
      let best = null, bd = 14;
      for (const s of this.seeds) { if (s.gone) continue; const d = Math.hypot(input.x - s.x, input.y - s.y); if (d < bd) { bd = d; best = s; } }
      if (best) { this.held = best; best.hx = best.x; best.hy = best.y; }
    }
    const s = this.held; if (!s) return;
    if (!input.down) { s.x = s.hx; s.y = s.hy; this.held = null; return; }   // let go too soon: it springs back
    s.x = input.x; s.y = input.y;
    const dx = s.x - hx, dy = s.y - hy, d = Math.hypot(dx, dy);
    if (d > 40) { this.held = null; this.release(s, dx / d * 90, dy / d * 90 - 50); }
  }
  update(dt, input) {
    this.pull(input);
    for (const s of this.seeds) if (s.gone) { s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 70 * dt; s.vx *= 0.99; }
    if (this.cleared >= this.n && !this.finished) this.succeed();
  }
  draw(g) {
    g.clear();
    // the stem, a couple of leaves at its foot, and the seed head
    g.line(CX, CY - 8, CX + 2, BOT - 16, SCENE.stem, 3);
    g.rect(CX - 12, BOT - 24, 12, 3, SCENE.stem); g.rect(CX + 3, BOT - 30, 11, 3, SCENE.stem);
    g.circle(CX, CY - 8, 4, SCENE.stem);
    for (const s of this.seeds) {
      if (s.gone && s.t > 0.9) continue;
      ctx.globalAlpha = s.gone ? Math.max(0, 1 - s.t / 0.9) : 1;
      if (!s.gone) g.line(CX, CY - 8, s.x, s.y, s === this.held ? PAL.accent : PAL.ink, 1);   // the stalk stretches as you pull
      // the seed's fluffy parachute: little white spokes round a dot
      const sp = s.gone ? s.t * s.spin : 0;
      for (let k = 0; k < 5; k++) {
        const a = sp + k * 1.2566;
        g.line(s.x, s.y, s.x + Math.cos(a) * 4, s.y + Math.sin(a) * 4, PAL.ink, 1);
      }
      g.circle(s.x, s.y, 1.5, PAL.ink);
      ctx.globalAlpha = 1;
    }
    g.text('DRAG THE SEEDS OFF!', CX - 14, TOP + 24, 9, PAL.ink);   // clear of the sun
    for (let i = 0; i < this.n; i++) g.rect(CX - this.n * 5 + i * 10 + 1, BOT - 10, 7, 4, i < this.cleared ? PAL.accent : PAL.bg);   // one pip per seed, like DIG and BARK
  }
}

// TAP — a shiba tower: shibas run in from either side; tap to drop each one, and it freezes mid-run on the tower
class StackBlocks extends Microgame {
  static meta = { id: 'stack', env: 'room@270', prompt: 'STACK!', hint: 'tap', duration: 5.0, minDuration: 4.2,
    how: 'TAP TO DROP EACH SHIBA\nONTO THE TOWER' };
  init() {
    this.need = this.byD(3, 4, 5); this.done = 0;
    this.baseX = CX; this.stackY = BOT - 6;   // the floor
    this.LH = 20;                             // one running shiba's height: each lands on the back of the one below
    this.sp = this.byD(90, 115, 140);
    this.tol = this.byD(14, 11, 9);
    this.leans = [];                          // where each landed (so the tower leans a little) and which way it ran
    this.drop = null;                         // the one falling, between the tap and the landing
    this.spawn(Math.random() < 0.5 ? 1 : -1);
  }
  spawn(dir) { this.dir = dir; this.bx = dir > 0 ? 14 : W - 14; this.runT = 0; }
  topY() { return this.stackY - 4 - this.done * this.LH; }   // where the next one's paws land
  update(dt, input) {
    if (this.drop) {
      this.drop.t += dt;
      if (this.drop.t >= 0.2) {
        this.leans.push({ dx: this.drop.x - this.baseX, dir: this.drop.dir, f: this.drop.f }); this.done++; this.drop = null;
        Sfx.squeak(); buzz(12); FX.hit(this.baseX, this.topY() + this.LH - 6, PAL.accent);
        if (this.done >= this.need) { Sfx.bark(); this.succeed(); return; }
        this.spawn(Math.random() < 0.5 ? 1 : -1); this.sp += 12;
      }
      return;
    }
    this.runT += dt;
    this.bx += this.dir * this.sp * dt;
    if (this.bx < 14) { this.bx = 14; this.dir = 1; }
    if (this.bx > W - 14) { this.bx = W - 14; this.dir = -1; }
    for (const t of input.taps) {
      if (Math.abs(this.bx - this.baseX) <= this.tol) { this.drop = { x: this.bx, y0: this.runY(), t: 0, dir: this.dir, f: this.frame() }; Sfx.whoosh(); }
      else { buzz(90); FX.shake(4); Sfx.thud(); this.lose(); }
      return;
    }
  }
  // paws of the running shiba: a little above the tower top
  runY() { return this.topY() - 30; }
  frame() { return Math.floor(this.runT * 16) % 9; }
  // a running shiba, paws at y; frozen stays on one frame of the gallop
  runner(x, paws, dir, f) { g.sprite(dir > 0 ? 'swiperight' : 'swipeleft', x, paws - 14, { w: 56, h: 56, frame: f }); }
  draw(g) {
    g.clear();
    // a cushion on the floor, dead centre, so the first one has a clear target
    g.rect(this.baseX - 26, this.stackY - 6, 52, 6, PAL.bad); g.rect(this.baseX - 22, this.stackY - 8, 44, 2, PAL.bad);
    if (this.done === 0 && !this.drop) { ctx.globalAlpha = 0.35; g.line(this.baseX, this.stackY - 8, this.baseX, TOP + 30, PAL.accent, 1); ctx.globalAlpha = 1; }
    // the tower, bottom up, so each one sits in front of the one it's on
    const top = this.finished && this.won;
    for (let i = 0; i < this.done; i++) {
      const L = this.leans[i], paws = this.stackY - 4 - i * this.LH;
      // frozen mid-run; the top one gallops on the spot when the tower is done
      this.runner(this.baseX + L.dx, paws, L.dir, top && i === this.done - 1 ? this.frame() : L.f);
    }
    if (this.drop) {   // falling onto the tower, frozen in the pose it was tapped in
      const k = Math.min(1, this.drop.t / 0.2), paws = this.drop.y0 + (this.topY() - this.drop.y0) * k * k;
      this.runner(this.drop.x, paws, this.drop.dir, this.drop.f);
    } else if (!this.finished) {   // the next one, running across
      const paws = this.runY();
      this.runner(this.bx, paws, this.dir, this.frame());
      ctx.globalAlpha = 0.3; g.line(this.bx, paws + 2, this.bx, this.topY(), PAL.mid, 1); ctx.globalAlpha = 1;
    }
    g.text('TAP TO DROP', CX, TOP + 22, 8, PAL.mid);
    for (let i = 0; i < this.need; i++) g.rect(W - 8 - i * 8, TOP + 4, 5, 5, i < this.done ? PAL.accent : PAL.mid);
  }
}

// DRAG — bones to the dog, chocolate in the bin
class SortTreats extends Microgame {
  static meta = { id: 'sort', env: 'wall@250', prompt: 'SORT!', hint: 'drag', duration: 5.0, minDuration: 4.2,
    how: 'DRAG BONES TO THE DOG\nCHOCOLATE TO THE BIN' };
  init() {
    this.need = this.byD(2, 3, 4); this.done = 0;
    this.dogSide = Math.random() < 0.5 ? 'left' : 'right';   // which side the dog sits, this round
    this.newTreat();
  }
  // bones go to the dog; chocolate is bad for dogs, so it goes in the bin
  newTreat() { this.bone = Math.random() < 0.55; this.pop = 0; this.dx = 0; this.held = false; }
  want() { return this.bone ? this.dogSide : (this.dogSide === 'left' ? 'right' : 'left'); }
  // The treat follows your finger and counts on the side you let it go, at any
  // speed (it used to need a swipe under half a second, so a careful drag to
  // the bin did nothing). A quick flick still works the same way.
  update(dt, input) {
    if (this.pop > 0) this.pop -= dt;
    if (input.justDown) { this.held = true; this.x0 = input.x - this.dx; }
    if (this.held && input.down) this.dx = Math.max(-CX + 20, Math.min(CX - 20, input.x - this.x0));
    if (this.held && !input.down) {
      this.held = false;
      const sw = input.swipe;   // a flick quicker than a frame never moved it: go by the swipe
      if (Math.abs(this.dx) < 24 && sw && (sw.dir === 'left' || sw.dir === 'right')) this.dx = sw.dir === 'left' ? -40 : 40;
      if (Math.abs(this.dx) < 24) { this.dx = 0; return; }   // not far enough: back to the middle
      const side = this.dx < 0 ? 'left' : 'right';
      if (side === this.want()) {
        this.done++; buzz(12); FX.hit(side === 'left' ? 28 : W - 28, CY + 20, PAL.accent); this.pop = 0.15;
        if (this.bone) Sfx.chomp(); else Sfx.thud();
        if (this.done >= this.need) { this.succeed(); return; }
        this.newTreat();
      } else { buzz(90); FX.shake(4); if (this.bone) Sfx.growl(); else Sfx.fail(); this.lose(); return; }
    }
  }
  draw(g) {
    g.clear();
    const dx = this.dogSide === 'left' ? 30 : W - 30, bx = W - dx;
    // the shiba behind its bowl
    g.sprite('face', dx, CY + 4, { w: 44, h: 45, frame: Math.floor(this.t * 6) % 3 });
    g.rect(dx - 20, CY + 28, 40, 8, PAL.bad); g.rect(dx - 16, CY + 36, 32, 4, PAL.bad);
    g.text('DOG', dx, CY - 26, 8, PAL.accent);
    // the bin
    g.rect(bx - 15, CY + 2, 30, 38, PAL.mid); g.rect(bx - 18, CY - 2, 36, 5, PAL.ink); g.rect(bx - 4, CY - 6, 8, 4, PAL.ink);
    for (let i = -1; i <= 1; i++) g.rect(bx + i * 8 - 1, CY + 9, 2, 26, PAL.bg);
    g.text('BIN', bx, CY - 26, 8, PAL.ink);
    // the treat in the middle
    const s = 1 + this.pop * 1.5;
    const tx = CX + this.dx, ty = CY - 40 + Math.abs(this.dx) * 0.35;   // dips toward the dog / bin as you drag
    if (this.bone) g.bone(tx, ty, 30 * s); else g.choc(tx, ty, 26 * s);
    if (!this.held) g.text(this.bone ? 'BONE' : 'CHOCOLATE', CX, CY - 18, 7, this.bone ? PAL.accent : PAL.bad);
    g.text('DRAG IT!', CX, TOP + 22, 8, PAL.mid);
    for (let i = 0; i < this.need; i++) g.rect(CX - this.need * 4 + i * 8, BOT - 14, 5, 5, i < this.done ? PAL.accent : PAL.mid);
  }
}

// 42. SQUID — red-light / green-light with the spinning doll (camera)
// The doll turns away (green) → you move your head to run toward the goal; it
// spins to face you (red) → hold perfectly still or you're caught. Reach the
// goal before the clock runs out to win. Uses the full portrait set for the spin.
class SquidDoll extends Microgame {
  static meta = { id: 'squid', env: 'field@212', cam: true, prompt: 'RUN & FREEZE!', hint: 'move', duration: 7.0, minDuration: 6.0, photo: true, photoCap: 'YOU MADE IT!',
    how: { cam: 'MOVE YOUR HEAD TO RUN\nFREEZE WHEN IT LOOKS', touch: 'HOLD ON GREEN\nLET GO ON RED' } };
  init() {
    Input.enableCam();
    this.paused = Input.camPending; this.wait = 0;
    this.prog = 0;                                   // 0..1 toward the goal
    this.base = this.byD(0.11, 0.085, 0.06);         // move threshold for "caught"
    this.thr = this.base; this.noise = 1; this.settle = 0.6;
    this.speed = this.byD(0.46, 0.39, 0.33);         // how fast movement advances you
    this.gT = this.byD(1.8, 1.5, 1.2);               // green (safe) window
    this.rT = this.byD(1.0, 1.25, 1.5);              // red (watching) window
    this.turn = 0.4;                                 // spin telegraph either way
    this.phase = 'green'; this.pt = this.gT;
    this.caught = 0; this.face = 4; this.flash = 0;
  }
  update(dt, input) {
    if (this.paused) { this.wait += dt; if (!Input.camPending || this.wait > 1.5) this.paused = false; return; }
    const moving = Input.camReady ? input.motion : (input.down ? 0.5 : 0);
    // learn the camera's quiet floor briefly so a grainy sensor can't "catch" a still player
    if (this.settle > 0) { this.settle -= dt; this.noise = Math.min(this.noise, moving);
      this.thr = this.noise < 0.08 ? Math.min(0.14, Math.max(this.base, this.noise * 1.5 + 0.02)) : this.base; }
    if (this.flash > 0) this.flash -= dt;
    this.pt -= dt;
    switch (this.phase) {
      case 'green':                                   // doll turned away — RUN
        this.face = 4;                                // back of head
        if (moving > this.thr) this.prog = Math.min(1, this.prog + dt * this.speed * Math.min(1.4, moving / 0.2));
        if (this.prog >= 1) { this.succeed(); return; }
        if (this.pt <= 0) { this.phase = 'toRed'; this.pt = this.turn; }
        break;
      case 'toRed':                                   // spinning to face you (grace — no fail yet)
        this.face = 2;                                // profile mid-spin
        if (this.pt <= 0) { this.phase = 'red'; this.pt = this.rT; this.caught = 0; }
        break;
      case 'red':                                     // doll watching — FREEZE
        this.face = 0;                                // facing you
        if (moving > this.thr) {
          this.caught += dt;
          if (this.caught > 0.12) this.flash = 0.15;  // only react to sustained movement, not camera noise
          if (this.caught > 0.35) { buzz(90); FX.shake(4); this.lose(); return; }
        } else this.caught = Math.max(0, this.caught - dt * 0.8);
        if (this.pt <= 0) { this.phase = 'toGreen'; this.pt = this.turn; }
        break;
      case 'toGreen':                                 // spinning back away
        this.face = 2;
        if (this.pt <= 0) { this.phase = 'green'; this.pt = this.gT; }
        break;
    }
  }
  draw(g) {
    g.clear();
    if (this.paused) { g.text('ALLOW CAMERA…', CX, CY - 6, 11, PAL.ink); g.text('(then run & freeze)', CX, CY + 12, 7, PAL.mid); return; }
    // goal track
    g.text('REACH THE GOAL', CX, TOP + 16, 8, PAL.mid);
    g.bar(30, TOP + 24, W - 60, 10, this.prog, PAL.accent);
    // status light: green = run, red = freeze, grey = turning
    const lit = this.phase === 'green' ? PAL.accent : this.phase === 'red' ? PAL.bad : PAL.mid;
    g.circle(CX, TOP + 48, 6, lit);
    // the doll: back (turned away) -> profile (spinning) -> front (watching)
    const jx = (this.phase === 'red' && this.flash > 0) ? (Math.random() - 0.5) * 6 : 0;
    g.sprite('facedir', CX + jx, CY + 6, { w: 100, h: 100, frame: this.face });
    // instruction
    const label = this.phase === 'green' ? 'RUN! MOVE!' : this.phase === 'red' ? 'FREEZE!' : '…TURNING…';
    g.text(label, CX, BOT - 18, 11, this.phase === 'red' ? PAL.bad : this.phase === 'green' ? PAL.accent : PAL.mid);
  }
}

  update(dt, input) {
    if (this.paused) { this.wait += dt; if (!Input.micPending || this.wait > 1.2) this.paused = false; return; }

    ctx.restore();

    g.bar(30, TOP + 34, W - 60, 6, k, k > 0.66 ? PAL.bad : PAL.accent);

// 50. WALKIES — draw one path from 1 through every square, numbers in order
// (a pocket-sized take on the classic one-line path puzzle); the shiba walks it
class Walkies extends Microgame {
  static meta = { id: 'walkies', env: 'lawn', prompt: 'WALKIES!', hint: 'trace', duration: 7.0,
    how: 'DRAG FROM 1 THROUGH EVERY\nSQUARE, NUMBERS IN ORDER' };
  init() {
    const n = this.n = this.byD(3, 4, 4), N = n * n;
    this.cs = Math.floor(150 / n);
    this.bx = Math.round(CX - this.cs * n / 2); this.by = Math.round(CY - this.cs * n / 2 + 4);
    // a random route that covers the board: the puzzle is built from a real answer
    this.sol = Walkies.route(n);
    const k = this.k = this.byD(3, 4, 5);
    this.num = new Map();
    // 1 at the start, the last number at the end, the rest spread along the way
    let prev = 0;
    for (let i = 0; i < k; i++) {
      let at = i === 0 ? 0 : i === k - 1 ? N - 1
             : Math.round(i * (N - 1) / (k - 1) + (Math.random() - 0.5) * 1.6);
      if (i > 0 && i < k - 1) at = Math.max(prev + 1, Math.min(N - 2 - (k - 2 - i), at));
      prev = at;
      this.num.set(this.sol[at], i + 1);
    }
    // hard: a couple of walls, only ever between squares the answer doesn't step across
    this.walls = new Set();
    if (this.d >= 3) {
      const step = new Set(); for (let i = 1; i < N; i++) step.add(Walkies.key(this.sol[i - 1], this.sol[i]));
      const cand = [];
      for (let c = 0; c < N; c++) { if (c % n < n - 1) cand.push([c, c + 1]); if (c + n < N) cand.push([c, c + n]); }
      for (const [a, b] of cand.sort(() => Math.random() - 0.5)) {
        if (this.walls.size >= 2) break;
        if (!step.has(Walkies.key(a, b))) this.walls.add(Walkies.key(a, b));
      }
    }
    this.path = []; this.next = 1;
    this.sx = null; this.sy = null; this.face = 'swipeup'; this.walkT = 0;
  }
  static key(a, b) { return Math.min(a, b) + '-' + Math.max(a, b); }
  // random depth-first walk that backs up when stuck; tiny boards, so it's instant
  static route(n) {
    const N = n * n;
    for (;;) {
      const seen = new Array(N).fill(false), path = [Math.floor(Math.random() * N)];
      seen[path[0]] = true;
      const go = () => {
        if (path.length === N) return true;
        const c = path[path.length - 1], r = Math.floor(c / n), q = c % n;
        const nb = [[r - 1, q], [r + 1, q], [r, q - 1], [r, q + 1]].filter(([a, b]) => a >= 0 && b >= 0 && a < n && b < n)
          .map(([a, b]) => a * n + b).filter(x => !seen[x]).sort(() => Math.random() - 0.5);
        for (const x of nb) { seen[x] = true; path.push(x); if (go()) return true; path.pop(); seen[x] = false; }
        return false;
      };
      if (go()) return path;
    }
  }
  cell(x, y) {
    const q = Math.floor((x - this.bx) / this.cs), r = Math.floor((y - this.by) / this.cs);
    return q >= 0 && r >= 0 && q < this.n && r < this.n ? r * this.n + q : -1;
  }
  centre(c) { return [this.bx + (c % this.n + 0.5) * this.cs, this.by + (Math.floor(c / this.n) + 0.5) * this.cs]; }
  near(a, b) {
    const n = this.n, d = Math.abs(a - b);
    return (d === n || (d === 1 && Math.floor(a / n) === Math.floor(b / n))) && !this.walls.has(Walkies.key(a, b));
  }
  update(dt, input) {
    const N = this.n * this.n;
    if (input.down) {
      const c = this.cell(input.x, input.y);
      if (c >= 0) {
        if (!this.path.length) { if (this.num.get(c) === 1) { this.path.push(c); this.next = 2; Sfx.boop(); } }
        else {
          const end = this.path[this.path.length - 1];
          if (this.path.length > 1 && c === this.path[this.path.length - 2]) {            // back up a step
            const gone = this.path.pop(); if (this.num.has(gone)) this.next = this.num.get(gone);
            Sfx.tick();
          } else if (c !== end && this.near(end, c) && !this.path.includes(c)) {
            const m = this.num.get(c);
            const ok = !m || (m === this.next && (m < this.k || this.path.length === N - 1));   // last number ends the walk
            if (ok) {
              this.path.push(c);
              if (m) { this.next = m + 1; Sfx.boop(); FX.hit(...this.centre(c), PAL.accent); buzz(15); }
              else Sfx.step(Math.min(7, this.path.length % 8));
              if (this.path.length === N && !this.finished) { Sfx.bark(); this.succeed(); }
            }
          }
        }
      }
    }
    // the shiba trots after the head of the path, facing the way it's going
    if (this.path.length) {
      const [tx, ty] = this.centre(this.path[this.path.length - 1]);
      if (this.sx === null) { this.sx = tx; this.sy = ty; }
      const dx = tx - this.sx, dy = ty - this.sy;
      if (Math.abs(dx) + Math.abs(dy) > 1) {
        this.face = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'swiperight' : 'swipeleft') : (dy > 0 ? 'swipeup' : 'swipedown');
        this.walkT += dt;
      }
      const k = Math.min(1, dt * 14); this.sx += dx * k; this.sy += dy * k;
    }
  }
  draw(g) {
    g.clear();
    const n = this.n, cs = this.cs, bx = this.bx, by = this.by, W2 = cs * n;
    // the board: a pale card on the lawn, with grid lines
    g.rect(bx - 4, by - 4, W2 + 8, W2 + 8, PAL.bg);
    g.rect(bx, by, W2, W2, SCENE.dayCloud);
    const vis = new Set(this.path);
    ctx.globalAlpha = 0.35; for (const c of vis) { const [x, y] = this.centre(c); g.rect(x - cs / 2, y - cs / 2, cs, cs, PAL.accent); } ctx.globalAlpha = 1;
    for (let i = 1; i < n; i++) { g.rect(bx + i * cs, by, 1, W2, PAL.mid); g.rect(bx, by + i * cs, W2, 1, PAL.mid); }
    // the trail so far
    if (this.path.length > 1) {
      ctx.strokeStyle = PAL.accent; ctx.lineWidth = cs * 0.34; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); this.path.forEach((c, i) => { const [x, y] = this.centre(c); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.stroke();
    }
    // walls: thick black bars on the grid line between two squares
    for (const w of this.walls) {
      const [a, b] = w.split('-').map(Number), [ax, ay] = this.centre(a);
      if (b - a === 1) g.rect(ax + cs / 2 - 2, ay - cs / 2 - 1, 5, cs + 2, PAL.bg);
      else g.rect(ax - cs / 2 - 1, ay + cs / 2 - 2, cs + 2, 5, PAL.bg);
    }
    // the numbers are the game's treat bone: the next one to fetch wiggles,
    // and they go grey once the shiba has walked over and picked them up
    const bw = cs * 0.84, fs = Math.round(Math.max(8, cs * 0.3));
    for (const [c, m] of this.num) {
      const [x, y] = this.centre(c), got = m < this.next, nxt = m === this.next;
      ctx.save(); ctx.translate(x, y); if (nxt) ctx.rotate(Math.sin(this.t * 9) * 0.14);
      g.bone(0, 0, bw, got ? PAL.mid : PAL.accent);
      g.text(String(m), 0, fs * 0.36, fs, PAL.bg);
      ctx.restore();
    }
    // the shiba walking the route
    if (this.sx !== null) g.sprite(this.face, this.sx, this.sy - cs * 0.12, { w: cs * 1.05, h: cs * 1.05, frame: Math.floor(this.walkT * 14) % 9 });
    const left = n * n - this.path.length;
    g.text(this.path.length ? (left ? left + ' TO GO' : 'GOOD WALK!') : 'START AT 1', CX, by - 12, 9, PAL.ink);
  }
}

// 51. BARK — the shiba runs, and shouting makes it jump: a bark clears a low
// hurdle, a real shout the tall ones (the voice-controlled runner genre)
class BarkJump extends Microgame {
  static meta = { id: 'bark', env: 'park@266', prompt: 'BARK TO JUMP!', hint: 'shout', duration: 5.4, winOnTimeout: true, minDuration: 4.0,
    photo: true, photoCap: 'WHAT A BARK!',
    how: { mic: 'SHOUT TO JUMP!\nLOUDER JUMPS HIGHER', touch: 'TAP TO JUMP\nOVER THE HURDLES' } };
  init() {
    Input.enableMic(); Input.enableCam();
    this.paused = Input.micPending; this.wait = 0;
    this.ground = 266; this.dogW = 30; this.dogH = 28; this.px = 42;
    this.y = 0; this.vy = 0; this.grav = 620; this.onGround = true; this.legT = 0;
    this.boostT = 0; this.woof = 0; this.woofK = 0;
    this.speed = this.byD(105, 125, 145);
    this.need = this.byD(2, 3, 4); this.cleared = 0;
    // low hurdles take any bark, tall ones a proper shout; never two tall in a row
    this.obs = []; let x = W + 30, tall = false;
    for (let i = 0; i < this.need; i++) {
      tall = !tall && i > 0 && Math.random() < this.byD(0.35, 0.5, 0.6);
      this.obs.push({ x, h: tall ? this.byD(25, 30, 30) + Math.random() * 3 : 12 + Math.random() * 4, tall, passed: false });
      x += 0.9 * this.speed + 60 + Math.random() * 30;
    }
  }
  update(dt, input) {
    if (this.paused) { this.wait += dt; if (!Input.micPending || this.wait > 1.2) this.paused = false; return; }
    this.legT += dt; if (this.woof > 0) this.woof -= dt;
    const mic = Input.micReady;
    // a bark lifts it off the ground; for the next moment, the louder you keep
    // going the higher it carries — so a short yelp hops, a shout soars
    if (this.onGround && (mic ? input.loud > 0.18 : input.justDown)) {
      this.vy = mic ? 140 : 250; this.onGround = false; this.boostT = mic ? 0.15 : 0;
      this.woof = 0.35; this.woofK = mic ? input.loud : 0.7; Sfx.bark(); buzz(15);
    }
    if (this.boostT > 0) { this.boostT -= dt; this.vy += input.loud * 900 * dt; this.woofK = Math.max(this.woofK, input.loud); }
    this.vy -= this.grav * dt; this.y += this.vy * dt;
    if (this.y <= 0) { this.y = 0; this.vy = 0; this.onGround = true; }
    for (const o of this.obs) {
      o.x -= this.speed * dt;
      if (Math.abs(o.x - this.px) < this.dogW / 2 - 2 && this.y < o.h - 2) { buzz(80); FX.shake(4); Sfx.thud(); this.lose(); return; }
      if (!o.passed && o.x < this.px - this.dogW / 2) { o.passed = true; this.cleared++; Sfx.tick(); FX.hit(this.px, this.ground - 4, PAL.accent); }
    }
    if (this.cleared >= this.need && !this.finished) this.succeed();
  }
  draw(g) {
    g.clear();
    if (this.paused) { g.text('ALLOW MIC…', CX, CY - 6, 11, PAL.bg); g.text('(then bark!)', CX, CY + 12, 7, PAL.bg); return; }
    // hurdles: striped bars on two posts; the tall ones wear a red flag
    for (const o of this.obs) {
      if (o.x < -14) continue;
      const top = this.ground - o.h;
      g.rect(o.x - 8, top, 3, o.h, PAL.bg); g.rect(o.x + 5, top, 3, o.h, PAL.bg);
      for (let i = 0; i < 4; i++) g.rect(o.x - 8 + i * 4, top, 4, 6, i % 2 ? PAL.bad : PAL.ink);
      if (o.tall) { g.rect(o.x + 6, top - 10, 1, 10, PAL.bg); g.rect(o.x + 7, top - 10, 6, 5, PAL.bad); }
    }
    const drawY = this.ground - this.dogH / 2 - this.y;
    if (this.onGround) g.sprite('swiperight', this.px, drawY, { w: this.dogW * 2, h: this.dogH * 2, frame: Math.floor(this.legT * 14) % 9 });
    else g.sprite('runjump', this.px, drawY, { w: this.dogW * 2, h: this.dogH * 2, frame: this.vy > 60 ? 2 : this.vy < -60 ? 4 : 3 });
    // the bark itself, bigger the louder it was
    if (this.woof > 0) {
      const k = 0.6 + this.woofK * 0.8, a = Math.min(1, this.woof * 4);
      ctx.globalAlpha = a; g.text('WOOF!', this.px + 34, drawY - 14, Math.round(9 * k + 4), PAL.bg); ctx.globalAlpha = 1;
    }
    g.text(Input.micReady ? 'BARK TO JUMP!' : 'TAP TO JUMP!', CX - 12, TOP + 26, 9, PAL.bg);   // clear of the sun
    if (Input.micReady) g.bar(30, TOP + 34, 90, 4, Input.loud, Input.loud > 0.55 ? PAL.bad : PAL.accent);
    for (let i = 0; i < this.need; i++) g.rect(CX - this.need * 5 + i * 10, BOT - 6, 7, 4, i < this.cleared ? PAL.accent : PAL.bg);
  }
}

// 52. SLICE — treats are tossed up: swipe through the bones, never the chocolate
class SliceTreats extends Microgame {
  static meta = { id: 'slice', env: 'room@268', prompt: 'SLICE!', hint: 'swipe', duration: 4.6,
    how: 'SWIPE THROUGH THE BONES\nNOT THE CHOCOLATE' };
  init() {
    this.need = this.byD(3, 4, 5); this.sliced = 0;
    this.items = []; this.bits = []; this.trail = [];
    this.spawnT = 0.1; this.every = this.byD(0.55, 0.46, 0.4);
    this.chocP = this.byD(0.2, 0.3, 0.38); this.chocRun = 0; this.bonesOut = 0;
    this.lx = null; this.ly = null; this.grav = 520;
  }
  toss() {
    const x = 30 + Math.random() * (W - 60);
    // chocolate now and then, never three in a row, and always enough bones
    const late = this.t > this.timeLimit * 0.5 && this.bonesOut < this.need + 1;
    const choc = !late && this.chocRun < 2 && Math.random() < this.chocP;
    this.chocRun = choc ? this.chocRun + 1 : 0; if (!choc) this.bonesOut++;
    this.items.push({ x, y: BOT + 12, vx: (CX - x) * 0.45 + (Math.random() - 0.5) * 30, vy: -(420 + Math.random() * 50),
                      rot: Math.random() * 6, spin: (Math.random() - 0.5) * 6, choc, cut: false });
  }
  update(dt, input) {
    this.spawnT -= dt;
    if (this.spawnT <= 0) { this.spawnT = this.every * (0.8 + Math.random() * 0.4); this.toss(); if (Math.random() < 0.25) this.toss(); }
    for (const it of this.items) { it.x += it.vx * dt; it.y += it.vy * dt; it.vy += this.grav * dt; it.rot += it.spin * dt; }
    this.items = this.items.filter(it => !it.cut && !(it.vy > 0 && it.y > BOT + 30));
    for (const b of this.bits) { b.x += b.vx * dt; b.y += b.vy * dt; b.vy += this.grav * dt; b.rot += b.spin * dt; b.t += dt; }
    this.bits = this.bits.filter(b => b.t < 0.8);
    for (const p of this.trail) p.t += dt;
    this.trail = this.trail.filter(p => p.t < 0.14);
    if (!input.down) { this.lx = null; return; }
    const x = input.x, y = input.y;
    this.trail.push({ x, y, t: 0 });
    if (this.lx !== null && Math.hypot(x - this.lx, y - this.ly) > 3) {
      // anything the blade's segment this step passes within reach of is cut
      for (const it of this.items) {
        if (it.cut || this.segDist(it.x, it.y, this.lx, this.ly, x, y) > 12) continue;
        it.cut = true;
        if (it.choc) { Sfx.growl(); buzz(90); FX.shake(4); FX.flash(PAL.bad, 0.4); this.lose(); return; }
        this.sliced++; Sfx.crunch(); buzz(15); FX.hit(it.x, it.y, PAL.accent);
        const dx = x - this.lx, dy = y - this.ly, n = Math.hypot(dx, dy) || 1;
        for (const side of [-1, 1]) this.bits.push({ x: it.x, y: it.y, vx: it.vx * 0.4 + side * -dy / n * 70, vy: it.vy * 0.3 + side * dx / n * 70 - 40,
                                                     rot: it.rot, spin: side * 8, side, t: 0 });
        if (this.sliced >= this.need && !this.finished) { this.succeed(); return; }
      }
    }
    this.lx = x; this.ly = y;
  }
  segDist(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy || 1;
    const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / L));
    return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
  }
  draw(g) {
    g.clear();
    for (const it of this.items) {
      ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.rot);
      if (it.choc) g.choc(0, 0, 22); else g.bone(0, 0, 24);
      ctx.restore();
    }
    // the two halves of each cut bone, tumbling apart
    for (const b of this.bits) {
      ctx.save(); ctx.globalAlpha = Math.min(1, (0.8 - b.t) * 3);
      ctx.translate(b.x, b.y); ctx.rotate(b.rot);
      ctx.beginPath(); ctx.rect(b.side < 0 ? -16 : 0, -10, 16, 20); ctx.clip();
      g.bone(0, 0, 24); ctx.restore();
    }
    // the swipe: a white streak that thins out behind the finger
    for (let i = 1; i < this.trail.length; i++) {
      const a = this.trail[i - 1], b = this.trail[i];
      g.line(a.x, a.y, b.x, b.y, PAL.ink, Math.max(1, 4 * (1 - b.t / 0.14)));
    }
    g.text('SLICE THE BONES!', CX, TOP + 26, 9, PAL.ink);
    for (let i = 0; i < this.need; i++) g.rect(CX - this.need * 5 + i * 10, TOP + 34, 7, 7, i < this.sliced ? PAL.accent : PAL.mid);
  }
}

// 53. YES OR NO — the shiba asks; nod for yes, shake your head for no. A nod
// moves the camera's centre of motion up and down, a head shake side to side.
class YesNo extends Microgame {
  static meta = { id: 'yesno', env: 'room@236', cam: true, prompt: 'YES OR NO?', hint: 'move', duration: 5.4, minDuration: 4.4,
    photo: true, photoCap: 'GOOD ANSWER!',
    how: { cam: 'NOD FOR YES\nSHAKE YOUR HEAD FOR NO', touch: 'TAP YES OR NO' } };
  static Q = [
    ['TREAT?', true, 'bone'], ['WALKIES?', true, 'paw'], ['PLAY BALL?', true, 'ball'], ['BELLY RUB?', true, 'paw'],
    ['BATH TIME?', false, 'tub'], ['CHOCOLATE?', false, 'choc'], ['VET VISIT?', false, 'cross'], ['NAIL TRIM?', false, 'cross'],
  ];
  init() {
    Input.enableCam();
    this.paused = Input.camPending; this.wait = 0;
    this.need = this.byD(1, 2, 2); this.done = 0;
    this.used = new Set(); this.ask();
  }
  ask() {
    let q; do { q = YesNo.Q[Math.floor(Math.random() * YesNo.Q.length)]; } while (this.used.has(q[0]) && this.used.size < YesNo.Q.length);
    this.used.add(q[0]); this.q = q;
    this.sx = 0; this.sy = 0; this.px = null; this.cool = 0.35; this.said = null; this.sayT = 0;
  }
  answer(yes) {
    this.said = yes; this.sayT = 0.5;
    if (yes !== this.q[1]) { Sfx.growl(); buzz(90); FX.shake(4); this.lose(); return; }
    this.done++; Sfx.bark(); buzz(20); FX.hit(CX, CY - 4, PAL.accent);
    if (this.done >= this.need && !this.finished) this.succeed();
  }
  update(dt, input) {
    if (this.paused) { this.wait += dt; if (!Input.camPending || this.wait > 1.5) this.paused = false; return; }
    if (this.sayT > 0) { this.sayT -= dt; if (this.sayT <= 0 && !this.finished) this.ask(); return; }
    if (this.cool > 0) { this.cool -= dt; this.px = null; return; }
    if (!Input.camReady) {                       // no camera: two buttons do it
      for (const tp of input.taps) if (tp.y > BOT - 40 && tp.y < BOT - 10) { this.answer(tp.x < CX); return; }
      return;
    }
    // add up how far the centre of motion travels across and down while you
    // move; whichever way dominates is the answer, once there's been enough
    this.sx *= 0.985; this.sy *= 0.985;
    if (input.motion > 0.06) {
      if (this.px) { this.sx += Math.abs(input.motionX - this.px[0]); this.sy += Math.abs(input.motionY - this.px[1]); }
      this.px = [input.motionX, input.motionY];
    } else this.px = null;
    if (this.sx + this.sy > 0.55) {
      // clearly one way or the other: waving in circles answers nothing
      if (this.sy > this.sx * 1.8) this.answer(true);
      else if (this.sx > this.sy * 1.8) this.answer(false);
    }
  }
  icon(kind, x, y) {
    if (kind === 'bone') g.bone(x, y, 24);
    else if (kind === 'ball') g.tennis(x, y, 8);
    else if (kind === 'choc') g.choc(x, y, 22);
    else if (kind === 'paw') g.paw(x, y, 20, PAL.bad);
    else if (kind === 'tub') { g.rect(x - 12, y - 3, 24, 10, PAL.mid); g.rect(x - 14, y - 5, 28, 3, PAL.mid); for (let i = 0; i < 3; i++) g.circle(x - 7 + i * 7, y - 7, 3, SCENE.dayCloud); }
    else { g.rect(x - 3, y - 10, 6, 20, PAL.bad); g.rect(x - 10, y - 3, 20, 6, PAL.bad); }   // a first-aid cross
  }
  draw(g) {
    g.clear();
    if (this.paused) { g.text('ALLOW CAMERA…', CX, CY - 6, 11, PAL.ink); g.text('(then nod or shake)', CX, CY + 12, 7, PAL.mid); return; }
    // the question, in a speech bubble over the shiba's head
    const by = TOP + 30;
    g.rect(CX - 62, by, 124, 50, PAL.ink); g.rect(CX - 6, by + 50, 12, 6, PAL.ink); g.rect(CX - 3, by + 56, 6, 4, PAL.ink);
    this.icon(this.q[2], CX - 40, by + 25);
    g.text(this.q[0], CX + 14, by + 29, this.q[0].length > 9 ? 9 : 11, PAL.bg);
    // the shiba, head tilted, waiting; it beams or sulks at your answer
    const happy = this.said !== null && this.said === this.q[1];
    const tilt = this.said === null ? Math.sin(this.t * 3) * 0.12 : 0;
    ctx.save(); ctx.translate(CX, CY + 22); ctx.rotate(tilt);
    g.sprite('face', 0, 0, { w: 70, h: 72, frame: this.said === null ? 2 : happy ? 0 : 5 });
    ctx.restore();
    if (this.said !== null) g.text(this.said ? 'YES!' : 'NO!', CX, CY + 76, 14, happy ? PAL.accent : PAL.bad);
    if (Input.camReady) {
      // which way you're moving: a nod fills YES, a head shake fills NO
      const k = Math.min(1, (this.sx + this.sy) / 0.55), yv = this.sy / (this.sx + this.sy + 1e-6);
      g.text('NOD', 26, BOT - 40, 8, PAL.ink); g.line(26, BOT - 34, 26, BOT - 14, PAL.ink, 2);
      g.line(22, BOT - 30, 26, BOT - 34, PAL.ink, 2); g.line(30, BOT - 30, 26, BOT - 34, PAL.ink, 2);
      g.line(22, BOT - 18, 26, BOT - 14, PAL.ink, 2); g.line(30, BOT - 18, 26, BOT - 14, PAL.ink, 2);
      g.text('YES', 26, BOT - 2, 7, PAL.accent);
      g.text('SHAKE', W - 26, BOT - 40, 8, PAL.ink); g.line(W - 40, BOT - 24, W - 12, BOT - 24, PAL.ink, 2);
      g.line(W - 36, BOT - 28, W - 40, BOT - 24, PAL.ink, 2); g.line(W - 36, BOT - 20, W - 40, BOT - 24, PAL.ink, 2);
      g.line(W - 16, BOT - 28, W - 12, BOT - 24, PAL.ink, 2); g.line(W - 16, BOT - 20, W - 12, BOT - 24, PAL.ink, 2);
      g.text('NO', W - 26, BOT - 2, 7, PAL.bad);
      g.bar(46, BOT - 26, 36, 5, k * yv, PAL.accent); g.bar(W - 82, BOT - 26, 36, 5, k * (1 - yv), PAL.bad);
    } else {
      g.rect(CX - 70, BOT - 38, 64, 26, PAL.accent); g.text('YES', CX - 38, BOT - 20, 11, PAL.bg);
      g.rect(CX + 6, BOT - 38, 64, 26, PAL.bad); g.text('NO', CX + 38, BOT - 20, 11, PAL.ink);

    for (let i = 0; i < this.need; i++) g.rect(W - 10 - i * 9, TOP + 6, 6, 6, i < this.done ? PAL.accent : PAL.mid);

];
